services:
  - type: web
    name: bandy-manager
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_ATTENTION_API_BASE
        fromService:
          name: bandy-manager-attention-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: bandy-manager-attention-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bandy-manager-attention-db
          property: connectionString
      - key: ATTENTION_PUSH_ENABLED
        value: "false"
      - key: ATTENTION_CRON_SECRET
        generateValue: true
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: cron
    name: bandy-manager-attention-hourly
    runtime: node
    region: frankfurt
    schedule: "0 * * * *"
    buildCommand: npm install --omit=dev
    startCommand: node scripts/run-attention-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: ATTENTION_API_URL
        fromService:
          name: bandy-manager-attention-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ATTENTION_CRON_SECRET
        fromService:
          name: bandy-manager-attention-api
          type: web
          envVarKey: ATTENTION_CRON_SECRET

databases:
  - name: bandy-manager-attention-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
