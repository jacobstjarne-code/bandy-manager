services:
  - type: web
    name: bandy-manager
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Node 20 gick ur support 2026-04-30 (EOL, inga säkerhetsfixar). 22 är
      # LTS till 2027-04; samma major i app-ci.yml och visual-baselines.yml.
      # Bara major, så Render plockar senaste 22.x-patchen själv.
      - key: NODE_VERSION
        value: "22"
      - key: VITE_ATTENTION_API_BASE
        fromService:
          name: bandy-manager-attention-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    # Säkerhetsgenomgång 2026-09-25: samma headers som vercel.json. Den här
    # kopian anropar API:t direkt (VITE_ATTENTION_API_BASE), därav connect-src.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.onrender.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
    routes:
      - type: rewrite
        source: /
        destination: /landing/index.html
      - type: rewrite
        source: /spela
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: bandy-manager-attention-api
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production applies during Render builds. Explicitly install the
    # lockfile-pinned build toolchain instead of falling through to Render's
    # global TypeScript binary when devDependencies are omitted.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bandy-manager-attention-db
          property: connectionString
      - key: ATTENTION_PUSH_ENABLED
        value: "false"
      - key: ATTENTION_CRON_SECRET
        sync: false
      - key: BETA_ADMIN_SECRET
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: bandy-manager-attention-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
