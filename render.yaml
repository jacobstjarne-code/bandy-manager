services:
  - type: web
    name: bandy-manager
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Node 20 gick ur support 2026-04-30 (EOL, inga säkerhetsfixar). 22 är
      # LTS till 2027-04; samma major i app-ci.yml och visual-baselines.yml.
      # Bara major, så Render plockar senaste 22.x-patchen själv.
      - key: NODE_VERSION
        value: "22"
      - key: VITE_ATTENTION_API_BASE
        fromService:
          name: bandy-manager-attention-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: bandy-manager-attention-api
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production applies during Render builds. Explicitly install the
    # lockfile-pinned build toolchain instead of falling through to Render's
    # global TypeScript binary when devDependencies are omitted.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bandy-manager-attention-db
          property: connectionString
      - key: ATTENTION_PUSH_ENABLED
        value: "false"
      - key: ATTENTION_CRON_SECRET
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: bandy-manager-attention-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
