name: app-ci

# Bandy Manager-appens CI. (De befintliga workflows är för bandy-brain.)
# Designsystemets efterlevnads-grind (lint:design) körs i warn-läge: error-reglerna
# (tailwind-rgb, radius-6) är grep-rent och fäller bygget vid återfall; warn-reglerna
# ratchas till error allt eftersom skulden städas (se scripts/check-design-tokens.mjs).

on:
  # 2026-08-19: åtta Playwright-tunga jobb (screenshots + fem gates + visual-
  # regression) körde på RENA docs-commits — ingen av dem läser markdown eller
  # data under docs/. Samma felklass som Vercels dagskvot samma vecka: kostnad
  # utan nytta, upptäckt när tre körningar samtidigt satt fast 35-50 min på
  # `npx playwright install` (konto-nivåns concurrency, inte kodfel) och
  # blockerade varandra i kön. paths-ignore stryper det vid källan — en
  # commit som BARA rör docs/**/*.md/data triggar aldrig workflowen alls.
  # En commit som rör BÅDE docs och kod kör som vanligt (ignore gäller bara
  # när ALLA ändrade filer matchar).
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check (tsc)
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npm test
      # ETAPP 1.2 (Skutskär-auditen, 2026-08-17): tsc --noEmit ensam missade
      # inte den faktiska buggen (seasonEndProcessor.ts:1178 saknade
      # resolveContractExtensions fjärde argument — det ÄR ett typfel, tsc
      # skulle ha fällt det) — den missade för att buggen aldrig nådde en
      # PUSHAD commit där check-jobbet körde mot den kompletta filen; en
      # commit-uppdelning under samma session lät en signaturändring och dess
      # anropsplats landa i olika commits. Det riktiga hålet var att ingen i
      # sessionen NÅGONSIN läste CI:s faktiska status — bara lokal körning.
      # Full produktionsbygge (inte bara tsc) som EGET, obligatoriskt steg
      # här — inte bara i screenshots-jobbet där ett fel dränks i
      # artefaktuppladdning — så en trasig main aldrig kan se grön ut.
      - name: Production build (vite)
        run: npm run build
      - name: Design tokens (lint:design)
        run: npm run lint:design
      - name: Color-mirror i synk med global.css
        run: npm run mirror:check

  # ◉ syn-audit: fångar alla /dev/scenes-ytor headless och laddar upp som artefakt
  # (review-bilaga per PR, inte strikt pixel-diff — font-rendering skiljer sig cross-OS,
  # så strikt baseline-diff vore flaky. Mac-bilagan i screenshots/audit/ är referensen
  # Jacob godkänner; denna laddar upp Linux-captures för granskning). Separat job → blockar
  # inte merge om browsern strular.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Preview-server + capture
        run: |
          npx vite preview --port 5173 &
          npx wait-on http://localhost:5173 || sleep 8
          BASE_URL=http://localhost:5173 npm run audit:scenes
      - uses: actions/upload-artifact@v4
        with:
          name: syn-audit-screenshots
          path: screenshots/audit

  # Tap-target-överlapp (mobil speltest-audit, 2026-08-17): EGEN port, separat
  # från visual-regression nedan. Motiv (Jacobs ord): en pixel-diff-regression
  # och en träffyta-regression är olika klasser av fel — ska synas som olika
  # klasser i CI-statusen, inte begravas i samma jobbs gröna/röda. Se
  # tests/visual/tapTargetOverlap.ts för vad grinden faktiskt täcker (och
  # dess kända begränsning: bottennav-kollision bara mätbar där
  # [data-bottom-nav] renderas, vilket idag bara är den nya
  # navgate-laddning-band-scenen).
  tap-target-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual/tapTargetGate.visual.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tap-target-gate-report
          path: playwright-report

  # Kontrastgrinden (åtgärdslistans post 17, 2026-08-18): WCAG-kontrast för
  # alla [data-primary-card]-varianter (Portal-Primary-familjen). Egen job,
  # samma motiv som tap-target-gate — en kontrastregression är en annan
  # felklass än en pixel-diff, ska synas som en egen grön/röd i CI.
  contrast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual/contrastGate.visual.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-gate-report
          path: playwright-report

  # En-primär-grinden (åtgärdslistans post 18, 2026-08-19): max 1 synlig
  # .btn-primary per skärm (CLAUDE.md-regeln, aldrig mätt automatiskt förut).
  en-primary-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual/enPrimaryGate.visual.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: en-primary-gate-report
          path: playwright-report

  # Matchtypsmatris-grinden (åtgärdslistans post 20, 2026-08-19): frånvaro
  # av irrelevanta Granska-sektioner + närvaro av "ankaret" (kapitelPunkt).
  matchtypsmatris-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual/matchtypsmatrisGate.visual.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matchtypsmatris-gate-report
          path: playwright-report

  # DecisionCard-dubbelpadding-grinden (åtgärdslistans post 7/21, 2026-08-19).
  decisioncard-padding-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual/decisionCardPaddingGate.visual.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: decisioncard-padding-gate-report
          path: playwright-report

  # Visuell regression: jämför /dev/scenes mot Linux-seedade baselines (samma OS →
  # pixelstabilt, till skillnad från Mac-vs-Linux). Baselines seedas via
  # visual-baselines.yml (workflow_dispatch). Innan de finns hoppar jobbet över
  # jämförelsen (ingen falsk röd). Separat job → blockar inte övriga checks.
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: baselines
        name: Finns Linux-baselines?
        run: |
          if ls tests/visual/__snapshots__/*-linux.png >/dev/null 2>&1; then
            echo "exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "exist=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Inga Linux-baselines ännu — kör workflow visual-baselines för att seeda."
          fi
      - if: steps.baselines.outputs.exist == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.baselines.outputs.exist == 'true'
        # Explicit filnamn, INTE npm run test:visual (som matchar alla
        # *.visual.ts): tapTargetGate.visual.ts har sin egen port ovan och
        # ska inte köras dubbelt eller fälla DETTA jobb vid en tap-target-
        # regression — de är olika felklasser (se tap-target-gate-jobbet).
        run: npx playwright test tests/visual/scenes.visual.ts tests/visual/baseline.visual.ts
      - if: ${{ failure() && steps.baselines.outputs.exist == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: playwright-report
