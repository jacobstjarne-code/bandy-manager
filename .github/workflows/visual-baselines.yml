name: visual-baselines

# Seedar/uppdaterar Linux-baselines för /dev/scenes visuell regression och committar dem.
# Kör MANUELLT (workflow_dispatch). Baselines MÅSTE komma från Linux-CI — aldrig ur
# Mac-renders — annars falsk-diffar varje körning p.g.a. cross-OS font-rendering.
# Kör efter en avsiktlig visuell ändring (eller första gången) → granska diffen i committen.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generera/uppdatera baselines (Linux)
        run: npm run test:visual:update
      - name: Committa baselines om de ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__snapshots__/*-linux.png
          if git diff --staged --quiet; then
            echo "Inga baseline-ändringar."
          else
            git commit -m "test(visual): seed/uppdatera Linux-baselines (workflow_dispatch)"
            git push
          fi
