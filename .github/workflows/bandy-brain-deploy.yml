# Bandy-Brain — manuell reservdeploy till GitHub Pages
#
# KANONISK PRODUKTION: Vercel-projektet bandy-manager-8dru + bandybrain.se.
# Den här workflowen körs därför endast manuellt och ska inte konkurrera med
# Vercels automatiska deploy från main.
#
# Prerequisites before enabling:
#   1. Create a new GitHub repo (e.g. bandy-brain or use this repo with gh-pages branch)
#   2. In repo Settings → Pages → Source: GitHub Actions
#   3. Optionally add custom domain (bandy-brain.bury-fen.se) in Pages settings
#      and create CNAME file in bandy-brain/public/
#
# Kör vid behov via GitHub Actions → Run workflow.

name: Deploy Bandy-Brain

on:
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: bandy-brain/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Verify fact links
        run: python3 scripts/check_links.py

      - name: Validate fact structure
        run: python3 scripts/validate_brain.py

      - name: Install dependencies
        run: npm ci
        working-directory: bandy-brain

      - name: Build
        run: npm run build
        working-directory: bandy-brain

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bandy-brain/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
