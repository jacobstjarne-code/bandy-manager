inear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #3 \n.h-display-xl { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; }\n.h-display-lg { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; }\n.h-display-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }\n.h-display-sm { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }\n\n/* Card titles (body, heavy) */\n.h-card     { font-family: var(--font-body); font-size: 14px; font-weight: 700; line-height: 1.3; }\n.h-card-sm  { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.3; }\n\n/* Body copy */\n.h-body     { font-family: var(--font-body); font-size: 12px; font-weight: 400; line-height: 1.45; color: var(--text-primary); }\n.h-body-sm  { font-family: var(--font-body); font-size: 11px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); }\n.h-body-xs  { font-family: var(--font-body); font-size: 10px; font-weight: 400; line-height: 1.45; color: var(--text-muted); }\n\n/* Section label — emoji + UPPERCASE letter-spaced */\n.h-label {\n  font-family: var(--font-body);\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin: 0 0 4px 0;\n}\n\n/* Quote / narrative (italic Georgia) */\n.h-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 12px;\n  color: var(--text-secondary);\n  line-height: 1.4;\n}\n\n/* CTA text — uppercase, letter-spaced */\n.h-cta {\n  font-family: var(--font-body);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SCEN-TYPOGRAFI (mörk bakgrund — ArrivalScene m.fl.)\n   Etablerad 2026-05-08 efter scenrevision (handover från Opus).\n   Komplement till .h-* som är dagsljus-optimerade.\n   ═══════════════════════════════════════════════════════════ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPELKÄNSLE-GENOMGÅNG — review-dokument\n   Mörk review-estetik, riktiga Bandy Manager-tokens.\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* canvas */\n  --rv-bg:        #1a1714;\n  --rv-bg-2:      #211d19;\n  --rv-panel:     #262019;\n  --rv-line:      rgba(245,241,235,0.08);\n  --rv-line-2:    rgba(245,241,235,0.14);\n\n  /* text */\n  --rv-ink:       #F2ECE1;\n  --rv-ink-2:     #C6BCA9;\n  --rv-ink-3:     #8E867A;\n\n  /* brand (ur colors_and_type.css) */\n  --accent:       #C47A3A;\n  --accent-dark:  #A25828;\n  --accent-deep:  #8B4820;\n  --success:      #5A9A4A;\n  --danger:       #B05040;\n  --danger-text:  #D08A78;\n  --ice:          #7EB3D4;\n  --cold:         #7E9BB5;\n  --warm:         #C4A86A;\n  --gold:         #D8B45A;\n\n  /* portal dark */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n  --text-muted:           #8A857A;\n\n  /* LED */\n  --led-bg:    #0A0A0A;\n  --led-score: #FF1A1A;\n  --led-time:  #CCFF00;\n  --led-us:    #FFB033;\n  --led-them:  #6FC0E8;\n\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --mono:  'Courier New', ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background:\n    radial-gradient(1200px 700px at 50% -200px, #2a231c 0%, transparent 60%),\n    var(--rv-bg);\n  color: var(--rv-ink);\n  font-family: var(--sans);\n  -webkit-font-smoothing: antialiased;\n  line-height: 1.5;\n  padding-bottom: 80px;\n}\n\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n\n/* ── Hero ─────────────────────────────────────────── */\n.hero {\n  text-align: center;\n  padding: 84px 0 48px;\n  border-bottom: 1px solid var(--rv-line);\n}\n.hero .kick {\n  font-size: 10px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase;\n  color: var(--accent); opacity: 0.85;\n}\n.hero h1 {\n  font-family: var(--serif); font-weight: 800; font-size: 52px; line-height: 1.05;\n  margin: 18px 0 0; letter-spacing: -0.5px;\n}\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub {\n  font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--rv-ink-2);\n  max-width: 680px; margin: 20px auto 0; line-height: 1.6;\n}\n.hero .meta {\n  margin-top: 26px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;\n  font-size: 11px; color: var(--rv-ink-3); letter-spacing: 0.3px;\n}\n.hero .meta b { color: var(--rv-ink-2); font-weight: 600; }\n\n/* ── Section scaffold ─────────────────────────────── */\n.sec { padding: 70px 0 0; }\n.sec-head { margin-bottom: 30px; }\n.sec-num {\n  font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--accent);\n  letter-spacing: 2px;\n}\n.sec-head h2 {\n  font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1.12;\n  margin-top: 6px; letter-spacing: -0.3px;\n}\n.sec-head p {\n  font-size: 13.5px; color: var(--rv-ink-2); max-width: 760px; margin-top: 12px; line-height: 1.65;\n}\n.sec-head p strong { color: var(--rv-ink); font-weight: 600; }\n.sec-head p .c { color: var(--accent); font-weight: 600; }\n\n/* ── The curve ────────────────────────────────────── */\n.curve-card {\n  margin-top: 8px; background: linear-gradient(180deg, #221d17, #1c1813);\n  border: 1px solid var(--rv-line); border-radius: 14px; padding: 30px 30px 22px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.curve-svg { width: 100%; height: auto; display: block; }\n.curve-legend {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px;\n}\n.cl {\n  border-top: 2px solid var(--cz); padding-top: 10px;\n}\n.cl .cl-r { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--rv-ink-3); text-transform: uppercase; }\n.cl .cl-t { font-family: var(--serif); font-size: 15px; font-weight: 700; margin-top: 3px; color: var(--rv-ink); }\n.cl .cl-d { font-size: 11.5px; color: var(--rv-ink-2); margin-top: 5px; line-height: 1.5; }\n.cl.dip .cl-t { color: var(--danger-text); }\n\n/* ── Diagnosis rows (phone + panel) ───────────────── */\n.diag {\n  display: grid; grid-template-columns: 300px 1fr; gap: 38px; align-items: start;\n  padding: 30px 0; border-top: 1px solid var(--rv-line);\n}\n.diag:first-of-type { border-top: none; }\n.diag-panel { padding-top: 6px; }\n.diag-tag {\n  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;\n  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;\n}\n.diag-panel h3 { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.2; }\n.diag-panel > p { font-size: 13px; color: var(--rv-ink-2); margin-top: 10px; line-height: 1.6; }\n\n/* problem / move callouts */\n.flag { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--rv-line); }\n.flag:first-of-type { margin-top: 14px; }\n.flag-ic {\n  flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; margin-top: 1px;\n  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700;\n}\n.flag.bad  .flag-ic { background: rgba(176,80,64,0.16);  color: var(--danger-text); }\n.flag.good .flag-ic { background: rgba(196,122,58,0.16); color: var(--accent); }\n.flag-body { font-size: 12.5px; line-height: 1.55; }\n.flag-body b { color: var(--rv-ink); font-weight: 600; }\n.flag.bad .flag-body b  { color: var(--danger-text); }\n.flag.good .flag-body b { color: var(--accent); }\n.flag-body span { color: var(--rv-ink-2); }\n\n/* severity score chip */\n.sev {\n  display: inline-flex; align-items: center; gap: 7px; margin-top: 16px;\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--rv-ink-3);\n}\n.sev b { color: var(--rv-ink); }\n.sev-bar { width: 90px; height: 5px; border-radius: 3px; background: var(--rv-line-2); overflow: hidden; }\n.sev-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger)); }\n\n/* ── Before / after ───────────────────────────────── */\n.ba-head {\n  display: flex; align-items: baseline; gap: 14px; margin: 18px 0 22px;\n}\n.ba-head .ba-pin {\n  font-family: var(--serif); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1;\n}\n.ba-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; }\n.ba-head .ba-sub { font-size: 12px; color: var(--rv-ink-3); margin-left: auto; font-family: var(--mono); letter-spacing: 0.5px; }\n\n.ba {\n  display: grid; grid-template-columns: 1fr 54px 1fr; gap: 0; align-items: start;\n  margin-top: 6px;\n}\n.ba-col { }\n.ba-col .ba-lbl {\n  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;\n}\n.ba-col .ba-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }\n.ba-col.before .dot { background: var(--danger); }\n.ba-col.after  .dot { background: var(--success); }\n.ba-col .ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }\n.ba-col.before .t { color: var(--danger-text); }\n.ba-col.after  .t { color: var(--success); }\n.ba-col .ba-lbl .s { font-size: 11px; color: var(--rv-ink-3); font-style: italic; font-family: var(--serif); }\n.ba-arrow {\n  display: grid; place-items: center; padding-top: 200px;\n  color: var(--accent); font-size: 24px;\n}\n.ba-notes { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }\n.ba-note { display: flex; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.ba-note .n-ic { color: var(--success); flex-shrink: 0; font-weight: 700; }\n.ba-note b { color: var(--rv-ink); font-weight: 600; }\n\n/* ═══════════════════════════════════════════════════\n   PHONE MOCKS — faithful BM recreation\n   ═══════════════════════════════════════════════════ */\n.phone {\n  border-radius: 18px; overflow: hidden; background: var(--bg-portal);\n  border: 4px solid #0b0a08; box-shadow: 0 14px 38px rgba(0,0,0,0.5);\n}\n.phone.paper { background: #EDE8DF; }\n.scr { position: relative; display: flex; flex-direction: column; min-height: 480px; }\n\n/* GameHeader */\n.gh {\n  background: linear-gradient(180deg, #3D3A32, #2a2822);\n  border-bottom: 2px solid var(--accent);\n  display: grid; grid-template-columns: 26px 1fr 40px; align-items: center; gap: 8px;\n  padding: 8px 12px;\n}\n.gh-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(245,241,235,0.4);\n  display: grid; place-items: center; font-family: var(--serif); font-size: 9px; color: var(--text-light); }\n.gh-mid { text-align: center; }\n.gh-club { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); letter-spacing: 0.5px; }\n.gh-sub  { font-size: 8px; color: var(--text-light-secondary); letter-spacing: 0.5px; margin-top: 1px; }\n.gh-bell { justify-self: end; display: flex; gap: 6px; color: var(--text-light-secondary); font-size: 13px; }\n.gh-bell .dot-n { position: relative; }\n.gh-bell .dot-n::after { content:''; position:absolute; top:-1px; right:-2px; width:5px; height:5px; border-radius:50%; background: var(--danger); }\n\n/* PhaseIndicator */\n.pi {\n  display: flex; align-items: center; justify-content: center; gap: 6px;\n  padding: 7px 12px; background: rgba(0,0,0,0.18); border-bottom: 1px solid rgba(0,0,0,0.25);\n}\n.pi.paper { background: #E4DED3; border-bottom: 1px solid var(--border, #DDD7CC); }\n.pi-step { display: flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }\n.pi.dark .pi-step { color: var(--text-muted); }\n.pi.paper .pi-step { color: #8A857A; }\n.pi-step .pd { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }\n.pi-step.on { color: var(--accent); }\n.pi-step.on .pd { background: var(--accent); border-color: var(--accent); }\n.pi-line { width: 22px; height: 1px; background: currentColor; opacity: 0.3; }\n\n/* generic scroll body */\n.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.body.paper { background: #EDE8DF; }\n.body.dark  { background: var(--bg-portal); }\n\n/* section label */\n.lbl { font-size: 8px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }\n.lbl.dark  { color: var(--text-muted); }\n.lbl.paper { color: #8A857A; }\n\n/* cards */\n.c-sharp { border-radius: 8px; padding: 10px 12px; }\n.c-round { border-radius: 14px; padding: 11px 13px; }\n.c-paper { background: #FAF8F4; border: 1px solid #DDD7CC; }\n.c-dark  { background: var(--bg-portal-surface); border: 1px solid var(--rv-line-2); }\n.c-elev  { background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2); }\n\n/* next-match leather */\n.nmc {\n  background: linear-gradient(180deg, #3D3520, #2a2418);\n  border-radius: 8px; padding: 11px 13px; color: var(--text-light);\n}\n.nmc-top { display: flex; align-items: center; justify-content: space-between; }\n.nmc-tag { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--match-gold, #D4B860); display:flex; gap:5px; align-items:center;}\n.nmc-home { font-size: 7px; font-weight: 700; letter-spacing: 1px; color: #0E0D0B; background: var(--accent); padding: 2px 6px; border-radius: 99px; }\n.nmc-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; gap: 8px; }\n.nmc-badge { width: 34px; height: 34px; border-radius: 6px; margin: 0 auto; display: grid; place-items: center; font-size: 15px; }\n.nmc-team { text-align: center; font-family: var(--serif); font-size: 11px; font-weight: 700; margin-top: 4px; }\n.nmc-mid { text-align: center; }\n.nmc-time { font-family: var(--serif); font-size: 13px; color: var(--match-gold, #D4B860); }\n.nmc-arena { font-size: 7.5px; color: var(--text-light-secondary); margin-top: 2px; }\n.nmc-form { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 8px; letter-spacing: 1px; color: var(--text-light-secondary); }\n.fdot { width: 7px; height: 7px; border-radius: 50%; }\n.fdots { display: flex; gap: 3px; }\n\n/* metric tiles */\n.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.tile-val { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1; }\n.tile-sub { font-size: 9px; margin-top: 4px; }\n\n/* quote / diary */\n.diary { }\n.diary-q { font-family: var(--serif); font-style: italic; font-size: 12px; line-height: 1.5; }\n\n/* tactic selector */\n.tac { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }\n.tac-opt { border-radius: 8px; padding: 9px 6px; text-align: center; border: 1px solid #DDD7CC; background: #FAF8F4; }\n.tac-opt.on { border: 1.5px solid var(--accent); background: #FBF3EA; }\n.tac-opt .to-t { font-size: 11px; font-weight: 700; color: #1A1A18; }\n.tac-opt.on .to-t { color: var(--accent-dark); }\n.tac-opt .to-s { font-size: 8px; color: #8A857A; margin-top: 2px; }\n\n/* pitch */\n.pitch { background: #2d6e3a; border-radius: 8px; position: relative; height: 150px; overflow: hidden; }\n.pitch::before { content:''; position:absolute; inset:0; background:\n  repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,0.04) 18px 36px); }\n.pp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #1e4d8c; border: 1.5px solid rgba(255,255,255,0.5);\n  display: grid; place-items: center; font-size: 7px; font-weight: 700; color: #fff; transform: translate(-50%,-50%); }\n\n/* LED scoreboard mini */\n.led {\n  background: var(--led-bg); border: 1px solid var(--accent-deep); border-radius: 6px;\n  padding: 9px 11px; position: relative;\n}\n.led-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }\n.led-team { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; }\n.led-team.us { color: var(--led-us); } .led-team.them { color: var(--led-them); text-align: right; }\n.led-score { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 2px; text-align: center; }\n.led-score .us { color: var(--led-us); } .led-score .them { color: var(--led-them); } .led-score .sep { color: #555; }\n.led-time { font-family: var(--mono); font-size: 15px; color: var(--led-score); letter-spacing: 1px; text-align: center; margin-top: 2px; }\n.led-per  { font-family: var(--mono); font-size: 9px; color: var(--led-time); text-align: center; }\n\n/* momentum bar */\n.mom { margin-top: 8px; }\n.mom-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }\n.mom-top .st { color: var(--accent); }\n.mom-track { height: 8px; border-radius: 4px; margin-top: 5px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 58%, #2a3a44 58%, var(--ice) 100%); }\n\n/* feed line */\n.feed { display: flex; gap: 9px; font-size: 10px; padding: 4px 0; }\n.feed .min { font-family: var(--mono); font-size: 9px; color: var(--text-muted); width: 22px; flex-shrink: 0; }\n.feed .tx { color: var(--text-light-secondary); line-height: 1.4; }\n.feed.goal .tx { color: var(--accent); font-weight: 600; }\n\n/* mini button */\n.mbtn { border-radius: 8px; padding: 9px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.mbtn-cta { background: linear-gradient(180deg, #DD9555, #8B4820); color: #fff; box-shadow: 0 3px 5px rgba(162,88,40,0.4); }\n.mbtn-ghost { background: transparent; border: 1.5px solid var(--rv-line-2); color: var(--text-light); }\n.mbtn-out { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }\n\n/* stripe-left accent */\n.stripe { position: relative; }\n.stripe::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; border-radius:2px; }\n.stripe.cold::before { background: var(--cold); }\n.stripe.warm::before { background: var(--warm); }\n.stripe.accent::before { background: var(--accent); }\n\n/* meter (puls / fanMood) */\n.meter { }\n.meter-top { display: flex; justify-content: space-between; align-items: baseline; }\n.meter-lbl { font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n.meter-val { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--text-light); }\n.meter-val s { font-size: 9px; color: var(--text-muted); text-decoration: none; font-weight: 400; }\n.meter-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 6px; overflow: hidden; }\n.meter-track i { display: block; height: 100%; border-radius: 3px; }\n.meter-cons { display: flex; gap: 8px; font-size: 8px; font-weight: 600; margin-top: 6px; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* \"dead\" marker overlay used in diagnosis */\n.dead-pin {\n  position: absolute; top: 8px; right: 8px; z-index: 4;\n  font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px;\n  background: rgba(176,80,64,0.92); color: #fff; padding: 3px 7px; border-radius: 4px;\n  text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.4);\n}\n\n/* eyebrow scene */\n.eyebrow { font-size: 8px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: var(--cold); }\n\n/* priority table */\n.prio { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }\n.prio-row {\n  display: grid; grid-template-columns: 30px 1fr 120px 92px; gap: 16px; align-items: center;\n  background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 10px; padding: 14px 18px;\n}\n.prio-row .rank { font-family: var(--serif); font-size: 22px; font-weight: 800; color: var(--accent); }\n.prio-row .what b { font-size: 13.5px; font-weight: 700; color: var(--rv-ink); }\n.prio-row .what span { display: block; font-size: 11.5px; color: var(--rv-ink-2); margin-top: 3px; line-height: 1.45; }\n.prio-row .eff { font-size: 10px; letter-spacing: 0.5px; }\n.prio-row .eff .k { color: var(--rv-ink-3); text-transform: uppercase; font-size: 8px; letter-spacing: 1px; }\n.prio-row .eff .v { color: var(--rv-ink); font-weight: 600; }\n.impact { display: flex; gap: 3px; }\n.impact i { width: 10px; height: 10px; border-radius: 2px; background: var(--rv-line-2); }\n.impact i.on { background: var(--accent); }\n\n/* foot */\n.foot { margin-top: 64px; padding-top: 26px; border-top: 1px solid var(--rv-line); text-align: center;\n  font-size: 11px; color: var(--rv-ink-3); line-height: 1.7; }\n.foot b { color: var(--rv-ink-2); }\n\n@media (max-width: 920px) {\n  .diag { grid-template-columns: 1fr; }\n  .ba { grid-template-columns: 1fr; gap: 28px; }\n  .ba-arrow { padding: 0; transform: rotate(90deg); }\n  .prio-row { grid-template-columns: 30px 1fr; }\n  .prio-row .eff, .prio-row .impact { display: none; }\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════\n   MENTORSKAP — läsbarhets-brief\n   tillägg ovanpå spelkansle_review.css\n   ═══════════════════════════════════════════════════ */\n\n/* canon banner reused from b1 .verdict — redeclare minimal here in case loaded alone */\n.verdict {\n  margin-top: 18px;\n  background: linear-gradient(180deg, #2a2218, #211c15);\n  border: 1px solid rgba(196,122,58,0.35);\n  border-radius: 14px; padding: 24px 26px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.verdict .vk { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }\n.verdict h2 { font-family: var(--serif); font-size: 23px; font-weight: 700; line-height: 1.2; margin-top: 10px; letter-spacing: -0.3px; }\n.verdict h2 em { font-style: italic; color: var(--accent); }\n.verdict .canon-list { margin-top: 14px; display: grid; gap: 9px; }\n.verdict .ci { display: flex; gap: 10px; font-size: 12.5px; color: var(--rv-ink-2); line-height: 1.5; }\n.verdict .ci .cn { flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; background: rgba(90,154,74,0.18); color: var(--success); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700; margin-top: 1px; }\n.verdict .ci b { color: var(--rv-ink); font-weight: 600; }\n\n/* ── Mentor bond on a player card ── */\n.bond {\n  display: flex; align-items: center; gap: 9px;\n  padding: 9px 11px; border-radius: 8px;\n  background: #FBF3EA; border: 1px solid var(--accent);\n}\n.bond.dark { background: rgba(196,122,58,0.10); border-color: rgba(196,122,58,0.5); }\n.bond .bava {\n  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;\n  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;\n  border: 2px solid rgba(255,255,255,0.25);\n}\n.bond .btxt { flex: 1; min-width: 0; }\n.bond .brole { font-size: 8px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent-dark); }\n.bond.dark .brole { color: var(--accent); }\n.bond .bname { font-size: 12.5px; font-weight: 700; color: #1A1A18; margin-top: 1px; }\n.bond.dark .bname { color: var(--text-light); }\n.bond .bsub { font-size: 9.5px; color: #6B6760; margin-top: 2px; font-family: var(--serif); font-style: italic; }\n.bond.dark .bsub { color: var(--text-light-secondary); }\n\n/* state pill */\n.spill { display: inline-flex; align-items: center; gap: 5px; font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; flex-shrink: 0; }\n.spill .sd { width: 6px; height: 6px; border-radius: 50%; }\n.spill.active { background: rgba(90,154,74,0.16); color: var(--success); }\n.spill.active .sd { background: var(--success); box-shadow: 0 0 0 2px rgba(90,154,74,0.2); }\n.spill.dormant { background: rgba(126,155,181,0.18); color: var(--cold); }\n.spill.dormant .sd { background: var(--cold); }\n\n/* mentor badge inline on trait row */\n.mtrait { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 700; letter-spacing: 0.3px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent-dark); background: #FBF3EA; }\n\n/* effect read line */\n.efread { display: flex; align-items: center; gap: 7px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #E4DED3; }\n.efread .ei { font-size: 12px; }\n.efread .et { font-size: 10px; color: #3a352c; font-family: var(--serif); font-style: italic; line-height: 1.4; }\n.efread.dark { border-top-color: var(--rv-line); }\n.efread.dark .et { color: var(--text-light-secondary); }\n\n/* akademi enriched pair row */\n.pair {\n  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;\n  padding: 10px 0; border-bottom: 1px solid #DDD7CC;\n}\n.pair:last-child { border-bottom: none; }\n.pair .pnames { font-size: 12px; color: #1A1A18; }\n.pair .pnames b { font-weight: 700; }\n.pair .pnames .arr { color: var(--accent); margin: 0 4px; }\n.pair .pmeta { font-size: 9px; color: #6B6760; margin-top: 3px; display: flex; gap: 8px; align-items: center; }\n\n/* Code spec strip */\n.spec { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n.spec-card { background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 12px; padding: 16px 18px; }\n.spec-card h4 { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--rv-ink); }\n.spec-card .sf { font-family: var(--mono); font-size: 10.5px; color: var(--ice); margin-top: 8px; line-height: 1.7; }\n.spec-card .sf b { color: var(--rv-ink); font-family: var(--sans); font-weight: 600; }\n.spec-card ul { list-style: none; margin-top: 10px; display: grid; gap: 7px; }\n.spec-card li { font-size: 11.5px; color: var(--rv-ink-2); line-height: 1.5; padding-left: 14px; position: relative; }\n.spec-card li::before { content: '·'; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }\n.spec-card li b { color: var(--rv-ink); font-weight: 600; }\n.spec-open { grid-column: 1 / -1; background: rgba(196,122,58,0.07); border: 1px solid rgba(196,122,58,0.3); border-radius: 12px; padding: 15px 18px; }\n.spec-open .ok { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }\n.spec-open p { font-size: 12px; color: var(--rv-ink-2); line-height: 1.55; margin-top: 6px; }\n.spec-open p b { color: var(--rv-ink); font-weight: 600; }\n@media (max-width: 760px) { .spec { grid-template-columns: 1fr; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">B1 · läsbarhets-brief · mentorskap<\u002Fp>\n    <h1>Se <em>bandet<\u002Fem><\u002Fh1>\n    <p class=\"sub\">Mentorskapet är byggt och konsekvensen tickar — men på spelarkortet, där du faktiskt möter människan, finns inget spår. Den här briefen gör <em>relationen läsbar<\u002Fem>: vem mentorerar vem, att den lever, och när den vilar. Kanon är satt; nu ska den synas.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Kanon<\u002Fb> · System 2 (<code style=\"font-family:var(--mono)\">mentorships<\u002Fcode>)<\u002Fspan>\n      <span><b>Grund<\u002Fb> · Academy.ts · AkademiTab · PlayerCard<\u002Fspan>\n      <span><b>2026-06-20<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"verdict\">\n      <div class=\"vk\">Kanon · beslutat av Jacob<\u002Fdiv>\n      <h2>Ett mentorskap. <em>Veteran → ung bevarad.<\u002Fem><\u002Fh2>\n      <div class=\"canon-list\">\n        <div class=\"ci\"><span class=\"cn\">1<\u002Fspan><span><b>System 2 är mentorskapet.<\u002Fb> <code style=\"font-family:var(--mono);font-size:11px\">game.mentorships<\u002Fcode> — du väljer mentor <em>och<\u002Fem> adept. Ett fält, en yta, en sanning.<\u002Fspan><\u002Fdiv>\n        <div class=\"ci\"><span class=\"cn\">2<\u002Fspan><span><b>Veteran→ung A-spelare bevaras.<\u002Fb> Adept-behörigheten vidgas till A-trupps-U22, inte bara P19/akademi. Fantasin \"kaptenen tar den unge under sina vingar\" lever — men routad genom det bra systemet.<\u002Fspan><\u002Fdiv>\n        <div class=\"ci\"><span class=\"cn\">3<\u002Fspan><span><b><code style=\"font-family:var(--mono);font-size:11px\">'mentor'<\u002Fcode> ut ur Ledarskap-panelen.<\u002Fb> Ett långt strukturellt åtagande hör inte hemma bland transienta moral-tryck. Panelen behåller lower_tempo · private_talk · public_praise.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ 1 · GAPET ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — GAPET<\u002Fdiv>\n      <h2>Du parar dem — sen försvinner bandet<\u002Fh2>\n      <p>Du tilldelar ett mentorskap i Akademi-fliken, får en bekräftelserad, och sen lever konsekvensen i det tysta: <code style=\"font-family:var(--mono);font-size:11px\">developmentRate<\u002Fcode> + självförtroende tickar varje omgång. Men öppnar du <strong>adeptens spelarkort<\u002Fstrong> — där du faktiskt undrar \"hur går det för grabben?\" — finns <span class=\"c\">inget spår alls<\u002Fspan>. Ingen mentor nämnd, ingen effekt, ingenting. Klassisk löfte↔konsekvens-lucka: bandet finns i motorn men inte för ögat.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"diag\">\n      <div class=\"phone paper\">\n        <div class=\"scr\" style=\"min-height:430px\">\n          <div style=\"position:relative\">\n            <div class=\"dead-pin\">mentor: inget spår<\u002Fdiv>\n            <div style=\"padding:13px 13px 11px;background:linear-gradient(180deg,#F3EFE8,#FAF8F4);border-bottom:1px solid #DDD7CC\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                <div style=\"width:48px;height:48px;border-radius:10px;background:repeating-linear-gradient(135deg,#cdbfa3 0 6px,#bcae92 6px 12px);flex-shrink:0\"><\u002Fdiv>\n                <div style=\"flex:1\">\n                  <div style=\"font-size:15px;font-weight:900;color:#1A1A18;text-transform:uppercase;letter-spacing:-0.3px\">Henriksson<\u002Fdiv>\n                  <div style=\"font-size:9px;color:var(--accent-dark);font-weight:700;letter-spacing:0.5px;margin-top:3px\">MF · 17 ÅR · #28 · P19→A<\u002Fdiv>\n                  <div style=\"display:flex;gap:4px;margin-top:6px\">\n                    <span style=\"font-size:8px;font-weight:700;color:#6B6760;border:1px solid #DDD7CC;border-radius:99px;padding:1px 6px\">🌱 Talang<\u002Fspan>\n                    <span style=\"font-size:8px;font-weight:700;color:#6B6760;border:1px solid #DDD7CC;border-radius:99px;padding:1px 6px\">🏘️ Lokal<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:7px;padding-top:10px\">\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">💪 STATUS<\u002Fdiv><\u002Fdiv>\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">⭐ EGENSKAPER<\u002Fdiv><\u002Fdiv>\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">🏒 SÄSONG<\u002Fdiv><\u002Fdiv>\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">🤝 RELATIONER<\u002Fdiv><div style=\"font-size:10px;color:#8A857A;margin-top:3px;font-style:italic;font-family:var(--serif)\">Kontrakt · lön · samtal — men ingen mentor<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"diag-panel\">\n        <div class=\"diag-tag\">Diagnos · adeptens kort idag<\u002Fdiv>\n        <h3>Relationen finns överallt utom där du tittar<\u002Fh3>\n        <p>Akademi-fliken vet att Henriksson mentoreras. Motorn vet det — <code style=\"font-family:var(--mono);font-size:11px\">YouthPlayer.mentorId<\u002Fcode> pekar på Lundqvist. Men kortet läser aldrig fältet. RELATIONER-sektionen visar kontrakt och samtal men inte den enda relation som faktiskt formar hans utveckling just nu.<\u002Fp>\n        <div class=\"flag bad\"><div class=\"flag-ic\">!<\u002Fdiv><div class=\"flag-body\"><b>Adepten:<\u002Fb> <span>ingen \"mentoreras av X\", ingen effekt-läsning. Du ser inte varför han växer snabbare.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag bad\"><div class=\"flag-ic\">!<\u002Fdiv><div class=\"flag-body\"><b>Mentorn:<\u002Fb> <span>Lundqvists kort säger inte att han är mentor åt någon — ett av hans viktigaste bidrag är osynligt.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag bad\"><div class=\"flag-ic\">!<\u002Fdiv><div class=\"flag-body\"><b>Vilande syns inte:<\u002Fb> <span>tappar mentorn formen pausas effekten (grind: form ≥40) — men ingenstans sägs det. Tyst konsekvens av en tyst konsekvens.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"sev\"><span>Läsbarhet<\u002Fspan><span class=\"sev-bar\"><i style=\"width:90%\"><\u002Fi><\u002Fspan><b>Nästan osynlig<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2 · ADEPTENS KORT ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — ADEPTEN<\u002Fdiv>\n      <h2>\"Mentoreras av Lundqvist\" — på kortet<\u002Fh2>\n      <p>Bandet hör hemma högt i RELATIONER, inte begravt. En rad med rutinarens ansikte, vad det <span class=\"c\">gör<\u002Fspan> (växer snabbare), och sedan när. Härlett rakt ur <code style=\"font-family:var(--mono);font-size:11px\">mentorId<\u002Fcode> — kortet hävdar bara det datan bär.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">RELATIONER utan mentor<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\">\n          <div class=\"scr\" style=\"min-height:300px\">\n            <div style=\"padding:11px 13px;border-bottom:1px solid #DDD7CC;background:#FAF8F4\">\n              <div style=\"font-size:14px;font-weight:900;color:#1A1A18;text-transform:uppercase\">Henriksson · 17<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:7px\">\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">🤝 RELATIONER<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#3a352c;margin-top:5px;font-family:var(--serif)\">📋 Kontrakt t.o.m. 2029<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#3a352c;margin-top:3px;font-family:var(--serif)\">💬 Senaste samtal: omg 8<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\" style=\"color:var(--danger-text)\">×<\u002Fspan><span>Den relation som formar honom mest just nu står inte med.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">mentor-bandet överst i RELATIONER<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\">\n          <div class=\"scr\" style=\"min-height:300px\">\n            <div style=\"padding:11px 13px;border-bottom:1px solid #DDD7CC;background:#FAF8F4\">\n              <div style=\"font-size:14px;font-weight:900;color:#1A1A18;text-transform:uppercase\">Henriksson · 17<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:8px\">\n              <div class=\"c-sharp c-paper\" style=\"padding-bottom:11px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:7px\"><div class=\"lbl paper\">🤝 RELATIONER<\u002Fdiv><span class=\"spill active\"><span class=\"sd\"><\u002Fspan>Aktiv<\u002Fspan><\u002Fdiv>\n                <div class=\"bond\">\n                  <div class=\"bava\" style=\"background:radial-gradient(circle,#c47a3a,#8b4820)\">EL<\u002Fdiv>\n                  <div class=\"btxt\">\n                    <div class=\"brole\">Mentoreras av<\u002Fdiv>\n                    <div class=\"bname\">Erik Lundqvist<\u002Fdiv>\n                    <div class=\"bsub\">Kapten · 32 år · sedan omg 6<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"efread\"><span class=\"ei\">🌱<\u002Fspan><span class=\"et\">Växer snabbare med en rutinare bredvid sig. Självförtroendet kryper uppåt varje omgång.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"c-sharp c-paper\">\n                <div style=\"font-size:10.5px;color:#3a352c;font-family:var(--serif)\">📋 Kontrakt t.o.m. 2029 · 💬 Samtal omg 8<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Ansikte + roll + effekt + sedan-när.<\u002Fb> Allt härlett ur <code style=\"font-family:var(--mono);font-size:10px\">mentorId<\u002Fcode> och <code style=\"font-family:var(--mono);font-size:10px\">startRound<\u002Fcode> — inga påhittade siffror.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Effekten kvalitativt, inte rått.<\u002Fb> \"Växer snabbare\" i stället för \"+0.06 CA\" — i appens röst (lärdom: värde i känsla, inte tal-slop).<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Tappbar:<\u002Fb> bandet länkar till Lundqvists kort. Relationen går åt båda håll.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 3 · MENTORN + VILANDE ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">03 — MENTORN &amp; DET VILANDE<\u002Fdiv>\n      <h2>Andra sidan av bandet — och när det somnar<\u002Fh2>\n      <p>Samma rad, speglad på rutinarens kort: <strong>\"Mentor åt Henriksson\"<\u002Fstrong>. Och den verkligt läsbara vinsten: när mentorns form faller under grinden pausas effekten. Det är en <span class=\"c\">andra konsekvens av en formsvacka<\u002Fspan> — den stallar grabben — och idag helt osynlig. Vi gör vilan till ett tydligt, ärligt tillstånd, inte en tyst paus.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:start;margin-top:6px\">\n      <!-- mentor side -->\n      <div>\n        <div class=\"ba-lbl\"><span class=\"dot\" style=\"background:var(--accent)\"><\u002Fspan><span class=\"t\" style=\"color:var(--accent)\">Mentorns kort<\u002Fspan><span class=\"s\">bandet speglat<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\" style=\"max-width:300px\">\n          <div class=\"scr\" style=\"min-height:260px\">\n            <div style=\"padding:11px 13px;border-bottom:1px solid #DDD7CC;background:#FAF8F4\">\n              <div style=\"font-size:14px;font-weight:900;color:#1A1A18;text-transform:uppercase\">Erik Lundqvist · 32<\u002Fdiv>\n              <div style=\"display:flex;gap:4px;margin-top:6px\">\n                <span style=\"font-size:8px;font-weight:700;color:#6B6760;border:1px solid #DDD7CC;border-radius:99px;padding:1px 6px\">🦁 Ledare<\u002Fspan>\n                <span class=\"mtrait\">🎓 Mentor<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:8px\">\n              <div class=\"c-sharp c-paper\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:7px\"><div class=\"lbl paper\">🤝 RELATIONER<\u002Fdiv><span class=\"spill active\"><span class=\"sd\"><\u002Fspan>Aktiv<\u002Fspan><\u002Fdiv>\n                <div class=\"bond\">\n                  <div class=\"bava\" style=\"background:radial-gradient(circle,#5a8a4a,#2d6e3a)\">H<\u002Fdiv>\n                  <div class=\"btxt\">\n                    <div class=\"brole\">Mentor åt<\u002Fdiv>\n                    <div class=\"bname\">Henriksson, 17<\u002Fdiv>\n                    <div class=\"bsub\">MF · sedan omg 6<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- dormant state -->\n      <div>\n        <div class=\"ba-lbl\"><span class=\"dot\" style=\"background:var(--cold)\"><\u002Fspan><span class=\"t\" style=\"color:var(--cold)\">Vilande<\u002Fspan><span class=\"s\">mentorns form under grinden<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\" style=\"max-width:300px\">\n          <div class=\"scr\" style=\"min-height:260px\">\n            <div style=\"padding:11px 13px;border-bottom:1px solid #DDD7CC;background:#FAF8F4\">\n              <div style=\"font-size:14px;font-weight:900;color:#1A1A18;text-transform:uppercase\">Henriksson · 17<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:8px\">\n              <div class=\"c-sharp c-paper\" style=\"border-color:rgba(126,155,181,0.5)\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:7px\"><div class=\"lbl paper\">🤝 RELATIONER<\u002Fdiv><span class=\"spill dormant\"><span class=\"sd\"><\u002Fspan>Vilar<\u002Fspan><\u002Fdiv>\n                <div class=\"bond\" style=\"background:#EEF2F5;border-color:rgba(126,155,181,0.6)\">\n                  <div class=\"bava\" style=\"background:radial-gradient(circle,#7e9bb5,#56708a);opacity:0.85\">EL<\u002Fdiv>\n                  <div class=\"btxt\">\n                    <div class=\"brole\" style=\"color:var(--cold)\">Mentoreras av<\u002Fdiv>\n                    <div class=\"bname\">Erik Lundqvist<\u002Fdiv>\n                    <div class=\"bsub\">Sedan omg 6 · pausad<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"efread\" style=\"border-top-color:rgba(126,155,181,0.3)\"><span class=\"ei\">💤<\u002Fspan><span class=\"et\" style=\"color:#56708a\">Lundqvist är i svacka — formen för låg för att leda. Växten pausar tills han hittar tillbaka.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba-notes\" style=\"max-width:none;margin-top:22px\">\n      <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Vila ≠ borttaget.<\u002Fb> Bandet finns kvar, bara pausat. Cold-paletten (samma \"långsam/stabil\"-signal som fanMood-grundtonen) skiljer vilande från aktiv utan ny färg.<\u002Fspan><\u002Fdiv>\n      <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Formsvackan får en andra tyngd.<\u002Fb> Nu betyder rutinarens dipp något bortom hans egen match — den stallar grabben. Det gör valet \"vem ska mentorera\" till ett riktigt vad-om: en skör veteran är en opålitlig mentor.<\u002Fspan><\u002Fdiv>\n      <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Ärligt mot motorn.<\u002Fb> Grinden är <code style=\"font-family:var(--mono);font-size:10px\">form ≥ 40<\u002Fcode> — UI:t läser samma tröskel, hittar inte på en egen.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 4 · AKADEMI-FLIKEN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">04 — TILLDELNINGS-YTAN<\u002Fdiv>\n      <h2>Akademi-listan får liv den redan förtjänar<\u002Fh2>\n      <p>Tilldelnings-ytan finns och fungerar — men paret visas som naken text (\"X → Y\" + Ta bort). Den vet <code style=\"font-family:var(--mono);font-size:11px\">startRound<\u002Fcode> och kan läsa formgrinden, men säger inget av det. Samma bond-vokabulär som spelarkortet, så ytorna talar samma språk.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">naken textrad<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\">\n          <div class=\"scr\" style=\"min-height:280px\">\n            <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">🏛️ Klubb · Akademi<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\" style=\"color:#C4BAA8\">⚙<\u002Fdiv><\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:8px\">\n              <div class=\"c-sharp c-paper\">\n                <div class=\"lbl paper\">🤝 MENTORSKAP<\u002Fdiv>\n                <div style=\"font-size:10px;color:#8A857A;margin-top:4px;font-style:italic;font-family:var(--serif)\">Para ihop en senior med en junior för snabbare utveckling.<\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid #DDD7CC\">\n                  <span style=\"font-size:12px;color:#1A1A18\">Lundqvist → Henriksson<\u002Fspan>\n                  <span style=\"font-size:10px;color:var(--danger)\">Ta bort<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\" style=\"color:var(--danger-text)\">×<\u002Fspan><span>Vet inte sedan-när, om det är aktivt eller vilande, eller vad det ger.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">samma bond-språk · sedan · tillstånd<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\">\n          <div class=\"scr\" style=\"min-height:280px\">\n            <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">🏛️ Klubb · Akademi<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\" style=\"color:#C4BAA8\">⚙<\u002Fdiv><\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:8px\">\n              <div class=\"c-sharp c-paper\">\n                <div class=\"lbl paper\">🤝 MENTORSKAP · 2 av 3<\u002Fdiv>\n                <div class=\"pair\">\n                  <div>\n                    <div class=\"pnames\"><b>Lundqvist<\u002Fb><span class=\"arr\">→<\u002Fspan>Henriksson, 17<\u002Fdiv>\n                    <div class=\"pmeta\"><span class=\"spill active\" style=\"padding:2px 6px\"><span class=\"sd\"><\u002Fspan>Aktiv<\u002Fspan><span>sedan omg 6 · växer snabbare<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:10px;color:var(--danger)\">Ta bort<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"pair\">\n                  <div>\n                    <div class=\"pnames\"><b>Berglund<\u002Fb><span class=\"arr\">→<\u002Fspan>Norin, 16<\u002Fdiv>\n                    <div class=\"pmeta\"><span class=\"spill dormant\" style=\"padding:2px 6px\"><span class=\"sd\"><\u002Fspan>Vilar<\u002Fspan><span>Berglunds form för låg<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:10px;color:var(--danger)\">Ta bort<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top:10px;padding-top:9px;border-top:1px solid #DDD7CC;display:flex;gap:6px;flex-wrap:wrap\">\n                  <span class=\"np\" style=\"font-size:8.5px;background:#fff;border-color:#DDD7CC;color:#6B6760\">Välj mentor ▾<\u002Fspan>\n                  <span class=\"np\" style=\"font-size:8.5px;background:#fff;border-color:#DDD7CC;color:#6B6760\">Välj ung ▾<\u002Fspan>\n                  <span class=\"np on\" style=\"font-size:8.5px\">Tilldela<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Varje par bär sitt tillstånd.<\u002Fb> Aktiv/Vilar + sedan-omg + effekt — du ser läget utan att öppna varje kort.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Vidgad behörighet syns här.<\u002Fb> \"Välj ung\" listar nu P19 <em>och<\u002Fem> A-trupps-U22 — veteran→ung A-spelare tilldelas på samma yta.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Inget nytt API.<\u002Fb> Samma <code style=\"font-family:var(--mono);font-size:10px\">assignMentor<\u002Fcode>/<code style=\"font-family:var(--mono);font-size:10px\">removeMentor<\u002Fcode>, bara rikare läsning av fält som redan finns.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 5 · CODE-SPEC ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">05 — FÖR CODE<\u002Fdiv>\n      <h2>Vad varje yta läser<\u002Fh2>\n      <p>Allt härleds ur fält som redan finns. Ingen ny domänmodell för läsbarheten — bara konsumtion av <code style=\"font-family:var(--mono);font-size:11px\">mentorships<\u002Fcode>, <code style=\"font-family:var(--mono);font-size:11px\">mentorId<\u002Fcode> och formgrinden.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"spec-card\">\n        <h4>Spelarkortet (PlayerCard)<\u002Fh4>\n        <div class=\"sf\">\n          <b>Adept:<\u002Fb> player.id === youthPlayer.<span style=\"color:var(--gold)\">mentorId<\u002Fspan><br>\n          <b>Mentor:<\u002Fb> mentorships.find(m =&gt; m.<span style=\"color:var(--gold)\">seniorPlayerId<\u002Fspan> === player.id)<br>\n          <b>Sedan:<\u002Fb> m.<span style=\"color:var(--gold)\">startRound<\u002Fspan><br>\n          <b>Tillstånd:<\u002Fb> mentor.form ≥ 40 ? aktiv : vilar\n        <\u002Fdiv>\n        <ul>\n          <li>Mentor-bandet överst i RELATIONER, båda sidor.<\u002Fli>\n          <li><b>🎓 Mentor<\u002Fb>-trait-tagg på mentorns kort.<\u002Fli>\n          <li>Effekt kvalitativt (\"växer snabbare\"), aldrig rått tal.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"spec-card\">\n        <h4>Akademi-fliken (AkademiTab)<\u002Fh4>\n        <div class=\"sf\">\n          <b>Par:<\u002Fb> activeMentorships.map(...)<br>\n          <b>+ tillägg:<\u002Fb> spill(active|dormant)<br>\n          <b>+ tillägg:<\u002Fb> \"sedan omg {startRound}\"<br>\n          <b>Behörighet:<\u002Fb> youthForMentor ∪ <span style=\"color:var(--gold)\">A-U22<\u002Fspan>\n        <\u002Fdiv>\n        <ul>\n          <li>Par-raden får tillstånds-pill + sedan + effekt.<\u002Fli>\n          <li>\"Välj ung\"-listan vidgas till A-trupps-U22.<\u002Fli>\n          <li>Samma <code style=\"font-family:var(--mono);font-size:10px\">assignMentor<\u002Fcode>/<code style=\"font-family:var(--mono);font-size:10px\">removeMentor<\u002Fcode>.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"spec-open\">\n        <div class=\"ok\">⚠ Ett öppet item för Code<\u002Fdiv>\n        <p><b>Adeptens back-ref för A-trupps-U22.<\u002Fb> <code style=\"font-family:var(--mono);font-size:11px\">YouthPlayer.mentorId<\u002Fcode> finns bara på ungdomsspelare. Vidgas adept-behörigheten till A-trupps-U22 har en A-spelare (<code style=\"font-family:var(--mono);font-size:11px\">Player<\u002Fcode>) ingen <code style=\"font-family:var(--mono);font-size:11px\">mentorId<\u002Fcode> — adept-sidan måste då härledas ur <code style=\"font-family:var(--mono);font-size:11px\">mentorships.find(m =&gt; m.youthPlayerId === player.id)<\u002Fcode> i stället för back-ref:en. Designen bryr sig inte vilket; bara att båda adept-typerna läser likadant på kortet. <b>Kanon-beslutet är ditt; den här reda-ut-frågan är Codes.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"foot\">\n      <b>Mentorskapet — att se bandet · läsbarhets-brief<\u002Fb> · 2026-06-20<br>\n      Kanon: <b>System 2<\u002Fb> (<code style=\"font-family:var(--mono)\">mentorships<\u002Fcode>) · veteran→ung bevarad via vidgad behörighet · <code style=\"font-family:var(--mono)\">'mentor'<\u002Fcode> ut ur Ledarskap-panelen.<br>\n      Grund: <b>Academy.ts<\u002Fb> · <b>AkademiTab.tsx<\u002Fb> · <b>PlayerCard.tsx<\u002Fb> · <b>playerDevelopmentService<\u002Fb>. Inga nya tokens, ingen ny domänmodell.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fbody><\u002Fhtml>"
