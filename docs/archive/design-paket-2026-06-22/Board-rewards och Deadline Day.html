document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"sv\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Board-rewards &amp; Deadline Day — design<\u002Ftitle>\n<style>/* ═══════════════════════════════════════════════════════════\n   BANDY MANAGER — Design Tokens\n   \"Heritage Bandy\" palette. Warm stone/paper backgrounds,\n   copper accent, ice-blue cool, Georgia display + system body.\n   Source: bandy-manager/src/styles/global.css\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Backgrounds (light) ─────────────────────────── */\n  --bg:              #EDE8DF;  /* warm paper */\n  --bg-surface:      #FAF8F4;  /* card */\n  --bg-elevated:     #FFFFFF;\n\n  /* ── Backgrounds (dark / leather) ────────────────── */\n  --bg-dark:         #0E0D0B;\n  --bg-dark-surface: #1E1D19;\n  --bg-dark-elevated:#2C2A24;\n  --bg-leather:      #3D3A32;  /* header strips */\n\n  /* ── Portal (mörka dashboard-tokens) ─────────────── */\n  /* Sätts på documentElement av PortalScreen, tonas per säsongsfas. */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n\n  /* ── Scen (alias för Portal — förtydligar scen-kontext) ─ */\n  /* Används av ArrivalScene, BoardMeetingScene, CoffeeRoomScene m.fl. */\n  --bg-scene: var(--bg-portal);\n\n  /* ── Severity (journalist-relation, signaturer) ──── */\n  --cold: #4a6680;  /* kall blå — neg severity, cold_winter-signatur */\n  --warm: #8c6e3a;  /* varm guld — injury_curve, warm severity */\n\n  /* ── Seasonal skies (dashboard) ──────────────────── */\n  --bg-october:  linear-gradient(180deg, #E8E4DC 0%, #EDE8DF 100%);\n  --bg-november: linear-gradient(180deg, #D8D4CC 0%, #E8E4DC 100%);\n  --bg-december: linear-gradient(180deg, #F0ECE4 0%, #E8DCCC 100%);\n  --bg-january:  linear-gradient(180deg, #D0D4D8 0%, #E0E4E8 100%);\n  --bg-february: linear-gradient(180deg, #E8E4DC 0%, #F0ECE4 100%);\n  --bg-march:    linear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  --match-bg-cold:    #3D3228;\n  --match-bg-fog:     #2A3228;\n  --match-bg-wind:    #32301E;\n  --match-gold:       #D4B860;\n  --match-warn:       #E8A090;\n  --match-positive:   #A0C890;\n  --match-copper:     #D4A850;\n  --match-home-bg:    #F0EDE6;\n\n  /* ── Archetype (squad badges) ────────────────────── */\n  --arch-finisher:  #c0392b;\n  --arch-playmaker: #2563EB;\n  --arch-defensive: #1a5e3a;\n  --arch-twoway:    #5a2d7a;\n  --arch-reflexgk:  #8B6914;\n  --arch-posgk:     #7b5a14;\n  --arch-dribbler:  #1a5e8a;\n  --arch-corner:    #4a3a8a;\n  --arch-raw:       #2d6e2d;\n  --arch-default:   #1e4d8c;\n\n  /* ── Typography ──────────────────────────────────── */\n  --font-display: 'Georgia', 'Times New Roman', serif;\n  --font-body:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n\n  /* ── Shape ───────────────────────────────────────── */\n  --radius:    14px;   /* round cards (narrative) */\n  --radius-md:  8px;   /* sharp cards, buttons */\n  --radius-sm:  3px;\n\n  /* ── Layout (mobile 375–430px) ───────────────────── */\n  --bottom-nav-height: 60px;\n  --safe-bottom: env(safe-area-inset-bottom, 0px);\n\n  /* ── Elevation (soft, copper-tinted on primary) ─── */\n  --shadow-card:    0 1px 3px rgba(0,0,0,0.05);\n  --shadow-btn:     0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);\n  --shadow-primary: 0 3px 5px rgba(162,88,40,0.38);\n  --shadow-danger:  0 3px 10px rgba(176,80,64,0.40);\n  --shadow-menu:    0 4px 16px rgba(0,0,0,0.15);\n\n  /* ── Z-index scale ───────────────────────────────── */\n  --z-dropdown:    100;  /* @kind other */\n  --z-modal:       300;  /* @kind other */\n  --z-overlay:     400;  /* @kind other */\n  --z-interaction: 500;  /* @kind other */\n  --z-toast:       600;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SEMANTIC TYPE ROLES\n   ═══════════════════════════════════════════════════════════ */\n\n/* Display / numeric (Georgia) — poäng, score, position */\n.h-display-xl { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; }\n.h-display-lg { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; }\n.h-display-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }\n.h-display-sm { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }\n\n/* Card titles (body, heavy) */\n.h-card     { font-family: var(--font-body); font-size: 14px; font-weight: 700; line-height: 1.3; }\n.h-card-sm  { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.3; }\n\n/* Body copy */\n.h-body     { font-family: var(--font-body); font-size: 12px; font-weight: 400; line-height: 1.45; color: var(--text-primary); }\n.h-body-sm  { font-family: var(--font-body); font-size: 11px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); }\n.h-body-xs  { font-family: var(--font-body); font-size: 10px; font-weight: 400; line-height: 1.45; color: var(--text-muted); }\n\n/* Section label — emoji + UPPERCASE letter-spaced */\n.h-label {\n  font-family: var(--font-body);\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin: 0 0 4px 0;\n}\n\n/* Quote / narrative (italic Georgia) */\n.h-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 12px;\n  color: var(--text-secondary);\n  line-height: 1.4;\n}\n\n/* CTA text — uppercase, letter-spaced */\n.h-cta {\n  font-family: var(--font-body);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SCEN-TYPOGRAFI (mörk bakgrund — ArrivalScene m.fl.)\n   Etablerad 2026-05-08 efter scenrevision (handover från Opus).\n   Komplement till .h-* som är dagsljus-optimerade.\n   ═══════════════════════════════════════════════════════════ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPELKÄNSLE-GENOMGÅNG — review-dokument\n   Mörk review-estetik, riktiga Bandy Manager-tokens.\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* canvas */\n  --rv-bg:        #1a1714;\n  --rv-bg-2:      #211d19;\n  --rv-panel:     #262019;\n  --rv-line:      rgba(245,241,235,0.08);\n  --rv-line-2:    rgba(245,241,235,0.14);\n\n  /* text */\n  --rv-ink:       #F2ECE1;\n  --rv-ink-2:     #C6BCA9;\n  --rv-ink-3:     #8E867A;\n\n  /* brand (ur colors_and_type.css) */\n  --accent:       #C47A3A;\n  --accent-dark:  #A25828;\n  --accent-deep:  #8B4820;\n  --success:      #5A9A4A;\n  --danger:       #B05040;\n  --danger-text:  #D08A78;\n  --ice:          #7EB3D4;\n  --cold:         #7E9BB5;\n  --warm:         #C4A86A;\n  --gold:         #D8B45A;\n\n  /* portal dark */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n  --text-muted:           #8A857A;\n\n  /* LED */\n  --led-bg:    #0A0A0A;\n  --led-score: #FF1A1A;\n  --led-time:  #CCFF00;\n  --led-us:    #FFB033;\n  --led-them:  #6FC0E8;\n\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --mono:  'Courier New', ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background:\n    radial-gradient(1200px 700px at 50% -200px, #2a231c 0%, transparent 60%),\n    var(--rv-bg);\n  color: var(--rv-ink);\n  font-family: var(--sans);\n  -webkit-font-smoothing: antialiased;\n  line-height: 1.5;\n  padding-bottom: 80px;\n}\n\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n\n/* ── Hero ─────────────────────────────────────────── */\n.hero {\n  text-align: center;\n  padding: 84px 0 48px;\n  border-bottom: 1px solid var(--rv-line);\n}\n.hero .kick {\n  font-size: 10px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase;\n  color: var(--accent); opacity: 0.85;\n}\n.hero h1 {\n  font-family: var(--serif); font-weight: 800; font-size: 52px; line-height: 1.05;\n  margin: 18px 0 0; letter-spacing: -0.5px;\n}\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub {\n  font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--rv-ink-2);\n  max-width: 680px; margin: 20px auto 0; line-height: 1.6;\n}\n.hero .meta {\n  margin-top: 26px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;\n  font-size: 11px; color: var(--rv-ink-3); letter-spacing: 0.3px;\n}\n.hero .meta b { color: var(--rv-ink-2); font-weight: 600; }\n\n/* ── Section scaffold ─────────────────────────────── */\n.sec { padding: 70px 0 0; }\n.sec-head { margin-bottom: 30px; }\n.sec-num {\n  font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--accent);\n  letter-spacing: 2px;\n}\n.sec-head h2 {\n  font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1.12;\n  margin-top: 6px; letter-spacing: -0.3px;\n}\n.sec-head p {\n  font-size: 13.5px; color: var(--rv-ink-2); max-width: 760px; margin-top: 12px; line-height: 1.65;\n}\n.sec-head p strong { color: var(--rv-ink); font-weight: 600; }\n.sec-head p .c { color: var(--accent); font-weight: 600; }\n\n/* ── The curve ────────────────────────────────────── */\n.curve-card {\n  margin-top: 8px; background: linear-gradient(180deg, #221d17, #1c1813);\n  border: 1px solid var(--rv-line); border-radius: 14px; padding: 30px 30px 22px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.curve-svg { width: 100%; height: auto; display: block; }\n.curve-legend {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px;\n}\n.cl {\n  border-top: 2px solid var(--cz); padding-top: 10px;\n}\n.cl .cl-r { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--rv-ink-3); text-transform: uppercase; }\n.cl .cl-t { font-family: var(--serif); font-size: 15px; font-weight: 700; margin-top: 3px; color: var(--rv-ink); }\n.cl .cl-d { font-size: 11.5px; color: var(--rv-ink-2); margin-top: 5px; line-height: 1.5; }\n.cl.dip .cl-t { color: var(--danger-text); }\n\n/* ── Diagnosis rows (phone + panel) ───────────────── */\n.diag {\n  display: grid; grid-template-columns: 300px 1fr; gap: 38px; align-items: start;\n  padding: 30px 0; border-top: 1px solid var(--rv-line);\n}\n.diag:first-of-type { border-top: none; }\n.diag-panel { padding-top: 6px; }\n.diag-tag {\n  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;\n  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;\n}\n.diag-panel h3 { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.2; }\n.diag-panel > p { font-size: 13px; color: var(--rv-ink-2); margin-top: 10px; line-height: 1.6; }\n\n/* problem / move callouts */\n.flag { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--rv-line); }\n.flag:first-of-type { margin-top: 14px; }\n.flag-ic {\n  flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; margin-top: 1px;\n  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700;\n}\n.flag.bad  .flag-ic { background: rgba(176,80,64,0.16);  color: var(--danger-text); }\n.flag.good .flag-ic { background: rgba(196,122,58,0.16); color: var(--accent); }\n.flag-body { font-size: 12.5px; line-height: 1.55; }\n.flag-body b { color: var(--rv-ink); font-weight: 600; }\n.flag.bad .flag-body b  { color: var(--danger-text); }\n.flag.good .flag-body b { color: var(--accent); }\n.flag-body span { color: var(--rv-ink-2); }\n\n/* severity score chip */\n.sev {\n  display: inline-flex; align-items: center; gap: 7px; margin-top: 16px;\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--rv-ink-3);\n}\n.sev b { color: var(--rv-ink); }\n.sev-bar { width: 90px; height: 5px; border-radius: 3px; background: var(--rv-line-2); overflow: hidden; }\n.sev-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger)); }\n\n/* ── Before / after ───────────────────────────────── */\n.ba-head {\n  display: flex; align-items: baseline; gap: 14px; margin: 18px 0 22px;\n}\n.ba-head .ba-pin {\n  font-family: var(--serif); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1;\n}\n.ba-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; }\n.ba-head .ba-sub { font-size: 12px; color: var(--rv-ink-3); margin-left: auto; font-family: var(--mono); letter-spacing: 0.5px; }\n\n.ba {\n  display: grid; grid-template-columns: 1fr 54px 1fr; gap: 0; align-items: start;\n  margin-top: 6px;\n}\n.ba-col { }\n.ba-col .ba-lbl {\n  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;\n}\n.ba-col .ba-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }\n.ba-col.before .dot { background: var(--danger); }\n.ba-col.after  .dot { background: var(--success); }\n.ba-col .ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }\n.ba-col.before .t { color: var(--danger-text); }\n.ba-col.after  .t { color: var(--success); }\n.ba-col .ba-lbl .s { font-size: 11px; color: var(--rv-ink-3); font-style: italic; font-family: var(--serif); }\n.ba-arrow {\n  display: grid; place-items: center; padding-top: 200px;\n  color: var(--accent); font-size: 24px;\n}\n.ba-notes { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }\n.ba-note { display: flex; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.ba-note .n-ic { color: var(--success); flex-shrink: 0; font-weight: 700; }\n.ba-note b { color: var(--rv-ink); font-weight: 600; }\n\n/* ═══════════════════════════════════════════════════\n   PHONE MOCKS — faithful BM recreation\n   ═══════════════════════════════════════════════════ */\n.phone {\n  border-radius: 18px; overflow: hidden; background: var(--bg-portal);\n  border: 4px solid #0b0a08; box-shadow: 0 14px 38px rgba(0,0,0,0.5);\n}\n.phone.paper { background: #EDE8DF; }\n.scr { position: relative; display: flex; flex-direction: column; min-height: 480px; }\n\n/* GameHeader */\n.gh {\n  background: linear-gradient(180deg, #3D3A32, #2a2822);\n  border-bottom: 2px solid var(--accent);\n  display: grid; grid-template-columns: 26px 1fr 40px; align-items: center; gap: 8px;\n  padding: 8px 12px;\n}\n.gh-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(245,241,235,0.4);\n  display: grid; place-items: center; font-family: var(--serif); font-size: 9px; color: var(--text-light); }\n.gh-mid { text-align: center; }\n.gh-club { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); letter-spacing: 0.5px; }\n.gh-sub  { font-size: 8px; color: var(--text-light-secondary); letter-spacing: 0.5px; margin-top: 1px; }\n.gh-bell { justify-self: end; display: flex; gap: 6px; color: var(--text-light-secondary); font-size: 13px; }\n.gh-bell .dot-n { position: relative; }\n.gh-bell .dot-n::after { content:''; position:absolute; top:-1px; right:-2px; width:5px; height:5px; border-radius:50%; background: var(--danger); }\n\n/* PhaseIndicator */\n.pi {\n  display: flex; align-items: center; justify-content: center; gap: 6px;\n  padding: 7px 12px; background: rgba(0,0,0,0.18); border-bottom: 1px solid rgba(0,0,0,0.25);\n}\n.pi.paper { background: #E4DED3; border-bottom: 1px solid var(--border, #DDD7CC); }\n.pi-step { display: flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }\n.pi.dark .pi-step { color: var(--text-muted); }\n.pi.paper .pi-step { color: #8A857A; }\n.pi-step .pd { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }\n.pi-step.on { color: var(--accent); }\n.pi-step.on .pd { background: var(--accent); border-color: var(--accent); }\n.pi-line { width: 22px; height: 1px; background: currentColor; opacity: 0.3; }\n\n/* generic scroll body */\n.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.body.paper { background: #EDE8DF; }\n.body.dark  { background: var(--bg-portal); }\n\n/* section label */\n.lbl { font-size: 8px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }\n.lbl.dark  { color: var(--text-muted); }\n.lbl.paper { color: #8A857A; }\n\n/* cards */\n.c-sharp { border-radius: 8px; padding: 10px 12px; }\n.c-round { border-radius: 14px; padding: 11px 13px; }\n.c-paper { background: #FAF8F4; border: 1px solid #DDD7CC; }\n.c-dark  { background: var(--bg-portal-surface); border: 1px solid var(--rv-line-2); }\n.c-elev  { background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2); }\n\n/* next-match leather */\n.nmc {\n  background: linear-gradient(180deg, #3D3520, #2a2418);\n  border-radius: 8px; padding: 11px 13px; color: var(--text-light);\n}\n.nmc-top { display: flex; align-items: center; justify-content: space-between; }\n.nmc-tag { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--match-gold, #D4B860); display:flex; gap:5px; align-items:center;}\n.nmc-home { font-size: 7px; font-weight: 700; letter-spacing: 1px; color: #0E0D0B; background: var(--accent); padding: 2px 6px; border-radius: 99px; }\n.nmc-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; gap: 8px; }\n.nmc-badge { width: 34px; height: 34px; border-radius: 6px; margin: 0 auto; display: grid; place-items: center; font-size: 15px; }\n.nmc-team { text-align: center; font-family: var(--serif); font-size: 11px; font-weight: 700; margin-top: 4px; }\n.nmc-mid { text-align: center; }\n.nmc-time { font-family: var(--serif); font-size: 13px; color: var(--match-gold, #D4B860); }\n.nmc-arena { font-size: 7.5px; color: var(--text-light-secondary); margin-top: 2px; }\n.nmc-form { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 8px; letter-spacing: 1px; color: var(--text-light-secondary); }\n.fdot { width: 7px; height: 7px; border-radius: 50%; }\n.fdots { display: flex; gap: 3px; }\n\n/* metric tiles */\n.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.tile-val { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1; }\n.tile-sub { font-size: 9px; margin-top: 4px; }\n\n/* quote / diary */\n.diary { }\n.diary-q { font-family: var(--serif); font-style: italic; font-size: 12px; line-height: 1.5; }\n\n/* tactic selector */\n.tac { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }\n.tac-opt { border-radius: 8px; padding: 9px 6px; text-align: center; border: 1px solid #DDD7CC; background: #FAF8F4; }\n.tac-opt.on { border: 1.5px solid var(--accent); background: #FBF3EA; }\n.tac-opt .to-t { font-size: 11px; font-weight: 700; color: #1A1A18; }\n.tac-opt.on .to-t { color: var(--accent-dark); }\n.tac-opt .to-s { font-size: 8px; color: #8A857A; margin-top: 2px; }\n\n/* pitch */\n.pitch { background: #2d6e3a; border-radius: 8px; position: relative; height: 150px; overflow: hidden; }\n.pitch::before { content:''; position:absolute; inset:0; background:\n  repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,0.04) 18px 36px); }\n.pp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #1e4d8c; border: 1.5px solid rgba(255,255,255,0.5);\n  display: grid; place-items: center; font-size: 7px; font-weight: 700; color: #fff; transform: translate(-50%,-50%); }\n\n/* LED scoreboard mini */\n.led {\n  background: var(--led-bg); border: 1px solid var(--accent-deep); border-radius: 6px;\n  padding: 9px 11px; position: relative;\n}\n.led-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }\n.led-team { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; }\n.led-team.us { color: var(--led-us); } .led-team.them { color: var(--led-them); text-align: right; }\n.led-score { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 2px; text-align: center; }\n.led-score .us { color: var(--led-us); } .led-score .them { color: var(--led-them); } .led-score .sep { color: #555; }\n.led-time { font-family: var(--mono); font-size: 15px; color: var(--led-score); letter-spacing: 1px; text-align: center; margin-top: 2px; }\n.led-per  { font-family: var(--mono); font-size: 9px; color: var(--led-time); text-align: center; }\n\n/* momentum bar */\n.mom { margin-top: 8px; }\n.mom-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }\n.mom-top .st { color: var(--accent); }\n.mom-track { height: 8px; border-radius: 4px; margin-top: 5px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 58%, #2a3a44 58%, var(--ice) 100%); }\n\n/* feed line */\n.feed { display: flex; gap: 9px; font-size: 10px; padding: 4px 0; }\n.feed .min { font-family: var(--mono); font-size: 9px; color: var(--text-muted); width: 22px; flex-shrink: 0; }\n.feed .tx { color: var(--text-light-secondary); line-height: 1.4; }\n.feed.goal .tx { color: var(--accent); font-weight: 600; }\n\n/* mini button */\n.mbtn { border-radius: 8px; padding: 9px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.mbtn-cta { background: linear-gradient(180deg, #DD9555, #8B4820); color: #fff; box-shadow: 0 3px 5px rgba(162,88,40,0.4); }\n.mbtn-ghost { background: transparent; border: 1.5px solid var(--rv-line-2); color: var(--text-light); }\n.mbtn-out { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }\n\n/* stripe-left accent */\n.stripe { position: relative; }\n.stripe::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; border-radius:2px; }\n.stripe.cold::before { background: var(--cold); }\n.stripe.warm::before { background: var(--warm); }\n.stripe.accent::before { background: var(--accent); }\n\n/* meter (puls / fanMood) */\n.meter { }\n.meter-top { display: flex; justify-content: space-between; align-items: baseline; }\n.meter-lbl { font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n.meter-val { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--text-light); }\n.meter-val s { font-size: 9px; color: var(--text-muted); text-decoration: none; font-weight: 400; }\n.meter-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 6px; overflow: hidden; }\n.meter-track i { display: block; height: 100%; border-radius: 3px; }\n.meter-cons { display: flex; gap: 8px; font-size: 8px; font-weight: 600; margin-top: 6px; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* \"dead\" marker overlay used in diagnosis */\n.dead-pin {\n  position: absolute; top: 8px; right: 8px; z-index: 4;\n  font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px;\n  back dary); line-height: 1.45; margin-top: 10px; padding: 9px 12px; background: var(--bg-portal-elevated); border-radius: 7px; }\n.tcard .tsrc { font-size: 10.5px; color: var(--rv-ink-2); margin-top: 9px; line-height: 1.45; }\n.tcard .tsrc code { font-family: var(--mono); font-size: 10px; color: var(--ice); }\n@media (max-width: 820px) { .tax { grid-template-columns: 1fr; } }\n\n/* anti-noise rules */\n.rules2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.rule2 { display: flex; gap: 11px; background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 10px; padding: 13px 15px; }\n.rule2 .ri { flex-shrink: 0; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); }\n.rule2 .rb { font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.rule2 .rb b { color: var(--rv-ink); font-weight: 600; }\n.rule2 .rb code { font-family: var(--mono); font-size: 10px; color: var(--ice); }\n@media (max-width: 820px) { .rules2 { grid-template-columns: 1fr; } }\n\n/* tone do/don't */\n.tone { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }\n.tcol { border-radius: 12px; padding: 18px 20px; }\n.tcol.no { background: rgba(176,80,64,0.06); border: 1px solid rgba(176,80,64,0.25); }\n.tcol.yes { background: rgba(90,154,74,0.06); border: 1px solid rgba(90,154,74,0.28); }\n.tcol .th { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }\n.tcol.no .th { color: var(--danger-text); }\n.tcol.yes .th { color: var(--success); }\n.tcol .tq { font-family: var(--serif); font-size: 13.5px; line-height: 1.5; padding: 9px 0; border-top: 1px solid var(--rv-line); }\n.tcol .tq:first-of-type { border-top: none; }\n.tcol.no .tq { color: var(--rv-ink-3); }\n.tcol.yes .tq { color: var(--rv-ink); font-style: italic; }\n@media (max-width: 760px) { .tone { grid-template-columns: 1fr; } }\n\n/* code spec */\n.cspec { background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 12px; padding: 20px 22px; margin-top: 8px; }\n.cspec h4 { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--rv-ink); }\n.cspec .code { font-family: var(--mono); font-size: 11.5px; line-height: 1.75; color: var(--rv-ink-2); margin-top: 12px; background: #16130f; border: 1px solid var(--rv-line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }\n.cspec .code .k { color: var(--ice); }\n.cspec .code .s { color: var(--warm); }\n.cspec .code .c { color: var(--rv-ink-3); }\n.cspec .code .f { color: var(--success); }\n.cspec ul { list-style: none; margin-top: 14px; display: grid; gap: 8px; }\n.cspec li { font-size: 12px; color: var(--rv-ink-2); line-height: 1.5; padding-left: 15px; position: relative; }\n.cspec li::before { content: '·'; position: absolute; left: 5px; color: var(--accent); font-weight: 700; }\n.cspec li b { color: var(--rv-ink); font-weight: 600; }\n.cspec li code { font-family: var(--mono); font-size: 10.5px; color: var(--ice); }\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════\n   BOARD-REWARDS + DEADLINE DAY — mock\n   tillägg ovanpå spelkansle_review.css + callback_review.css (.cspec) + vision (.spine)\n   ═══════════════════════════════════════════════════ */\n\n.verdict {\n  margin-top: 18px;\n  background: linear-gradient(180deg, #2a2218, #211c15);\n  border: 1px solid rgba(196,122,58,0.35);\n  border-radius: 14px; padding: 24px 26px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.verdict .vk { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }\n.verdict h2 { font-family: var(--serif); font-size: 23px; font-weight: 700; line-height: 1.2; margin-top: 10px; letter-spacing: -0.3px; }\n.verdict h2 em { font-style: italic; color: var(--accent); }\n.verdict p { font-size: 13px; color: var(--rv-ink-2); line-height: 1.6; margin-top: 12px; max-width: 780px; }\n.verdict p strong { color: var(--rv-ink); font-weight: 600; }\n\n/* reward ladder */\n.ladder2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 8px; }\n.lcard2 { border-radius: 12px; padding: 16px 18px; border: 1px solid var(--rv-line); }\n.lcard2.soft { background: rgba(90,154,74,0.05); border-color: rgba(90,154,74,0.28); }\n.lcard2.hard { background: rgba(196,122,58,0.06); border-color: rgba(196,122,58,0.3); }\n.lcard2.fail { background: rgba(176,80,64,0.06); border-color: rgba(176,80,64,0.28); }\n.lcard2 .lt { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--rv-ink); }\n.lcard2 .lt .lg { margin-left: auto; font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; }\n.lcard2.soft .lg { background: rgba(90,154,74,0.18); color: var(--success); }\n.lcard2.hard .lg { background: rgba(196,122,58,0.18); color: var(--accent); }\n.lcard2.fail .lg { background: rgba(176,80,64,0.18); color: var(--danger-text); }\n.lcard2 p { font-size: 11.5px; color: var(--rv-ink-2); line-height: 1.5; margin-top: 9px; }\n.lcard2 p b { color: var(--rv-ink); font-weight: 600; }\n.lcard2 .lex { font-family: var(--mono); font-size: 10px; color: var(--ice); margin-top: 9px; background: var(--bg-portal-elevated); border-radius: 6px; padding: 7px 9px; line-height: 1.4; }\n@media (max-width: 820px) { .ladder2 { grid-template-columns: 1fr; } }\n\n/* trust meter */\n.trust { display: flex; align-items: center; gap: 12px; background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2); border-radius: 8px; padding: 11px 13px; }\n.trust .tl { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); flex-shrink: 0; }\n.trust .ttrack { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; position: relative; }\n.trust .ttrack i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--gold)); }\n.trust .ttick { position: absolute; top: -3px; width: 2px; height: 13px; background: var(--gold); opacity: 0.6; }\n.trust .tv { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--gold); flex-shrink: 0; }\n\n/* reward beat (ceremony) */\n.rbeat { background: linear-gradient(180deg, rgba(216,180,90,0.12), var(--bg-portal-elevated)); border: 1px solid rgba(216,180,90,0.4); border-radius: 10px; padding: 14px 15px; text-align: center; }\n.rbeat .rk { font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }\n.rbeat .rt { font-family: var(--serif); font-size: 16px; font-weight: 800; color: var(--text-light); margin-top: 6px; line-height: 1.2; }\n.rbeat .rq { font-family: var(--serif); font-style: italic; font-size: 11.5px; color: var(--text-light-secondary); line-height: 1.5; margin-top: 8px; }\n.rbeat .rgain { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 10px; font-weight: 700; color: var(--gold); background: rgba(216,180,90,0.14); border-radius: 99px; padding: 4px 12px; }\n\n/* fail beat escalation */\n.fbeat { border-left: 2px solid var(--danger); background: var(--bg-portal-elevated); border-radius: 8px; padding: 11px 13px; }\n.fbeat .fk { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }\n.fbeat .ft { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); margin-top: 4px; }\n.fbeat .fq { font-family: var(--serif); font-style: italic; font-size: 11px; color: var(--text-light-secondary); margin-top: 6px; line-height: 1.45; }\n.escal { display: flex; gap: 6px; margin-top: 10px; }\n.escal .es { flex: 1; text-align: center; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 5px 4px; border-radius: 6px; border: 1px solid var(--rv-line-2); color: var(--text-muted); }\n.escal .es.on { background: rgba(176,80,64,0.16); border-color: var(--danger); color: var(--danger-text); }\n\n/* deadline day countdown urgency */\n.dday { background: linear-gradient(180deg, #2a1a16, #1f1512); border: 1.5px solid var(--danger); border-radius: 10px; padding: 13px 14px; position: relative; overflow: hidden; }\n.dday .dk { display: flex; align-items: center; gap: 7px; font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--danger-text); }\n.dday .dclock { font-family: var(--mono); font-weight: 700; font-size: 22px; color: var(--led-score); letter-spacing: 2px; text-align: center; margin: 8px 0 2px; }\n.dday .dsub { text-align: center; font-size: 9px; color: var(--text-muted); font-family: var(--mono); letter-spacing: 1px; }\n.dday .doffer { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }\n.dday .doh { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); }\n.dday .dosub { font-size: 10px; color: var(--text-light-secondary); margin-top: 2px; font-family: var(--serif); font-style: italic; }\n.dpulse { position: absolute; top: 9px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: dpulse 1.2s ease-in-out infinite; }\n@keyframes dpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }\n.ddbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">Audit-svar · ytdesign · prio 4 + Deadline Day<\u002Fp>\n    <h1>Löften som <em>håller<\u002Fem> — och en deadline som <em>bränns<\u002Fem><\u002Fh1>\n    <p class=\"sub\">Två ytor ur audit-svaret: styrelsens belöningar gjorda verkliga utan att spräcka ekonomin, och Deadline Day med den urgency den förtjänar. Båda på befintlig data, båda ärver beat- och scen-mönster ni redan har.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Bygger på<\u002Fb> · boardObjectiveService · sponsorNetworkMood · TransferDeadlinePrimary<\u002Fspan>\n      <span><b>2026-06-22<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"verdict\">\n      <div class=\"vk\">Designbeslut · verkligt men innesluten<\u002Fdiv>\n      <h2>Belöningen är mest <em>mjuk<\u002Fem> — förtroende &amp; sponsorgunst — och bara sällan <em>hård<\u002Fem>.<\u002Fh2>\n      <p>Så blir styrelsens löften kännbara utan budget-injektioner som spräcker ekonomin. Och den eleganta kopplingen: uppfyllt mål → sponsorgunst → <strong>sponsorNetworkMood<\u002Fstrong> → sponsorintäkt. Det attrapp-fältet får äntligen sin konsument, och belöningen sin inneslutna ekonomiska hävstång. Två audit-fynd, en wire.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ 1 · BELÖNINGSSTEGEN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — BELÖNINGSSTEGEN<\u002Fdiv>\n      <h2>Tre nivåer — mjukt som default, hårt sällan<\u002Fh2>\n      <p>Idag: en sträng + ±3/5 patience. I stället en stege där det <span class=\"c\">mesta är ekonomiskt säkert<\u002Fspan> och det hårda är sällsynt och kapat.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ladder2\">\n      <div class=\"lcard2 soft\">\n        <div class=\"lt\">Förtroende<span class=\"lg\">Default<\u002Fspan><\u002Fdiv>\n        <p><b>Kompounderar.<\u002Fb> Uppfyllt mål → patience-headroom + en kvarstående förtroende-nivå. Minnet som gör nästa mål viktigare.<\u002Fp>\n        <div class=\"lex\">boardTrust += 1<br>patience += 3 (headroom)<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lcard2 soft\">\n        <div class=\"lt\">Sponsorgunst<span class=\"lg\">Default<\u002Fspan><\u002Fdiv>\n        <p><b>Löser prio 5.<\u002Fb> Uppfyllt mål → sponsorNetworkMood ↑ → liten kontinuerlig sponsorintäkts-modifierare. Säker, mjuk ekonomi.<\u002Fp>\n        <div class=\"lex\">sponsorNetworkMood += 6<br>→ intäkt ×(1 + mood/500)<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lcard2 hard\">\n        <div class=\"lt\">Förtroendepott<span class=\"lg\">Sällan<\u002Fspan><\u002Fdiv>\n        <p><b>Kapad engångseffekt.<\u002Fb> Bara vid kompounderat förtroende (t.ex. 2 säsonger i rad). En liten, taket-begränsad transfer-/facility-slant.<\u002Fp>\n        <div class=\"lex\">if boardTrust ≥ 3:<br>oneOffGrant (capped)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px\">\n      <div class=\"trust\">\n        <span class=\"tl\">Styrelsens förtroende<\u002Fspan>\n        <div class=\"ttrack\"><i style=\"width:64%\"><\u002Fi><span class=\"ttick\" style=\"left:80%\"><\u002Fspan><\u002Fdiv>\n        <span class=\"tv\">2 / 3<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:11px;color:var(--rv-ink-3);margin-top:8px;font-style:italic;font-family:var(--serif)\">Förtroendet syns — spelaren ser sig närma sig den hårda belöningen. Märket vid 80% = nästa pott. Det gör mjuka belöningar till en väg, inte bara en siffra.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2 · BELÖNING & MISSLYCKANDE ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — BÅDA UTFALLEN FÅR EN RÖST<\u002Fdiv>\n      <h2>Uppfyllt firas · misslyckat känns<\u002Fh2>\n      <p>Idag landar båda som en inbox-rad. Lyft dem: uppfyllt flaggskeppsmål → en <span class=\"c\">ceremoni-beat<\u002Fspan>; misslyckat → en <span class=\"c\">synlig, eskalerande<\u002Fspan> ägarreaktion. Då väger nästa mål tyngre.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"anat\">\n      <div class=\"phone\" style=\"max-width:320px\">\n        <div class=\"scr\">\n          <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">Säsongen klar · S4<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\">⚙<\u002Fdiv><\u002Fdiv>\n          <div class=\"body dark\" style=\"gap:11px;padding-top:14px\">\n            <div class=\"rbeat\">\n              <div class=\"rk\">🏆 Styrelsemål uppfyllt<\u002Fdiv>\n              <div class=\"rt\">Topp 6 — klarat<\u002Fdiv>\n              <div class=\"rq\">\"Du gjorde precis det du lovade. Det glömmer vi inte.\" — Birger, ordförande<\u002Fdiv>\n              <div class=\"rgain\">🤝 Sponsorgunst +6 · Förtroende 3/3<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"fbeat\">\n              <div class=\"fk\" style=\"color:var(--danger-text)\">📉 Styrelsemål missat<\u002Fdiv>\n              <div class=\"ft\">En egenfostrad i startelvan — nej<\u002Fdiv>\n              <div class=\"fq\">\"Andra året i rad. Jag börjar undra om akademin är en prioritet för dig.\" — Sandberg<\u002Fdiv>\n              <div class=\"escal\">\n                <span class=\"es\">Notering<\u002Fspan>\n                <span class=\"es on\">Varning<\u002Fspan>\n                <span class=\"es\">Ultimatum<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"alist\">\n        <div class=\"ai\"><span class=\"an\">✓<\u002Fspan><div class=\"ab\"><b>Ceremoni vid uppfyllt flaggskepp.<\u002Fb><p>Gold-ton, ägarens röst, de konkreta vinsterna synliga (sponsorgunst + förtroende). Återanvänder anslag/scen-infra.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"ai\"><span class=\"an\">!<\u002Fspan><div class=\"ab\"><b>Misslyckande eskalerar synligt.<\u002Fb><p>Notering → Varning → Ultimatum. Samma ägare minns; tonen skärps per missat mål. Det är så patience-talet får mening.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"ai\"><span class=\"an\">↩<\u002Fspan><div class=\"ab\"><b>Båda kallar tillbaka.<\u002Fb><p>\"Andra året i rad\" — ägaren minns förra säsongen. Ärver callback-principen: löftet har ett minne.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"ai\"><span class=\"an\">⚖<\u002Fspan><div class=\"ab\"><b>Ekonomin skyddad.<\u002Fb><p>Det mesta är mjukt (förtroende, sponsorgunst). Den hårda potten är sällsynt och kapad — balansen hålls.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 3 · DEADLINE DAY ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">03 — DEADLINE DAY<\u002Fdiv>\n      <h2>Logiken finns — ge den dramatiken<\u002Fh2>\n      <p><code style=\"font-family:var(--mono);font-size:11px\">TransferDeadlinePrimary<\u002Fcode> är byggd men budet hamnar i inboxen utan urgency. Deadline Day ska <span class=\"c\">kännas<\u002Fspan> — en av få stunder per säsong med riktig tidspress. Ingen ny logik, bara den koreografi ögonblicket förtjänar.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">ett bud i inboxen<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\" style=\"min-height:360px\">\n            <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">📬 Inkorg<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\"><span class=\"dot-n\">◔<\u002Fspan> ⚙<\u002Fdiv><\u002Fdiv>\n            <div class=\"body dark\" style=\"gap:7px\">\n              <div class=\"c-sharp c-dark\"><div class=\"lbl dark\">📬 NYTT BUD<\u002Fdiv><div style=\"font-size:11px;color:var(--text-light-secondary);margin-top:3px;font-family:var(--serif)\">Bollnäs lägger 180 tkr för Sundström.<\u002Fdiv><\u002Fdiv>\n              <div class=\"c-sharp c-dark\" style=\"opacity:0.6\"><div style=\"font-size:10px;color:var(--text-muted)\">Övriga meddelanden …<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\" style=\"color:var(--danger-text)\">×<\u002Fspan><span>En av säsongens mest spännande stunder läses som vilket meddelande som helst.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\" style=\"color:var(--danger-text)\">×<\u002Fspan><span>Ingen tidspress, ingen signal om att fönstret stänger. Dramatiken är noll.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">deadline-takeover med urgency<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\" style=\"min-height:360px\">\n            <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">Transferfönstret stänger<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\">⚙<\u002Fdiv><\u002Fdiv>\n            <div class=\"body dark\" style=\"gap:9px;padding-top:14px\">\n              <div class=\"dday\">\n                <span class=\"dpulse\"><\u002Fspan>\n                <div class=\"dk\">⏳ Deadline Day<\u002Fdiv>\n                <div class=\"dclock\">23:41<\u002Fdiv>\n                <div class=\"dsub\">FÖNSTRET STÄNGER MIDNATT<\u002Fdiv>\n                <div class=\"doffer\">\n                  <div class=\"doh\">Bollnäs — 180 tkr för Sundström<\u002Fdiv>\n                  <div class=\"dosub\">Rivalen vill ha din klackfavorit. Sista budet höjt två gånger.<\u002Fdiv>\n                  <div class=\"ddbtns\">\n                    <div class=\"mbtn mbtn-cta\">Acceptera<\u002Fdiv>\n                    <div class=\"mbtn mbtn-ghost\">Avslå<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:center;font-size:9px;color:v
