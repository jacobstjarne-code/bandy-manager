Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPELKÄNSLE-GENOMGÅNG — review-dokument\n   Mörk review-estetik, riktiga Bandy Manager-tokens.\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* canvas */\n  --rv-bg:        #1a1714;\n  --rv-bg-2:      #211d19;\n  --rv-panel:     #262019;\n  --rv-line:      rgba(245,241,235,0.08);\n  --rv-line-2:    rgba(245,241,235,0.14);\n\n  /* text */\n  --rv-ink:       #F2ECE1;\n  --rv-ink-2:     #C6BCA9;\n  --rv-ink-3:     #8E867A;\n\n  /* brand (ur colors_and_type.css) */\n  --accent:       #C47A3A;\n  --accent-dark:  #A25828;\n  --accent-deep:  #8B4820;\n  --success:      #5A9A4A;\n  --danger:       #B05040;\n  --danger-text:  #D08A78;\n  --ice:          #7EB3D4;\n  --cold:         #7E9BB5;\n  --warm:         #C4A86A;\n  --gold:         #D8B45A;\n\n  /* portal dark */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n  --text-muted:           #8A857A;\n\n  /* LED */\n  --led-bg:    #0A0A0A;\n  --led-score: #FF1A1A;\n  --led-time:  #CCFF00;\n  --led-us:    #FFB033;\n  --led-them:  #6FC0E8;\n\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --mono:  'Courier New', ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background:\n    radial-gradient(1200px 700px at 50% -200px, #2a231c 0%, transparent 60%),\n    var(--rv-bg);\n  color: var(--rv-ink);\n  font-family: var(--sans);\n  -webkit-font-smoothing: antialiased;\n  line-height: 1.5;\n  padding-bottom: 80px;\n}\n\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n\n/* ── Hero ─────────────────────────────────────────── */\n.hero {\n  text-align: center;\n  padding: 84px 0 48px;\n  border-bottom: 1px solid var(--rv-line);\n}\n.hero .kick {\n  font-size: 10px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase;\n  color: var(--accent); opacity: 0.85;\n}\n.hero h1 {\n  font-family: var(--serif); font-weight: 800; font-size: 52px; line-height: 1.05;\n  margin: 18px 0 0; letter-spacing: -0.5px;\n}\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub {\n  font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--rv-ink-2);\n  max-width: 680px; margin: 20px auto 0; line-height: 1.6;\n}\n.hero .meta {\n  margin-top: 26px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;\n  font-size: 11px; color: var(--rv-ink-3); letter-spacing: 0.3px;\n}\n.hero .meta b { color: var(--rv-ink-2); font-weight: 600; }\n\n/* ── Section scaffold ─────────────────────────────── */\n.sec { padding: 70px 0 0; }\n.sec-head { margin-bottom: 30px; }\n.sec-num {\n  font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--accent);\n  letter-spacing: 2px;\n}\n.sec-head h2 {\n  font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1.12;\n  margin-top: 6px; letter-spacing: -0.3px;\n}\n.sec-head p {\n  font-size: 13.5px; color: var(--rv-ink-2); max-width: 760px; margin-top: 12px; line-height: 1.65;\n}\n.sec-head p strong { color: var(--rv-ink); font-weight: 600; }\n.sec-head p .c { color: var(--accent); font-weight: 600; }\n\n/* ── The curve ────────────────────────────────────── */\n.curve-card {\n  margin-top: 8px; background: linear-gradient(180deg, #221d17, #1c1813);\n  border: 1px solid var(--rv-line); border-radius: 14px; padding: 30px 30px 22px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.curve-svg { width: 100%; height: auto; display: block; }\n.curve-legend {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px;\n}\n.cl {\n  border-top: 2px solid var(--cz); padding-top: 10px;\n}\n.cl .cl-r { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--rv-ink-3); text-transform: uppercase; }\n.cl .cl-t { font-family: var(--serif); font-size: 15px; font-weight: 700; margin-top: 3px; color: var(--rv-ink); }\n.cl .cl-d { font-size: 11.5px; color: var(--rv-ink-2); margin-top: 5px; line-height: 1.5; }\n.cl.dip .cl-t { color: var(--danger-text); }\n\n/* ── Diagnosis rows (phone + panel) ───────────────── */\n.diag {\n  display: grid; grid-template-columns: 300px 1fr; gap: 38px; align-items: start;\n  padding: 30px 0; border-top: 1px solid var(--rv-line);\n}\n.diag:first-of-type { border-top: none; }\n.diag-panel { padding-top: 6px; }\n.diag-tag {\n  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;\n  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;\n}\n.diag-panel h3 { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.2; }\n.diag-panel > p { font-size: 13px; color: var(--rv-ink-2); margin-top: 10px; line-height: 1.6; }\n\n/* problem / move callouts */\n.flag { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--rv-line); }\n.flag:first-of-type { margin-top: 14px; }\n.flag-ic {\n  flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; margin-top: 1px;\n  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700;\n}\n.flag.bad  .flag-ic { background: rgba(176,80,64,0.16);  color: var(--danger-text); }\n.flag.good .flag-ic { background: rgba(196,122,58,0.16); color: var(--accent); }\n.flag-body { font-size: 12.5px; line-height: 1.55; }\n.flag-body b { color: var(--rv-ink); font-weight: 600; }\n.flag.bad .flag-body b  { color: var(--danger-text); }\n.flag.good .flag-body b { color: var(--accent); }\n.flag-body span { color: var(--rv-ink-2); }\n\n/* severity score chip */\n.sev {\n  display: inline-flex; align-items: center; gap: 7px; margin-top: 16px;\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--rv-ink-3);\n}\n.sev b { color: var(--rv-ink); }\n.sev-bar { width: 90px; height: 5px; border-radius: 3px; background: var(--rv-line-2); overflow: hidden; }\n.sev-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger)); }\n\n/* ── Before / after ───────────────────────────────── */\n.ba-head {\n  display: flex; align-items: baseline; gap: 14px; margin: 18px 0 22px;\n}\n.ba-head .ba-pin {\n  font-family: var(--serif); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1;\n}\n.ba-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; }\n.ba-head .ba-sub { font-size: 12px; color: var(--rv-ink-3); margin-left: auto; font-family: var(--mono); letter-spacing: 0.5px; }\n\n.ba {\n  display: grid; grid-template-columns: 1fr 54px 1fr; gap: 0; align-items: start;\n  margin-top: 6px;\n}\n.ba-col { }\n.ba-col .ba-lbl {\n  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;\n}\n.ba-col .ba-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }\n.ba-col.before .dot { background: var(--danger); }\n.ba-col.after  .dot { background: var(--success); }\n.ba-col .ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }\n.ba-col.before .t { color: var(--danger-text); }\n.ba-col.after  .t { color: var(--success); }\n.ba-col .ba-lbl .s { font-size: 11px; color: var(--rv-ink-3); font-style: italic; font-family: var(--serif); }\n.ba-arrow {\n  display: grid; place-items: center; padding-top: 200px;\n  color: var(--accent); font-size: 24px;\n}\n.ba-notes { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }\n.ba-note { display: flex; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.ba-note .n-ic { color: var(--success); flex-shrink: 0; font-weight: 700; }\n.ba-note b { color: var(--rv-ink); font-weight: 600; }\n\n/* ═══════════════════════════════════════════════════\n   PHONE MOCKS — faithful BM recreation\n   ═══════════════════════════════════════════════════ */\n.phone {\n  border-radius: 18px; overflow: hidden; background: var(--bg-portal);\n  border: 4px solid #0b0a08; box-shadow: 0 14px 38px rgba(0,0,0,0.5);\n}\n.phone.paper { background: #EDE8DF; }\n.scr { position: relative; display: flex; flex-direction: column; min-height: 480px; }\n\n/* GameHeader */\n.gh {\n  background: linear-gradient(180deg, #3D3A32, #2a2822);\n  border-bottom: 2px solid var(--accent);\n  display: grid; grid-template-columns: 26px 1fr 40px; align-items: center; gap: 8px;\n  padding: 8px 12px;\n}\n.gh-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(245,241,235,0.4);\n  display: grid; place-items: center; font-family: var(--serif); font-size: 9px; color: var(--text-light); }\n.gh-mid { text-align: center; }\n.gh-club { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); letter-spacing: 0.5px; }\n.gh-sub  { font-size: 8px; color: var(--text-light-secondary); letter-spacing: 0.5px; margin-top: 1px; }\n.gh-bell { justify-self: end; display: flex; gap: 6px; color: var(--text-light-secondary); font-size: 13px; }\n.gh-bell .dot-n { position: relative; }\n.gh-bell .dot-n::after { content:''; position:absolute; top:-1px; right:-2px; width:5px; height:5px; border-radius:50%; background: var(--danger); }\n\n/* PhaseIndicator */\n.pi {\n  display: flex; align-items: center; justify-content: center; gap: 6px;\n  padding: 7px 12px; background: rgba(0,0,0,0.18); border-bottom: 1px solid rgba(0,0,0,0.25);\n}\n.pi.paper { background: #E4DED3; border-bottom: 1px solid var(--border, #DDD7CC); }\n.pi-step { display: flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }\n.pi.dark .pi-step { color: var(--text-muted); }\n.pi.paper .pi-step { color: #8A857A; }\n.pi-step .pd { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }\n.pi-step.on { color: var(--accent); }\n.pi-step.on .pd { background: var(--accent); border-color: var(--accent); }\n.pi-line { width: 22px; height: 1px; background: currentColor; opacity: 0.3; }\n\n/* generic scroll body */\n.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.body.paper { background: #EDE8DF; }\n.body.dark  { background: var(--bg-portal); }\n\n/* section label */\n.lbl { font-size: 8px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }\n.lbl.dark  { color: var(--text-muted); }\n.lbl.paper { color: #8A857A; }\n\n/* cards */\n.c-sharp { border-radius: 8px; padding: 10px 12px; }\n.c-round { border-radius: 14px; padding: 11px 13px; }\n.c-paper { background: #FAF8F4; border: 1px solid #DDD7CC; }\n.c-dark  { background: var(--bg-portal-surface); border: 1px solid var(--rv-line-2); }\n.c-elev  { background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2); }\n\n/* next-match leather */\n.nmc {\n  background: linear-gradient(180deg, #3D3520, #2a2418);\n  border-radius: 8px; padding: 11px 13px; color: var(--text-light);\n}\n.nmc-top { display: flex; align-items: center; justify-content: space-between; }\n.nmc-tag { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--match-gold, #D4B860); display:flex; gap:5px; align-items:center;}\n.nmc-home { font-size: 7px; font-weight: 700; letter-spacing: 1px; color: #0E0D0B; background: var(--accent); padding: 2px 6px; border-radius: 99px; }\n.nmc-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; gap: 8px; }\n.nmc-badge { width: 34px; height: 34px; border-radius: 6px; margin: 0 auto; display: grid; place-items: center; font-size: 15px; }\n.nmc-team { text-align: center; font-family: var(--serif); font-size: 11px; font-weight: 700; margin-top: 4px; }\n.nmc-mid { text-align: center; }\n.nmc-time { font-family: var(--serif); font-size: 13px; color: var(--match-gold, #D4B860); }\n.nmc-arena { font-size: 7.5px; color: var(--text-light-secondary); margin-top: 2px; }\n.nmc-form { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 8px; letter-spacing: 1px; color: var(--text-light-secondary); }\n.fdot { width: 7px; height: 7px; border-radius: 50%; }\n.fdots { display: flex; gap: 3px; }\n\n/* metric tiles */\n.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.tile-val { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1; }\n.tile-sub { font-size: 9px; margin-top: 4px; }\n\n/* quote / diary */\n.diary { }\n.diary-q { font-family: var(--serif); font-style: italic; font-size: 12px; line-height: 1.5; }\n\n/* tactic selector */\n.tac { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }\n.tac-opt { border-radius: 8px; padding: 9px 6px; text-align: center; border: 1px solid #DDD7CC; background: #FAF8F4; }\n.tac-opt.on { border: 1.5px solid var(--accent); background: #FBF3EA; }\n.tac-opt .to-t { font-size: 11px; font-weight: 700; color: #1A1A18; }\n.tac-opt.on .to-t { color: var(--accent-dark); }\n.tac-opt .to-s { font-size: 8px; color: #8A857A; margin-top: 2px; }\n\n/* pitch */\n.pitch { background: #2d6e3a; border-radius: 8px; position: relative; height: 150px; overflow: hidden; }\n.pitch::before { content:''; position:absolute; inset:0; background:\n  repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,0.04) 18px 36px); }\n.pp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #1e4d8c; border: 1.5px solid rgba(255,255,255,0.5);\n  display: grid; place-items: center; font-size: 7px; font-weight: 700; color: #fff; transform: translate(-50%,-50%); }\n\n/* LED scoreboard mini */\n.led {\n  background: var(--led-bg); border: 1px solid var(--accent-deep); border-radius: 6px;\n  padding: 9px 11px; position: relative;\n}\n.led-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }\n.led-team { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; }\n.led-team.us { color: var(--led-us); } .led-team.them { color: var(--led-them); text-align: right; }\n.led-score { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 2px; text-align: center; }\n.led-score .us { color: var(--led-us); } .led-score .them { color: var(--led-them); } .led-score .sep { color: #555; }\n.led-time { font-family: var(--mono); font-size: 15px; color: var(--led-score); letter-spacing: 1px; text-align: center; margin-top: 2px; }\n.led-per  { font-family: var(--mono); font-size: 9px; color: var(--led-time); text-align: center; }\n\n/* momentum bar */\n.mom { margin-top: 8px; }\n.mom-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }\n.mom-top .st { color: var(--accent); }\n.mom-track { height: 8px; border-radius: 4px; margin-top: 5px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 58%, #2a3a44 58%, var(--ice) 100%); }\n\n/* feed line */\n.feed { display: flex; gap: 9px; font-size: 10px; padding: 4px 0; }\n.feed .min { font-family: var(--mono); font-size: 9px; color: var(--text-muted); width: 22px; flex-shrink: 0; }\n.feed .tx { color: var(--text-light-secondary); line-height: 1.4; }\n.feed.goal .tx { color: var(--accent); font-weight: 600; }\n\n/* mini button */\n.mbtn { border-radius: 8px; padding: 9px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.mbtn-cta { background: linear-gradient(180deg, #DD9555, #8B4820); color: #fff; box-shadow: 0 3px 5px rgba(162,88,40,0.4); }\n.mbtn-ghost { background: transparent; border: 1.5px solid var(--rv-line-2); color: var(--text-light); }\n.mbtn-out { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }\n\n/* stripe-left accent */\n.stripe { position: relative; }\n.stripe::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; border-radius:2px; }\n.stripe.cold::before { background: var(--cold); }\n.stripe.warm::before { background: var(--warm); }\n.stripe.accent::before { background: var(--accent); }\n\n/* meter (puls / fanMood) */\n.meter { }\n.meter-top { display: flex; justify-content: space-between; align-items: baseline; }\n.meter-lbl { font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n.meter-val { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--text-light); }\n.meter-val s { font-size: 9px; color: var(--text-muted); text-decoration: none; font-weight: 400; }\n.meter-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 6px; overflow: hidden; }\n.meter-track i { display: block; height: 100%; border-radius: 3px; }\n.meter-cons { display: flex; gap: 8px; font-size: 8px; font-weight: 600; margin-top: 6px; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* \"dead\" marker overlay used in diagnosis */\n.dead-pin {\n  position: absolute; top: 8px; right: 8px; z-index: 4;\n  font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px;\n  background: rgba(176,80,64,0.92); color: #fff; padding: 3px 7px; border-radius: 4px;\n  text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.4);\n}\n\n/* eyebrow scene */\n.eyebrow { font-size: 8px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: var(--cold); }\n\n/* priority table */\n.prio { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }\n.prio-row {\n  display: grid; grid-template-columns: 30px 1fr 120px 92px; gap: 16px; align-items: center;\n  background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 10px; padding: 14px 18px;\n}\n.prio-row .rank { font-family: var(--serif); font-size: 22px; font-weight: 800; color: var(--accent); }\n.prio-row .what b { font-size: 13.5px; font-weight: 700; color: var(--rv-ink); }\n.prio-row .what span { display: block; font-size: 11.5px; color: var(--rv-ink-2); margin-top: 3px; line-height: 1.45; }\n.prio-row .eff { font-size: 10px; letter-spacing: 0.5px; }\n.prio-row .eff .k { color: var(--rv-ink-3); text-transform: uppercase; font-size: 8px; letter-spacing: 1px; }\n.prio-row .eff .v { color: var(--rv-ink); font-weight: 600; }\n.impact { display: flex; gap: 3px; }\n.impact i { width: 10px; height: 10px; border-radius: 2px; background: var(--rv-line-2); }\n.impact i.on { background: var(--accent); }\n\n/* foot */\n.foot { margin-top: 64px; padding-top: 26px; border-top: 1px solid var(--rv-line); text-align: center;\n  font-size: 11px; color: var(--rv-ink-3); line-height: 1.7; }\n.foot b { color: var(--rv-ink-2); }\n\n@media (max-width: 920px) {\n  .diag { grid-template-columns: 1fr; }\n  .ba { grid-template-columns: 1fr; gap: 28px; }\n  .ba-arrow { padding: 0; transform: rotate(90deg); }\n  .prio-row { grid-template-columns: 30px 1fr; }\n  .prio-row .eff, .prio-row .impact { display: none; }\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════\n   STATE OF THE GAME — svep · scorecard\n   tillägg ovanpå spelkansle_review.css\n   ═══════════════════════════════════════════════════ */\n\n.verdict {\n  margin-top: 18px;\n  background: linear-gradient(180deg, #232d22, #1b211a);\n  border: 1px solid rgba(90,154,74,0.4);\n  border-radius: 14px; padding: 24px 26px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.verdict .vk { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--success); }\n.verdict h2 { font-family: var(--serif); font-size: 25px; font-weight: 700; line-height: 1.18; margin-top: 10px; letter-spacing: -0.3px; }\n.verdict h2 em { font-style: italic; color: var(--success); }\n.verdict p { font-size: 13.5px; color: var(--rv-ink-2); line-height: 1.6; margin-top: 12px; max-width: 780px; }\n.verdict p strong { color: var(--rv-ink); font-weight: 600; }\n\n/* tally row */\n.tally { display: flex; gap: 26px; margin-top: 20px; flex-wrap: wrap; }\n.tally .ti { display: flex; flex-direction: column; }\n.tally .tn { font-family: var(--serif); font-size: 34px; font-weight: 800; line-height: 1; }\n.tally .tl { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--rv-ink-3); margin-top: 6px; }\n.tally .tn.land { color: var(--success); }\n.tally .tn.evolve { color: var(--accent); }\n.tally .tn.front { color: var(--cold); }\n\n/* scorecard list */\n.score { margin-top: 8px; display: flex; flex-direction: column; gap: 9px; }\n.scard {\n  display: grid; grid-template-columns: 26px 1fr 116px; gap: 16px; align-items: start;\n  background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 11px; padding: 15px 18px;\n}\n.scard .sx { font-size: 16px; line-height: 1.3; }\n.scard .sm b { font-size: 13.5px; font-weight: 700; color: var(--rv-ink); }\n.scard .sm .src { font-size: 9px; color: var(--rv-ink-3); font-family: var(--mono); letter-spacing: 0.3px; margin-left: 7px; }\n.scard .sm p { font-size: 12px; color: var(--rv-ink-2); line-height: 1.5; margin-top: 5px; }\n.scard .sm p code { font-family: var(--mono); font-size: 10.5px; color: var(--ice); }\n.scard .st { justify-self: end; text-align: right; }\n.scard .stp { display: inline-block; font-size: 8.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }\n.stp.land { background: rgba(90,154,74,0.16); color: var(--success); }\n.stp.evolve { background: rgba(196,122,58,0.16); color: var(--accent); }\n.stp.front { background: rgba(126,155,181,0.18); color: var(--cold); }\n.scard.is-land { border-left: 2px solid var(--success); }\n.scard.is-evolve { border-left: 2px solid var(--accent); }\n.scard.is-front { border-left: 2px solid var(--cold); }\n\n/* evolve callout block */\n.evo {\n  display: grid; grid-template-columns: 1fr 54px 1fr; gap: 0; align-items: stretch;\n  margin-top: 8px; background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 12px; overflow: hidden;\n}\n.evo .ec { padding: 18px 20px; }\n.evo .ec.was { background: rgba(176,80,64,0.05); }\n.evo .ec.now { background: rgba(90,154,74,0.06); }\n.evo .ec .eh { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }\n.evo .ec.was .eh { color: var(--danger-text); }\n.evo .ec.now .eh { color: var(--success); }\n.evo .ec .et { font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--rv-ink); line-height: 1.25; }\n.evo .ec .ed { font-size: 12px; color: var(--rv-ink-2); line-height: 1.55; margin-top: 7px; }\n.evo .earr { display: grid; place-items: center; color: var(--accent); font-size: 22px; background: var(--rv-bg); }\n@media (max-width: 760px) { .evo { grid-template-columns: 1fr; } .evo .earr { padding: 8px; transform: rotate(90deg); } }\n\n/* frontier cards */\n.front-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }\n.fcard { background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 12px; padding: 16px 18px; }\n.fcard.block { border-color: rgba(126,155,181,0.3); }\n.fcard .fk { display: flex; align-items: center; gap: 8px; }\n.fcard .fk .ft { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--rv-ink); }\n.fcard .fk .fb { margin-left: auto; font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: rgba(126,155,181,0.18); color: var(--cold); }\n.fcard .fk .fb.polish { background: rgba(196,122,58,0.16); color: var(--accent); }\n.fcard p { font-size: 12px; color: var(--rv-ink-2); line-height: 1.55; margin-top: 9px; }\n.fcard p b { color: var(--rv-ink); font-weight: 600; }\n.fcard ul { list-style: none; margin-top: 9px; display: grid; gap: 5px; }\n.fcard li { font-size: 11.5px; color: var(--rv-ink-2); padding-left: 13px; position: relative; line-height: 1.45; }\n.fcard li::before { content: '·'; position: absolute; left: 4px; color: var(--cold); font-weight: 700; }\n@media (max-width: 760px) { .front-grid { grid-template-columns: 1fr; } }\n\n/* nuance note */\n.nuance { display: flex; gap: 11px; background: rgba(126,155,181,0.07); border: 1px solid rgba(126,155,181,0.25); border-radius: 10px; padding: 13px 16px; margin-top: 12px; }\n.nuance .ni { color: var(--cold); font-size: 14px; flex-shrink: 0; }\n.nuance .nb { font-size: 12.5px; color: var(--rv-ink-2); line-height: 1.55; }\n.nuance .nb b { color: var(--rv-ink); font-weight: 600; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">Svep · var står spelet · efter backloggen<\u002Fp>\n    <h1>Backloggen <em>landade<\u002Fem><\u002Fh1>\n    <p class=\"sub\">Jag läste presentation-lagret som det står idag — nav, portal, spelarkort, akademi, bygget, minne — mot allt vi flaggade i de fyra genomgångarna. Det här är inte en problemjakt. <em>Det är var ni faktiskt står.<\u002Fem> Och ni står bra.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Läst<\u002Fb> · BottomNav · PortalScreen · PlayerCard · AkademiTab · FacilityScreen<\u002Fspan>\n      <span><b>Mot<\u002Fb> · genomgång I–II · B1-nav · mentorskap · moments<\u002Fspan>\n      <span><b>2026-06-22<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"verdict\">\n      <div class=\"vk\">Helhetsdom · verifierad i kod<\u002Fdiv>\n      <h2>Var enda flaggad yta har fått sin fix — och flera <em>utvecklades förbi<\u002Fem> förslaget.<\u002Fh2>\n      <p>Mittsäsongens rytm, beslutsbudgeten, portal-beatet, mentor-bandet, moments-ytan, B1-navet — allt finns i koden, med kommentarer som citerar genomgångarna på rad. Ett par saker itererade <strong>bortom<\u002Fstrong> det jag föreslog (beslutsbudgeten blev ännu lugnare). Och fronten har flyttat: det som återstår är inte spelkänsla längre — det är <strong>ikon- och märkesarbetet<\u002Fstrong> samt komponent-polish.<\u002Fp>\n      <div class=\"tally\">\n        <div class=\"ti\"><span class=\"tn land\">9<\u002Fspan><span class=\"tl\">Landat<\u002Fspan><\u002Fdiv>\n        <div class=\"ti\"><span class=\"tn evolve\">2<\u002Fspan><span class=\"tl\">Utvecklat förbi<\u002Fspan><\u002Fdiv>\n        <div class=\"ti\"><span class=\"tn front\">3<\u002Fspan><span class=\"tl\">Fronten kvar<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ 1 · SCORECARD ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — SCORECARD<\u002Fdiv>\n      <h2>Varje flaggad yta, status idag<\u002Fh2>\n      <p>Spårat rad för rad mot koden — inte mot minnet. Filnamn och kommentar bekräftar att det är <span class=\"c\">våra<\u002Fspan> beslut som byggts.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"score\">\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🌧️<\u002Fspan>\n        <div class=\"sm\"><b>Mittsäsongens rytm<\u002Fb><span class=\"src\">StillnessSection · PortalMinimalBar<\u002Fspan>\n          <p>\"VECKANS RYTM\" 7-dagars-strip + minimal-kort (kondition, kassa, klacken, form) med sparklines. Den döda zonen har fått sin andning — precis genomgång I, yta A.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🏟️<\u002Fspan>\n        <div class=\"sm\"><b>B1-navet — Bygget in, Värvning villkorad<\u002Fb><span class=\"src\">BottomNav.tsx<\u002Fspan>\n          <p>Kommentar i koden: <code>\"B1-nav 2026-06-19: Bygget ersätter Transfers permanent plats\"<\u002Fcode>. Värvning eleveras bara vid öppet fönster. Exakt rekommendationen.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🏗️<\u002Fspan>\n        <div class=\"sm\"><b>Bygget som egen flik + Orten-rensning<\u002Fb><span class=\"src\">FacilityScreen · OrtenTab<\u002Fspan>\n          <p>FacilityScreen är <code>/game/bygget<\u002Fcode>-destination; Orten-arenanoden <code>deep-linkar<\u002Fcode> dit i stället för scroll. \"Anläggning bor i FacilityScreen sedan Orten-rensningen\" — kommentar på rad 191.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🎓<\u002Fspan>\n        <div class=\"sm\"><b>Mentor-bandet läsbart<\u002Fb><span class=\"src\">PlayerCard.tsx · AkademiTab<\u002Fspan>\n          <p>Adept-rad \"Mentoreras av X · sedan omg N\", mentor-rad \"Mentor åt Y\", 🎓-tagg, och <b>vilande-tillståndet<\u002Fb> via <code>MENTOR_FORM_THRESHOLD<\u002Fcode>. Egen <code>mentorshipStrings<\u002Fcode>-fil för rösten. Hela briefen.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">📖<\u002Fspan>\n        <div class=\"sm\"><b>Moments fick sin yta<\u002Fb><span class=\"src\">ClubMemoryView.tsx<\u002Fspan>\n          <p><code>recentMoments<\u002Fcode> renderas direkt — <b>inte<\u002Fb> aggregatorn. Exakt domen i moments-verifieringen: läs strömmen, dubbel-visa inte Efterklang.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🔔<\u002Fspan>\n        <div class=\"sm\"><b>Portal-beatet<\u002Fb><span class=\"src\">PortalBeat.tsx · portalBeatService<\u002Fspan>\n          <p>Copper-kicker, kursiv display-font, en pil in, stängbar, max ett via <code>getActiveBeat<\u002Fcode>. B1-genomgångens bygg-beat — generaliserat till en beat-tjänst för hela portalen.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🎯<\u002Fspan>\n        <div class=\"sm\"><b>Taktiken — platt, en hemvist<\u002Fb><span class=\"src\">TaktikScreen.tsx<\u002Fspan>\n          <p>Skärmen är nu tillbaka-header + <em>en<\u002Fem> TacticBoardCard. Den nästlade flik-i-flik-raden från genomgång II är borta.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🗺️<\u002Fspan>\n        <div class=\"sm\"><b>Valet bor i Bygget<\u002Fb><span class=\"src\">FacilityScreen.tsx<\u002Fspan>\n          <p>\"Valet-ceremonin fyrar ej i S1 — Bygget-fliken är den enda vägen\" (rad 38). Två ingångar, ett träd — ceremonin + fliken, som i B1-genomgången.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scard is-land\">\n        <span class=\"sx\">🧭<\u002Fspan>\n        <div class=\"sm\"><b>Nav-ansvar avknutet<\u002Fb><span class=\"src\">BottomNav · GameShell<\u002Fspan>\n          <p>\"GameShell äger DÖLJ/VISA, BottomNav äger SPÄRR\" — den dubbla dölj-listan som fick navet att hoppa är borttagen. Inte en av mina, men rätt städning.<\u002Fp><\u002Fdiv>\n        <div class=\"st\"><span class=\"stp land\">Landat<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2 · UTVECKLAT FÖRBI ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — UTVECKLAT FÖRBI FÖRSLAGET<\u002Fdiv>\n      <h2>Där koden gick längre än mocken<\u002Fh2>\n      <p>Två fall där implementationen inte bara byggde mitt förslag — den <span class=\"c\">förbättrade<\u002Fspan> det. Värt att notera, för det är så ett designsystem ska mogna: mocken är en riktning, inte en spec i sten.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"evo\">\n      <div class=\"ec was\">\n        <div class=\"eh\">Mitt förslag · Veckans bord<\u002Fdiv>\n        <div class=\"et\">Severity-rankad lista + \"2 av 4\"-budget med pills<\u002Fdiv>\n        <div class=\"ed\">Alla avbrott på en yta, en beslutsbudget visad som ifyllda prickar. Lugnare än modal-kön — men fortfarande flera frågor samtidigt på skärmen.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"earr\">→<\u002Fdiv>\n      <div class=\"ec now\">\n        <div class=\"eh\">Koden · en fråga åt gången<\u002Fdiv>\n        <div class=\"et\">Variant B — ingen paginering, ingen pill-rad<\u002Fdiv>\n        <div class=\"ed\">\"PortalActiveBudget (pills) removed — Variant B: en fråga åt gången.\" Plus en tutorial-ram S1R1: \"En fråga åt gången. Resten ligger och väntar tills du hittat rytmen.\" Budgeten <em>finns<\u002Fem> i <code>decisionBudgetService<\u002Fcode> — men ytan visar bara den översta. Lugnare än jag vågade föreslå.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"evo\" style=\"margin-top:14px\">\n      <div class=\"ec was\">\n        <div class=\"eh\">Mitt förslag · build-beat<\u002Fdiv>\n        <div class=\"et\">En rad för Bygget knackar på portalen<\u002Fdiv>\n        <div class=\"ed\">En lågmäld beat-rad för bygg-händelser, anti-brus-reglerna: bara på state-change, max ett, mot beslutsbudgeten.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"earr\">→<\u002Fdiv>\n      <div class=\"ec now\">\n        <div class=\"eh\">Koden · generell beat-tjänst<\u002Fdiv>\n        <div class=\"et\">portalBeatService för hela portalen<\u002Fdiv>\n        <div class=\"ed\">Greppet generaliserades: en <code>getActiveBeat<\u002Fcode>-tjänst med dismiss-nycklar per säsong, inte bara för bygget. Bygg-beatet blev <em>ett<\u002Fem> fall i en återanvändbar mekanik. Bredare än mocken.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 3 · FRONTEN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">03 — DÄR FRONTEN LIGGER NU<\u002Fdiv>\n      <h2>Vad som faktiskt återstår<\u002Fh2>\n      <p>Spelkänslan är inte längre den svaga punkten. Enligt er egen <code style=\"font-family:var(--mono);font-size:11px\">SYNC.md<\u002Fcode> är de blockerade raderna nu <span class=\"c\">egna design-projekt<\u002Fspan> — ikoner och märken — plus komponent-polish. Det är en helt annan, mognare front.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"front-grid\">\n      <div class=\"fcard block\">\n        <div class=\"fk\"><span class=\"ft\">🎨 Tre ikon-/märkesprojekt<\u002Fspan><span class=\"fb\">Blockerat<\u002Fspan><\u002Fdiv>\n        <p>Tre rader står <code style=\"font-family:var(--mono);font-size:10px\">⚠·⚠<\u002Fcode> i SYNC — alla \"eget designprojekt\", inte buggar:<\u002Fp>\n        <ul>\n          <li><b>Piktogramserie (24)<\u002Fb> — EMOJI_MAP → ICON_MAP. Ersätt emoji med egen ikonografi.<\u002Fli>\n          <li><b>BottomNav-ikoner (6)<\u002Fb> — Hem · Trupp · Match · Tabell · Bygget · Klubb. Idag Lucide-platshållare (TODO i koden).<\u002Fli>\n          <li><b>Klubbmärken (12)<\u002Fb> — ClubBadge. Egen heraldik per klubb.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"fcard\">\n        <div class=\"fk\"><span class=\"ft\">🧩 Komponent-polish<\u002Fspan><span class=\"fb polish\">Design klar · code ⚠<\u002Fspan><\u002Fdiv>\n        <p>Designen finns i <code style=\"font-family:var(--mono);font-size:10px\">preview/<\u002Fcode>; koden behöver hämta hem tillstånden:<\u002Fp>\n        <ul>\n          <li><b>Button<\u002Fb> — hover/loading/focus/disabled (copper).<\u002Fli>\n          <li><b>Tag<\u002Fb> — status utan emoji.<\u002Fli>\n          <li><b>GameHeader<\u002Fb> — grid + sigill-chip + kuvert-SVG.<\u002Fli>\n          <li><b>PhaseIndicator<\u002Fb> — done/current/upcoming-stepper.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec-head\" style=\"margin-top:30px;margin-bottom:6px\">\n      <div class=\"sec-num\">TVÅ ÄRLIGA NYANSER<\u002Fdiv>\n      <h2 style=\"font-size:22px\">Inte allt är knivskarpt — två saker att titta på<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"nuance\">\n      <span class=\"ni\">◆<\u002Fspan>\n      <div class=\"nb\"><b>Puls vs fanMood slogs aldrig ihop — de fick olika jobb i stället.<\u002Fb> \"Bygdens puls\" är nu ett SectionCard i Orten (klubbens ekonomi/identitet); fanMood matar matchen (pep-talk, publik). Det löser den \"döda mätaren\" — de konkurrerar inte längre — men de två talen lever fortfarande på var sitt håll. Värt en blick: <em>läser spelaren dem som två system, eller som puls + dess matchdags-uttryck?<\u002Fem> Om det senare, är det bra. Om det förra, finns en sista förenkling kvar.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"nuance\">\n      <span class=\"ni\">◆<\u002Fspan>\n      <div class=\"nb\"><b>Spelarkortets gruppering — bekräfta de tre lägena.<\u002Fb> Mentor-bandet sitter rätt i RELATIONER, men jag kunde inte verifiera att de ~14 sektionerna grupperats i Översikt/Attribut/Karriär-lägena (genomgång II, yta A). Kortet är fortfarande långt. <em>En snabb titt på om gruppe­ringen byggdes eller om sektionerna fortfarande staplar.<\u002Fem><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"foot\">\n      <b>State of the Game · svep<\u002Fb> · 2026-06-22<br>\n      Helhetsdom: <b>backloggen landade.<\u002Fb> 9 ytor verifierade i kod, 2 utvecklade förbi förslaget, fronten flyttad till ikon-/märkesprojekt + komponent-polish. Två nyanser värda en blick: puls/fanMood-rollerna och spelarkortets gruppering.<br>\n      Läst: <b>BottomNav · PortalScreen · PortalBeat · PortalActiveBudget · StillnessSection · PlayerCard · AkademiTab · ClubMemoryView · FacilityScreen · TaktikScreen · SYNC.md<\u002Fb>.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fbody><\u002Fhtml>"
