ent(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  - n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPELKÄNSLE-GENOMGÅNG — review-dokument\n   Mörk review-estetik, riktiga Bandy Manager-tokens.\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* canvas */\n  --rv-bg:        #1a1714;\n  --rv-bg-2:      #211d19;\n  --rv-panel:     #262019;\n  --rv-line:      rgba(245,241,235,0.08);\n  --rv-line-2:    rgba(245,241,235,0.14);\n\n  /* text */\n  --rv-ink:       #F2ECE1;\n  --rv-ink-2:     #C6BCA9;\n  --rv-ink-3:     #8E867A;\n\n  /* brand (ur colors_and_type.css) */\n  --accent:       #C47A3A;\n  --accent-dark:  #A25828;\n  --accent-deep:  #8B4820;\n  --success:      #5A9A4A;\n  --danger:       #B05040;\n  --danger-text:  #D08A78;\n  --ice:          #7EB3D4;\n  --cold:         #7E9BB5;\n  --warm:         #C4A86A;\n  --gold:         #D8B45A;\n\n  /* portal dark */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n  --text-muted:           #8A857A;\n\n  /* LED */\n  --led-bg:    #0A0A0A;\n  --led-score: #FF1A1A;\n  --led-time:  #CCFF00;\n  --led-us:    #FFB033;\n  --led-them:  #6FC0E8;\n\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --mono:  'Courier New', ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background:\n    radial-gradient(1200px 700px at 50% -200px, #2a231c 0%, transparent 60%),\n    var(--rv-bg);\n  color: var(--rv-ink);\n  font-family: var(--sans);\n  -webkit-font-smoothing: antialiased;\n  line-height: 1.5;\n  padding-bottom: 80px;\n}\n\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n\n/* ── Hero ─────────────────────────────────────────── */\n.hero {\n  text-align: center;\n  padding: 84px 0 48px;\n  border-bottom: 1px solid var(--rv-line);\n}\n.hero .kick {\n  font-size: 10px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase;\n  color: var(--accent); opacity: 0.85;\n}\n.hero h1 {\n  font-family: var(--serif); font-weight: 800; font-size: 52px; line-height: 1.05;\n  margin: 18px 0 0; letter-spacing: -0.5px;\n}\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub {\n  font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--rv-ink-2);\n  max-width: 680px; margin: 20px auto 0; line-height: 1.6;\n}\n.hero .meta {\n  margin-top: 26px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;\n  font-size: 11px; color: var(--rv-ink-3); letter-spacing: 0.3px;\n}\n.hero .meta b { color: var(--rv-ink-2); font-weight: 600; }\n\n/* ── Section scaffold ─────────────────────────────── */\n.sec { padding: 70px 0 0; }\n.sec-head { margin-bottom: 30px; }\n.sec-num {\n  font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--accent);\n  letter-spacing: 2px;\n}\n.sec-head h2 {\n  font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1.12;\n  margin-top: 6px; letter-spacing: -0.3px;\n}\n.sec-head p {\n  font-size: 13.5px; color: var(--rv-ink-2); max-width: 760px; margin-top: 12px; line-height: 1.65;\n}\n.sec-head p strong { color: var(--rv-ink); font-weight: 600; }\n.sec-head p .c { color: var(--accent); font-weight: 600; }\n\n/* ── The curve ────────────────────────────────────── */\n.curve-card {\n  margin-top: 8px; background: linear-gradient(180deg, #221d17, #1c1813);\n  border: 1px solid var(--rv-line); border-radius: 14px; padding: 30px 30px 22px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.curve-svg { width: 100%; height: auto; display: block; }\n.curve-legend {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px;\n}\n.cl {\n  border-top: 2px solid var(--cz); padding-top: 10px;\n}\n.cl .cl-r { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--rv-ink-3); text-transform: uppercase; }\n.cl .cl-t { font-family: var(--serif); font-size: 15px; font-weight: 700; margin-top: 3px; color: var(--rv-ink); }\n.cl .cl-d { font-size: 11.5px; color: var(--rv-ink-2); margin-top: 5px; line-height: 1.5; }\n.cl.dip .cl-t { color: var(--danger-text); }\n\n/* ── Diagnosis rows (phone + panel) ───────────────── */\n.diag {\n  display: grid; grid-template-columns: 300px 1fr; gap: 38px; align-items: start;\n  padding: 30px 0; border-top: 1px solid var(--rv-line);\n}\n.diag:first-of-type { border-top: none; }\n.diag-panel { padding-top: 6px; }\n.diag-tag {\n  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;\n  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;\n}\n.diag-panel h3 { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.2; }\n.diag-panel > p { font-size: 13px; color: var(--rv-ink-2); margin-top: 10px; line-height: 1.6; }\n\n/* problem / move callouts */\n.flag { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--rv-line); }\n.flag:first-of-type { margin-top: 14px; }\n.flag-ic {\n  flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; margin-top: 1px;\n  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700;\n}\n.flag.bad  .flag-ic { background: rgba(176,80,64,0.16);  color: var(--danger-text); }\n.flag.good .flag-ic { background: rgba(196,122,58,0.16); color: var(--accent); }\n.flag-body { font-size: 12.5px; line-height: 1.55; }\n.flag-body b { color: var(--rv-ink); font-weight: 600; }\n.flag.bad .flag-body b  { color: var(--danger-text); }\n.flag.good .flag-body b { color: var(--accent); }\n.flag-body span { color: var(--rv-ink-2); }\n\n/* severity score chip */\n.sev {\n  display: inline-flex; align-items: center; gap: 7px; margin-top: 16px;\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--rv-ink-3);\n}\n.sev b { color: var(--rv-ink); }\n.sev-bar { width: 90px; height: 5px; border-radius: 3px; background: var(--rv-line-2); overflow: hidden; }\n.sev-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger)); }\n\n/* ── Before / after ───────────────────────────────── */\n.ba-head {\n  display: flex; align-items: baseline; gap: 14px; margin: 18px 0 22px;\n}\n.ba-head .ba-pin {\n  font-family: var(--serif); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1;\n}\n.ba-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; }\n.ba-head .ba-sub { font-size: 12px; color: var(--rv-ink-3); margin-left: auto; font-family: var(--mono); letter-spacing: 0.5px; }\n\n.ba {\n  display: grid; grid-template-columns: 1fr 54px 1fr; gap: 0; align-items: start;\n  margin-top: 6px;\n}\n.ba-col { }\n.ba-col .ba-lbl {\n  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;\n}\n.ba-col .ba-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }\n.ba-col.before .dot { background: var(--danger); }\n.ba-col.after  .dot { background: var(--success); }\n.ba-col .ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }\n.ba-col.before .t { color: var(--danger-text); }\n.ba-col.after  .t { color: var(--success); }\n.ba-col .ba-lbl .s { font-size: 11px; color: var(--rv-ink-3); font-style: italic; font-family: var(--serif); }\n.ba-arrow {\n  display: grid; place-items: center; padding-top: 200px;\n  color: var(--accent); font-size: 24px;\n}\n.ba-notes { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }\n.ba-note { display: flex; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.ba-note .n-ic { color: var(--success); flex-shrink: 0; font-weight: 700; }\n.ba-note b { color: var(--rv-ink); font-weight: 600; }\n\n/* ═══════════════════════════════════════════════════\n   PHONE MOCKS — faithful BM recreation\n   ═══════════════════════════════════════════════════ */\n.phone {\n  border-radius: 18px; overflow: hidden; background: var(--bg-portal);\n  border: 4px solid #0b0a08; box-shadow: 0 14px 38px rgba(0,0,0,0.5);\n}\n.phone.paper { background: #EDE8DF; }\n.scr { position: relative; display: flex; flex-direction: column; min-height: 480px; }\n\n/* GameHeader */\n.gh {\n  background: linear-gradient(180deg, #3D3A32, #2a2822);\n  border-bottom: 2px solid var(--accent);\n  display: grid; grid-template-columns: 26px 1fr 40px; align-items: center; gap: 8px;\n  padding: 8px 12px;\n}\n.gh-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(245,241,235,0.4);\n  display: grid; place-items: center; font-family: var(--serif); font-size: 9px; color: var(--text-light); }\n.gh-mid { text-align: center; }\n.gh-club { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); letter-spacing: 0.5px; }\n.gh-sub  { font-size: 8px; color: var(--text-light-secondary); letter-spacing: 0.5px; margin-top: 1px; }\n.gh-bell { justify-self: end; display: flex; gap: 6px; color: var(--text-light-secondary); font-size: 13px; }\n.gh-bell .dot-n { position: relative; }\n.gh-bell .dot-n::after { content:''; position:absolute; top:-1px; right:-2px; width:5px; height:5px; border-radius:50%; background: var(--danger); }\n\n/* PhaseIndicator */\n.pi {\n  display: flex; align-items: center; justify-content: center; gap: 6px;\n  padding: 7px 12px; background: rgba(0,0,0,0.18); border-bottom: 1px solid rgba(0,0,0,0.25);\n}\n.pi.paper { background: #E4DED3; border-bottom: 1px solid var(--border, #DDD7CC); }\n.pi-step { display: flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }\n.pi.dark .pi-step { color: var(--text-muted); }\n.pi.paper .pi-step { color: #8A857A; }\n.pi-step .pd { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }\n.pi-step.on { color: var(--accent); }\n.pi-step.on .pd { background: var(--accent); border-color: var(--accent); }\n.pi-line { width: 22px; height: 1px; background: currentColor; opacity: 0.3; }\n\n/* generic scroll body */\n.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.body.paper { background: #EDE8DF; }\n.body.dark  { background: var(--bg-portal); }\n\n/* section label */\n.lbl { font-size: 8px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }\n.lbl.dark  { color: var(--text-muted); }\n.lbl.paper { color: #8A857A; }\n\n/* cards */\n.c-sharp { border-radius: 8px; padding: 10px 12px; }\n.c-round { border-radius: 14px; padding: 11px 13px; }\n.c-paper { background: #FAF8F4; border: 1px solid #DDD7CC; }\n.c-dark  { background: var(--bg-portal-surface); border: 1px solid var(--rv-line-2); }\n.c-elev  { background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2); }\n\n/* next-match leather */\n.nmc {\n  background: linear-gradient(180deg, #3D3520, #2a2418);\n  border-radius: 8px; padding: 11px 13px; color: var(--text-light);\n}\n.nmc-top { display: flex; align-items: center; justify-content: space-between; }\n.nmc-tag { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--match-gold, #D4B860); display:flex; gap:5px; align-items:center;}\n.nmc-home { font-size: 7px; font-weight: 700; letter-spacing: 1px; color: #0E0D0B; background: var(--accent); padding: 2px 6px; border-radius: 99px; }\n.nmc-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; gap: 8px; }\n.nmc-badge { width: 34px; height: 34px; border-radius: 6px; margin: 0 auto; display: grid; place-items: center; font-size: 15px; }\n.nmc-team { text-align: center; font-family: var(--serif); font-size: 11px; font-weight: 700; margin-top: 4px; }\n.nmc-mid { text-align: center; }\n.nmc-time { font-family: var(--serif); font-size: 13px; color: var(--match-gold, #D4B860); }\n.nmc-arena { font-size: 7.5px; color: var(--text-light-secondary); margin-top: 2px; }\n.nmc-form { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 8px; letter-spacing: 1px; color: var(--text-light-secondary); }\n.fdot { width: 7px; height: 7px; border-radius: 50%; }\n.fdots { display: flex; gap: 3px; }\n\n/* metric tiles */\n.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.tile-val { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1; }\n.tile-sub { font-size: 9px; margin-top: 4px; }\n\n/* quote / diary */\n.diary { }\n.diary-q { font-family: var(--serif); font-style: italic; font-size: 12px; line-height: 1.5; }\n\n/* tactic selector */\n.tac { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }\n.tac-opt { border-radius: 8px; padding: 9px 6px; text-align: center; border: 1px solid #DDD7CC; background: #FAF8F4; }\n.tac-opt.on { border: 1.5px solid var(--accent); background: #FBF3EA; }\n.tac-opt .to-t { font-size: 11px; font-weight: 700; color: #1A1A18; }\n.tac-opt.on .to-t { color: var(--accent-dark); }\n.tac-opt .to-s { font-size: 8px; color: #8A857A; margin-top: 2px; }\n\n/* pitch */\n.pitch { background: #2d6e3a; border-radius: 8px; position: relative; height: 150px; overflow: hidden; }\n.pitch::before { content:''; position:absolute; inset:0; background:\n  repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,0.04) 18px 36px); }\n.pp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #1e4d8c; border: 1.5px solid rgba(255,255,255,0.5);\n  display: grid; place-items: center; font-size: 7px; font-weight: 700; color: #fff; transform: translate(-50%,-50%); }\n\n/* LED scoreboard mini */\n.led {\n  background: var(--led-bg); border: 1px solid var(--accent-deep); border-radius: 6px;\n  padding: 9px 11px; position: relative;\n}\n.led-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }\n.led-team { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; }\n.led-team.us { color: var(--led-us); } .led-team.them { color: var(--led-them); text-align: right; }\n.led-score { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 2px; text-align: center; }\n.led-score .us { color: var(--led-us); } .led-score .them { color: var(--led-them); } .led-score .sep { color: #555; }\n.led-time { font-family: var(--mono); font-size: 15px; color: var(--led-score); letter-spacing: 1px; text-align: center; margin-top: 2px; }\n.led-per  { font-family: var(--mono); font-size: 9px; color: var(--led-time); text-align: center; }\n\n/* momentum bar */\n.mom { margin-top: 8px; }\n.mom-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }\n.mom-top .st { color: var(--accent); }\n.mom-track { height: 8px; border-radius: 4px; margin-top: 5px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 58%, #2a3a44 58%, var(--ice) 100%); }\n\n/* feed line */\n.feed { display: flex; gap: 9px; font-size: 10px; padding: 4px 0; }\n.feed .min { font-family: var(--mono); font-size: 9px; color: var(--text-muted); width: 22px; flex-shrink: 0; }\n.feed .tx { color: var(--text-light-secondary); line-height: 1.4; }\n.feed.goal .tx { color: var(--accent); font-weight: 600; }\n\n/* mini button */\n.mbtn { border-radius: 8px; padding: 9px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.mbtn-cta { background: linear-gradient(180deg, #DD9555, #8B4820); color: #fff; box-shadow: 0 3px 5px rgba(162,88,40,0.4); }\n.mbtn-ghost { background: transparent; border: 1.5px solid var(--rv-line-2); color: var(--text-light); }\n.mbtn-out { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }\n\n/* stripe-left accent */\n.stripe { position: relative; }\n.stripe::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; border-radius:2px; }\n.stripe.cold::before { background: var(--cold); }\n.stripe.warm::before { background: var(--warm); }\n.stripe.accent::before { background: var(--accent); }\n\n/* meter (puls / fanMood) */\n.meter { }\n.meter-top { display: flex; justify-content: space-between; align-items: baseline; }\n.meter-lbl { font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n.meter-val { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--text-light); }\n.meter-val s { font-size: 9px; color: var(--text-muted); text-decoration: none; font-weight: 400; }\n.meter-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 6px; overflow: hidden; }\n.meter-track i { display: block; height: 100%; border-radius: 3px; }\n.meter-cons { display: flex; gap: 8px; font-size: 8px; font-weight: 600; margin-top: 6px; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* \"dead\" marker overlay used in diagnosis */\n.dead-pin {\n  position: absolute; top: 8px; right: 8px; z-index: 4;\n  font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px;\n  background: rgba(176,80,64,0.92); color: #fff; padding: 3px 7px; border-radius: 4px;\n  text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.4);\n}\n\n/* eyebrow scene */\n.eyebrow { font-size: 8px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: var(--cold); }\n\n/* priority table */\n.prio { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }\n.prio-row {\n  display: grid; grid-template-columns: 30px 1fr 120px 92px; gap: 16px; align-items: center;\n  background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 10px; padding: 14px 18px;\n}\n.prio-row .rank { font-family: var(--serif); font-size: 22px; font-weight: 800; color: var(--accent); }\n.prio-row .what b { font-size: 13.5px; font-weight: 700; color: var(--rv-ink); }\n.prio-row .what span { display: block; font-size: 11.5px; color: var(--rv-ink-2); margin-top: 3px; line-height: 1.45; }\n.prio-row .eff { font-size: 10px; letter-spacing: 0.5px; }\n.prio-row .eff .k { color: var(--rv-ink-3); text-transform: uppercase; font-size: 8px; letter-spacing: 1px; }\n.prio-row .eff .v { color: var(--rv-ink); font-weight: 600; }\n.impact { display: flex; gap: 3px; }\n.impact i { width: 10px; height: 10px; border-radius: 2px; background: var(--rv-line-2); }\n.impact i.on { background: var(--accent); }\n\n/* foot */\n.foot { margin-top: 64px; padding-top: 26px; border-top: 1px solid var(--rv-line); text-align: center;\n  font-size: 11px; color: var(--rv-ink-3); line-height: 1.7; }\n.foot b { color: var(--rv-ink-2); }\n\n@media (max-width: 920px) {\n  .diag { grid-template-columns: 1fr; }\n  .ba { grid-template-columns: 1fr; gap: 28px; }\n  .ba-arrow { padding: 0; transform: rotate(90deg); }\n  .prio-row { grid-template-columns: 30px 1fr; }\n  .prio-row .eff, .prio-row .impact { display: none; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">Designgenomgång · spelkänsla · hela säsongen<\u002Fp>\n    <h1>Var dör <em>trycket<\u002Fem>?<\u002Fh1>\n    <p class=\"sub\">En genomlysning av Bandy Manager-säsongen som <em>upplevelseflöde<\u002Fem> — portal → förbered → spela → granska. Vi följer spelkänslans kurva, pekar ut var den tappar luft, och bygger om de tre svagaste ytorna.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Underlag<\u002Fb> · mockups/ · ui_kit · src<\u002Fspan>\n      <span><b>Metod<\u002Fb> · spelkänsle-auditen (6 teman)<\u002Fspan>\n      <span><b>Fokus<\u002Fb> · spänningskurva · avbrottsstapling · döda mätare<\u002Fspan>\n      <span><b>2026-06-17<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ 1 · SPÄNNINGSKURVAN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — TESEN<\u002Fdiv>\n      <h2>Spelkänslan är en kurva, inte ett medelvärde<\u002Fh2>\n      <p>Säsongen har en dramaturgi: <strong>premiärnerv → mittsäsongsdipp → upptaktsallvar → slutspelstryck<\u002Fstrong>. Systemet är <span class=\"c\">mästerligt byggt för slutet<\u002Fspan> — eskaleringen grundserie → upptakt → kvart → semi → final är en graderad estetik-familj som höjer pulsen omgång för omgång. Men eskaleringen tänds först de sista 3 omgångarna. <strong>Mitten (omg 6–15) lämnas odifferentierad<\u002Fstrong> — samma \"routine\"-portal, vägg-till-vägg-kort utan rytm. Där tappar trycket luft.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"curve-card\">\n      <svg class=\"curve-svg\" viewBox=\"0 0 1180 300\" role=\"img\" aria-label=\"Spänningskurva över en säsong\">\n        <!-- zones -->\n        <rect x=\"34\" y=\"30\" width=\"92\" height=\"240\" fill=\"rgba(196,122,58,0.10)\"><\u002Frect>\n        <rect x=\"255\" y=\"30\" width=\"272\" height=\"240\" fill=\"rgba(176,80,64,0.13)\"><\u002Frect>\n        <rect x=\"845\" y=\"30\" width=\"180\" height=\"240\" fill=\"rgba(196,168,106,0.10)\"><\u002Frect>\n        <rect x=\"1025\" y=\"30\" width=\"135\" height=\"240\" fill=\"rgba(216,180,90,0.16)\"><\u002Frect>\n        <!-- baseline -->\n        <line x1=\"34\" y1=\"270\" x2=\"1160\" y2=\"270\" stroke=\"rgba(245,241,235,0.12)\" stroke-width=\"1\"><\u002Fline>\n        <!-- gridlines -->\n        <line x1=\"34\" y1=\"155\" x2=\"1160\" y2=\"155\" stroke=\"rgba(245,241,235,0.05)\" stroke-width=\"1\"><\u002Fline>\n        <line x1=\"34\" y1=\"92\" x2=\"1160\" y2=\"92\" stroke=\"rgba(245,241,235,0.05)\" stroke-width=\"1\"><\u002Fline>\n        <!-- area under curve -->\n        <path d=\"M50,81.4 95.4,132 140.8,150.4 186.3,164.2 231.7,173.4 277.1,187.2 322.5,194.1 367.9,201 413.3,198.7 458.8,191.8 504.2,194.1 549.6,182.6 595,173.4 640.4,159.6 685.8,164.2 731.3,155 776.7,145.8 822.1,136.6 867.5,118.2 912.9,104.4 958.3,90.6 1003.8,76.8 1049.2,67.6 1094.6,58.4 1140,40 L1140,270 L50,270 Z\" fill=\"rgba(196,122,58,0.07)\"><\u002Fpath>\n        <!-- the line -->\n        <polyline points=\"50,81.4 95.4,132 140.8,150.4 186.3,164.2 231.7,173.4 277.1,187.2 322.5,194.1 367.9,201 413.3,198.7 458.8,191.8 504.2,194.1 549.6,182.6 595,173.4 640.4,159.6 685.8,164.2 731.3,155 776.7,145.8 822.1,136.6 867.5,118.2 912.9,104.4 958.3,90.6 1003.8,76.8 1049.2,67.6 1094.6,58.4 1140,40\" fill=\"none\" stroke=\"#C47A3A\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline>\n        <!-- key dots -->\n        <circle cx=\"50\" cy=\"81.4\" r=\"4\" fill=\"#C47A3A\"><\u002Fcircle>\n        <circle cx=\"367.9\" cy=\"201\" r=\"5\" fill=\"#B05040\"><\u002Fcircle>\n        <circle cx=\"640.4\" cy=\"159.6\" r=\"4\" fill=\"#C4A86A\"><\u002Fcircle>\n        <circle cx=\"1140\" cy=\"40\" r=\"5\" fill=\"#D8B45A\"><\u002Fcircle>\n        <!-- dip label -->\n        <text x=\"391\" y=\"232\" fill=\"#D08A78\" font-family=\"Georgia,serif\" font-size=\"15\" font-style=\"italic\" text-anchor=\"middle\" font-weight=\"700\">DÖD ZON?<\u002Ftext>\n        <text x=\"391\" y=\"249\" fill=\"rgba(208,138,120,0.7)\" font-family=\"monospace\" font-size=\"9\" text-anchor=\"middle\" letter-spacing=\"1\">OMG 6–15 · HYPOTES<\u002Ftext>\n        <!-- x labels -->\n        <g fill=\"rgba(245,241,235,0.4)\" font-family=\"monospace\" font-size=\"9\" text-anchor=\"middle\">\n          <text x=\"50\" y=\"288\">1<\u002Ftext>\n          <text x=\"277\" y=\"288\">6<\u002Ftext>\n          <text x=\"367.9\" y=\"288\">8<\u002Ftext>\n          <text x=\"504\" y=\"288\">11<\u002Ftext>\n          <text x=\"640\" y=\"288\">14<\u002Ftext>\n          <text x=\"867.5\" y=\"288\">19<\u002Ftext>\n          <text x=\"1003.8\" y=\"288\">22<\u002Ftext>\n          <text x=\"1049.2\" y=\"288\">KV<\u002Ftext>\n          <text x=\"1094.6\" y=\"288\">SF<\u002Ftext>\n          <text x=\"1140\" y=\"288\">F<\u002Ftext>\n        <\u002Fg>\n        <!-- peak labels -->\n        <text x=\"50\" y=\"68\" fill=\"#C47A3A\" font-family=\"Georgia,serif\" font-size=\"11\" font-style=\"italic\" text-anchor=\"middle\">premiärnerv<\u002Ftext>\n        <text x=\"1140\" y=\"28\" fill=\"#D8B45A\" font-family=\"Georgia,serif\" font-size=\"11\" font-style=\"italic\" text-anchor=\"middle\">final<\u002Ftext>\n      <\u002Fsvg>\n\n      <div class=\"curve-legend\">\n        <div class=\"cl\" style=\"--cz:#C47A3A\">\n          <div class=\"cl-r\">Omg 1–5 · Premiär<\u002Fdiv>\n          <div class=\"cl-t\">Nerv finns<\u002Fdiv>\n          <div class=\"cl-d\">Ny säsong, allt är öppet. ArrivalScene + premiär bär trycket. Fungerar.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cl dip\" style=\"--cz:#B05040\">\n          <div class=\"cl-r\">Omg 6–15 · Mitten<\u002Fdiv>\n          <div class=\"cl-t\">Trycket dör<\u002Fdiv>\n          <div class=\"cl-d\">Tabellen jämn, inget på spel än. Portalen ser likadan ut varje omgång. <b>Hypotesen: här tappas spelaren<\u002Fb> — genomspelningen bekräftar.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cl\" style=\"--cz:#C4A86A\">\n          <div class=\"cl-r\">Omg 16–22 · Upptakt<\u002Fdiv>\n          <div class=\"cl-t\">Allvaret återvänder<\u002Fdiv>\n          <div class=\"cl-d\">Eskaleringen tänds: warm PhaseMark, countdown-rail, primary lyfts. Väl byggt.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cl\" style=\"--cz:#D8B45A\">\n          <div class=\"cl-r\">KV → SF → Final<\u002Fdiv>\n          <div class=\"cl-t\">Full kraft<\u002Fdiv>\n          <div class=\"cl-d\">Gold-gradient, best-of-five-tracker, klimax-koreografi. Systemets paradnummer.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2 · FLÖDESDIAGNOS ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — DIAGNOS<\u002Fdiv>\n      <h2>Flödet, yta för yta<\u002Fh2>\n      <p>Fyra ytor bär en omgång. Tre av dem har redan stark spelkänsla. En är hålet. Här är var och en genom spelkänsle-linsen — vad som <span class=\"c\">lyfter<\u002Fspan> och vad som <strong>skaver<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- DIAG A · Portal mid-season -->\n    <div class=\"diag\">\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"gh\">\n            <div class=\"gh-logo\">BM<\u002Fdiv>\n            <div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">J. Stjärne · 2026/27 · Omg 9<\u002Fdiv><\u002Fdiv>\n            <div class=\"gh-bell\"><span class=\"dot-n\">◔<\u002Fspan> ⚙<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pi dark\">\n            <span class=\"pi-step on\"><span class=\"pd\"><\u002Fspan>Förbered<\u002Fspan><span class=\"pi-line\"><\u002Fspan>\n            <span class=\"pi-step\"><span class=\"pd\"><\u002Fspan>Spela<\u002Fspan><span class=\"pi-line\"><\u002Fspan>\n            <span class=\"pi-step\"><span class=\"pd\"><\u002Fspan>Granska<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"dead-pin\">samma varje omg<\u002Fdiv>\n          <div class=\"body dark\">\n            <div class=\"c-round c-dark\"><div class=\"lbl dark\" style=\"margin-bottom:5px\">📖 DAGBOKEN · ONS 9<\u002Fdiv><div class=\"diary-q\" style=\"color:var(--text-light-secondary)\">\"Träning igår. Inget på gång till lördag.\"<\u002Fdiv><\u002Fdiv>\n            <div class=\"c-sharp c-dark\"><div class=\"lbl dark\">📊 STYRELSENS KRAV<\u002Fdiv><div style=\"font-size:11px;color:var(--text-light-secondary);margin-top:3px;font-family:var(--serif)\">Topp 8 — vi ligger 6:a.<\u002Fdiv><\u002Fdiv>\n            <div class=\"c-sharp c-dark\"><div class=\"lbl dark\">📊 TABELL<\u002Fdiv><div style=\"font-size:11px;color:var(--text-light-secondary);margin-top:3px;font-family:var(--serif)\">6:a · 14 poäng efter 8.<\u002Fdiv><\u002Fdiv>\n            <div class=\"c-sharp c-dark\"><div class=\"lbl dark\">💰 EKONOMI<\u002Fdiv><div style=\"font-size:11px;color:var(--text-light-secondary);margin-top:3px;font-family:var(--serif)\">96 tkr. Stadigt.<\u002Fdiv><\u002Fdiv>\n            <div class=\"c-sharp c-dark\"><div class=\"lbl dark\">🏒 NÄSTA MATCH<\u002Fdiv><div style=\"font-size:11px;color:var(--text-light);margin-top:3px;font-family:var(--serif);font-weight:700\">Forsbacka — Heros<\u002Fdiv><div style=\"font-size:9px;color:var(--text-muted);margin-top:1px\">Lördag 14:00. Hemma.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"diag-panel\">\n        <div class=\"diag-tag\">Yta A · Portal, mittsäsong<\u002Fdiv>\n        <h3>Den döda zonen<\u002Fh3>\n        <p>Fem tunna kort, samma uppställning varje omgång. \"Lugnt\" renderas som <em>lite<\u002Fem>, inte som lugnt. Ingen tyngdpunkt, ingen rörelse, ingenting som drar blicken. Detta är ytan som bär 10 av 22 omgångar — och den ber aldrig om uppmärksamhet.<\u002Fp>\n        <div class=\"flag bad\"><div class=\"flag-ic\">!<\u002Fdiv><div class=\"flag-body\"><b>Ingen rytm.<\u002Fb> <span>Vägg-till-vägg-kort i identisk ordning. Omg 9 är inte att skilja från omg 11.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag bad\"><div class=\"flag-ic\">!<\u002Fdiv><div class=\"flag-body\"><b>Ingen tyngdpunkt.<\u002Fb> <span>Allt väger lika. Ögat har ingenstans att landa, så inget fastnar.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag bad\"><div class=\"flag-ic\">!<\u002Fdiv><div class=\"flag-body\"><b>Tystnaden har ingen röst.<\u002Fb> <span>En lugn vecka borde kännas som vila — här känns den som att appen är tom.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag good\"><div class=\"flag-ic\">↑<\u002Fdiv><div class=\"flag-body\"><b>Lösningen finns redan skissad.<\u002Fb> <span>\"Vardagsrytm\"-mocken (andningsrad + tålamodskort) pekar rätt — den är bara inte byggd. Vi tar den hela vägen i 03.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag good\" style=\"border-top-color:var(--rv-line-2)\"><div class=\"flag-ic\" style=\"background:rgba(126,155,181,0.16);color:var(--cold)\">?<\u002Fdiv><div class=\"flag-body\"><b style=\"color:var(--cold)\">Hypotes, inte mätning.<\u002Fb> <span>Svackan är läst ur mockups — inte ur en spelad säsong. Jacobs genomspelning är instrumentet som bekräftar eller dödar den. A byggs <em>efter<\u002Fem> att genomspelningen styrker svackan, inte före.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"sev\"><span>Spelkänsle-skada<\u002Fspan><span class=\"sev-bar\"><i style=\"width:88%;background:linear-gradient(90deg,var(--cold),var(--accent))\"><\u002Fi><\u002Fspan><b style=\"color:var(--cold)\">Hypotes · att bekräftas<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DIAG B · Live match -->\n    <div class=\"diag\">\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"gh\">\n            <div class=\"gh-logo\">BM<\u002Fdiv>\n            <div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">Spela · 2:a halvlek<\u002Fdiv><\u002Fdiv>\n            <div class=\"gh-bell\">⚙<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"body dark\" style=\"gap:8px\">\n            <div class=\"led\">\n              <div class=\"led-row\">\n                <div class=\"led-team us\">FOR<\u002Fdiv>\n                <div class=\"led-per\">HL2<\u002Fdiv>\n                <div class=\"led-team them\">HER<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"led-row\" style=\"margin-top:2px\">\n                <div class=\"led-score us\">2<\u002Fdiv>\n                <div><div class=\"led-time\">79:05<\u002Fdiv><\u002Fdiv>\n                <div class=\"led-score them\" style=\"text-align:right\">2<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"mom\">\n              <div class=\"mom-top\"><span>FORSBACKA<\u002Fspan><span class=\"st\">↟ INTENSIVT<\u002Fspan><span>HEROS<\u002Fspan><\u002Fdiv>\n              <div class=\"mom-track\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"c-sharp c-elev stripe accent\" style=\"padding-left:13px\">\n              <div style=\"font-size:7.5px;letter-spacing:2px;color:var(--accent);text-align:center;font-weight:600\">· 79' · JÄMNT · DET ÖPPNAR UPP ·<\u002Fdiv>\n              <div style=\"font-family:var(--serif);font-size:13px;font-weight:700;color:var(--text-light);text-align:center;margin-top:5px\">Gå på vinsten, eller stäng igen?<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px\">\n                <div class=\"mbtn mbtn-out\">Gå på<\u002Fdiv>\n                <div class=\"mbtn mbtn-ghost\">Stäng igen<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:2px\">\n              <div class=\"feed\"><span class=\"min\">78'<\u002Fspan><span class=\"tx\">Det vrider och vänder. Båda lagen vill ha trean.<\u002Fspan><\u002Fdiv>\n              <div class=\"feed\"><span class=\"min\">75'<\u002Fspan><span class=\"tx =\"meter-lbl\" style=\"color:var(--accent)\">🏘️ BYGDENS PULS<\u002Fspan><span style=\"font-size:8px;color:var(--text-muted);font-family:var(--mono)\">8 OMG<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:6px\">\n                  <span style=\"font-family:var(--serif);font-weight:800;font-size:30px;color:var(--text-light);line-height:1\">54<\u002Fspan>\n                  <span style=\"font-size:11px;color:var(--success);font-weight:600\">↑ 4 sedan derbyt<\u002Fspan>\n                <\u002Fdiv>\n                <!-- moving sparkline -->\n                <svg viewBox=\"0 0 260 40\" style=\"width:100%;height:34px;margin-top:8px\"><polyline points=\"2,20 35,16 68,26 100,22 133,30 166,18 200,24 232,12 258,15\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolyline><circle cx=\"258\" cy=\"15\" r=\"3\" fill=\"var(--accent)\"><\u002Fcircle><\u002Fsvg>\n                <div class=\"meter-cons\" style=\"margin-top:8px;flex-wrap:wrap\"><span class=\"up\">Klacken ↑<\u002Fspan><span class=\"up\">Derbyseger ↑<\u002Fspan><span class=\"down\">Tre raka förluster ↓<\u002Fspan><span class=\"neu\">Mean-reversion mot 50<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:var(--serif);font-style:italic;font-size:11px;color:var(--text-light-secondary);margin-top:9px;line-height:1.5;border-top:1px solid var(--rv-line);padding-top:9px\">Bygden vänder sakta uppåt. Derbyt gav råg i ryggen — men minnet av höstens svacka sitter kvar.<\u002Fdiv>\n              <\u002Fdiv>\n              <!-- fanMood folded in as slow undertone, not a competing meter -->\n              <div class=\"c-sharp c-dark stripe cold\" style=\"padding:9px 12px 9px 14px;display:flex;justify-content:space-between;align-items:center\">\n                <div><div class=\"lbl dark\" style=\"margin-bottom:2px\">GRUNDSTÄMNING<\u002Fdiv><div style=\"font-size:10px;color:var(--text-light-secondary);font-family:var(- b><span>Andningsrad + salience-driven veckans-tyngdpunkt + komprimerad statusrad. <b style=\"color:var(--accent)\">Den enda som bär kurvan<\u002Fb> — lyfter 10 av 22 omgångar. Går vidare efter (a) datacheck mot trä/ungdom och (b) att genomspelningen styrker svackan.<\u002Fspan><\u002Fdiv>\n        <div class=\"eff\"><div><span class=\"k\">Kostnad<\u002Fspan> <span class=\"v\">Medel<\u002Fspan><\u002Fdiv><div style=\"margin-top:4px\"><span class=\"k\">Bär kurvan<\u002Fspan> <span class=\"v\" style=\"color:var(--accent)\">Ja — ensam<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"impact\"><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prio-row\">\n        <div class=\"rank\">2<\u002Fdiv>\n        <div class=\"what\"><b>Veckans bord ersätter modal-kön<\u002Fb><span>Samla alla 7 avbrottskanaler på en severity-rankad yta med en beslutsbudget. Egna meriter (ytkvalitet, ej svackan). Blockerad bakom interruptClassifier-wiringen.<\u002Fspan><\u002Fdiv>\n        <div class=\"eff\"><div><span class=\"k\">Kostnad<\u002Fspan> <span class=\"v\">Medel–hög<\u002Fspan><\u002Fdiv><div style=\"margin-top:4px\"><span class=\"k\">Bär kurvan<\u002Fspan> <span class=\"v\" style=\"color:var(--rv-ink-3)\">Nej<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"impact\"><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prio-row\">\n        <div class=\"rank\">3<\u002Fdiv>\n        <div class=\"what\"><b>Slå ihop puls + fanMood<\u002Fb><span>En levande puls, fanMood som grundton. Tar bort den enda mätaren som ser död ut i hela appen. Egna meriter, ej svackan.<\u002Fspan><\u002Fdiv>\n        <div class=\"eff\"><div><span class=\"k\">Kostnad<\u002Fspan> <span class=\"v\">Låg<\u002Fspan><\u002Fdiv><div style=\"margin-top:4px\"><span class=\"k\">Tema<\u002Fspan> <span class=\"v\">Döda mätaren<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"impact\"><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prio-row\">\n        <div class=\"rank\">4<\u002Fdiv>\n        <div class=\"what\"><b>Knyt granska → nästa portal<\u002Fb><span>Låt granskas avslut peka in i nästa omgångs kapitel så momentum inte tappas i sömmen.<\u002Fspan><\u002Fdiv>\n        <div class=\"eff\"><div><span class=\"k\">Kostnad<\u002Fspan> <span class=\"v\">Låg<\u002Fspan><\u002Fdiv><div style=\"margin-top:4px\"><span class=\"k\">Tema<\u002Fspan> <span class=\"v\">Flödessöm<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"impact\"><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"foot\">\n      <b>Spelkänsle-genomgång · Bandy Manager<\u002Fb> · 2026-06-17<br>\n      Allt på befintliga tokens, komponenter och copy-ton. Inga nya färger, ingen pastisch — förstärkning &amp; kontrast, aldrig kostym.<br>\n      Underlag: <b>mockups/<\u002Fb> · <b>ui_kits/bandy-manager-pwa<\u002Fb> · <b>bandy-manager/src<\u002Fb> · auditmetod ur <b>RELA_FABLE_SPELKANSLE<\u002Fb>.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<\u002Fbody><\u002Fhtml>"
