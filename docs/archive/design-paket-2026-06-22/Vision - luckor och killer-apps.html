e-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPELKÄNSLE-GENOMGÅNG — review-dokument\n   Mörk review-estetik, riktiga Bandy Manager-tokens.\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* canvas */\n  --rv-bg:        #1a1714;\n  --rv-bg-2:      #211d19;\n  --rv-panel:     #262019;\n  --rv-line:      rgba(245,241,235,0.08);\n  --rv-line-2:    rgba(245,241,235,0.14);\n\n  /* text */\n  --rv-ink:       #F2ECE1;\n  --rv-ink-2:     #C6BCA9;\n  --rv-ink-3:     #8E867A;\n\n  /* brand (ur colors_and_type.css) */\n  --accent:       #C47A3A;\n  --accent-dark:  #A25828;\n  --accent-deep:  #8B4820;\n  --success:      #5A9A4A;\n  --danger:       #B05040;\n  --danger-text:  #D08A78;\n  --ice:          #7EB3D4;\n  --cold:         #7E9BB5;\n  --warm:         #C4A86A;\n  --gold:         #D8B45A;\n\n  /* portal dark */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n  --text-muted:           #8A857A;\n\n  /* LED */\n  --led-bg:    #0A0A0A;\n  --led-score: #FF1A1A;\n  --led-time:  #CCFF00;\n  --led-us:    #FFB033;\n  --led-them:  #6FC0E8;\n\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --mono:  'Courier New', ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background:\n    radial-gradient(1200px 700px at 50% -200px, #2a231c 0%, transparent 60%),\n    var(--rv-bg);\n  color: var(--rv-ink);\n  font-family: var(--sans);\n  -webkit-font-smoothing: antialiased;\n  line-height: 1.5;\n  padding-bottom: 80px;\n}\n\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n\n/* ── Hero ─────────────────────────────────────────── */\n.hero {\n  text-align: center;\n  padding: 84px 0 48px;\n  border-bottom: 1px solid var(--rv-line);\n}\n.hero .kick {\n  font-size: 10px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase;\n  color: var(--accent); opacity: 0.85;\n}\n.hero h1 {\n  font-family: var(--serif); font-weight: 800; font-size: 52px; line-height: 1.05;\n  margin: 18px 0 0; letter-spacing: -0.5px;\n}\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub {\n  font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--rv-ink-2);\n  max-width: 680px; margin: 20px auto 0; line-height: 1.6;\n}\n.hero .meta {\n  margin-top: 26px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;\n  font-size: 11px; color: var(--rv-ink-3); letter-spacing: 0.3px;\n}\n.hero .meta b { color: var(--rv-ink-2); font-weight: 600; }\n\n/* ── Section scaffold ─────────────────────────────── */\n.sec { padding: 70px 0 0; }\n.sec-head { margin-bottom: 30px; }\n.sec-num {\n  font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--accent);\n  letter-spacing: 2px;\n}\n.sec-head h2 {\n  font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1.12;\n  margin-top: 6px; letter-spacing: -0.3px;\n}\n.sec-head p {\n  font-size: 13.5px; color: var(--rv-ink-2); max-width: 760px; margin-top: 12px; line-height: 1.65;\n}\n.sec-head p strong { color: var(--rv-ink); font-weight: 600; }\n.sec-head p .c { color: var(--accent); font-weight: 600; }\n\n/* ── The curve ────────────────────────────────────── */\n.curve-card {\n  margin-top: 8px; background: linear-gradient(180deg, #221d17, #1c1813);\n  border: 1px solid var(--rv-line); border-radius: 14px; padding: 30px 30px 22px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.curve-svg { width: 100%; height: auto; display: block; }\n.curve-legend {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px;\n}\n.cl {\n  border-top: 2px solid var(--cz); padding-top: 10px;\n}\n.cl .cl-r { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--rv-ink-3); text-transform: uppercase; }\n.cl .cl-t { font-family: var(--serif); font-size: 15px; font-weight: 700; margin-top: 3px; color: var(--rv-ink); }\n.cl .cl-d { font-size: 11.5px; color: var(--rv-ink-2); margin-top: 5px; line-height: 1.5; }\n.cl.dip .cl-t { color: var(--danger-text); }\n\n/* ── Diagnosis rows (phone + panel) ───────────────── */\n.diag {\n  display: grid; grid-template-columns: 300px 1fr; gap: 38px; align-items: start;\n  padding: 30px 0; border-top: 1px solid var(--rv-line);\n}\n.diag:first-of-type { border-top: none; }\n.diag-panel { padding-top: 6px; }\n.diag-tag {\n  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;\n  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;\n}\n.diag-panel h3 { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.2; }\n.diag-panel > p { font-size: 13px; color: var(--rv-ink-2); margin-top: 10px; line-height: 1.6; }\n\n/* problem / move callouts */\n.flag { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--rv-line); }\n.flag:first-of-type { margin-top: 14px; }\n.flag-ic {\n  flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; margin-top: 1px;\n  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700;\n}\n.flag.bad  .flag-ic { background: rgba(176,80,64,0.16);  color: var(--danger-text); }\n.flag.good .flag-ic { background: rgba(196,122,58,0.16); color: var(--accent); }\n.flag-body { font-size: 12.5px; line-height: 1.55; }\n.flag-body b { color: var(--rv-ink); font-weight: 600; }\n.flag.bad .flag-body b  { color: var(--danger-text); }\n.flag.good .flag-body b { color: var(--accent); }\n.flag-body span { color: var(--rv-ink-2); }\n\n/* severity score chip */\n.sev {\n  display: inline-flex; align-items: center; gap: 7px; margin-top: 16px;\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--rv-ink-3);\n}\n.sev b { color: var(--rv-ink); }\n.sev-bar { width: 90px; height: 5px; border-radius: 3px; background: var(--rv-line-2); overflow: hidden; }\n.sev-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger)); }\n\n/* ── Before / after ───────────────────────────────── */\n.ba-head {\n  display: flex; align-items: baseline; gap: 14px; margin: 18px 0 22px;\n}\n.ba-head .ba-pin {\n  font-family: var(--serif); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1;\n}\n.ba-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; }\n.ba-head .ba-sub { font-size: 12px; color: var(--rv-ink-3); margin-left: auto; font-family: var(--mono); letter-spacing: 0.5px; }\n\n.ba {\n  display: grid; grid-template-columns: 1fr 54px 1fr; gap: 0; align-items: start;\n  margin-top: 6px;\n}\n.ba-col { }\n.ba-col .ba-lbl {\n  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;\n}\n.ba-col .ba-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }\n.ba-col.before .dot { background: var(--danger); }\n.ba-col.after  .dot { background: var(--success); }\n.ba-col .ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }\n.ba-col.before .t { color: var(--danger-text); }\n.ba-col.after  .t { color: var(--success); }\n.ba-col .ba-lbl .s { font-size: 11px; color: var(--rv-ink-3); font-style: italic; font-family: var(--serif); }\n.ba-arrow {\n  display: grid; place-items: center; padding-top: 200px;\n  color: var(--accent); font-size: 24px;\n}\n.ba-notes { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }\n.ba-note { display: flex; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.ba-note .n-ic { color: var(--success); flex-shrink: 0; font-weight: 700; }\n.ba-note b { color: var(--rv-ink); font-weight: 600; }\n\n/* ═══════════════════════════════════════════════════\n   PHONE MOCKS — faithful BM recreation\n   ═══════════════════════════════════════════════════ */\n.phone {\n  border-radius: 18px; overflow: hidden; background: var(--bg-portal);\n  border: 4px solid #0b0a08; box-shadow: 0 14px 38px rgba(0,0,0,0.5);\n}\n.phone.paper { background: #EDE8DF; }\n.scr { position: relative; display: flex; flex-direction: column; min-height: 480px; }\n\n/* GameHeader */\n.gh {\n  background: linear-gradient(180deg, #3D3A32, #2a2822);\n  border-bottom: 2px solid var(--accent);\n  display: grid; grid-template-columns: 26px 1fr 40px; align-items: center; gap: 8px;\n  padding: 8px 12px;\n}\n.gh-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(245,241,235,0.4);\n  display: grid; place-items: center; font-family: var(--serif); font-size: 9px; color: var(--text-light); }\n.gh-mid { text-align: center; }\n.gh-club { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); letter-spacing: 0.5px; }\n.gh-sub  { font-size: 8px; color: var(--text-light-secondary); letter-spacing: 0.5px; margin-top: 1px; }\n.gh-bell { justify-self: end; display: flex; gap: 6px; color: var(--text-light-secondary); font-size: 13px; }\n.gh-bell .dot-n { position: relative; }\n.gh-bell .dot-n::after { content:''; position:absolute; top:-1px; right:-2px; width:5px; height:5px; border-radius:50%; background: var(--danger); }\n\n/* PhaseIndicator */\n.pi {\n  display: flex; align-items: center; justify-content: center; gap: 6px;\n  padding: 7px 12px; background: rgba(0,0,0,0.18); border-bottom: 1px solid rgba(0,0,0,0.25);\n}\n.pi.paper { background: #E4DED3; border-bottom: 1px solid var(--border, #DDD7CC); }\n.pi-step { display: flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }\n.pi.dark .pi-step { color: var(--text-muted); }\n.pi.paper .pi-step { color: #8A857A; }\n.pi-step .pd { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }\n.pi-step.on { color: var(--accent); }\n.pi-step.on .pd { background: var(--accent); border-color: var(--accent); }\n.pi-line { width: 22px; height: 1px; background: currentColor; opacity: 0.3; }\n\n/* generic scroll body */\n.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.body.paper { background: #EDE8DF; }\n.body.dark  { background: var(--bg-portal); }\n\n/* section label */\n.lbl { font-size: 8px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }\n.lbl.dark  { color: var(--text-muted); }\n.lbl.paper { color: #8A857A; }\n\n/* cards */\n.c-sharp { border-radius: 8px; padding: 10px 12px; }\n.c-round { border-radius: 14px; padding: 11px 13px; }\n.c-paper { background: #FAF8F4; border: 1px solid #DDD7CC; }\n.c-dark  { background: var(--bg-portal-surface); border: 1px solid var(--rv-line-2); }\n.c-elev  { background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2); }\n\n/* next-match leather */\n.nmc {\n  background: linear-gradient(180deg, #3D3520, #2a2418);\n  border-radius: 8px; padding: 11px 13px; color: var(--text-light);\n}\n.nmc-top { display: flex; align-items: center; justify-content: space-between; }\n.nmc-tag { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--match-gold, #D4B860); display:flex; gap:5px; align-items:center;}\n.nmc-home { font-size: 7px; font-weight: 700; letter-spacing: 1px; color: #0E0D0B; background: var(--accent); padding: 2px 6px; border-radius: 99px; }\n.nmc-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; gap: 8px; }\n.nmc-badge { width: 34px; height: 34px; border-radius: 6px; margin: 0 auto; display: grid; place-items: center; font-size: 15px; }\n.nmc-team { text-align: center; font-family: var(--serif); font-size: 11px; font-weight: 700; margin-top: 4px; }\n.nmc-mid { text-align: center; }\n.nmc-time { font-family: var(--serif); font-size: 13px; color: var(--match-gold, #D4B860); }\n.nmc-arena { font-size: 7.5px; color: var(--text-light-secondary); margin-top: 2px; }\n.nmc-form { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 8px; letter-spacing: 1px; color: var(--text-light-secondary); }\n.fdot { width: 7px; height: 7px; border-radius: 50%; }\n.fdots { display: flex; gap: 3px; }\n\n/* metric tiles */\n.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.tile-val { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1; }\n.tile-sub { font-size: 9px; margin-top: 4px; }\n\n/* quote / diary */\n.diary { }\n.diary-q { font-family: var(--serif); font-style: italic; font-size: 12px; line-height: 1.5; }\n\n/* tactic selector */\n.tac { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }\n.tac-opt { border-radius: 8px; padding: 9px 6px; text-align: center; border: 1px solid #DDD7CC; background: #FAF8F4; }\n.tac-opt.on { border: 1.5px solid var(--accent); background: #FBF3EA; }\n.tac-opt .to-t { font-size: 11px; font-weight: 700; color: #1A1A18; }\n.tac-opt.on .to-t { color: var(--accent-dark); }\n.tac-opt .to-s { font-size: 8px; color: #8A857A; margin-top: 2px; }\n\n/* pitch */\n.pitch { background: #2d6e3a; border-radius: 8px; position: relative; height: 150px; overflow: hidden; }\n.pitch::before { content:''; position:absolute; inset:0; background:\n  repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,0.04) 18px 36px); }\n.pp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #1e4d8c; border: 1.5px solid rgba(255,255,255,0.5);\n  display: grid; place-items: center; font-size: 7px; font-weight: 700; color: #fff; transform: translate(-50%,-50%); }\n\n/* LED scoreboard mini */\n.led {\n  background: var(--led-bg); border: 1px solid var(--accent-deep); border-radius: 6px;\n  padding: 9px 11px; position: relative;\n}\n.led-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }\n.led-team { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; }\n.led-team.us { color: var(--led-us); } .led-team.them { color: var(--led-them); text-align: right; }\n.led-score { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 2px; text-align: center; }\n.led-score .us { color: var(--led-us); } .led-score .them { color: var(--led-them); } .led-score .sep { color: #555; }\n.led-time { font-family: var(--mono); font-size: 15px; color: var(--led-score); letter-spacing: 1px; text-align: center; margin-top: 2px; }\n.led-per  { font-family: var(--mono); font-size: 9px; color: var(--led-time); text-align: center; }\n\n/* momentum bar */\n.mom { margin-top: 8px; }\n.mom-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }\n.mom-top .st { color: var(--accent); }\n.mom-track { height: 8px; border-radius: 4px; margin-top: 5px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 58%, #2a3a44 58%, var(--ice) 100%); }\n\n/* feed line */\n.feed { display: flex; gap: 9px; font-size: 10px; padding: 4px 0; }\n.feed .min { font-family: var(--mono); font-size: 9px; color: var(--text-muted); width: 22px; flex-shrink: 0; }\n.feed .tx { color: var(--text-light-secondary); line-height: 1.4; }\n.feed.goal .tx { color: var(--accent); font-weight: 600; }\n\n/* mini button */\n.mbtn { border-radius: 8px; padding: 9px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.mbtn-cta { background: linear-gradient(180deg, #DD9555, #8B4820); color: #fff; box-shadow: 0 3px 5px rgba(162,88,40,0.4); }\n.mbtn-ghost { background: transparent; border: 1.5px solid var(--rv-line-2); color: var(--text-light); }\n.mbtn-out { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }\n\n/* stripe-left accent */\n.stripe { position: relative; }\n.stripe::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; border-radius:2px; }\n.stripe.cold::before { background: var(--cold); }\n.stripe.warm::before { background: var(--warm); }\n.stripe.accent::before { background: var(--accent); }\n\n/* meter (puls / fanMood) */\n.meter { }\n.meter-top { display: flex; justify-content: space-between; align-items: baseline; }\n.meter-lbl { font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n.meter-val { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--text-light); }\n.meter-val s { font-size: 9px; color: var(--text-muted); text-decoration: none; font-weight: 400; }\n.meter-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 6px; overflow: hidden; }\n.meter-track i { display: block; height: 100%; border-radius: 3px; }\n.meter-cons { display: flex; gap: 8px; font-size: 8px; font-weight: 600; margin-top: 6px; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* \"dead\" marker overlay used in diagnosis */\n.dead-pin {\n  position: absolute; top: 8px; right: 8px; z-index: 4;\n  font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px;\n  background: rgba(176,80,64,0.92); color: #fff; padding: 3px 7px; border-radius: 4px;\n  text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.4);\n}\n\n/* eyebrow scene */\n.eyebrow { font-size: 8px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: var(--cold); }\n\n/* priority table */\n.prio { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }\n.prio-row {\n  display: grid; grid-template-columns: 30px 1fr 120px 92px; gap: 16px; align-items: center;\n  background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 10px; padding: 14px 18px;\n}\n.prio-row .rank { font-family: var(--serif); font-size: 22px; font-weight: 800; color: var(--accent); }\n.prio-row .what b { font-size: 13.5px; font-weight: 700; color: var(--rv-ink); }\n.prio-row .what span { display: block; font-size: 11.5px; color: var(--rv-ink-2); margin-top: 3px; line-height: 1.45; }\n.prio-row .eff { font-size: 10px; letter-spacing: 0.5px; }\n.prio-row .eff .k { color: var(--rv-ink-3); text-transform: uppercase; font-size: 8px; letter-spacing: 1px; }\n.prio-row .eff .v { color: var(--rv-ink); font-weight: 600; }\n.impact { display: flex; gap: 3px; }\n.impact i { width: 10px; height: 10px; border-radius: 2px; background: var(--rv-line-2); }\n.impact i.on { background: var(--accent); }\n\n/* foot */\n.foot { margin-top: 64px; padding-top: 26px; border-top: 1px solid var(--rv-line); text-align: center;\n  font-size: 11px; color: var(--rv-ink-3); line-height: 1.7; }\n.foot b { color: var(--rv-ink-2); }\n\n@media (max-width: 920px) {\n  .diag { grid-template-columns: 1fr; }\n  .ba { grid-template-columns: 1fr; gap: 28px; }\n  .ba-arrow { padding: 0; transform: rotate(90deg); }\n  .prio-row { grid-template-columns: 30px 1fr; }\n  .prio-row .eff, .prio-row .impact { display: none; }\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════\n   VISION — luckor, killer-apps, data-leverage\n   editorial-lager ovanpå spelkansle_review.css\n   ═══════════════════════════════════════════════════ */\n\n.hero.vision { padding-bottom: 36px; }\n.hero .tag-think {\n  display: inline-block; margin-top: 22px; font-size: 11px; font-style: italic;\n  font-family: var(--serif); color: var(--rv-ink-3); border-top: 1px solid var(--rv-line);\n  padding-top: 16px; max-width: 600px;\n}\n\n/* big thesis band */\n.thesis {\n  background: linear-gradient(180deg, #221d17, #1b1712);\n  border: 1px solid var(--rv-line-2); border-radius: 16px;\n  padding: 40px 42px; margin-top: 8px; text-align: center;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.thesis .tk { font-size: 10px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); }\n.thesis h2 {\n  font-family: var(--serif); font-size: 34px; font-weight: 700; line-height: 1.22;\n  margin-top: 16px; letter-spacing: -0.4px; max-width: 880px; margin-left: auto; margin-right: auto;\n}\n.thesis h2 em { font-style: italic; color: var(--accent); }\n.thesis p { font-size: 14px; color: var(--rv-ink-2); line-height: 1.65; margin-top: 18px; max-width: 680px; margin-left: auto; margin-right: auto; }\n\n/* generated → surfaced → felt ladder */\n.ladder { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; margin-top: 8px; border: 1px solid var(--rv-line); border-radius: 14px; overflow: hidden; }\n.lstep { padding: 22px 22px 24px; border-right: 1px solid var(--rv-line); }\n.lstep:last-child { border-right: none; }\n.lstep.g { background: rgba(90,154,74,0.05); }\n.lstep.s { background: rgba(196,168,106,0.05); }\n.lstep.f { background: rgba(176,80,64,0.06); }\n.lstep .ln { font-family: var(--serif); font-size: 38px; font-weight: 800; line-height: 1; }\n.lstep.g .ln { color: var(--success); }\n.lstep.s .ln { color: var(--warm); }\n.lstep.f .ln { color: var(--danger-text); }\n.lstep .lh { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 12px; color: var(--rv-ink); }\n.lstep .ld { font-size: 12px; color: var(--rv-ink-2); line-height: 1.55; margin-top: 8px; }\n.lstep .ld b { color: var(--rv-ink); font-weight: 600; }\n@media (max-width: 820px) { .ladder { grid-template-columns: 1fr; } .lstep { border-right: none; border-bottom: 1px solid var(--rv-line); } }\n\n/* killer-app header */\n.ka-head { display: flex; align-items: baseline; gap: 14px; margin: 8px 0 8px; }\n.ka-head .kn { font-family: var(--serif); font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: 1px; flex-shrink: 0; }\n.ka-head h3 { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.15; }\n.ka-sub { font-size: 13.5px; color: var(--rv-ink-2); line-height: 1.65; max-width: 800px; margin-bottom: 22px; }\n.ka-sub strong { color: var(--rv-ink); font-weight: 600; }\n.ka-sub code { font-family: var(--mono); font-size: 11.5px; color: var(--ice); }\n.ka-sub .c { color: var(--accent); font-weight: 600; }\n\n/* concept row: phone + idea */\n.concept { display: grid; grid-template-columns: 300px 1fr; gap: 40px; align-items: start; }\n.concept.flip { grid-template-columns: 1fr 300px; }\n.concept .cbody { padding-top: 4px; }\n.concept .cbody .now { font-size: 12.5px; color: var(--rv-ink-2); line-height: 1.6; }\n.concept .cbody .now b { color: var(--danger-text); font-weight: 600; }\n.concept .cnote { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }\n.concept .cn { display: flex; gap: 10px; font-size: 12.5px; line-height: 1.55; color: var(--rv-ink-2); }\n.concept .cn .ci { color: var(--success); flex-shrink: 0; font-weight: 700; }\n.concept .cn b { color: var(--rv-ink); font-weight: 600; }\n.concept .cn code { font-family: var(--mono); font-size: 10.5px; color: var(--ice); }\n.have { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--success); background: rgba(90,154,74,0.12); border: 1px solid rgba(90,154,74,0.3); border-radius: 99px; padding: 4px 11px; font-weight: 700; }\n.have.partial { color: var(--warm); background: rgba(196,168,106,0.12); border-color: rgba(196,168,106,0.3); }\n@media (max-width: 820px) { .concept, .concept.flip { grid-template-columns: 1fr; gap: 26px; } }\n\n/* callback beat (in-moment) */\n.cb {\n  position: relative; padding: 12px 14px 12px 16px; border-radius: 8px;\n  background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2);\n}\n.cb::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; border-radius:2px; background: var(--danger); }\n.cb .cbk { font-size: 7.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--danger-text); }\n.cb .cbt { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); margin-top: 5px; line-height: 1.3; }\n.cb .cbq { font-family: var(--serif); font-style: italic; font-size: 11px; color: var(--text-light-secondary); margin-top: 7px; line-height: 1.45; padding-left: 9px; border-left: 1px solid var(--rv-line); }\n\n/* domino chain */\n.domino { display: flex; flex-direction: column; gap: 0; }\n.dnode { display: flex; gap: 11px; align-items: flex-start; }\n.dnode .dt { flex: 1; padding: 8px 0; }\n.dnode .de { font-size: 13px; }\n.dnode .dlabel { font-size: 11.5px; color: var(--text-light); font-weight: 600; }\n.dnode .dsub { font-size: 9.5px; color: var(--text-muted); margin-top: 1px; font-family: var(--serif); font-style: italic; }\n.dconn { width: 13px; display: flex; justify-content: center; flex-shrink: 0; }\n.dconn .line { width: 2px; flex: 1; background: linear-gradient(180deg, var(--danger), var(--cold)); min-height: 14px; }\n.dnode .ddot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; margin-top: 9px; border: 2px solid var(--bg-portal); }\n\n/* timeline / arc spine */\n.spine { position: relative; padding-left: 22px; }\n.spine::before { content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background: var(--rv-line-2); }\n.snode { position: relative; padding: 7px 0; }\n.snode::before { content:''; position:absolute; left:-21px; top:11px; width:10px; height:10px; border-radius:50%; background: var(--accent); border:2px solid var(--bg-portal); }\n.snode.dim::before { background: var(--text-muted); }\n.snode .sy { font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }\n.snode .stx { font-family: var(--serif); font-size: 12px; color: var(--text-light); margin-top: 2px; line-height: 1.35; }\n.snode .stx em { color: var(--accent); font-style: italic; }\n\n/* leverage order */\n.lev { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 8px; }\n.lcard { background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 12px; padding: 18px 18px 16px; position: relative; }\n.lcard .lnum { font-family: var(--serif); font-size: 13px; font-weight: 800; color: var(--accent); }\n.lcard h4 { font-family: var(--serif); font-size: 16px; font-weight: 700; margin-top: 4px; }\n.lcard p { font-size: 12px; color: var(--rv-ink-2); line-height: 1.55; margin-top: 8px; }\n.lcard p b { color: var(--rv-ink); font-weight: 600; }\n.lcard.first { border-color: rgba(196,122,58,0.4); box-shadow: 0 0 0 1px rgba(196,122,58,0.16); }\n@media (max-width: 820px) { .lev { grid-template-columns: 1fr; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero vision\">\n  <div class=\"wrap\">\n    <p class=\"kick\">Fritt tänkande · luckor · killer-apps · datan<\u002Fp>\n    <h1>Spelet minns mer än det <em>låter dig känna<\u002Fem><\u002Fh1>\n    <p class=\"sub\">Jag läste hela domänen — 130+ tjänster, 30 entiteter. Det här är inte en yt-audit. Det är en speldesigners fria läsning av vad ni har byggt, var den verkliga potentialen ligger, och vad jag skulle jaga om det var mitt spel.<\u002Fp>\n    <p class=\"tag-think\">En ärlig första observation: ni har inte ett innehållsproblem. Ni har ett av de mest narrativt täta managerspel jag sett i kod. Frågan är inte \"vad saknas\" — det är \"varför känns inte allt ni redan genererar\".<\u002Fp>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ THESIS ═══════════════ -->\n<section class=\"sec\" style=\"padding-top:46px\">\n  <div class=\"wrap\">\n    <div class=\"thesis\">\n      <div class=\"tk\">Den stora läsningen<\u002Fdiv>\n      <h2>Ni har en <em>romanförfattares minne<\u002Fem> — men ni arkiverar det i flikar i stället för att säga det i ögonblicket.<\u002Fh2>\n      <p>Varje spelare har en <code style=\"font-family:var(--mono);font-size:13px\">narrativeLog<\u002Fcode>. Tränaren har karriärrekord, burnout-historik och namngivna <code style=\"font-family:var(--mono);font-size:13px\">coachRivalries<\u002Fcode> med h2h. Klubben har <code style=\"font-family:var(--mono);font-size:13px\">recentMoments<\u002Fcode>, eror, mecenater, en klack som ekar. Allt detta <em>finns<\u002Fem> — och mycket av det ytas till och med, i Tränare-fliken, i karriärsresan. Men det ligger som <strong>referensdata du slår upp<\u002Fstrong>, inte som <strong>minne spelet talar till dig<\u002Fstrong> när det betyder något. Depån är full. Den hälls bara aldrig tillbaka i ögonblicket.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 1 · GENERERAT/YTLAGT/KÄNT ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — ANVÄNDER NI DATAN OPTIMALT?<\u002Fdiv>\n      <h2>Tre nivåer — och var ni tappar den<\u002Fh2>\n      <p>\"Optimal dataanvändning\" är inte att generera mer. Ni genererar redan enormt. Det är att flytta data <span class=\"c\">uppför den här trappan<\u002Fspan> — från beräknad, till visad, till <em>känd<\u002Fem>. Ni är världsmästare på det första steget, bra på det andra, och lämnar det tredje nästan orört.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ladder\">\n      <div class=\"lstep g\">\n        <div class=\"ln\">130+<\u002Fdiv>\n        <div class=\"lh\">Genererat<\u002Fdiv>\n        <div class=\"ld\">Tjänster som skriver tillstånd varje omgång: rykten, skandaler, insändare, kafferum, journalister, mecenat-middagar, nationslag, domare, eror, ripple-effekter. <b>Extraordinärt. Detta är inte problemet.<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lstep s\">\n        <div class=\"ln\">~⅔<\u002Fdiv>\n        <div class=\"lh\">Ytlagt<\u002Fdiv>\n        <div class=\"ld\">Mycket når en yta — portalen, Tränare-fliken, karriärsresan, minnet. Men ofta som <b>en siffra eller en rad i en flik du måste söka upp<\u002Fb>. Datan syns. Den talar inte.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lstep f\">\n        <div class=\"ln\">sällan<\u002Fdiv>\n        <div class=\"lh\">Känt<\u002Fdiv>\n        <div class=\"ld\">Nästan inget <b>kallar tillbaka<\u002Fb>. Ögonblicket vet sällan vad som hänt förut. Rivaliteten du byggt, löftet du gav, svackan du tog dig igenom — spelet minns det, men påminner dig aldrig mitt i nästa beslut. <b>Här ligger all olevd potential.<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2 · KILLER-APP: CALLBACK ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div class=\"sec-num\">02 — KILLER-APP #1<\u002Fdiv><\u002Fdiv>\n    <div class=\"ka-head\"><span class=\"kn\">①<\u002Fspan><h3>Callback — den billigaste depån ni inte spenderar<\u002Fh3><\u002Fdiv>\n    <p class=\"ka-sub\">Den enskilt högsta hävstången i hela spelet. Ni har <code>coachRivalries<\u002Fcode> med h2h och personlighet, <code>narrativeLog<\u002Fcode> per spelare, <code>recentMoments<\u002Fcode>, <code>seasonSummaries<\u002Fcode>. Men inför en match säger portalen sällan <span class=\"c\">\"det här har hänt förut\"<\u002Fspan>. En enda återkopplad mening — \"Nordin har slagit dig tre raka\" — är värd tio nya händelser, för den får allt det andra att kännas <strong>ihågkommet<\u002Fstrong>. Minnet finns redan i datan; det behöver bara tala i ögonblicket.<\u002Fp>\n    <div class=\"concept\">\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">Hem · inför omg 12<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\">⚙<\u002Fdiv><\u002Fdiv>\n          <div class=\"body dark\" style=\"gap:9px\">\n            <div class=\"cb\">\n              <div class=\"cbk\">🎯 Gammal oavgjord räkning<\u002Fdiv>\n              <div class=\"cbt\">Bengt Nordin igen — han har slagit dig tre raka.<\u002Fdiv>\n              <div class=\"cbq\">\"Bandyn skriver sina egna historier. Vi får se.\" — Nordin, inför mötet<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"nmc\">\n              <div class=\"nmc-top\"><span class=\"nmc-tag\">🏒 NÄSTA MATCH<\u002Fspan><span class=\"nmc-home\">HEMMA<\u002Fspan><\u002Fdiv>\n              <div style=\"font-family:var(--serif);font-weight:700;font-size:12px;color:var(--text-light);margin-top:7px;text-align:center\">Forsbacka — Lesjöfors · lö 14:00<\u002Fdiv>\n              <div style=\"font-size:8px;color:var(--text-muted);text-align:center;margin-top:4px;font-family:var(--mono);letter-spacing:1px\">H2H I ÅR · 0 V · 0 O · 3 F<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"c-sharp c-dark\"><div class=\"lbl dark\">📊 TABELL<\u002Fdiv><div style=\"font-size:11px;color:var(--text-light-secondary);margin-top:3px;font-family:var(--serif)\">Ni möts på 4:e-platsen. Vinnaren går om.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cbody\">\n        <div class=\"now\"><b>Idag:<\u002Fb> rivaliteten lever i Tränare-fliken som \"3V 2O 4F\" — en siffra du slår upp. Inför matchen är den tyst. Du möter Lesjöfors som vilken motståndare som helst.<\u002Fdiv>\n        <div class=\"cnote\">\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Bron, inte ny data.<\u002Fb> <code>coachRivalries<\u002Fcode> + <code>generatePreMatchOpponentQuote<\u002Fcode> finns. Det som saknas är att <em>lyfta dem till portal-beatet<\u002Fem> inför mötet. En ny beat-typ i <code>portalBeatService<\u002Fcode> — inget nytt system.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Återanvänd överallt.<\u002Fb> Samma teknik: \"Senast Lundqvist mötte sin gamla klubb gjorde han två mål.\" \"Förra gången ni var i den här sitsen åkte ni ur.\" Callback är en <em>vana<\u002Fem>, inte en feature.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Det gör allt annat värt mer.<\u002Fb> Varje system du redan har får retroaktivt tyngd så fort ögonblicket minns det.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"have partial\">◐ Datan finns · bron saknas<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 3 · KILLER-APP: PROTAGONISTEN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div class=\"sec-num\">03 — KILLER-APP #2<\u002Fdiv><\u002Fdiv>\n    <div class=\"ka-head\"><span class=\"kn\">②<\u002Fspan><h3>Du är en statistiksida — inte en karaktär<\u002Fh3><\u002Fdiv>\n    <p class=\"ka-sub\">Tränare-fliken har ditt rekord, din burnout-kurva, dina rivaliteter. Allt korrekt — men det är en <strong>resultattavla<\u002Fstrong>, inte en <strong>berättelse<\u002Fstrong>. Spelarna har <code>narrativeLog<\u002Fcode> och en karriärsresa. Du, huvudpersonen, har ingen. Varför du kom till den här orten, nemesisen som följt dig, säsongen du nästan brann ut, löftet till styrelsen — det <span class=\"c\">borde vara spelets ryggrad<\u002Fspan> och är idag utspritt i tal. Det här är det mest underutnyttjade i hela spelet: <strong>spelaren själv.<\u002Fstrong><\u002Fp>\n    <div class=\"concept flip\">\n      <div class=\"cbody\">\n        <div class=\"now\"><b>Idag:<\u002Fb> \"62V 24O 44F · burnout 42 · rivaler: Nordin 3-2-4\". Sann data, noll berättelse. Din historia finns i fragmenten men aldrig som en tråd du kan läsa.<\u002Fdiv>\n        <div class=\"cnote\">\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>En tränarens berättelse-yta.<\u002Fb> Samma <code>narrativeLog<\u002Fcode>-mönster som spelarna har, fast för dig: ankomsten, nemesisen, nära-burnouten, eran du startade. <code>ManagerProfile<\u002Fcode> + <code>clubEra<\u002Fcode> + <code>recentMoments<\u002Fcode> bär redan stoffet.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Nemesisen som löpande tråd.<\u002Fb> En rival höjs från en h2h-rad till en <em>karaktär<\u002Fem> du jagar över säsonger — den som ledde din berättelse. Det är managerspelets mest underskattade krok.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Burnouten blir en båge, inte en mätare.<\u002Fb> Kurvan finns; gör den till kapitel — \"hösten du höll på att tappa det\" — så betyder vilan något.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"have partial\">◐ ManagerProfile finns · arcen saknas<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">J. STJÄRNE<\u002Fdiv><div class=\"gh-sub\">Tränarens berättelse<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\">⚙<\u002Fdiv><\u002Fdiv>\n          <div class=\"body dark\" style=\"gap:6px\">\n            <div style=\"text-align:center;padding:8px 0 4px\">\n              <div style=\"font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--text-light)\">\"Jag kom hit för att ingen annan ville.\"<\u002Fdiv>\n              <div style=\"font-size:8px;color:var(--text-muted);letter-spacing:1.5px;font-family:var(--mono);margin-top:5px\">FJÄRDE SÄSONGEN · FORSBACKA<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"spine\" style=\"margin-top:4px\">\n              <div class=\"snode dim\"><div class=\"sy\">Säsong 1 · ankomst<\u002Fdiv><div class=\"stx\">Tog över en klubb på fallrepet. Styrelsen ville ha topp 8.<\u002Fdiv><\u002Fdiv>\n              <div class=\"snode\"><div class=\"sy\">Säsong 2 · svackan<\u002Fdiv><div class=\"stx\">Tre raka förluster mot <em>Nordins Lesjöfors<\u002Fem>. Burnouten nådde 71. Du stannade.<\u002Fdiv><\u002Fdiv>\n              <div class=\"snode\"><div class=\"sy\">Säsong 3 · vändningen<\u002Fdiv><div class=\"stx\">Derbyt som vände bygden. <em>Eran skiftade<\u002Fem> — \"inte längre bara bandy för orten\".<\u002Fdiv><\u002Fdiv>\n              <div class=\"snode\"><div class=\"sy\">Nu<\u002Fdiv><div class=\"stx\">62 segrar in. Nordin leder er räkning 4-2. Det är inte avgjort.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 4 · KILLER-APP: LEGIBEL KONSEKVENS ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div class=\"sec-num\">04 — KILLER-APP #3<\u002Fdiv><\u002Fdiv>\n    <div class=\"ka-head\"><span class=\"kn\">③<\u002Fspan><h3>Konsekvensen beräknas — men syns aldrig som en kedja<\u002Fh3><\u002Fdiv>\n    <p class=\"ka-sub\"><code>rippleEffectService<\u002Fcode> är en juvel: en stjärna skadas → fanMood, community, sponsorhumör, klacken rör sig i kaskad. Men spelaren ser bara <strong>sluttillståndet<\u002Fstrong> — siffror som flyttat sig. Själva <span class=\"c\">dominokedjan<\u002Fspan> — det som får systemen att kännas levande och sammankopplade — är osynlig. Att visa orsakslinjen <em>en gång<\u002Fem>, när den fyrar, är skillnaden mellan \"siffror ändrades\" och \"min värld reagerade\".<\u002Fp>\n    <div class=\"concept\">\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">Spridningseffekt<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\">⚙<\u002Fdiv><\u002Fdiv>\n          <div class=\"body dark\" style=\"gap:4px;padding-top:14px\">\n            <div style=\"text-align:center;font-family:var(--serif);font-style:italic;font-size:12px;color:var(--text-light);padding-bottom:8px\">Lindholm bröt foten. Det stannade inte där.<\u002Fdiv>\n            <div class=\"domino\">\n              <div class=\"dnode\"><div class=\"ddot\" style=\"background:var(--danger)\"><\u002Fdiv><div class=\"dt\"><div class=\"dlabel\">Lindholm skadad — ute 8 veckor<\u002Fdiv><div class=\"dsub\">Lagets bästa back, mittpunkten i försvaret<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div class=\"dnode\"><div class=\"dconn\"><div class=\"line\"><\u002Fdiv><\u002Fdiv><div class=\"dt\" style=\"padding-top:0\"><\u002Fdiv><\u002Fdiv>\n              <div class=\"dnode\"><div class=\"ddot\" style=\"background:var(--accent)\"><\u002Fdiv><div class=\"dt\"><div class=\"dlabel\">Klacken tystnade — puls −6<\u002Fdiv><div class=\"dsub\">\"Utan honom bakåt är vi tunna\"<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div class=\"dnode\"><div class=\"dconn\"><div class=\"line\"><\u002Fdiv><\u002Fdiv><div class=\"dt\" style=\"padding-top:0\"><\u002Fdiv><\u002Fdiv>\n              <div class=\"dnode\"><div class=\"ddot\" style=\"background:var(--cold)\"><\u002Fdiv><div class=\"dt\"><div class=\"dlabel\">Mecenaten tvekar inför nästa möte<\u002Fdiv><div class=\"dsub\">Sponsorhumör −4 · \"vill se hur ni löser det\"<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cbody\">\n        <div class=\"now\"><b>Idag:<\u002Fb> de tre siffrorna rör sig i bakgrunden vid omgångsskifte. Du kanske märker att pulsen sjönk — men inte att det var <em>Lindholms fot<\u002Fem> som gjorde det. Orsak och verkan kopplas aldrig ihop för ögat.<\u002Fdiv>\n        <div class=\"cnote\">\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Visa kedjan en gång.<\u002Fb> När <code>applyRipples<\u002Fcode> fyrar, rendera orsakslinjen som ett litet \"därför hände det här\"-ögonblick — inte en permanent yta, en engångs-knuff.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Detta är vad \"systemen pratar med varandra\" betyder.<\u002Fb> Känslan av en levande värld kommer inte från fler system — den kommer från att <em>se<\u002Fem> dem röra vid varandra.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Knyter till puls/fanMood-nyansen.<\u002Fb> Om spelaren ser <em>varför<\u002Fem> en mätare rör sig slutar den kännas som en död siffra.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"have partial\">◐ Kaskaden beräknas · linjen visas ej<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 5 · KILLER-APP: GENERATIONSLOOPEN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div class=\"sec-num\">05 — KILLER-APP #4<\u002Fdiv><\u002Fdiv>\n    <div class=\"ka-head\"><span class=\"kn\">④<\u002Fspan><h3>Bågarna sluts i datan — men inte i känslan<\u002Fh3><\u002Fdiv>\n    <p class=\"ka-sub\">Här är den långsiktiga kroken som kan göra spelet till något man spelar i tio säsonger. Ni har alla delar: <code>youthIntake<\u002Fcode> → <code>mentorships<\u002Fcode> → <code>narrativeLog<\u002Fcode> → <code>retirement<\u002Fcode> → <code>era_shift<\u002Fcode>. Pojken du tog upp, lät en rutinare mentorera, som blev kapten, som en dag lägger av — och vars lärling nu mentorerar nästa. <span class=\"c\">Klubbens blodsband över tid.<\u002Fspan> Loopen sluter sig redan mekaniskt. Den firas bara aldrig som den dynasti den är.<\u002Fp>\n    <div class=\"concept flip\">\n      <div class=\"cbody\">\n        <div class=\"now\"><b>Idag:<\u002Fb> en spelare går i pension med en notis. Hans karriärsresa finns men försvinner med honom. Att han en gång mentorerades av en legend, och själv fostrade nästa kapten, kopplas aldrig ihop till en linje.<\u002Fdiv>\n        <div class=\"cnote\">\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Ett avskedskapitel som kallar tillbaka.<\u002Fb> När någon lägger av: hans <code>narrativeLog<\u002Fcode> som en sluten båge — debut, första målet, bindeln, lärlingen han fostrade. Inte en notis, ett eftermäle.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Blodsbandet synligt.<\u002Fb> \"Henriksson, mentorerad av Lundqvist (2026), mentorerar nu Norin.\" En generationskedja i Minnet — klubbens DNA, inte en spelarlista.<\u002Fspan><\u002Fdiv>\n          <div class=\"cn\"><span class=\"ci\">↑<\u002Fspan><span><b>Det är retention.<\u002Fb> Den här loopen är skälet att spela säsong 8. Gör den kännbar och ni har ett spel ingen lägger ifrån sig.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"have\">● Alla delar finns · loopen sluts redan<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">FORSBACKA IF<\u002Fdiv><div class=\"gh-sub\">Klubbens blodsband<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\">⚙<\u002Fdiv><\u002Fdiv>\n          <div class=\"body dark\" style=\"gap:0;padding-top:14px\">\n            <div class=\"spine\">\n              <div class=\"snode dim\"><div class=\"sy\">2019 · legenden<\u002Fdiv><div class=\"stx\">Sten Eriksson, 312 matcher. Mentorerade en ung mittfältare innan han la av.<\u002Fdiv><\u002Fdiv>\n              <div class=\"snode\"><div class=\"sy\">2026 · kaptenen<\u002Fdiv><div class=\"stx\"><em>Erik Lundqvist<\u002Fem> — den unge mittfältaren. Bär nu bindeln. Mentorerar Henriksson.<\u002Fdiv><\u002Fdiv>\n              <div class=\"snode dim\"><div class=\"sy\">2026 · lärlingen<\u002Fdiv><div class=\"stx\">Henriksson, 17. Växer i tystnad. Bär kanske bindeln 2033.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:center;font-family:var(--serif);font-style:italic;font-size:10.5px;color:var(--text-muted);margin-top:12px;padding:0 10px\">Tre generationer, en obruten linje. Det här är klubben.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 6 · ORTEN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">06 — DEN TYSTA KILLER-APPEN<\u002Fdiv>\n      <h2>Orten talar redan tillbaka — i utspridda röster<\u002Fh2>\n      <p>Insändare, klack-eko, kommun, funktionärscitat, kafferum, mecenat-middag. Ni har byggt en <span class=\"c\">plats som svarar<\u002Fspan> — och det, inte statistiken, är den känslomässiga kärnan i ett småorts-bandyspel. Men rösterna ligger i var sin kanal. Samlade till <em>en<\u002Fem> ortens röst över en säsong — bygden som märker, åldras, hoppas, gnäller — blir det spelets själ. Det här är ingen ny mekanik; det är en redaktionell aggregering av det ni redan skriver. Värt en egen genomgång om ni vill väcka den.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"sec-head\" style=\"margin-top:34px;margin-bottom:8px\">\n      <div class=\"sec-num\">SÅ ANVÄNDER NI DATAN OPTIMALT — HÄVSTÅNGSORDNING<\u002Fdiv>\n      <h2 style=\"font-size:24px\">Inte mer innehåll. Mer minne.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"lev\">\n      <div class=\"lcard first\">\n        <div class=\"lnum\">1<\u002Fdiv>\n        <h4>Callback före nytt<\u002Fh4>\n        <p>Innan en enda ny händelsekälla byggs: låt ögonblicket <b>referera det som hänt<\u002Fb>. Högsta hävstången, lägsta kostnaden — datan finns. Det får allt befintligt att kännas ihågkommet.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"lcard\">\n        <div class=\"lnum\">2<\u002Fdiv>\n        <h4>Aggregera spridda röster<\u002Fh4>\n        <p>Slå ihop de utspridda narrativa strömmarna till <b>kännbara röster<\u002Fb> — ortens röst, tränarens berättelse. Mindre fragmentering, mer karaktär. Samma data, samlad.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"lcard\">\n        <div class=\"lnum\">3<\u002Fdiv>\n        <h4>Slut bågarna synligt<\u002Fh4>\n        <p>Gör det osynligt avslutade <b>kännbart avslutat<\u002Fb> — avskedskapitlet, generationslinjen, kedjan som fyrade. Konsekvens och kontinuitet som man ser, inte bara beräknas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"foot\">\n      <b>Vision — luckor, killer-apps, data-leverage<\u002Fb> · 2026-06-22<br>\n      Tesen: <b>spelet minns mer än det låter dig känna.<\u002Fb> Ni har inte ett innehållsproblem — ni har ett callback-problem. Den billigaste depån ni inte spenderar är minnet ni redan genererar.<br>\n      Läst fritt över: <b>rippleEffectService · opponentManagerService · ManagerProfile · narrativeService · clubMemoryService · clubEraService · mentorship · retirement · insändare · klackEcho<\u002Fb> m.fl.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
