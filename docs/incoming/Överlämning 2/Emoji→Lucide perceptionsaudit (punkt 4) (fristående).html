document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b449f4dd-797a-451c-91c0-166ed6de265b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ═══════════════════════════════════════════════════════════\n   BANDY MANAGER — Design Tokens\n   \"Heritage Bandy\" palette. Warm stone/paper backgrounds,\n   copper accent, ice-blue cool, Georgia display + system body.\n   Source: bandy-manager/src/styles/global.css\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Backgrounds (light) ─────────────────────────── */\n  --bg:              #EDE8DF;  /* warm paper */\n  --bg-surface:      #FAF8F4;  /* card */\n  --bg-elevated:     #FFFFFF;\n\n  /* ── Backgrounds (dark / leather) ────────────────── */\n  --bg-dark:         #0E0D0B;\n  --bg-dark-surface: #1E1D19;\n  --bg-dark-elevated:#2C2A24;\n  --bg-leather:      #3D3A32;  /* header strips */\n\n  /* ── Portal (mörka dashboard-tokens) ─────────────── */\n  /* Sätts på documentElement av PortalScreen, tonas per säsongsfas. */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n\n  /* ── Scen (alias för Portal — förtydligar scen-kontext) ─ */\n  /* Används av ArrivalScene, BoardMeetingScene, CoffeeRoomScene m.fl. */\n  --bg-scene: var(--bg-portal);\n\n  /* ── Severity (journalist-relation, signaturer) ──── */\n  --cold: #4a6680;  /* kall blå — neg severity, cold_winter-signatur */\n  --warm: #8c6e3a;  /* varm guld — injury_curve, warm severity */\n\n  /* ── Seasonal skies (dashboard) ──────────────────── */\n  --bg-october:  linear-gradient(180deg, #E8E4DC 0%, #EDE8DF 100%);\n  --bg-november: linear-gradient(180deg, #D8D4CC 0%, #E8E4DC 100%);\n  --bg-december: linear-gradient(180deg, #F0ECE4 0%, #E8DCCC 100%);\n  --bg-january:  linear-gradient(180deg, #D0D4D8 0%, #E0E4E8 100%);\n  --bg-february: linear-gradient(180deg, #E8E4DC 0%, #F0ECE4 100%);\n  --bg-march:    linear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  --match-bg-cold:    #3D3228;\n  --match-bg-fog:     #2A3228;\n  --match-bg-wind:    #32301E;\n  --match-gold:       #D4B860;\n  --match-warn:       #E8A090;\n  --match-positive:   #A0C890;\n  --match-copper:     #D4A850;\n  --match-home-bg:    #F0EDE6;\n\n  /* ── Archetype (squad badges) ────────────────────── */\n  --arch-finisher:  #c0392b;\n  --arch-playmaker: #2563EB;\n  --arch-defensive: #1a5e3a;\n  --arch-twoway:    #5a2d7a;\n  --arch-reflexgk:  #8B6914;\n  --arch-posgk:     #7b5a14;\n  --arch-dribbler:  #1a5e8a;\n  --arch-corner:    #4a3a8a;\n  --arch-raw:       #2d6e2d;\n  --arch-default:   #1e4d8c;\n\n  /* ── Typography ──────────────────────────────────── */\n  --font-display: 'Georgia', 'Times New Roman', serif;\n  --font-body:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n\n  /* ── Shape ───────────────────────────────────────── */\n  --radius:    14px;   /* round cards (narrative) */\n  --radius-md:  8px;   /* sharp cards, buttons */\n  --radius-sm:  3px;\n\n  /* ── Layout (mobile 375–430px) ───────────────────── */\n  --bottom-nav-height: 60px;\n  --safe-bottom: env(safe-area-inset-bottom, 0px);\n\n  /* ── Elevation (soft, copper-tinted on primary) ─── */\n  --shadow-card:    0 1px 3px rgba(0,0,0,0.05);\n  --shadow-btn:     0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);\n  --shadow-primary: 0 3px 5px rgba(162,88,40,0.38);\n  --shadow-danger:  0 3px 10px rgba(176,80,64,0.40);\n  --shadow-menu:    0 4px 16px rgba(0,0,0,0.15);\n\n  /* ── Z-index scale ───────────────────────────────── */\n  --z-dropdown:    100;  /* @kind other */\n  --z-modal:       300;  /* @kind other */\n  --z-overlay:     400;  /* @kind other */\n  --z-interaction: 500;  /* @kind other */\n  --z-toast:       600;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SEMANTIC TYPE ROLES\n   ═══════════════════════════════════════════════════════════ */\n\n/* Display / numeric (Georgia) DE8DF;  /* warm paper */\n  --bg-surface:      #FAF8F4;  /* card */\n  --bg-elevated:     #FFFFFF;\n\n  /* ── Backgrounds (dark / leather) ────────────────── */\n  --bg-dark:         #0E0D0B;\n  --bg-dark-surface: #1E1D19;\n  --bg-dark-elevated:#2C2A24;\n  --bg-leather:      #3D3A32;  /* header strips */\n\n  /* ── Portal (mörka dashboard-tokens) ─────────────── */\n  /* Sätts på documentElement av PortalScreen, tonas per säsongsfas. */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n\n  /* ── Scen (alias för Portal — förtydligar scen-kontext) ─ */\n  /* Används av ArrivalScene, BoardMeetingScene, CoffeeRoomScene m.fl. */\n  --bg-scene: var(--bg-portal);\n\n  /* ── Severity (journalist-relation, signaturer) ──── */\n  --cold: #4a6680;  /* kall blå — neg severity, cold_winter-signatur */\n  --warm: #8c6e3a;  /* varm guld — injury_curve, warm severity */\n\n  /* ── Seasonal skies (dashboard) ──────────────────── */\n  --bg-october:  linear-gradient(180deg, #E8E4DC 0%, #EDE8DF 100%);\n  --bg-november: linear-gradient(180deg, #D8D4CC 0%, #E8E4DC 100%);\n  --bg-december: linear-gradient(180deg, #F0ECE4 0%, #E8DCCC 100%);\n  --bg-january:  linear-gradient(180deg, #D0D4D8 0%, #E0E4E8 100%);\n  --bg-february: linear-gradient(180deg, #E8E4DC 0%, #F0ECE4 100%);\n  --bg-march:    linear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  --match-bg-cold:    #3D3228;\n  --match-bg-fog:     #2A3228;\n  --match-bg-wind:    #32301E;\n  --match-gold:       #D4B860;\n  --match-warn:       #E8A090;\n  --match-positive:   #A0C890;\n  --match-copper:     #D4A850;\n  --match-home-bg:    #F0EDE6;\n\n  /* ── Archetype (squad badges) ────────────────────── */\n  --arch-finisher:  #c0392b;\n  --arch-playmaker: #2563EB;\n  --arch-defensive: #1a5e3a;\n  --arch-twoway:    #5a2d7a;\n  --arch-reflexgk:  #8B6914;\n  --arch-posgk:     #7b5a14;\n  --arch-dribbler:  #1a5e8a;\n  --arch-corner:    #4a3a8a;\n  --arch-raw:       #2d6e2d;\n  --arch-default:   #1e4d8c;\n\n  /* ── Typography ──────────────────────────────────── */\n  --font-display: 'Georgia', 'Times New Roman', serif;\n  --font-body:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n\n  /* ── Shape ───────────────────────────────────────── */\n  --radius:    14px;   /* round cards (narrative) */\n  --radius-md:  8px;   /* sharp cards, buttons */\n  --radius-sm:  3px;\n\n  /* ── Layout (mobile 375–430px) ───────────────────── */\n  --bottom-nav-height: 60px;\n  --safe-bottom: env(safe-area-inset-bottom, 0px);\n\n  /* ── Elevation (soft, copper-tinted on primary) ─── */\n  --shadow-card:    0 1px 3px rgba(0,0,0,0.05);\n  --shadow-btn:     0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);\n  --shadow-primary: 0 3px 5px rgba(162,88,40,0.38);\n  --shadow-danger:  0 3px 10px rgba(176,80,64,0.40);\n  --shadow-menu:    0 4px 16px rgba(0,0,0,0.15);\n\n  /* ── Z-index scale ───────────────────────────────── */\n  --z-dropdown:    100;  /* @kind other */\n  --z-modal:       300;  /* @kind other */\n  --z-overlay:     400;  /* @kind other */\n  --z-interaction: 500;  /* @kind other */\n  --z-toast:       600;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SEMANTIC TYPE ROLES\n   ═══════════════════════════════════════════════════════════ */\n\n/* Display / numeric (Georgia) — poäng, score, position */\n.h-display-xl { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; }\n.h-display-lg { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; }\n.h-display-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }\n.h-display-sm { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }\n\n/* Card titles (body, heavy) */\n.h-card     { font-family: var(--font-body); font-size: 14px; font-weight: 700; line-height: 1.3; }\n.h-card-sm  { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.3; }\n\n/* Body copy */\n.h-body     { font-family: var(--font-body); font-size: 12px; font-weight: 400; line-height: 1.45; color: var(--text-primary); }\n.h-body-sm  { font-family: var(--font-body); font-size: 11px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); }\n.h-body-xs  { font-family: var(--font-body); font-size: 10px; font-weight: 400; line-height: 1.45; color: var(--text-muted); }\n\n/* Section label — emoji + UPPERCASE letter-spaced */\n.h-label {\n  font-family: var(--font-body);\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin: 0 0 4px 0;\n}\n\n/* Quote / narrative (italic Georgia) */\n.h-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 12px;\n  color: var(--text-secondary);\n  line-height: 1.4;\n}\n\n/* CTA text — uppercase, letter-spaced */\n.h-cta {\n  font-family: var(--font-body);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SCEN-TYPOGRAFI (mörk bakgrund — ArrivalScene m.fl.)\n   Etablerad 2026-05-08 efter scenrevision (handover från Opus).\n   Komplement till .h-* som är dagsljus-optimerade.\n   ═══════════════════════════════════════════════════════════ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body {\n  background: var(--bg);\n  color: var(--text-primary);\n  font-family: var(--font-body);\n  font-size: 13px;\n  line-height: 1.4;\n  -webkit-font-smoothing: antialiased;\n}\n\nbody {\n  padding: 18px;\n  width: 700px;\n  min-height: 150px;\n  overflow: hidden;\n}\n\n.row { display: flex; gap: 10px; align-items: stretch; }\n.col { display: flex; flex-direction: column; gap: 10px; }\n.grow { flex: 1; min-width: 0; }\n.mono { font-variant-numeric: tabular-nums; font-feature-settings: \"tnum\"; }\n\n.swatch {\n  flex: 1;\n  min-width: 0;\n  border-radius: 8px;\n  padding: 10px 12px;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  min-height: 88px;\n  border: 1px solid rgba(0,0,0,0.06);\n  position: relative;\n  overflow: hidden;\n}\n\n.swatch .name {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.3px;\n  text-transform: uppercase;\n}\n.swatch .hex {\n  font-family: var(--font-display);\n  font-size: 13px;\n  font-weight: 700;\n  font-variant-numeric: tabular-nums;\n  opacity: 0.85;\n}\n.swatch .var {\n  font-size: 9.5px;\n  opacity: 0.7;\n  font-variant-numeric: tabular-nums;\n}\n\n/* Light-text swatch (for dark bg) */\n.swatch.dark { color: var(--text-light); }\n.swatch.dark .var { color: rgba(245,241,235,0.6); }\n\n/* Sharp card primitive */\n.card-sharp {\n  border-radius: 8px;\n  background: var(--bg-surface);\n  border: 1px solid var(--border);\n  box-shadow: var(--shadow-card);\n}\n.card-round {\n  border-radius: 14px;\n  background: var(--bg-surface);\n  border: 1px solid var(--border);\n  box-shadow: var(--shadow-card);\n}\n\n/* Section label */\n.label8 {\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  font-family: var(--font-body);\n  margin: 0;\n}\n\n/* Buttons */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 5px;\n  border-radius: 8px;\n  padding: 7px 14px;\n  font-size: 12px;\n  font-weight: 600;\n  font-family: var(--font-body);\n  cursor: pointer;\n  box-shadow: var(--shadow-btn);\n  transition: box-shadow 0.15s, transform 0.1s;\n  border: none;\n  color: inherit;\n}\n.btn-primary {\n  background:\n    linear-gradient(to bottom, rgba(255,255,255,0.35) 0%, transparent 50%),\n    linear-gradient(to bottom, #DD9555, #8B4820);\n  color: #fff;\n  box-shadow: var(--shadow-primary);\n}\n.btn-secondary {\n  background: var(--accent);\n  color: #fff;\n  box-shadow: 0 2px 6px rgba(196,122,58,0.25);\n}\n.btn-ghost {\n  background: var(--bg-surface);\n  border: 1px solid var(--border-dark);\n  color: var(--text-secondary);\n}\n.btn-outline {\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  color: var(--accent-dark);\n}\n.btn-cta {\n  width: 100%;\n  padding: 14px 16px;\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n  border-radius: 12px;\n}\n\n/* Tags */\n.tag {\n  display: inline-flex; align-items: center; gap: 3px;\n  border-radius: 99px; padding: 2px 8px;\n  font-size: 9px; font-weight: 600;\n  letter-spacing: 0.4px; text-transform: uppercase;\n  white-space: nowrap;\n}\n.tag-fill    { background: var(--accent); color: #fff; }\n.tag-copper  { background: transparent; border: 1px solid var(--accent); color: var(--accent-dark); }\n.tag-outline { background: transparent; border: 1px solid var(--border-dark); color: var(--text-secondary); }\n.tag-green   { background: rgba(90,154,74,0.12); border: 1px solid rgba(90,154,74,0.3); color: var(--success-light); }\n.tag-red     { background: rgba(176,80,64,0.10); border: 1px solid rgba(176,80,64,0.25); color: var(--danger-text); }\n.tag-ice     { background: rgba(126,179,212,0.12); border: 1px solid rgba(126,179,212,0.3); color: var(--ice-dark); }\n.tag-ghost   { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }\n.tag-dark    { background: rgba(255,255,255,0.1); color: var(--text-light-secondary); }\n\n/* Chevron nav button */\n.chev {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;\n  background: transparent; border: 1px solid var(--border);\n  color: var(--accent); font-size: 11px; line-height: 1;\n  cursor: pointer;\n}\n\n/* Gemensam style för \"Skärmar i drift\"-kort\n   Importeras efter _base.css.\n   Dessa stilar är kopierade från docs/mockups/design-mockups-2026-04-22.html\n   för att ge en trogen representation av produktionsappen.\n   FÅR INTE ÄNDRAS utan att originalappen ändras samtidigt. */\n\n.screen-card {\n  background: #2a2824;\n  padding: 16px;\n  min-height: 560px;\n}\n\n.screen-frame {\n  background: #EDE8DF;\n  border-radius: 12px;\n  overflow: hidden;\n  box-shadow: 0 6px 16px rgba(0,0,0,0.25);\n  max-width: 375px;\n  margin: 0 auto 12px;\n}\n\n.screen-label {\n  background: #1f1d19;\n  color: #F5F1EB;\n  padding: 10px 16px;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  border-bottom: 1px solid #8B4820;\n}\n.screen-label .sub {\n  display: block;\n  margin-top: 2px;\n  font-size: 9px;\n  color: #C4BAA8;\n  letter-spacing: 1px;\n  font-weight: 400;\n  text-transform: none;\n  font-style: italic;\n}\n\n/* Match-shell (mörk bakgrund för interaktioner) */\n.match-bg {\n  background: #3D3520;\n  padding: 8px 12px;\n}\n\n/* Scoreboard (LED) */\n.scoreboard {\n  background: #0A0A0A;\n  border-radius: 8px;\n  border: 3px solid #1A1A1A;\n  box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);\n  padding: 12px 16px;\n  margin: 8px 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 6px;\n}\n.scoreboard-row {\n  display: flex; align-items: center; gap: 8px;\n  justify-content: center; width: 100%;\n}\n.scoreboard-team { flex: 1; text-align: center; }\n.scoreboard-team-label {\n  font-family: 'Courier New', monospace;\n  font-weight: 700; font-size: 13px;\n  color: rgba(255,255,255,0.85);\n  letter-spacing: 1.5px;\n  margin-bottom: 2px;\n  text-transform: uppercase;\n}\n.scoreboard-team-label .hg { color: #CCFF00; font-size: 12px; }\n.scoreboard-score {\n  display: block;\n  font-family: 'Courier New', monospace;\n  font-weight: 900; font-size: 56px;\n  color: #FF1A1A;\n  text-shadow: 0 0 10px rgba(255,26,26,0.6), 0 0 20px rgba(255,26,26,0.3);\n  line-height: 1; letter-spacing: 4px;\n}\n.scoreboard-score.flash {\n  color: #FF9900;\n  text-shadow: 0 0 20px rgba(255,153,0,0.8), 0 0 40px rgba(255,153,0,0.4);\n}\n.scoreboard-dash {\n  color: #FF1A1A; font-size: 28px; font-weight: 900; opacity: 0.7;\n  font-family: 'Courier New', monospace; line-height: 1;\n}\n.scoreboard-time {\n  font-family: 'Courier New', monospace;\n  font-weight: 700; font-size: 22px;\n  color: #CCFF00;\n  text-shadow: 0 0 8px rgba(204,255,0,0.5);\n  line-height: 1;\n}\n.scoreboard-timezone { display: flex; flex-direction: column; align-items: center; gap: 4px; }\n.rivalry-pill {\n  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;\n  border-radius: 99px;\n  background: rgba(220,50,30,0.2);\n  border: 1px solid rgba(220,100,30,0.4);\n  font-size: 10px; font-weight: 700; color: #FF6644;\n  font-family: 'Courier New', monospace;\n}\n.weather-line { font-size: 13px; color: rgba(255,255,255,0.6); font-family: 'Courier New', monospace; }\n.arena-line {\n  font-size: 10px; color: #A89878; font-family: 'Courier New', monospace;\n  letter-spacing: 1.5px; text-shadow: 0 0 4px rgba(168,152,120,0.3);\n}\n.susp-row {\n  display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 0 0;\n  font-size: 11px; font-weight: 700; font-family: 'Courier New', monospace; color: #FF6644;\n}\n.susp-row > div { flex: 1; text-align: center; }\n.susp-row .gap { width: 60px; flex: none; }\n\n/* Commentary */\n.commentary { background: rgba(196,122,58,0.04); border-radius: 6px; padding: 8px 0; }\n.commentary-row { display: flex; align-items: flex-start; padding: 8px 16px; gap: 8px; }\n.commentary-row.away { flex-direction: row-reverse; text-align: right; }\n.commentary-min { font-size: 12px; color: #8A857A; min-width: 28px; padding-top: 1px; flex-shrink: 0; }\n.commentary-icon { font-size: 14px; flex-shrink: 0; }\n.commentary-text { font-size: 13px; color: #6B6760; line-height: 1.4; }\n.commentary-row.goal { background: rgba(196,122,58,0.12); border-left: 3px solid #C47A3A; padding-left: 12px; }\n.commentary-row.goal .commentary-text { font-size: 14px; font-weight: 600; color: #C47A3A; }\n.commentary-row.goal.away { border-left: none; border-right: 3px solid #C47A3A; padding-left: 16px; padding-right: 12px; }\n.commentary-row.susp { border-left: 3px solid #B05040; }\n.commentary-row.susp .commentary-text { color: #B05040; font-weight: 500; }\n.commentary-row.corner { border-left: 3px solid rgba(196,122,58,0.4); }\n.commentary-row.corner .commentary-text { color: #1A1A18; font-weight: 500; }\n.commentary-row.derby { border-left: 3px solid rgba(220,80,30,0.7); padding-left: 8px; }\n.commentary-row.atmosphere { border-left: 1px dashed rgba(140,190,220,0.5); }\n.commentary-row.atmosphere .commentary-text { color: #8A857A; font-style: italic; }\n.commentary-row.atmosphere .commentary-min { visibility: hidden; }\n.commentary-row.tactical { border-left: 2px solid rgba(140,190,220,0.6); }\n.commentary-row.tactical .commentary-text { color: #6B6760; }\n.commentary-row.sub { border-left: 3px solid rgba(196,122,58,0.35); padding: 6px 16px; }\n.commentary-row.sub .commentary-text { color: #C47A3A; font-size: 13px; }\n\n/* Interact shell */\n.interact-shell {\n  background: #0E0D0B;\n  border-radius: 12px;\n  padding: 16px;\n  border: 1.5px solid rgba(196,122,58,0.3);\n  box-shadow: 0 8px 24px rgba(0,0,0,0.4);\n}\n.interact-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }\n.interact-title { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #C47A3A; }\n.interact-timer { font-size: 12px; font-weight: 700; color: #C47A3A; font-family: Georgia, serif; }\n.timer-bar { height: 3px; background: #DDD7CC; border-radius: 2px; margin-bottom: 10px; overflow: hidden; }\n.timer-bar-fill { height: 100%; width: 70%; background: #C47A3A; border-radius: 2px; }\n.interact-stats {\n  display: flex; align-items: center; gap: 8px; padding: 6px 8px;\n  background: #1E1D19; border-radius: 4px; margin-bottom: 10px;\n}\n.interact-stats .name { font-size: 12px; font-weight: 700; color: #F5F1EB; }\n.interact-stats .sub { font-size: 10px; color: #C4BAA8; margin-left: auto; }\n.interact-pitch { border-radius: 6px; overflow: hidden; margin-bottom: 8px; display: block; width: 100%; }\n.coach-tip {\n  display: flex; align-items: center; gap: 8px; padding: 8px 10px;\n  background: rgba(196,122,58,0.08); border-radius: 6px; margin-bottom: 8px;\n  border: 1px solid rgba(196,122,58,0.2);\n}\n.coach-avatar {\n  width: 22px; height: 22px; border-radius: 50%; background: #A25828;\n  display: flex; align-items: center; justify-content: center; flex-shrink: 0;\n}\n.coach-avatar span { color: #fff; font-size: 9px; font-weight: 700; }\n.coach-quote { font-family: Georgia, serif; font-size: 11px; font-style: italic; color: #C4BAA8; flex: 1; }\n.interact-choices { display: flex; gap: 5px; margin-bottom: 6px; }\n.interact-choice {\n  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;\n  padding: 8px 4px; border-radius: 8px;\n  border: 1.5px solid rgba(196,122,58,0.25);\n  background: #1E1D19; cursor: pointer;\n}\n.interact-choice.active { border-color: #C47A3A; background: #2C2A24; }\n.interact-choice .emo { font-size: 16px; }\n.interact-choice .lbl { color: #F5F1EB; font-size: 11px; font-weight: 600; }\n.interact-choice .rate { color: #C4BAA8; font-size: 10px; font-weight: 700; }\n.interact-choice.active .rate { color: #C47A3A; }\n\n.btn-big {\n  width: 100%; padding: 10px; margin-top: 6px;\n  background: linear-gradient(135deg, #A25828, #8B4820);\n  color: #F5F1EB; border: none; border-radius: 8px;\n  font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;\n  cursor: pointer;\n}\n.btn-big.danger { background: #B05040; }\n\n/* Förändringsnotis (på varje kort, längst ner) */\n.change-notice {\n  background: #FFF7EC;\n  border: 1px dashed #C47A3A;\n  border-radius: 6px;\n  padding: 10px 12px;\n  margin: 12px 12px 4px;\n  font-size: 11px;\n  color: #6B4020;\n  line-height: 1.5;\n  max-width: calc(375px - 24px);\n  margin-left: auto;\n  margin-right: auto;\n}\n.change-notice strong { color: #8B4820; font-weight: 700; letter-spacing: 0.5px; }\n.change-notice .phase {\n  display: inline-block;\n  background: #C47A3A; color: #fff;\n  padding: 1px 6px; border-radius: 3px;\n  font-size: 9px; font-weight: 700; letter-spacing: 1px;\n  margin-right: 6px;\n}\n.change-notice ul { margin: 6px 0 0 0; padding-left: 16px; }\n.change-notice li { margin-bottom: 2px; }\n\n.current-state-badge {\n  display: inline-block;\n  background: #6B6760;\n  color: #fff;\n  font-size: 8px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n  padding: 2px 7px;\n  border-radius: 3px;\n  margin-left: 6px;\n}\n\n<\u002Fstyle>\n<script src=\"6c8a2312-327e-4c0c-84e6-dbdbbe64784f\"><\u002Fscript>\n<script src=\"c2fec163-e050-4c8f-8938-9ee3597de0e0\"><\u002Fscript>\n\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; height: auto !important; overflow: visible !important; overflow-y: auto !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#EDE8DF; padding:0 0 80px; font-family:system-ui,-apple-system,sans-serif; color:#1A1A18;\">\n\n  <div style=\"background:#0E0D0B; border-bottom:2px solid #C47A3A; padding:22px 32px 20px;\">\n    <div style=\"max-width:1180px; margin:0 auto;\">\n      <div style=\"font-family:'Georgia',serif; font-size:8px; letter-spacing:2px; color:#8A857A; text-transform:uppercase;\">DESIGN-KÖ 2026-07-02 · PUNKT 4<\u002Fdiv>\n      <h1 style=\"font-family:'Georgia',serif; font-weight:400; color:#F5F1EB; font-size:30px; margin:8px 0 4px; letter-spacing:-0.3px;\">Emoji→Lucide — perceptionsaudit<\u002Fh1>\n      <div style=\"font-family:ui-monospace,'Courier New',monospace; font-size:11px; color:#C47A3A; letter-spacing:0.5px;\">stroke-konsekvens · emoji-gräns (2026-06-11) · severity-dots · ceremoni-heron<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1180px; margin:0 auto; padding:24px 32px 0;\">\n\n    <!-- Method + summary -->\n    <div style=\"display:flex; flex-wrap:wrap; gap:16px; margin-bottom:26px;\">\n      <div style=\"flex:1 1 420px; background:#FAF8F4; border:1px solid #DDD7CC; border-radius:8px; padding:14px 16px;\">\n        <div style=\"font-family:ui-monospace,monospace; font-size:8px; letter-spacing:2px; color:#C47A3A; text-transform:uppercase; margin-bottom:8px;\">METOD<\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.6; color:#3D3A32;\">Perceptionsaudit av ikon-lagret mot den ratificerade emoji/Lucide-gränsen (2026-06-11): <b>emoji = domänkategorier i sektionsetiketter på översiktsytor<\u002Fb>, <b>Lucide = chrome<\u002Fb> (knappar, tabbar, selektorer, status), <b>severity = CSS-dots i token-färg, aldrig 🔴🟡⚪<\u002Fb>. Kanon för stroke är BottomNav: <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">1.8 inaktiv / 2.2 aktiv<\u002Fspan>. Källverifierat mot <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">src/presentation<\u002Fspan>. Regel 6: VEM/VAD per rad.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 300px; background:#0E0D0B; border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"font-family:ui-monospace,monospace; font-size:8px; letter-spacing:2px; color:#8A857A; text-transform:uppercase; margin-bottom:10px;\">UTFALL — 7 PUNKTER<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:7px; font-family:ui-monospace,monospace; font-size:11px; color:#F5F1EB;\">\n          <div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5A9A4A;display:inline-block;\"><\u002Fspan>2 verifierade (pass)<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#B05040;display:inline-block;\"><\u002Fspan>1 systemiskt (alla ikoner)<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#C47A3A;display:inline-block;\"><\u002Fspan>3 fix + 1 städ (död kod)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- FIGUR: stroke jämförelse -->\n    <div style=\"font-family:ui-monospace,monospace; font-size:8px; letter-spacing:2px; color:#C47A3A; text-transform:uppercase; margin-bottom:12px;\">FIGUR · STROKE-JÄMFÖRELSE (samma Lucide-ikoner)<\u002Fdiv>\n    <div style=\"display:flex; flex-wrap:wrap; gap:14px; margin-bottom:12px;\">\n      <div style=\"flex:1 1 240px; background:#FAF8F4; border:1px solid #DDD7CC; border-radius:8px; padding:16px; text-align:center;\">\n        <div style=\"display:flex; justify-content:center; gap:16px; margin-bottom:12px; color:#1A1A18;\" data-stroke=\"1.8\">\n          <i data-lucide=\"users\"><\u002Fi><i data-lucide=\"swords\"><\u002Fi><i data-lucide=\"heart-pulse\"><\u002Fi><i data-lucide=\"graduation-cap\"><\u002Fi>\n        <\u002Fdiv>\n        <div style=\"font-family:ui-monospace,monospace; font-size:11px; font-weight:700; color:#5A9A4A;\">1.8 — KANON<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,monospace; font-size:9px; color:#8A857A; margin-top:3px;\">BottomNav inaktiv · det vi vill ha<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 240px; background:#FAF8F4; border:1px solid #B05040; border-radius:8px; padding:16px; text-align:center;\">\n        <div style=\"display:flex; justify-content:center; gap:16px; margin-bottom:12px; color:#1A1A18;\" data-stroke=\"2\">\n          <i data-lucide=\"users\"><\u002Fi><i data-lucide=\"swords\"><\u002Fi><i data-lucide=\"heart-pulse\"><\u002Fi><i data-lucide=\"graduation-cap\"><\u002Fi>\n        <\u002Fdiv>\n        <div style=\"font-family:ui-monospace,monospace; font-size:11px; font-weight:700; color:#B05040;\">2.0 — NUVARANDE (default)<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,monospace; font-size:9px; color:#8A857A; margin-top:3px;\">det svepet ärver idag · tyngre<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 240px; background:#FAF8F4; border:1px solid #DDD7CC; border-radius:8px; padding:16px; text-align:center;\">\n        <div style=\"display:flex; justify-content:center; gap:16px; margin-bottom:12px; color:#C47A3A;\" data-stroke=\"1.5\">\n          <i data-lucide=\"trophy\"><\u002Fi><i data-lucide=\"medal\"><\u002Fi><i data-lucide=\"crown\"><\u002Fi><i data-lucide=\"award\"><\u002Fi>\n        <\u002Fdiv>\n        <div style=\"font-family:ui-monospace,monospace; font-size:11px; font-weight:700; color:#A25828;\">1.5 — CEREMONI-HERON<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,monospace; font-size:9px; color:#8A857A; margin-top:3px;\">konsekvent, men odokumenterad tier<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:ui-monospace,monospace; font-size:9px; color:#8A857A; margin-bottom:26px; line-height:1.6;\">Vid små storlekar (8–13px) syns skillnaden 1.8↔2.0 tydligast — 2.0 blir kladdig och tung mot den lätta pappersytan. Ceremoni-heron (56–80px) klarar 1.5 för att de är stora.<\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:32px; align-items:flex-start;\">\n      <div style=\"flex:1 1 100%;\">\n\n        <!-- STROKE -->\n        <div style=\"font-family:ui-monospace,monospace; font-size:8px; letter-spacing:2px; color:#C47A3A; text-transform:uppercase; margin:4px 0 12px;\">STROKE-KONSEKVENS<\u002Fdiv>\n\n        <div style=\"background:#FAF8F4; border:1px solid #DDD7CC; border-left:3px solid #B05040; border-radius:8px; padding:13px 16px; margin-bottom:10px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#B05040;\"><\u002Fspan><span style=\"font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:#B05040; font-weight:700;\">N-1 · hela svepet ärver Lucide-default 2.0, mot kanon 1.8 — SYSTEMISKT<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.55; color:#3D3A32;\">BottomNav sätter <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">strokeWidth={'{'}isActive ? 2.2 : 1.8{'}'}<\u002Fspan> — det är kanon. <b>Ingen annan yta anger strokeWidth<\u002Fb>, så alla ärver Lucides default <b>2.0<\u002Fb>: PlayerCards 7 funktionsikoner, Inbox-kategorierna, MatchControls, LineupStep, StartStep, PortalScreen, KlubbpärmOverlay och Granska-tabbarna. Chromet är alltså tyngre överallt utom i nav-baren — och skillnaden syns mest vid 8–13px.<\u002Fp>\n          <div style=\"display:flex; align-items:flex-start; gap:8px; font-family:ui-monospace,monospace; font-size:10px;\"><span style=\"background:#B05040; color:#F5F1EB; padding:2px 6px; border-radius:3px;\">→ CODE<\u002Fspan><span style=\"color:#6B6760; line-height:1.5; padding-top:2px;\">Sätt <span style=\"color:#A25828;\">strokeWidth={'{'}1.8{'}'}<\u002Fspan> på alla chrome-ikoner. Renast: en liten wrapper <span style=\"color:#A25828;\">&lt;Icon/&gt;<\u002Fspan> med default 1.8 (aktiv 2.2) så defaulten aldrig läcker igen. Design levererar tier-tabellen nedan att koda mot.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#FAF8F4; border:1px solid #DDD7CC; border-left:3px solid #C47A3A; border-radius:8px; padding:13px 16px; margin-bottom:10px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#C47A3A;\"><\u002Fspan><span style=\"font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:#A25828; font-weight:700;\">N-2 · PlayerCards 7 knappikoner: size 13 + stroke 2.0<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.55; color:#3D3A32;\">De sju ikonerna i spelarkortets åtgärdsrad kör <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">size={'{'}13{'}'}<\u002Fspan> utan strokeWidth. 13px är ok inline mot 11px-texten, men 2.0-stroken vid 13px blir visuellt tung bredvid den lätta etikett-typografin.<\u002Fp>\n          <div style=\"display:flex; align-items:flex-start; gap:8px; font-family:ui-monospace,monospace; font-size:10px;\"><span style=\"background:#3D3A32; color:#F5F1EB; padding:2px 6px; border-radius:3px;\">→ CODE<\u002Fspan><span style=\"color:#6B6760; line-height:1.5; padding-top:2px;\">Ingår i N-1-svepet: <span style=\"color:#A25828;\">strokeWidth={'{'}1.8{'}'}<\u002Fspan>. Behåll size 13.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#FAF8F4; border:1px solid #DDD7CC; border-left:3px solid #C47A3A; border-radius:8px; padding:13px 16px; margin-bottom:10px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#C47A3A;\"><\u002Fspan><span style=\"font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:#A25828; font-weight:700;\">N-3 · GameHeader-chromet inte ens 1.8-enhetligt internt<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.55; color:#3D3A32;\">I headern kör <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">BookOpen<\u002Fspan> (spelguide) och <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">Settings<\u002Fspan> med <b>strokeWidth 2<\u002Fb>, men klockan (<span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">Bell<\u002Fspan>) med <b>1.8<\u002Fb>. Tre ikoner på samma 44px-rad, två olika strokes.<\u002Fp>\n          <div style=\"display:flex; align-items:flex-start; gap:8px; font-family:ui-monospace,monospace; font-size:10px;\"><span style=\"background:#3D3A32; color:#F5F1EB; padding:2px 6px; border-radius:3px;\">→ CODE<\u002Fspan><span style=\"color:#6B6760; line-height:1.5; padding-top:2px;\">Sätt alla tre till 1.8.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#FAF8F4; border:1px solid #DDD7CC; border-left:3px solid #C47A3A; border-radius:8px; padding:13px 16px; margin-bottom:24px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#C47A3A;\"><\u002Fspan><span style=\"font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:#A25828; font-weight:700;\">N-4 · Granska-tabbarna följer inte BottomNavs aktiv/inaktiv-mönster<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.55; color:#3D3A32;\">Granska-skärmens tabbar renderar <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">size 18<\u002Fspan> men fast stroke 2.0 för både aktiv och inaktiv. BottomNav — samma sorts tabbrad — använder 1.8/2.2 för att markera aktiv flik. Tabbarna borde dela mönstret.<\u002Fp>\n          <div style=\"display:flex; align-items:flex-start; gap:8px; font-family:ui-monospace,monospace; font-size:10px;\"><span style=\"background:#3D3A32; color:#F5F1EB; padding:2px 6px; border-radius:3px;\">→ CODE<\u002Fspan><span style=\"color:#6B6760; line-height:1.5; padding-top:2px;\">Applicera 1.8/2.2 aktiv-mönstret på Granska-tabbarna (samma helper som N-1-wrappern).<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- TIER-TABELL -->\n        <div style=\"font-family:ui-monospace,monospace; font-size:8px; letter-spacing:2px; color:#C47A3A; text-transform:uppercase; margin:4px 0 12px;\">FÖRESLAGEN STROKE-TIER (design levererar, Code kodar mot)<\u002Fdiv>\n        <div style=\"background:#0E0D0B; border-radius:8px; padding:4px 0; margin-bottom:24px; overflow:hidden;\">\n          <div style=\"display:flex; padding:10px 16px; font-family:ui-monospace,monospace; font-size:8px; letter-spacing:1.5px; color:#8A857A; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.08);\">\n            <span style=\"flex:0 0 90px;\">STROKE<\u002Fspan><span style=\"flex:1;\">ANVÄNDNING<\u002Fspan><span style=\"flex:0 0 130px;\">STATUS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; padding:11px 16px; font-size:12px; color:#F5F1EB; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05);\">\n            <span style=\"flex:0 0 90px; font-family:ui-monospace,monospace; font-weight:700; color:#5A9A4A;\">1.8<\u002Fspan><span style=\"flex:1; color:#C4BAA8;\">Alla chrome-ikoner i vila (nav, header, tabbar, kortknappar, selektorer)<\u002Fspan><span style=\"flex:0 0 130px; font-family:ui-monospace,monospace; font-size:9px; color:#5A9A4A;\">RATIFICERAD<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; padding:11px 16px; font-size:12px; color:#F5F1EB; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05);\">\n            <span style=\"flex:0 0 90px; font-family:ui-monospace,monospace; font-weight:700; color:#C47A3A;\">2.2<\u002Fspan><span style=\"flex:1; color:#C4BAA8;\">Aktiv/vald tabb eller selektor (markör)<\u002Fspan><span style=\"flex:0 0 130px; font-family:ui-monospace,monospace; font-size:9px; color:#5A9A4A;\">RATIFICERAD<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; padding:11px 16px; font-size:12px; color:#F5F1EB; align-items:center;\">\n            <span style=\"flex:0 0 90px; font-family:ui-monospace,monospace; font-weight:700; color:#7EB3D4;\">1.5<\u002Fspan><span style=\"flex:1; color:#C4BAA8;\">Ceremoni-heron, stora format 56–80px (Trophy, Medal, Crown, Award)<\u002Fspan><span style=\"flex:0 0 130px; font-family:ui-monospace,monospace; font-size:9px; color:#C47A3A;\">FÖRESLÅS RATIFICERAS<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- EMOJI / SEVERITY -->\n        <div style=\"font-family:ui-monospace,monospace; font-size:8px; letter-spacing:2px; color:#C47A3A; text-transform:uppercase; margin:4px 0 12px;\">EMOJI-GRÄNS + SEVERITY + HERON<\u002Fdiv>\n\n        <div style=\"background:#FAF8F4; border:1px solid #DDD7CC; border-left:3px solid #5A9A4A; border-radius:8px; padding:13px 16px; margin-bottom:10px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5A9A4A;\"><\u002Fspan><span style=\"font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:#5A9A4A; font-weight:700;\">PASS · inga semafor-emoji, severity är CSS/Lucide i token-färg<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#3D3A32;\">Svepet hittar <b>inga<\u002Fb> renderade 🔴🟡🟢⚪ i UI. Severity görs korrekt som CSS-dots respektive Lucide <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">Circle fill<\u002Fspan> i token-färg (transfers.css, TransfersScreen, OpponentAnalysis). Regeln hålls.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#FAF8F4; border:1px solid #DDD7CC; border-left:3px solid #C47A3A; border-radius:8px; padding:13px 16px; margin-bottom:10px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#C47A3A;\"><\u002Fspan><span style=\"font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:#A25828; font-weight:700;\">N-5 · död kod med 🟠/🔴 i trainingService — städa innan den tänds<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.55; color:#3D3A32;\"><span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">trainingService.trainingTypeEmoji<\u002Fspan> mappar bl.a. 🟠 (BallControl) och 🔴 (fallback). Funktionen <b>anropas ingenstans<\u002Fb> (död kod) — men om den någonsin kopplas in renderar den semafor-emoji rakt in i UI:t och bryter severity-regeln.<\u002Fp>\n          <div style=\"display:flex; align-items:flex-start; gap:8px; font-family:ui-monospace,monospace; font-size:10px;\"><span style=\"background:#3D3A32; color:#F5F1EB; padding:2px 6px; border-radius:3px;\">→ CODE<\u002Fspan><span style=\"color:#6B6760; line-height:1.5; padding-top:2px;\">Ta bort funktionen, eller ersätt med Lucide-mappning + domänemoji (🏋️) innan den används.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#FAF8F4; border:1px solid #DDD7CC; border-left:3px solid #5A9A4A; border-radius:8px; padding:13px 16px; margin-bottom:10px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5A9A4A;\"><\u002Fspan><span style=\"font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:#5A9A4A; font-weight:700;\">PASS · ceremoni-heron konsekventa (men odokumenterad tier)<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.55; color:#3D3A32;\">Alla ceremoni-heron (Trophy/Medal/Crown/Award i SmFinal, CupFinal, Champion, VictoryTrophy, 56–80px) kör konsekvent <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#A25828;\">strokeWidth 1.5<\u002Fspan>. Snyggt och avsiktligt — men det är en <b>tredje stroke-tier<\u002Fb> som inte finns i DS-dokumentationen (som bara nämner 1.8/2.2).<\u002Fp>\n          <div style=\"display:flex; align-items:flex-start; gap:8px; font-family:ui-monospace,monospace; font-size:10px;\"><span style=\"background:#C47A3A; color:#0E0D0B; padding:2px 6px; border-radius:3px;\">→ DESIGN<\u002Fspan><span style=\"color:#6B6760; line-height:1.5; padding-top:2px;\">Ratificera 1.5-tiern i DS:et (tier-tabellen ovan) så den inte råkar \"rättas\" bort vid N-1-svepet.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family:ui-monospace,monospace; font-size:9px; color:#8A857A; margin-top:18px; line-height:1.6; border-top:1px solid #DDD7CC; padding-top:14px;\">N-1–N-4 löses renast med en gemensam <span style=\"color:#A25828;\">&lt;Icon/&gt;<\u002Fspan>-wrapper (default 1.8, aktiv 2.2) — ett pass som stänger defaulten permanent. N-5 är städ. PASS-heron ratificeras i DS. Vid klar punkt: stryk rad i DESIGN-KÖ + logga i BACKLOG CHANGELOG.<\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() { this.renderIcons(); }\n  componentDidUpdate() { this.renderIcons(); }\n  renderIcons() {\n    const run = () => {\n      if (!window.lucide) { setTimeout(run, 200); return; }\n      window.lucide.createIcons();\n      document.querySelectorAll('[data-stroke]').forEach(box => {\n        const w = box.getAttribute('data-stroke');\n        const px = box.getAttribute('data-stroke') === '1.5' ? 40 : 26;\n        box.querySelectorAll('svg').forEach(svg => {\n          svg.setAttribute('stroke-width', w);\n          svg.setAttribute('width', px);\n          svg.setAttribute('height', px);\n        });\n      });\n    };\n    if (window.lucide) run(); else setTimeout(run, 300);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
