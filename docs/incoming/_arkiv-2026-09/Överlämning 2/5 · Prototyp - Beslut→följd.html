  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3f409d5e-9df7-491e-ab92-5707f276765d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ═══════════════════════════════════════════════════════════\n   BANDY MANAGER — Design Tokens\n   \"Heritage Bandy\" palette. Warm stone/paper backgrounds,\n   copper accent, ice-blue cool, Georgia display + system body.\n   Source: bandy-manager/src/styles/global.css\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Backgrounds (light) ─────────────────────────── */\n  --bg:              #EDE8DF;  /* warm paper */\n  --bg-surface:      #FAF8F4;  /* card */\n  --bg-elevated:     #FFFFFF;\n\n  /* ── Backgrounds (dark / leather) ────────────────── */\n  --bg-dark:         #0E0D0B;\n  --bg-dark-surface: #1E1D19;\n  --bg-dark-elevated:#2C2A24;\n  --bg-leather:      #3D3A32;  /* header strips */\n\n  /* ── Portal (mörka dashboard-tokens) ─────────────── */\n  /* Sätts på documentElement av PortalScreen, tonas per säsongsfas. */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n\n  /* ── Scen (alias för Portal — förtydligar scen-kontext) ─ */\n  /* Används av ArrivalScene, BoardMeetingScene, CoffeeRoomScene m.fl. */\n  --bg-scene: var(--bg-portal);\n\n  /* ── Severity (journalist-relation, signaturer) ──── */\n  --cold: #4a6680;  /* kall blå — neg severity, cold_winter-signatur */\n  --warm: #8c6e3a;  /* varm guld — injury_curve, warm severity */\n\n  /* ── Seasonal skies (dashboard) ──────────────────── */\n  --bg-october:  linear-gradient(180deg, #E8E4DC 0%, #EDE8DF 100%);\n  --bg-november: linear-gradient(180deg, #D8D4CC 0%, #E8E4DC 100%);\n  --bg-december: linear-gradient(180deg, #F0ECE4 0%, #E8DCCC 100%);\n  --bg-january:  linear-gradient(180deg, #D0D4D8 0%, #E0E4E8 100%);\n  --bg-february: linear-gradient(180deg, #E8E4DC 0%, #F0ECE4 100%);\n  --bg-march:    linear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  --match-bg-cold:    #3D3228;\n  --match-bg-fog:     #2A3228;\n  --match-bg-wind:    #32301E;\n  --match-gold:       #D4B860;\n  --match-warn:       #E8A090;\n  --match-positive:   #A0C890;\n  --match-copper:     #D4A850;\n  --match-home-bg:    #F0EDE6;\n\n  /* ── Archetype (squad badges) ────────────────────── */\n  --arch-finisher:  #c0392b;\n  --arch-playmaker: #2563EB;\n  --arch-defensive: #1a5e3a;\n  --arch-twoway:    #5a2d7a;\n  --arch-reflexgk:  #8B6914;\n  --arch-posgk:     #7b5a14;\n  --arch-dribbler:  #1a5e8a;\n  --arch-corner:    #4a3a8a;\n  --arch-raw:       #2d6e2d;\n  --arch-default:   #1e4d8c;\n\n  /* ── Typography ──────────────────────────────────── */\n  --font-display: 'Georgia', 'Times New Roman', serif;\n  --font-body:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n\n  /* ── Shape ───────────────────────────────────────── */\n  --radius:    14px;   /* round cards (narrative) */\n  --radius-md:  8px;   /* sharp cards, buttons */\n  --radius-sm:  3px;\n\n  /* ── Layout (mobile 375–430px) ───────────────────── */\n  --bottom-nav-height: 60px;\n  --safe-bottom: env(safe-area-inset-bottom, 0px);\n\n  /* ── Elevation (soft, copper-tinted on primary) ─── */\n  --shadow-card:    0 1px 3px rgba(0,0,0,0.05);\n  --shadow-btn:     0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);\n  --shadow-primary: 0 3px 5px rgba(162,88,40,0.38);\n  --shadow-danger:  0 3px 10px rgba(176,80,64,0.40);\n  --shadow-menu:    0 4px 16px rgba(0,0,0,0.15);\n\n  /* ── Z-index scale ───────────────────────────────── */\n  --z-dropdown:    100;  /* @kind other */\n  --z-modal:       300;  /* @kind other */\n  --z-overlay:     400;  /* @kind other */\n  --z-interaction: 500;  /* @kind other */\n  --z-toast:       600;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SEMANTIC TYPE ROLES\n   ═══════════════════════════════════════════════════════════ */\n\n/* Display / numeric (Georgia) — poäng, score, position */\n.h-display-xl { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; }\n.h-display-lg { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; }\n.h-display-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }\n.h-display-sm { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }\n\n/* Card titles (body, heavy) */\n.h-card     { font-family: var(--font-body); font-size: 14px; font-weight: 700; line-height: 1.3; }\n.h-card-sm  { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.3; }\n\n/* Body copy */\n.h-body     { font-family: var(--font-body); font-size: 12px; font-weight: 400; line-height: 1.45; color: var(--text-primary); }\n.h-body-sm  { font-family: var(--font-body); font-size: 11px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); }\n.h-body-xs  { font-family: var(--font-body); font-size: 10px; font-weight: 400; line-height: 1.45; color: var(--text-muted); }\n\n/* Section label — emoji + UPPERCASE letter-spaced */\n.h-label {\n  font-family: var(--font-body);\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin: 0 0 4px 0;\n}\n\n/* Quote / narrative (italic Georgia) */\n.h-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 12px;\n  color: var(--text-secondary);\n  line-height: 1.4;\n}\n\n/* CTA text — uppercase, letter-spaced */\n.h-cta {\n  font-family: var(--font-body);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SCEN-TYPOGRAFI (mörk bakgrund — ArrivalScene m.fl.)\n   Etablerad 2026-05-08 efter scenrevision (handover från Opus).\n   Komplement till .h-* som är dagsljus-optimerade.\n   ═══════════════════════════════════════════════════════════ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<script src=\"93b896b9-14fa-4c0b-a934-a4535e2c669a\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #2a2620; display: flex; min-height: 100vh; align-items: flex-start; justify-content: center; }\n  @keyframes rippleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n  @keyframes pulseCTA { 0%,100% { box-shadow: 0 3px 5px rgba(162,88,40,0.38); } 50% { box-shadow: 0 6px 24px rgba(162,88,40,0.55); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"padding:28px 20px 40px; width:472px; box-sizing:border-box;\">\n  <div style=\"margin-bottom:14px; text-align:center;\">\n    <div style=\"font-family:system-ui; font-size:9px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:#C47A3A;\">Interaktiv prototyp<\u002Fdiv>\n    <div style=\"font-family:Georgia,serif; font-size:19px; font-weight:700; color:#F5F1EB; margin-top:4px;\">Beslut → följd<\u002Fdiv>\n    <div style=\"font-family:system-ui; font-size:11px; color:#9a948a; margin-top:4px; line-height:1.45;\">Välj ett alternativ → bekräfta → se kedjan som genereras för just det valet.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Beslut-prototyp\" style=\"width:430px; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,0.4); border:1px solid rgba(0,0,0,0.5); overflow:hidden;\">\n    <div style=\"height:780px; display:flex; flex-direction:column; overflow-y:auto; background:radial-gradient(rgba(255,255,255,0.02) 0.5px, transparent 0.5px) 0 0 / 5px 5px, radial-gradient(130% 70% at 50% 0%, #25241f 0%, #141210 72%);\">\n\n      <!-- header -->\n      <div style=\"padding:10px 16px; border-bottom:2px solid var(--accent); display:flex; justify-content:space-between; align-items:center; flex-shrink:0;\">\n        <span style=\"font-family:Georgia,serif; font-size:12px; font-weight:700; color:#F5F1EB;\">Forsbacka BK<\u002Fspan>\n        <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:8px; letter-spacing:1.5px; color:#C47A3A;\">OMG. 3 · FÖRBERED<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 16px 6px;\">\n        <p style=\"font-family:Georgia,serif; font-style:italic; font-size:12px; color:#C4BAA8; margin:0; line-height:1.5;\">Snön kom tidigt. Holmgren stod kvar efter träningen och ville prata.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- decision card -->\n      <div style=\"margin:6px 16px; background:#2a241e; border:1px solid rgba(196,122,58,0.3); border-radius:14px; padding:14px 16px; flex-shrink:0;\">\n        <div style=\"font-family:system-ui; font-size:9px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:#FFB033; margin-bottom:8px;\">Veckans beslut<\u002Fdiv>\n        <p style=\"font-family:Georgia,serif; font-size:15px; font-weight:700; color:#F5F1EB; margin:0 0 4px; line-height:1.3;\">Holmgren kräver förlängt kontrakt<\u002Fp>\n        <p style=\"font-family:system-ui; font-size:11.5px; color:#C4BAA8; line-height:1.5; margin:0 0 14px;\">Lagets bästa anfallare (28). Annars testar han marknaden i vinter — gratis.<\u002Fp>\n\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <sc-for list=\"{{ choices }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"{{ c.rowStyle }}\" onclick=\"{{ c.onSelect }}\">\n              <span style=\"font-family:system-ui; font-size:13px; font-weight:600; color:#F5F1EB; flex:1;\">{{ c.label }}<\u002Fspan>\n              <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; color:#9a948a;\">{{ c.hint }}<\u002Fspan>\n              <sc-if value=\"{{ c.selected }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#C47A3A; font-size:13px; font-weight:700;\">✓<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ripple panel (after lock) -->\n      <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin:8px 16px 0; background:rgba(0,0,0,0.3); border:1px solid rgba(196,122,58,0.25); border-radius:12px; padding:14px 16px; animation:rippleIn 0.4s ease-out both; flex-shrink:0;\">\n          <div style=\"font-family:system-ui; font-size:9px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:#C47A3A; margin-bottom:14px;\">Därför hände det<\u002Fdiv>\n          <sc-for list=\"{{ ripple }}\" as=\"step\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; gap:12px;\">\n              <div style=\"display:flex; flex-direction:column; align-items:center; flex-shrink:0;\">\n                <span style=\"width:11px; height:11px; border-radius:50%; flex-shrink:0; background:{{ step.color }};\"><\u002Fspan>\n                <span style=\"width:2px; flex:1; min-height:14px; background:rgba(196,122,58,0.3);\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding-bottom:14px;\">\n                <p style=\"font-family:Georgia,serif; font-size:13.5px; color:#E6DDD0; margin:0; line-height:1.35;\">{{ step.text }}<\u002Fp>\n                <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:8px; color:{{ step.color }};\">{{ step.meta }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"flex:1; min-height:14px;\"><\u002Fdiv>\n\n      <!-- bottom CTA states -->\n      <div style=\"padding:12px 16px 16px; flex-shrink:0;\">\n        <sc-if value=\"{{ noChoice }}\" hint-placeholder-val=\"{{ true }}\">\n          <button style=\"width:100%; font-family:system-ui; font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:rgba(245,241,235,0.4); padding:15px; border:1px solid rgba(196,122,58,0.25); border-radius:12px; background:rgba(255,255,255,0.04); cursor:not-allowed; display:flex; align-items:center; justify-content:center; gap:8px;\"><span>🔒<\u002Fspan> Välj veckans beslut<\u002Fbutton>\n          <div style=\"text-align:center; margin-top:9px; font-family:system-ui; font-size:9px; font-style:italic; color:rgba(196,122,58,0.5);\">CTA:n är grindad — ett val är villkor för att gå vidare.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notLocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ lock }}\" style=\"width:100%; display:flex; align-items:center; justify-content:center; gap:8px; font-family:system-ui; font-size:13px; font-weight:700; color:#15120f; padding:14px; border:none; border-radius:10px; background:#C47A3A; cursor:pointer; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.2);\">Bekräfta: {{ chosenLabel }}<\u002Fbutton>\n          <div style=\"text-align:center; margin-top:9px; font-family:system-ui; font-size:9px; font-style:italic; color:rgba(196,122,58,0.5);\">Lås in valet för att se följden.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n          <button style=\"width:100%; font-family:system-ui; font-size:14px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#15120f; padding:15px; border:none; border-radius:12px; background:linear-gradient(180deg,#DD9555,#8B4820); cursor:pointer; animation:pulseCTA 2.8s ease-in-out infinite;\">Spela omgång 3 →<\u002Fbutton>\n          <div onclick=\"{{ reset }}\" style=\"text-align:center; margin-top:11px; font-family:system-ui; font-size:11px; color:#C47A3A; cursor:pointer; text-decoration:underline;\">↺ Ändra — testa ett annat val<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:14px; text-align:center; font-family:system-ui; font-size:10px; color:#7a756c; line-height:1.5;\">Hela slingan finns redan i koden: <code style=\"font-family:ui-monospace,monospace; color:#C4BAA8;\">weeklyDecisionService<\u002Fcode> (valet) +<br><code style=\"font-family:ui-monospace,monospace; color:#C4BAA8;\">rippleEffectService.describeRippleChain<\u002Fcode> (följden). Detta ytar den.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 472, &quot;height&quot;: 880 }\n}\">\nclass Component extends DCLogic {\n  state = { choice: null, locked: false };\n\n  labels = { forlang: 'Förläng', avvakta: 'Avvakta', salj: 'Sälj i vinterfönstret' };\n\n  ripples = {\n    forlang: [\n      { text: 'Du förlängde Holmgrens kontrakt', meta: 'löner +18 tkr/mån', color: '#B05040' },\n      { text: 'Klacken behåller sin favoritspelare', meta: 'humör +12', color: '#5A9A4A' },\n      { text: 'Bygdens puls steg', meta: 'puls +6', color: '#5A9A4A' },\n      { text: 'Styrelsens ekonomimål pressas', meta: 'i fara →', color: '#FFB033' },\n    ],\n    avvakta: [\n      { text: 'Du avvaktade med beslutet', meta: 'omg. 3', color: '#C4BAA8' },\n      { text: 'Holmgren känner sig oönskad', meta: 'moral −8', color: '#B05040' },\n      { text: 'Snacket går i omklädningsrummet', meta: 'lagkemi −5', color: '#B05040' },\n      { text: 'Kontraktet riskerar löpa ut', meta: 'gratis i vinter →', color: '#B05040' },\n    ],\n    salj: [\n      { text: 'Du sålde Holmgren i vinterfönstret', meta: 'kassa +220 tkr', color: '#5A9A4A' },\n      { text: 'Klacken rasar', meta: 'humör −20', color: '#B05040' },\n      { text: 'Bygdens puls föll', meta: 'puls −10', color: '#B05040' },\n      { text: 'Hemmaintäkten minskar', meta: '−14 tkr/match', color: '#B05040' },\n      { text: 'Styrelsens ekonomimål uppfyllt', meta: '✓', color: '#5A9A4A' },\n    ],\n  };\n\n  select(id) { if (!this.state.locked) this.setState({ choice: id }); }\n  lock() { if (this.state.choice) this.setState({ locked: true }); }\n  reset() { this.setState({ choice: null, locked: false }); }\n\n  renderVals() {\n    const { choice, locked } = this.state;\n    const base = [\n      { id: 'forlang', label: 'Förläng', hint: '+18 tkr/mån · klacken +' },\n      { id: 'avvakta', label: 'Avvakta', hint: 'risk: tappar gratis' },\n      { id: 'salj', label: 'Sälj i vinterfönstret', hint: '+220 tkr · klacken −−' },\n    ];\n    const choices = base.map(c => {\n      const selected = choice === c.id;\n      return {\n        ...c,\n        selected,\n        onSelect: () => this.select(c.id),\n        rowStyle: 'display:flex; align-items:center; gap:10px; border-radius:8px; padding:11px 13px; cursor:pointer; transition:all 0.15s; background:' +\n          (selected ? 'rgba(196,122,58,0.16)' : 'rgba(0,0,0,0.25)') +\n          '; border:1px solid ' + (selected ? '#C47A3A' : 'rgba(196,122,58,0.22)') + ';',\n      };\n    });\n    return {\n      choices,\n      noChoice: !choice,\n      notLocked: !!choice && !locked,\n      locked,\n      chosenLabel: choice ? this.labels[choice] : '',\n      ripple: locked && choice ? this.ripples[choice] : [],\n      lock: () => this.lock(),\n      reset: () => this.reset(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
