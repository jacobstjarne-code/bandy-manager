"<!DOCTYPE html>\n<html lang=\"sv\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>CTA mot bottennav — mönsterfix<\u002Ftitle>\n<style>/* ═══════════════════════════════════════════════════════════\n   BANDY MANAGER — Design Tokens\n   \"Heritage Bandy\" palette. Warm stone/paper backgrounds,\n   copper accent, ice-blue cool, Georgia display + system body.\n   Source: bandy-manager/src/styles/global.css\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Backgrounds (light) ─────────────────────────── */\n  --bg:              #EDE8DF;  /* warm paper */\n  --bg-surface:      #FAF8F4;  /* card */\n  --bg-elevated:     #FFFFFF;\n\n  /* ── Backgrounds (dark / leather) ────────────────── */\n  --bg-dark:         #0E0D0B;\n  --bg-dark-surface: #1E1D19;\n  --bg-dark-elevated:#2C2A24;\n  --bg-leather:      #3D3A32;  /* header strips */\n\n  /* ── Portal (mörka dashboard-tokens) ─────────────── */\n  /* Sätts på documentElement av PortalScreen, tonas per säsongsfas. */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n\n  /* ── Scen (alias för Portal — förtydligar scen-kontext) ─ */\n  /* Används av ArrivalScene, BoardMeetingScene, CoffeeRoomScene m.fl. */\n  --bg-scene: var(--bg-portal);\n\n  /* ── Severity (journalist-relation, signaturer) ──── */\n  --cold: #4a6680;  /* kall blå — neg severity, cold_winter-signatur */\n  --warm: #8c6e3a;  /* varm guld — injury_curve, warm severity */\n\n  /* ── Seasonal skies (dashboard) ──────────────────── */\n  --bg-october:  linear-gradient(180deg, #E8E4DC 0%, #EDE8DF 100%);\n  --bg-november: linear-gradient(180deg, #D8D4CC 0%, #E8E4DC 100%);\n  --bg-december: linear-gradient(180deg, #F0ECE4 0%, #E8DCCC 100%);\n  --bg-january:  linear-gradient(180deg, #D0D4D8 0%, #E0E4E8 100%);\n  --bg-february: linear-gradient(180deg, #E8E4DC 0%, #F0ECE4 100%);\n  --bg-march:    linear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  --match-bg-cold:    #3D3228;\n  --match-bg-fog:     #2A3228;\n  --match-bg-wind:    #32301E;\n  --match-gold:       #D4B860;\n  --match-warn:       #E8A090;\n  --match-positive:   #A0C890;\n  --match-copper:     #D4A850;\n  --match-home-bg:    #F0EDE6;\n\n  /* ── Archetype (squad badges) ────────────────────── */\n  --arch-finisher:  #c0392b;\n  --arch-playmaker: #2563EB;\n  --arch-defensive: #1a5e3a;\n  --arch-twoway:    #5a2d7a;\n  --arch-reflexgk:  #8B6914;\n  --arch-posgk:     #7b5a14;\n  --arch-dribbler:  #1a5e8a;\n  --arch-corner:    #4a3a8a;\n  --arch-raw:       #2d6e2d;\n  --arch-default:   #1e4d8c;\n\n  /* ── Typography ──────────────────────────────────── */\n  --font-display: 'Georgia', 'Times New Roman', serif;\n  --font-body:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n\n  /* ── Shape ───────────────────────────────────────── */\n  --radius:    14px;   /* round cards (narrative) */\n  --radius-md:  8px;   /* sharp cards, buttons */\n  --radius-sm:  3px;\n\n  /* ── Layout (mobile 375–430px) ───────────────────── */\n  --bottom-nav-height: 60px;\n  --safe-bottom: env(safe-area-inset-bottom, 0px);\n\n  /* ── Elevation (soft, copper-tinted on primary) ─── */\n  --shadow-card:    0 1px 3px rgba(0,0,0,0.05);\n  --shadow-btn:     0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);\n  --shadow-primary: 0 3px 5px rgba(162,88,40,0.38);\n  --shadow-danger:  0 3px 10px rgba(176,80,64,0.40);\n  --shadow-menu:    0 4px 16px rgba(0,0,0,0.15);\n\n  /* ── Z-index scale ───────────────────────────────── */\n  --z-dropdown:    100;  /* @kind other */\n  --z-modal:       300;  /* @kind other */\n  --z-overlay:     400;  /* @kind other */\n  --z-interaction: 500;  /* @kind other */\n  --z-toast:       600;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SEMANTIC TYPE ROLES\n   ═══════════════════════════════════════════════════════════ */\n\n/* Display / numeric (Georgia) — poäng, score, position */\n.h-display-xl { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; }\n.h-display-lg { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; }\n.h-display-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }\n.h-display-sm { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }\n\n/* Card titles (body, heavy) */\n.h-card     { font-family: var(--font-body); font-size: 14px; font-weight: 700; line-height: 1.3; }\n.h-card-sm  { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.3; }\n\n/* Body copy */\n.h-body     { font-family: var(--font-body); font-size: 12px; font-weight: 400; line-height: 1.45; color: var(--text-primary); }\n.h-body-sm  { font-family: var(--font-body); font-size: 11px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); }\n.h-body-xs  { font-family: var(--font-body); font-size: 10px; font-weight: 400; line-height: 1.45; color: var(--text-muted); }\n\n/* Section label — emoji + UPPERCASE letter-spaced */\n.h-label {\n  font-family: var(--font-body);\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin: 0 0 4px 0;\n}\n\n/* Quote / narrative (italic Georgia) */\n.h-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 12px;\n  color: var(--text-secondary);\n  line-height: 1.4;\n}\n\n/* CTA text — uppercase, letter-spaced */\n.h-cta {\n  font-family: var(--font-body);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SCEN-TYPOGRAFI (mörk bakgrund — ArrivalScene m.fl.)\n   Etablerad 2026-05-08 efter scenrevision (handover från Opus).\n   Komplement till .h-* som är dagsljus-optimerade.\n   ═══════════════════════════════════════════════════════════ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPRINT 1 — pre-match-ytor · mock + dokumentation\n   Självständig. Bygger på colors_and_type.css (tokens).\n   ═══════════════════════════════════════════════════════════ */\n\n* { box-sizing: border-box; }\nbody {\n  margin: 0;\n  background: #15120E;\n  color: var(--text-light);\n  font-family: var(--font-body);\n  -webkit-font-smoothing: antialiased;\n}\n.wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }\n\n/* ── HERO ── */\n.hero { padding: 64px 0 38px; border-bottom: 1px solid rgba(196,122,58,0.22); background: radial-gradient(120% 100% at 50% 0%, #211a12 0%, #15120E 70%); }\n.kick { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin: 0; }\n.hero h1 { font-family: var(--font-display); font-size: 50px; font-weight: 800; line-height: 1.04; letter-spacing: -1px; margin: 16px 0 0; color: var(--text-light); }\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub { font-size: 15px; line-height: 1.6; color: var(--text-light-secondary); max-width: 760px; margin: 18px 0 0; }\n.hero .sub em { color: var(--text-light); font-style: italic; }\n.meta { display: flex; flex-wrap: wrap; gap: y: flex; gap: 9px; font-size: 11.5px; line-height: 1.45; color: var(--text-light-secondary); }\n.ba-note .n-ic { flex-shrink: 0; font-weight: 700; }\n.after .n-ic { color: var(--success); } .before .n-ic { color: #B05040; }\n.ba-note b { color: var(--text-light); font-weight: 600; }\n@media (max-width: 940px) { .ba { grid-template-columns: 1fr; } .ba-arrow { display: none; } }\n\n/* single mock centered */\n.solo { display: flex; gap: 30px; margin-top: 26px; align-items: start; }\n.solo .panel { flex: 1; }\n.solo .panel h3 { font-family: var(--font-display); font-size: 19px; color: var(--text-light); margin: 0 0 4px; }\n.solo .panel .pk { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }\n.solo .panel p { font-size: 13px; line-height: 1.6; color: var(--text-light-secondary); margin: 10px 0 0; }\n.flag { display: flex; gap: 11px; margin-top: 12px; padding: 13px 15px; border-radius: 10px; background: rgba(90,154,74,0.07); border: 1px solid rgba(90,154,74,0.22); }\n.flag.des { background: rgba(196,122,58,0.07); border-color: rgba(196,122,58,0.25); }\n.flag .fic { flex-shrink: 0; color: var(--success); font-weight: 700; }\n.flag.des .fic { color: var(--accent); }\n.flag b { color: var(--text-light); font-weight: 600; }\n.flag span { font-size: 12px; line-height: 1.5; color: var(--text-light-secondary); }\n@media (max-width: 760px) { .solo { flex-direction: column; } }\n\n/* ═══════════════ PHONE FRAME (app-trogen) ═══════════════ */\n.phone { width: 300px; flex-shrink: 0; border-radius: 26px; background: #0a0a0a; padding: 7px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin: 0 auto; }\n.scr { border-radius: 20px; overflow: hidden; background: var(--bg); position: relative; }\n.scr.dark { background: var(--bg-portal); }\n\n/* app header */\n.gh { background: var(--bg-portal); padding: 9px 11px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(196,122,58,0.3); }\n.gh-logo { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-dark); display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 800; color: var(--text-light-secondary); flex-shrink: 0; }\n.gh-mid { min-width: 0; }\n.gh-club { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-light); line-height: 1; }\n.gh-sub { font-size: 8.5px; color: var(--text-muted); font-style: italic; margin-top: 2px; }\n.gh-omg { margin-left: auto; font-size: 8px; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 2px 5px; font-weight: 700; flex-shrink: 0; }\n.gh-ic { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }\n\n/* phase nav */\n.phase { background: var(--bg-portal); display: flex; align-items: center; padding: 7px 11px; gap: 6px; border-bottom: 1.5px solid var(--accent); }\n.phase .pp { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }\n.phase .pp.on { color: var(--accent); }\n.phase .pl { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }\n\n/* body */\n.body { padding: 11px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }\n.body.beige { background: var(--bg); }\n\n/* generic app card */\n.acard { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 11px 12px; }\n.acard.sharp { border-radius: var(--radius-md); }\n.alabel { font-size: 7.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n\n/* bottom nav */\n.bn { display: flex; background: var(--bg-surface); border-top: 1px solid var(--border); padding: 6px 4px 7px; }\n.bn .bi { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 7.5px; color: var(--text-muted); }\n.bn .bi.on { color: var(--accent); }\n.bn .bi .g { font-size: 13px; }\n\n/* highlight ring for the thing being fixed */\n.hl { position: relative; }\n.hl::after { content: ''; position: absolute; inset: -4px; border: 2px solid var(--accent); border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 4px rgba(196,122,58,0.12); }\n\n/* ── pill nav demo ── */\n.pillrow { display: flex; gap: 6px; padding: 9px 11px; background: var(--bg); }\n.pillrow.scroll { overflow: hidden; }\n.pill { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-dark); background: var(--bg-elevated); color: var(--text-secondary); white-space: nowrap; }\n.pill.on { background: var(--accent); color: #fff; border-color: var(--accent); }\n.pill.cut { opacity: 0.5; }\n\n/* segmented underline nav (the fix) */\n.segnav { display: grid; padding: 0 6px; background: var(--bg); border-bottom: 1px solid var(--border); }\n.segnav .row { display: flex; }\n.segitem { flex: 1; text-align: center; font-size: 9.5px; font-weight: 700; padding: 9px 2px; color: var(--text-muted); border-bottom: 2px solid transparent; }\n.segitem.on { color: var(--accent); border-bottom-color: var(--accent); }\n\n/* mode dial */\n.dial { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }\n.dbtn { border-radius: 7px; border: 1px solid var(--border); background: var(--bg-elevated); padding: 7px 3px; text-align: center; }\n.dbtn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }\n.dbtn .dn { font-size: 12px; font-weight: 700; color: var(--text-primary); }\n.dbtn.on .dn { color: var(--accent-dark); }\n.dbtn .de { font-size: 7px; color: var(--text-muted); margin-top: 2px; line-height: 1.2; }\n.dbtn.on .de { color: var(--accent); }\n\n/* reaction row */\n.rrow { display: flex; align-items: center; gap: 7px; padding: 7px 4px; border-top: 1px solid var(--border); }\n.rrow .pos { width: 22px; text-align: center; font-size: 9px; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 2px 0; 22px 14px; }\n.empty .et { font-family: var(--font-display); font-style: italic; color: var(--text-muted); font-size: 12px; }\n.empty.guide { background: var(--bg-surface); border: 1px dashed var(--border-dark); border-radius: var(--radius-md); }\n.empty.guide .eh { font-size: 12px; color: var(--text-primary); font-weight: 600; font-family: var(--font-body); font-style: normal; }\n.empty.guide .es { font-size: 11px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }\n.empty.guide .eb { display: inline-block; margin-top: 11px; font-size: 11px; font-weight: 700; color: var(--accent-dark); border: 1px solid var(--accent); border-radius: 7px; padding: 6px 14px; }\n\n/* intro/help line normalized */\n.introline { display: flex; gap: 8px; align-items: flex-start; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 11px; }\n.introline.bad { border-color: rgba(176,80,64,0.4); }\n.introline .ii { font-size: 11px; flex-shrink: 0; }\n.introline .it { font-size: 10.5px; color: var(--text-secondary); line-height: 1.4; }\n.introline .it b { color: var(--text-primary); font-weight: 600; }\n\n/* build node */\n.bnode { border-radius: 7px; padding: 9px 11px; margin-bottom: 7px; position: relative; }\n.bnode.dashed { border: 1px dashed var(--border-dark); background: transparent; }\n.bnode.solid { border: 1px solid var(--border); background: var(--bg-surface); }\n.bnode .bt { display: flex; align-items: center; gap: 6px; }\n.bnode .bt .bttl { font-size: 12.5px; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); }\n.bnode .bt .bstate { margin-left: auto; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; }\n.bstate.ok { background: rgba(90,154,74,0.14); color: var(--success-light); }\n.bstate.lock { background: var(--border); color: var(--text-muted); }\n.bstate.trial { background: rgba(126,150,180,0.16); color:  ui-monospace, monospace; letter-spacing: 1px; }\n  .scene .setting { font-family: var(--font-display); font-style: italic; font-size: 11px; color: var(--text-light-secondary); margin-top: 9px; line-height: 1.5; }\n  .ctabar { background: linear-gradient(180deg, var(--accent), var(--accent-deep)); color: #fff; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 14px; }\n  .ctabar.cut { position: absolute; left: 0; right: 0; bottom: -18px; opacity: 0.55; }\n  .navbadge { outline: 2px solid #3b82f6; outline-offset: -2px; border-radius: 4px; }\n  /* halftime modal bits */\n  .htm { position: relative; background: var(--bg-portal); min-height: 300px; }\n  .htdim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }\n  .htcard { position: absolute; left: 14px; right: 14px; top: 14px; background: var(--bg-portal-surface); border: 1px solid rgba(196,122,58,0.3); border-radius: 14px; padding: 13px; }\n  .htcard .ht { text-align: center; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }\n  .htcard .sc { text-align: center; font-family: var(--font-display); font-size: 26px; font-weight: 800; color: var(--text-light); line-height: 1; margin: 4px 0; }\n  .plist { display: flex; flex-direction: column; gap: 5px; }\n  .pl2 { border: 1px solid rgba(196,122,58,0.3); border-radius: 7px; padding: 7px 9px; font-size: 10px; color: var(--text-light-secondary); }\n  .stickycta { background: linear-gradient(180deg, var(--accent), var(--accent-deep)); color: #fff; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 11px; border-radius: 8px; margin-top: 8px; }\n  .whitebar { background: #fff; color: #555; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 11px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">Sprint 1 · mönsterfix · korrvända 3<\u002Fp>\n    <h1>CTA:n får aldrig hamna <em>bakom navet<\u002Fem><\u002Fh1>\n    <p class=\"sub\">Det här har blivit fel tre gånger — match-intro, halvtidsmodal, och tidigare. <em>Det är inte tre buggar utan ett mönster:<\u002Fem> fasta scrollytor och flytande CTA:er tar inte höjd för det fasta bottennavet på desktop. Här är roten, fixen, och den delade regeln så det inte återkommer.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Fynd<\u002Fb> · M1 match-intro · M3 halvtidsmodal<\u002Fspan>\n      <span><b>Token<\u002Fb> · --bottom-nav-height<\u002Fspan>\n      <span><b>2026-06-23<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- 01 · MATCH-INTRO -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — MATCH-INTRO<\u002Fdiv>\n      <h2>\"Spela\"-knappen ligger bakom navet<\u002Fh2>\n      <p>Scenen fyller hela höjden, så CTA:n hamnar under bottennavet och går inte att nå — <span class=\"c\">och webbläsarens blå fokusring läcker fram kring \"Match\" i navet (M2).<\u002Fspan><\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">M1 CTA bakom nav<\u002Fspan><span class=\"tg fix\">M2 fokusring<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">CTA dold, blå ruta i nav<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"scene\">\n              <div class=\"ctabar cut\">Spela cup-kvartsfinal →<\u002Fdiv>\n              <div class=\"gen\">⬩ Cupen ⬩<\u002Fdiv>\n              <div class=\"ttl\">Skutskär<\u002Fdiv>\n              <div class=\"meta2\">Hemma · Utslagsmatch<\u002Fdiv>\n              <div class=\"setting\">Det som hände i höstas räknas inte i dag.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"bn\">\n              <div class=\"bi\"><span class=\"g\">⌂<\u002Fspan>Hem<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚔<\u002Fspan>Trupp<\u002Fdiv>\n              <div class=\"bi on navbadge\"><span class=\"g\">⚔<\u002Fspan>Match<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⊞<\u002Fspan>Tabell<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚒<\u002Fspan>Bygget<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>CTA:n sticker ut under navet — oscrollbar, onåbar.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Blå systemruta kring \"Match\" = default <code style=\"font-family:var(--font-body)\">:focus<\u002Fcode> outline.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">CTA ovanför nav, ren fokus<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"scene\" style=\"min-height:188px\">\n              <div class=\"gen\">⬩ Cupen ⬩<\u002Fdiv>\n              <div class=\"ttl\">Skutskär<\u002Fdiv>\n              <div class=\"meta2\">Hemma · Utslagsmatch<\u002Fdiv>\n              <div class=\"setting\">Det som hände i höstas räknas inte i dag.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"ctabar\">Spela cup-kvartsfinal →<\u002Fdiv>\n            <div class=\"bn\">\n              <div class=\"bi\"><span class=\"g\">⌂<\u002Fspan>Hem<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚔<\u002Fspan>Trupp<\u002Fdiv>\n              <div class=\"bi on\"><span class=\"g\">⚔<\u002Fspan>Match<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⊞<\u002Fspan>Tabell<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚒<\u002Fspan>Bygget<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>CTA sitter ovanför navet<\u002Fb> — alltid synlig och nåbar, scenen tar höjd för nav-höjden.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Ren aktiv-markering<\u002Fb> i navet (appens egen stil), ingen blå systemruta.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 · HALVTIDSMODAL -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — HALVTIDSMODAL (LIVE · BYTEN)<\u002Fdiv>\n      <h2>Listan scrollar bakom CTA:n, knappen täcks<\u002Fh2>\n      <p>Samma rot: modalen tar inte höjd för navet. Byteslistan försvinner bakom \"Match pågår\"-raden och primärknappen blir oåtkomlig. <span class=\"c\">Modalens innehåll ska scrolla i sin egen höjd, CTA:n sitta sticky ovanför navet.<\u002Fspan><\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">M3 CTA/scroll i modal<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">vit CTA-rad täcker knappen<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"htm\">\n              <div class=\"htdim\"><\u002Fdiv>\n              <div class=\"htcard\" style=\"bottom:-30px\">\n                <div class=\"ht\">❚❚ Halvtid<\u002Fdiv>\n                <div class=\"sc\">3—1<\u002Fdiv>\n                <div style=\"font-size:8px;letter-spacing:1px;color:var(--text-muted);text-align:center;margin-bottom:8px\">Byten · välj spelare att byta ut<\u002Fdiv>\n                <div class=\"plist\">\n                  <div class=\"pl2\">C. Stål (A) · 78 · 73%<\u002Fdiv>\n                  <div class=\"pl2\">T. Lindberg (A) · 51 · 73%<\u002Fdiv>\n                  <div class=\"pl2\">S. Berg (MF) · 62 · 71%<\u002Fdiv>\n                  <div class=\"pl2\" style=\"opacity:0.6\">M. Wahlström (MF) · 52 · 68%<\u002Fdiv>\n                  <div class=\"pl2\" style=\"opacity:0.3\">F. Sandström (MV) · 79 · 62%<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"whitebar\" style=\"position:absolute;left:0;right:0;bottom:0\">Match pågår — spela klart<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"bn\" style=\"opacity:0.5\">\n              <div class=\"bi\"><span class=\"g\">⌂<\u002Fspan>Hem<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚔<\u002Fspan>Trupp<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚔<\u002Fspan>Match<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⊞<\u002Fspan>Tabell<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚒<\u002Fspan>Bygget<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Listan går bakom den vita raden; primärknappen (\"Bekräfta byte\") är dold.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Modalen tar inte höjd för navet → CTA-raden klistras mot fel kant.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">scrollbar body, sticky CTA<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"htm\">\n              <div class=\"htdim\"><\u002Fdiv>\n              <div class=\"htcard\" style=\"bottom:14px;display:flex;flex-direction:column\">\n                <div class=\"ht\">❚❚ Halvtid<\u002Fdiv>\n                <div class=\"sc\">3—1<\u002Fdiv>\n                <div style=\"font-size:8px;letter-spacing:1px;color:var(--text-muted);text-align:center;margin-bottom:8px\">Byten · välj spelare att byta ut<\u002Fdiv>\n                <div class=\"plist\" style=\"max-height:96px;overflow:hidden;position:relative\">\n                  <div class=\"pl2\">C. Stål (A) · 78 · 73%<\u002Fdiv>\n                  <div class=\"pl2\">T. Lindberg (A) · 51 · 73%<\u002Fdiv>\n                  <div class=\"pl2\">S. Berg (MF) · 62 · 71%<\u002Fdiv>\n                  <div style=\"position:absolute;right:2px;top:0;bottom:0;width:3px;background:rgba(196,122,58,0.4);border-radius:2px\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:7px;color:var(--text-muted);text-align:center;margin-top:3px;font-style:italic\">listan scrollar i egen höjd ↕<\u002Fdiv>\n                <div class=\"stickycta\">Bekräfta byte<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"bn\" style=\"opacity:0.5\">\n              <div class=\"bi\"><span class=\"g\">⌂<\u002Fspan>Hem<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚔<\u002Fspan>Trupp<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚔<\u002Fspan>Match<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⊞<\u002Fspan>Tabell<\u002Fdiv>\n              <div class=\"bi\"><span class=\"g\">⚒<\u002Fspan>Bygget<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Innehållet scrollar inuti modalen<\u002Fb>, CTA:n sitter sticky i botten av kortet — alltid synlig.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Modalen slutar ovanför navet<\u002Fb> — inget täcks, knappen alltid nåbar.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 · REGELN -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">03 — DEN DELADE REGELN<\u002Fdiv>\n      <h2>Fixa mönstret, inte de tre instanserna<\u002Fh2>\n      <p>Roten är densamma varje gång: layouten antar att viewporten slutar vid skärmkanten, men bottennavet ligger fast ovanpå de sista 60 px. <span class=\"c\">Token finns redan — <code style=\"font-family:var(--font-body)\">--bottom-nav-height<\u002Fcode>. Använd den konsekvent.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ruler\">\n      <div class=\"pk\">CSS · en regel, varje fullskärmsyta<\u002Fdiv>\n      <h3>Reservera nav-höjden, förankra CTA ovanför den<\u002Fh3>\n      <div class=\"code\">\n<span class=\"c\">/* Varje scrollyta / fullskärmsscen reserverar navet */<\u002Fspan><br>\n.scene, .match-intro, .scroll-region {<br>\n&nbsp;&nbsp;<span class=\"k\">padding-bottom<\u002Fspan>: <span class=\"k\">calc<\u002Fspan>(<span class=\"p\">var(--bottom-nav-height)<\u002Fspan> + <span class=\"p\">var(--safe-bottom)<\u002Fspan> + 12px);<br>\n}<br><br>\n<span class=\"c\">/* Flytande / sticky CTA sitter OVANFÖR navet, aldrig under */<\u002Fspan><br>\n.floating-cta {<br>\n&nbsp;&nbsp;<span class=\"k\">position<\u002Fspan>: sticky; <span class=\"k\">bottom<\u002Fspan>: <span class=\"k\">calc<\u002Fspan>(<span class=\"p\">var(--bottom-nav-height)<\u002Fspan> + <span class=\"p\">var(--safe-bottom)<\u002Fspan>);<br>\n}<br><br>\n<span class=\"c\">/* Modaler slutar ovanför navet, body scrollar i egen höjd */<\u002Fspan><br>\n.modal-card {<br>\n&nbsp;&nbsp;<span class=\"k\">max-height<\u002Fspan>: <span class=\"k\">calc<\u002Fspan>(100<span class=\"s\">dvh<\u002Fspan> - <span class=\"p\">var(--bottom-nav-height)<\u002Fspan> - 28px);<br>\n&nbsp;&nbsp;<span class=\"k\">display<\u002Fspan>: flex; <span class=\"k\">flex-direction<\u002Fspan>: column;<br>\n}<br>\n.modal-body { <span class=\"k\">overflow-y<\u002Fspan>: auto; } <span class=\"c\">/* CTA är sista, icke-krympande barnet */<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin-top:16px\"><b style=\"color:var(--text-light)\">Och M2:<\u002Fb> byt navets <code style=\"font-family:var(--font-body)\">:focus<\u002Fcode> mot <code style=\"font-family:var(--font-body)\">:focus-visible<\u002Fcode> med appens egen markering — den blå systemrutan ska aldrig synas vid klick/tap.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"solo\" style=\"margin-top:24px\">\n      <div class=\"panel\">\n        <div class=\"flag\"><span class=\"fic\">✓<\u002Fspan><span><b>Portal efter cup-match (kontroll):<\u002Fb> ser rätt ut. Där sitter \"Spela cup-semifinal\" redan korrekt ovanför navet — det är den layouten match-intro och modalen ska ärva. Använd portalen som referens.<\u002Fspan><\u002Fdiv>\n        <div class=\"flag des\"><span class=\"fic\">→<\u002Fspan><span><b>Regression-vakt:<\u002Fb> en enkel visuell/test-check — \"primär-CTA ska ha ≥ nav-höjd marginal till viewport-botten\" — fångar det här innan det blir fel en fjärde gång.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\">\n      <b>CTA mot bottennav — mönsterfix<\u002Fb> · 2026-06-23 · korrvända 3<br>\n      Ett mönster, inte tre buggar: M1 (match-intro) + M3 (halvtidsmodal) + M2 (fokusring). Roten: layouter tar inte höjd för det fasta bottennavet. Fix: reservera <b>--bottom-nav-height<\u002Fb> i varje fullskärmsyta, förankra CTA:er ovanför navet, modaler scrollar i egen höjd med sticky CTA. Referens: portalen gör redan rätt.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fbody><\u002Fhtml>"
