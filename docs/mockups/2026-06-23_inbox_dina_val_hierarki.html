document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"sv\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Inbox + Dina val — täthet &amp; hierarki<\u002Ftitle>\n<style>/* ═══════════════════════════════════════════════════════════\n   BANDY MANAGER — Design Tokens\n   \"Heritage Bandy\" palette. Warm stone/paper backgrounds,\n   copper accent, ice-blue cool, Georgia display + system body.\n   Source: bandy-manager/src/styles/global.css\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Backgrounds (light) ─────────────────────────── */\n  --bg:              #EDE8DF;  /* warm paper */\n  --bg-surface:      #FAF8F4;  /* card */\n  --bg-elevated:     #FFFFFF;\n\n  /* ── Backgrounds (dark / leather) ────────────────── */\n  --bg-dark:         #0E0D0B;\n  --bg-dark-surface: #1E1D19;\n  --bg-dark-elevated:#2C2A24;\n  --bg-leather:      #3D3A32;  /* header strips */\n\n  /* ── Portal (mörka dashboard-tokens) ─────────────── */\n  /* Sätts på documentElement av PortalScreen, tonas per säsongsfas. */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n\n  /* ── Scen (alias för Portal — förtydligar scen-kontext) ─ */\n  /* Används av ArrivalScene, BoardMeetingScene, CoffeeRoomScene m.fl. */\n  --bg-scene: var(--bg-portal);\n\n  /* ── Severity (journalist-relation, signaturer) ──── */\n  --cold: #4a6680;  /* kall blå — neg severity, cold_winter-signatur */\n  --warm: #8c6e3a;  /* varm guld — injury_curve, warm severity */\n\n  /* ── Seasonal skies (dashboard) ──────────────────── */\n  --bg-october:  linear-gradient(180deg, #E8E4DC 0%, #EDE8DF 100%);\n  --bg-november: linear-gradient(180deg, #D8D4CC 0%, #E8E4DC 100%);\n  --bg-december: linear-gradient(180deg, #F0ECE4 0%, #E8DCCC 100%);\n  --bg-january:  linear-gradient(180deg, #D0D4D8 0%, #E0E4E8 100%);\n  --bg-february: linear-gradient(180deg, #E8E4DC 0%, #F0ECE4 100%);\n  --bg-march:    linear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  --match-bg-cold:    #3D3228;\n  --match-bg-fog:     #2A3228;\n  --match-bg-wind:    #32301E;\n  --match-gold:       #D4B860;\n  --match-warn:       #E8A090;\n  --match-positive:   #A0C890;\n  --match-copper:     #D4A850;\n  --match-home-bg:    #F0EDE6;\n\n  /* ── Archetype (squad badges) ────────────────────── */\n  --arch-finisher:  #c0392b;\n  --arch-playmaker: #2563EB;\n  --arch-defensive: #1a5e3a;\n  --arch-twoway:    #5a2d7a;\n  --arch-reflexgk:  #8B6914;\n  --arch-posgk:     #7b5a14;\n  --arch-dribbler:  #1a5e8a;\n  --arch-corner:    #4a3a8a;\n  --arch-raw:       #2d6e2d;\n  --arch-default:   #1e4d8c;\n\n  /* ── Typography ──────────────────────────────────── */\n  --font-display: 'Georgia', 'Times New Roman', serif;\n  --font-body:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n\n  /* ── Shape ───────────────────────────────────────── */\n  --radius:    14px;   /* round cards (narrative) */\n  --radius-md:  8px;   /* sharp cards, buttons */\n  --radius-sm:  3px;\n\n  /* ── Layout (mobile 375–430px) ───────────────────── */\n  --bottom-nav-height: 60px;\n  --safe-bottom: env(safe-area-inset-bottom, 0px);\n\n  /* ── Elevation (soft, copper-tinted on primary) ─── */\n  --shadow-card:    0 1px 3px rgba(0,0,0,0.05);\n  --shadow-btn:     0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);\n  --shadow-primary: 0 3px 5px rgba(162,88,40,0.38);\n  --shadow-danger:  0 3px 10px rgba(176,80,64,0.40);\n  --shadow-menu:    0 4px 16px rgba(0,0,0,0.15);\n\n  /* ── Z-index scale ───────────────────────────────── */\n  --z-dropdown:    100;  /* @kind other */\n  --z-modal:       300;  /* @kind other */\n  --z-overlay:     400;  /* @kind other */\n  --z-interaction: 500;  /* @kind other */\n  --z-toast:       600;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SEMANTIC TYPE ROLES\n   ═══════════════════════════════════════════════════════════ */\n\n/* Display / numeric (Georgia) — poäng, score, position */\n.h-display-xl { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; }\n.h-display-lg { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; }\n.h-display-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }\n.h-display-sm { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }\n\n/* Card titles (body, heavy) */\n.h-card     { font-family: var(--font-body); font-size: 14px; font-weight: 700; line-height: 1.3; }\n.h-card-sm  { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.3; }\n\n/* Body copy */\n.h-body     { font-family: var(--font-body); font-size: 12px; font-weight: 400; line-height: 1.45; color: var(--text-primary); }\n.h-body-sm  { font-family: var(--font-body); font-size: 11px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); }\n.h-body-xs  { font-family: var(--font-body); font-size: 10px; font-weight: 400; line-height: 1.45; color: var(--text-muted); }\n\n/* Section label — emoji + UPPERCASE letter-spaced */\n.h-label {\n  font-family: var(--font-body);\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin: 0 0 4px 0;\n}\n\n/* Quote / narrative (italic Georgia) */\n.h-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 12px;\n  color: var(--text-secondary);\n  line-height: 1.4;\n}\n\n/* CTA text — uppercase, letter-spaced */\n.h-cta {\n  font-family: var(--font-body);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SCEN-TYPOGRAFI (mörk bakgrund — ArrivalScene m.fl.)\n   Etablerad 2026-05-08 efter scenrevision (handover från Opus).\n   Komplement till .h-* som är dagsljus-optimerade.\n   ═══════════════════════════════════════════════════════════ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPRINT 1 — pre-match-ytor · mock + dokumentation\n   Självständig. Bygger på colors_and_type.css (tokens).\n   ═══════════════════════════════════════════════════════════ */\n\n* { box-sizing: border-box; }\nbody {\n  margin: 0;\n  background: #15120E;\n  color: var(--text-light);\n  font-family: var(--font-body);\n  -webkit-font-smoothing: antialiased;\n}\n.wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }\n\n/* ── HERO ── */\n.hero { padding: 64px 0 38px; border-bottom: 1px solid rgba(196,122,58,0.22); background: radial-gradient(120% 100% at 50% 0%, #211a12 0%, #15120E 70%); }\n.kick { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin: 0; }\n.hero h1 { font-family: var(--font-display); font-size: 50px; font-weight: 800; line-height: 1.04; letter-spacing: -1px; margin: 16px 0 0; color: var(--text-light); }\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub { font-size: 15px; line-height: 1.6; color: var(--text-light-secondary); max-width: 760px; margin: 18px 0 0; }\n.hero .sub em { color: var(--text-light); font-style: italic; }\n.meta { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 26px; font-size: 11.5px; color: var(--text-muted); }\n.meta b { color: var(--accent); font-weight: 600; }\n\n/* ── SCORECARD (sprint summary) ── */\n.scards { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 30px; }\n.scard { background: #1d1812; border: 1px solid rgba(196,122,58,0.2); border-radius: 12px; padding: 16px 17px; }\n.scard .n { font-family: var(--font-display); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1; }\n.scard .l { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 7px; font-weight: 600; }\n.scard .d { font-size: 11px; color: var(--text-light-secondary); margin-top: 5px; line-height: 1.4; }\n\n/* ── SECTION ── */\n.sec { padding: 46px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }\n.sec-head { max-width: 760px; }\n.sec-num { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); }\n.sec-head h2 { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.12; letter-spacing: -0.4px; margin: 11px 0 0; color: var(--text-light); }\n.sec-head p { font-size: 14px; line-height: 1.6; color: var(--text-light-secondary); margin: 12px 0 0; }\n.sec-head p .c { color: var(--accent); font-style: italic; }\n.tagrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }\n.tg { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; }\n.tg.fix { background: rgba(90,154,74,0.16); color: #7CB86A; }\n.tg.des { background: rgba(196,122,58,0.16); color: var(--accent); }\n.tg.bug { background: rgba(176,80,64,0.18); color: #D98878; }\n.tg.q { background: rgba(126,150,180,0.18); color: #9FB6CE; }\n\n/* ── BACKLOG TABLE ── */\n.backlog { margin-top: 8px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }\n.backlog table { width: 100%; border-collapse: collapse; }\n.backlog th, .backlog td { text-align: left; padding: 12px 15px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.07); vertical-align: top; }\n.backlog thead th { background: #1d1812; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }\n.backlog tbody tr:last-child td { border-bottom: none; }\n.backlog .id { font-family: var(--font-display); font-weight: 700; color: var(--accent); width: 40px; }\n.backlog .ti { color: var(--text-light); }\n.backlog .ow { color: var(--text-light-secondary); white-space: nowrap; }\n.backlog .pri { font-weight: 700; font-size: 11px; }\n.backlog .p1 { color: #D98878; } .backlog .p2 { color: var(--accent); } .backlog .p3 { color: var(--text-muted); }\n.mini { display:inline-block; font-size: 8.5px; font-weight: 700; letter-spacing:0.5px; text-transform: uppercase; padding: 1px 6px; border-radius: 99px; }\n.mini.des { background: rgba(196,122,58,0.16); color: var(--accent); }\n.mini.fix { background: rgba(90,154,74,0.16); color: #7CB86A; }\n.mini.bug { background: rgba(176,80,64,0.18); color: #D98878; }\n.mini.q { background: rgba(126,150,180,0.18); color: #9FB6CE; }\n\n/* ── BEFORE / AFTER LAYOUT ── */\n.ba { display: grid; grid-template-columns: 1fr auto 1fr; gap: 22px; align-items: start; margin-top: 26px; }\n.ba-arrow { align-self: center; font-size: 26px; color: var(--accent); }\n.ba-col { min-width: 0; }\n.ba-lbl { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }\n.ba-lbl .dot { width: 8px; height: 8px; border-radius: 99px; }\n.before .dot { background: #B05040; } .after .dot { background: var(--success); }\n.ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.before .t { color: #D98878; } .after .t { color: #7CB86A; }\n.ba-lbl .s { font-size: 11px; color: var(--text-muted); font-style: italic; }\n.ba-notes { margin-top: 13px; display: flex; flex-direction: column; gap: 8px; }\n.ba-note { display: flex; gap: 9px; font-size: 11.5px; line-height: 1.45; color: var(--text-light-secondary); }\n.ba-note .n-ic { flex-shrink: 0; font-weight: 700; }\n.after .n-ic { color: var(--success); } .before .n-ic { color: #B05040; }\n.ba-note b { color: var(--text-light); font-weight: 600; }\n@media (max-width: 940px) { .ba { grid-template-columns: 1fr; } .ba-arrow { display: none; } }\n\n/* single mock centered */\n.solo { display: flex; gap: 30px; margin-top: 26px; align-items: start; }\n.solo .panel { flex: 1; }\n.solo .panel h3 { font-family: var(--font-display); font-size: 19px; color: var(--text-light); margin: 0 0 4px; }\n.solo .panel .pk { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }\n.solo .panel p { font-size: 13px; line-height: 1.6; color: var(--text-light-secondary); margin: 10px 0 0; }\n.flag { display: flex; gap: 11px; margin-top: 12px; padding: 13px 15px; border-radius: 10px; background: rgba(90,154,74,0.07); border: 1px solid rgba(90,154,74,0.22); }\n.flag.des { background: rgba(196,122,58,0.07); border-color: rgba(196,122,58,0.25); }\n.flag .fic { flex-shrink: 0; color: var(--success); font-weight: 700; }\n.flag.des .fic { color: var(--accent); }\n.flag b { color: var(--text-light); font-weight: 600; }\n.flag span { font-size: 12px; line-height: 1.5; color: var(--text-light-secondary); }\n@media (max-width: 760px) { .solo { flex-direction: column; } }\n\n/* ═══════════════ PHONE FRAME (app-trogen) ═══════════════ */\n.phone { width: 300px; flex-shrink: 0; border-radius: 26px; background: #0a0a0a; padding: 7px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin: 0 auto; }\n.scr { border-radius: 20px; overflow: hidden; background: var(--bg); position: relative; }\n.scr.dark { background: var(--bg-portal); }\n\n/* app header */\n.gh { background: var(--bg-portal); padding: 9px 11px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(196,122,58,0.3); }\n.gh-logo { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-dark); display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 800; color: var(--text-light-secondary); flex-shrink: 0; }\n.gh-mid { min-width: 0; }\n.gh-club { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-light); line-height: 1; }\n.gh-sub { font-size: 8.5px; color: var(--text-muted); font-style: italic; margin-top: 2px; }\n.gh-omg { margin-left: auto; font-size: 8px; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 2px 5px; font-weight: 700; flex-shrink: 0; }\n.gh-ic { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }\n\n/* phase nav */\n.phase { background: var(--bg-portal); display: flex; align-items: center; padding: 7px 11px; gap: 6px; border-bottom: 1.5px solid var(--accent); }\n.phase .pp { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }\n.phase .pp.on { color: var(--accent); }\n.phase .pl { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }\n\n/* body */\n.body { padding: 11px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }\n.body.beige { background: var(--bg); }\n\n/* generic app card */\n.acard { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 11px 12px; }\n.acard.sharp { border-radius: var(--radius-md); }\n.alabel { font-size: 7.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n\n/* bottom nav */\n.bn { display: flex; background: var(--bg-surface); border-top: 1px solid var(--border); padding: 6px 4px 7px; }\n.bn .bi { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 7.5px; color: var(--text-muted); }\n.bn .bi.on { color: var(--accent); }\n.bn .bi .g { font-size: 13px; }\n\n/* highlight ring for the thing being fixed */\n.hl { position: relative; }\n.hl::after { content: ''; position: absolute; inset: -4px; border: 2px solid var(--accent); border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 4px rgba(196,122,58,0.12); }\n\n/* ── pill nav demo ── */\n.pillrow { display: flex; gap: 6px; padding: 9px 11px; background: var(--bg); }\n.pillrow.scroll { overflow: hidden; }\n.pill { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-dark); background: var(--bg-elevated); color: var(--text-secondary); white-space: nowrap; }\n.pill.on { background: var(--accent); color: #fff; border-color: var(--accent); }\n.pill.cut { opacity: 0.5; }\n\n/* segmented underline nav (the fix) */\n.segnav { display: grid; padding: 0 6px; background: var(--bg); border-bottom: 1px solid var(--border); }\n.segnav .row { display: flex; }\n.segitem { flex: 1; text-align: center; font-size: 9.5px; font-weight: 700; padding: 9px 2px; color: var(--text-muted); border-bottom: 2px solid transparent; }\n.segitem.on { color: var(--accent); border-bottom-color: var(--accent); }\n\n/* mode dial */\n.dial { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }\n.dbtn { border-radius: 7px; border: 1px solid var(--border); background: var(--bg-elevated); padding: 7px 3px; text-align: center; }\n.dbtn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }\n.dbtn .dn { font-size: 12px; font-weight: 700; color: var(--text-primary); }\n.dbtn.on .dn { color: var(--accent-dark); }\n.dbtn .de { font-size: 7px; color: var(--text-muted); margin-top: 2px; line-height: 1.2; }\n.dbtn.on .de { color: var(--accent); }\n\n/* reaction row */\n.rrow { display: flex; align-items: center; gap: 7px; padding: 7px 4px; border-top: 1px solid var(--border); }\n.rrow .pos { width: 22px; text-align: center; font-size: 9px; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 2px 0; flex-shrink: 0; }\n.rrow .nm { flex: 1; min-width: 0; }\n.rrow .nm .n1 { font-size: 12px; font-weight: 600; color: var(--text-primary); }\n.rrow .nm .n2 { font-size: 9px; color: var(--text-muted); }\n.rrow .flagpill { font-size: 8.5px; font-weight: 600; padding: 2px 6px; border-radius: 99px; white-space: nowrap; }\n.rrow .ov { display: flex; gap: 4px; flex-shrink: 0; }\n.ovbtn { font-size: 9px; font-weight: 600; padding: 3px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-elevated); color: var(--text-secondary); white-space: nowrap; }\n.ovbtn.cryptic { width: 22px; text-align: center; color: var(--text-muted); }\n\n/* player row (värvning) */\n.prow { display: flex; align-items: center; gap: 9px; padding: 9px 2px; border-top: 1px solid var(--border); }\n.prow:first-child { border-top: none; }\n.prow .pn { flex: 1; min-width: 0; }\n.prow .pn .p1 { font-size: 12.5px; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); }\n.prow .pn .p2 { font-size: 9.5px; color: var(--text-muted); margin-top: 1px; }\n.prow .pbtn { font-size: 9.5px; font-weight: 600; padding: 5px 10px; border: 1px solid var(--accent); border-radius: 6px; color: var(--accent-dark); background: transparent; white-space: nowrap; flex-shrink: 0; }\n.prow .pbtn.disabled { border-color: var(--border); color: var(--text-muted); opacity: 0.6; }\n\n/* messy version markers */\n.messy .p1 { font-size: 10px; font-weight: 700; }\n.messy .pbtn { padding: 5px 4px; font-size: 8.5px; line-height: 1.1; max-width: 52px; }\n\n/* dropdown demo */\n.dd { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-elevated); color: var(--text-secondary); font-size: 11px; }\n.dd.big { padding: 13px 12px; font-size: 13px; }\n.dd.tight { padding: 8px 11px; font-size: 11px; }\n.dd .cv { color: var(--text-muted); font-size: 9px; }\n\n/* empty state */\n.empty { text-align: center; padding: 22px 14px; }\n.empty .et { font-family: var(--font-display); font-style: italic; color: var(--text-muted); font-size: 12px; }\n.empty.guide { background: var(--bg-surface); border: 1px dashed var(--border-dark); border-radius: var(--radius-md); }\n.empty.guide .eh { font-size: 12px; color: var(--text-primary); font-weight: 600; font-family: var(--font-body); font-style: normal; }\n.empty.guide .es { font-size: 11px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }\n.empty.guide .eb { display: inline-block; margin-top: 11px; font-size: 11px; font-weight: 700; color: var(--accent-dark); border: 1px solid var(--accent); border-radius: 7px; padding: 6px 14px; }\n\n/* intro/help line normalized */\n.introline { display: flex; gap: 8px; align-items: flex-start; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 11px; }\n.introline.bad { border-color: rgba(176,80,64,0.4); }\n.introline .ii { font-size: 11px; flex-shrink: 0; }\n.introline .it { font-size: 10.5px; color: var(--text-secondary); line-height: 1.4; }\n.introline .it b { color: var(--text-primary); font-weight: 600; }\n\n/* build node */\n.bnode { border-radius: 7px; padding: 9px 11px; margin-bottom: 7px; position: relative; }\n.bnode.dashed { border: 1px dashed var(--border-dark); background: transparent; }\n.bnode.solid { border: 1px solid var(--border); background: var(--bg-surface); }\n.bnode .bt { display: flex; align-items: center; gap: 6px; }\n.bnode .bt .bttl { font-size: 12.5px; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); }\n.bnode .bt .bstate { margin-left: auto; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; }\n.bstate.ok { background: rgba(90,154,74,0.14); color: var(--success-light); }\n.bstate.lock { background: var(--border); color: var(--text-muted); }\n.bstate.trial { background: rgba(126,150,180,0.16); color: var(--ice-dark); }\n.bnode .bd { font-size: 9.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }\n.bnode .bdim { display: flex; gap: 9px; margin-top: 5px; font-size: 9px; font-weight: 600; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* foot */\n.foot { margin-top: 40px; padding: 22px 0 60px; font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }\n.foot b { color: var(--text-light-secondary); }\n<\u002Fstyle>\n<style>\n  /* inbox rows */\n  .ibx { display: flex; flex-direction: column; }\n  .ibx-sec { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 6px; padding: 8px 2px 5px; }\n  .ibx-sec .ct { margin-left: auto; color: var(--accent); }\n  /* busy version: every row a fat card */\n  .ib-fat { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 7px; padding: 9px 10px; margin-bottom: 6px; background: var(--bg-surface); }\n  .ib-fat .t1 { font-size: 11.5px; font-weight: 700; color: var(--text-primary); }\n  .ib-fat .t2 { font-size: 9.5px; color: var(--text-secondary); margin-top: 2px; line-height: 1.35; }\n  /* fixed version */\n  .ib-card { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 7px; padding: 9px 10px; margin-bottom: 6px; background: var(--bg-surface); }\n  .ib-card .t1 { font-size: 11.5px; font-weight: 700; color: var(--text-primary); display: flex; }\n  .ib-card .t1 .when { margin-left: auto; font-size: 8px; color: var(--text-muted); font-weight: 400; }\n  .ib-card .t2 { font-size: 9.5px; color: var(--text-secondary); margin-top: 2px; }\n  .ib-card .lnk { font-size: 9.5px; color: var(--accent-dark); font-weight: 700; margin-top: 4px; }\n  .ib-thin { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border); }\n  .ib-thin .ic { width: 16px; text-align: center; font-size: 10px; color: var(--text-muted); flex-shrink: 0; }\n  .ib-thin .tx { flex: 1; min-width: 0; font-size: 10.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .ib-thin .tx b { color: var(--text-primary); font-weight: 600; }\n  .ib-thin.read .tx { color: var(--text-muted); }\n  .ib-thin.read .tx b { color: var(--text-secondary); font-weight: 400; }\n  .ib-thin .wh { font-size: 8px; color: var(--text-muted); flex-shrink: 0; }\n  /* grouped roll-up */\n  .ib-group { display: flex; align-items: center; gap: 8px; padding: 7px 9px; background: color-mix(in srgb, var(--accent) 5%, var(--bg-surface)); border: 1px dashed var(--border-dark); border-radius: 7px; margin-bottom: 6px; }\n  .ib-group .gc { width: 20px; height: 20px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-dark); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex-shrink: 0; }\n  .ib-group .gt { flex: 1; font-size: 10.5px; color: var(--text-primary); font-weight: 600; }\n  .ib-group .gx { font-size: 9px; color: var(--accent-dark); font-weight: 700; }\n\n  /* dina val rows */\n  .dv-flat .lbl { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-primary); margin-top: 11px; }\n  .dv-flat .it { font-family: var(--font-display); font-style: italic; font-size: 11px; color: var(--text-secondary); margin-top: 2px; line-height: 1.4; }\n  .dv-row { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-surface); margin-bottom: 6px; }\n  .dv-row .res { width: 6px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }\n  .dv-row.good .res { background: var(--success); } .dv-row.neu .res { background: var(--text-muted); } .dv-row.bad .res { background: var(--danger); }\n  .dv-row .body2 { flex: 1; min-width: 0; }\n  .dv-row .dh { font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }\n  .dv-row .dn { font-size: 12px; font-weight: 700; color: var(--text-primary); margin-top: 1px; }\n  .dv-row .do { font-size: 9.5px; color: var(--text-secondary); margin-top: 2px; }\n  .dv-row .pct { text-align: right; flex-shrink: 0; }\n  .dv-row .pct .pv { font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1; }\n  .dv-row.good .pv { color: var(--success); } .dv-row.neu .pv { color: var(--text-secondary); } .dv-row.bad .pv { color: var(--danger-text); }\n  .dv-row .pct .pl { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">Sprint 1 · mockar · korrvända 3<\u002Fp>\n    <h1>Actionable innehåll ska <em>se actionable ut<\u002Fem><\u002Fh1>\n    <p class=\"sub\">Två ytor där viktigt, handlingsbart innehåll dränks i jämntjock text: <em>inboxen som blir en vägg av lika tunga rader, och \"Dina val\" där matchavgörande beslut staplas som prosa.<\u002Fem> Båda löses med hierarki och struktur — inte mer innehåll.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Fynd<\u002Fb> · M12 inbox · M15 Dina val<\u002Fspan>\n      <span><b>Princip<\u002Fb> · hierarki före volym<\u002Fspan>\n      <span><b>2026-06-23<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- 01 · INBOX -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — INBOXEN<\u002Fdiv>\n      <h2>20 rader, alla lika tunga<\u002Fh2>\n      <p>Allt väger lika mycket och repeterade typer staplas (två \"Birgitta Nordin\", flera nemesis, flera Allehanda). <span class=\"c\">Ge \"Kräver svar\" tyngd, gör nyheter tunna, dämpa lästa, och rulla ihop dubbletter.<\u002Fspan><\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">M12 täthet &amp; hierarki<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">allt som feta kort<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"gap:0;padding:11px\">\n              <div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-primary)\">Inkorg<\u002Fspan><span style=\"font-size:10px;color:var(--accent)\">19 olästa<\u002Fspan><\u002Fdiv>\n              <div class=\"ibx-sec\" style=\"margin-top:6px\">● Kräver svar <span class=\"ct\">5<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-fat\"><div class=\"t1\">Nemesis: Folke Karlsson<\u002Fdiv><div class=\"t2\">Folke Karlsson (Målilla) har nu gjort 2 mål mot oss. Är…<\u002Fdiv><\u002Fdiv>\n              <div class=\"ib-fat\"><div class=\"t1\">Nemesis: Filip Hagberg<\u002Fdiv><div class=\"t2\">Filip Hagberg (Målilla) har nu gjort 3 mål mot oss. Är d…<\u002Fdiv><\u002Fdiv>\n              <div class=\"ib-fat\"><div class=\"t1\">Träningsprojekt klart: Fyspass<\u002Fdiv><div class=\"t2\">Fyspass är avslutat. Effekt: +2 Acceleration &amp; Arbet…<\u002Fdiv><\u002Fdiv>\n              <div class=\"ibx-sec\" style=\"margin-top:6px\">● Nyheter <span class=\"ct\">12<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-fat\"><div class=\"t1\">Loppis till förmån för laget<\u002Fdiv><div class=\"t2\">Föräldrarna till juniorspelarna vill arrangera…<\u002Fdiv><\u002Fdiv>\n              <div class=\"ib-fat\"><div class=\"t1\">Storseger mot tabellsvagt motstånd<\u002Fdiv><div class=\"t2\">Helena Wikström, Allehanda<\u002Fdiv><\u002Fdiv>\n              <div class=\"ib-fat\"><div class=\"t1\">Birgitta Nordin på besök<\u002Fdiv><div class=\"t2\">Birgitta Nordin tackade ja till inbjudan…<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Varje rad är ett tjockt kort — inget sticker ut, allt skriker lika högt.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Dubbletter (2× Birgitta, flera nemesis) staplas i full storlek.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">kort · tunt · grupperat<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"gap:0;padding:11px\">\n              <div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-primary)\">Inkorg<\u002Fspan><span style=\"font-size:10px;color:var(--accent)\">19 olästa<\u002Fspan><\u002Fdiv>\n              <div class=\"ibx-sec\" style=\"margin-top:6px\">● Kräver svar <span class=\"ct\">5<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-group\"><span class=\"gc\">3<\u002Fspan><span class=\"gt\">Nemesis-uppdateringar<\u002Fspan><span class=\"gx\">Visa ›<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-card\"><div class=\"t1\">Träningsprojekt klart: Fyspass<span class=\"when\">Omg 3<\u002Fspan><\u002Fdiv><div class=\"t2\">+2 Acceleration &amp; Arbetskapacitet.<\u002Fdiv><div class=\"lnk\">Klubb ›<\u002Fdiv><\u002Fdiv>\n              <div class=\"ib-card\"><div class=\"t1\">Karriärsmilstolpe: Sven Berglund<span class=\"when\">Omg 3<\u002Fspan><\u002Fdiv><div class=\"t2\">Hattrick — nådde en milstolpe.<\u002Fdiv><div class=\"lnk\">Sven Berglund ›<\u002Fdiv><\u002Fdiv>\n              <div class=\"ibx-sec\" style=\"margin-top:8px\">● Nyheter <span class=\"ct\">12<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-group\"><span class=\"gc\">3<\u002Fspan><span class=\"gt\">Allehanda · mediaröster<\u002Fspan><span class=\"gx\">Visa ›<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-thin\"><span class=\"ic\">🏘️<\u002Fspan><span class=\"tx\"><b>Loppis till förmån för laget<\u002Fb><\u002Fspan><span class=\"wh\">Omg 4<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-thin read\"><span class=\"ic\">📰<\u002Fspan><span class=\"tx\">Storseger mot tabellsvagt motstånd<\u002Fspan><span class=\"wh\">Omg 3<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-thin read\"><span class=\"ic\">🏥<\u002Fspan><span class=\"tx\">Tillbaka: Elias Fagerberg frisk igen<\u002Fspan><span class=\"wh\">Omg 4<\u002Fspan><\u002Fdiv>\n              <div class=\"ib-group\"><span class=\"gc\">2<\u002Fspan><span class=\"gt\">Birgitta Nordin på besök<\u002Fspan><span class=\"gx\">Visa ›<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>\"Kräver svar\" som kort, nyheter som tunna rader<\u002Fb> — ögat hittar det actionable direkt.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Dubbletter rullas ihop<\u002Fb> (\"3 nemesis\", \"2 Birgitta\") — listan andas, inget tappas.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Lästa dämpas<\u002Fb> så olästa drar blicken. Samma anti-brus-princip som portal-beatsen.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 · DINA VAL -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — DINA VAL (GRANSKA)<\u002Fdiv>\n      <h2>Matchavgörande beslut staplade som prosa<\u002Fh2>\n      <p>\"Dina val\" bär riktigt actionable info — vem du satte som kapten, vilka som startade trötta och hur det föll ut (0% / 21% / 9%). <span class=\"c\">Men det renderas som UPPERCASE-etikett + kursiv mening, om och om igen → en vägg.<\u002Fspan> Strukturera som utfallsrader med tydligt resultat.<\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">M15 struktur<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">etikett + kursiv, staplat<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"padding:13px\">\n              <div class=\"alabel\" style=\"margin-bottom:2px\">📋 Dina val<\u002Fdiv>\n              <div class=\"dv-flat\">\n                <div class=\"it\" style=\"margin-top:4px\">Dina beslut den här matchen, och hur de föll ut.<\u002Fdiv>\n                <div class=\"lbl\">Kapten: Sandström<\u002Fdiv>\n                <div class=\"it\">Ledarorden satte sig i omklädningsrummet.<\u002Fdiv>\n                <div class=\"lbl\">Startade trött: Sandström (0%)<\u002Fdiv>\n                <div class=\"it\">Sandström gjorde sitt, varken mer eller mindre.<\u002Fdiv>\n                <div class=\"lbl\">Startade trött: Stål (21%)<\u002Fdiv>\n                <div class=\"it\">Stål gjorde sitt, varken mer eller mindre.<\u002Fdiv>\n                <div class=\"lbl\">Startade trött: Lindgren (9%)<\u002Fdiv>\n                <div class=\"it\">Lindgren gjorde sitt, varken mer eller mindre.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Procenten (0/21/9%) — det mest intressanta — göms inne i en etikett.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Tre nästan identiska kursivmeningar i rad → läses inte, scannas inte.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">utfallsrader med resultat<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"padding:13px\">\n              <div class=\"alabel\" style=\"margin-bottom:7px\">📋 Dina val · utfall<\u002Fdiv>\n              <div class=\"dv-row good\">\n                <div class=\"res\"><\u002Fdiv>\n                <div class=\"body2\"><div class=\"dh\">Kapten<\u002Fdiv><div class=\"dn\">Sandström<\u002Fdiv><div class=\"do\">Ledarorden satte sig i omklädningsrummet.<\u002Fdiv><\u002Fdiv>\n                <div class=\"pct\"><div class=\"pv\">✓<\u002Fdiv><div class=\"pl\">gav effekt<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"dv-row neu\">\n                <div class=\"res\"><\u002Fdiv>\n                <div class=\"body2\"><div class=\"dh\">Startade trött<\u002Fdiv><div class=\"dn\">Stål<\u002Fdiv><div class=\"do\">Klarade matchen utan att sjunka.<\u002Fdiv><\u002Fdiv>\n                <div class=\"pct\"><div class=\"pv\">21%<\u002Fdiv><div class=\"pl\">trötthet<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"dv-row neu\">\n                <div class=\"res\"><\u002Fdiv>\n                <div class=\"body2\"><div class=\"dh\">Startade trött<\u002Fdiv><div class=\"dn\">Lindgren<\u002Fdiv><div class=\"do\">Höll måttet, ingen påverkan.<\u002Fdiv><\u002Fdiv>\n                <div class=\"pct\"><div class=\"pv\">9%<\u002Fdiv><div class=\"pl\">trötthet<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"dv-row neu\">\n                <div class=\"res\"><\u002Fdiv>\n                <div class=\"body2\"><div class=\"dh\">Startade trött<\u002Fdiv><div class=\"dn\">Sandström<\u002Fdiv><div class=\"do\">Gjorde sitt, varken mer eller mindre.<\u002Fdiv><\u002Fdiv>\n                <div class=\"pct\"><div class=\"pv\">0%<\u002Fdiv><div class=\"pl\">trötthet<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Siffran fram<\u002Fb> — trötthet-% som stort tal till höger, scanbart på en blick.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Resultat-stripe<\u002Fb> (grön/grå/röd) säger direkt om valet lönade sig.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Beslut + utfall i en rad<\u002Fb> — ingen prosa-vägg, men berättelsen finns kvar i underraden.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\">\n      <b>Inbox + Dina val — täthet &amp; hierarki<\u002Fb> · 2026-06-23 · korrvända 3<br>\n      Två ytor, samma princip: handlingsbart och intressant innehåll ska ha visuell tyngd, repetition ska komprimeras, prosa-väggar struktureras. M12 (inbox) + M15 (Dina val). Ärver anti-brus-tänket från portal-beats/callback.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fbody><\u002Fhtml>"
