document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"sv\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Sprint 1 — pre-match-ytor<\u002Ftitle>\n<style>/* ═══════════════════════════════════════════════════════════\n   BANDY MANAGER — Design Tokens\n   \"Heritage Bandy\" palette. Warm stone/paper backgrounds,\n   copper accent, ice-blue cool, Georgia display + system body.\n   Source: bandy-manager/src/styles/global.css\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Backgrounds (light) ─────────────────────────── */\n  --bg:              #EDE8DF;  /* warm paper */\n  --bg-surface:      #FAF8F4;  /* card */\n  --bg-elevated:     #FFFFFF;\n\n  /* ── Backgrounds (dark / leather) ────────────────── */\n  --bg-dark:         #0E0D0B;\n  --bg-dark-surface: #1E1D19;\n  --bg-dark-elevated:#2C2A24;\n  --bg-leather:      #3D3A32;  /* header strips */\n\n  /* ── Portal (mörka dashboard-tokens) ─────────────── */\n  /* Sätts på documentElement av PortalScreen, tonas per säsongsfas. */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n\n  /* ── Scen (alias för Portal — förtydligar scen-kontext) ─ */\n  /* Används av ArrivalScene, BoardMeetingScene, CoffeeRoomScene m.fl. */\n  --bg-scene: var(--bg-portal);\n\n  /* ── Severity (journalist-relation, signaturer) ──── */\n  --cold: #4a6680;  /* kall blå — neg severity, cold_winter-signatur */\n  --warm: #8c6e3a;  /* varm guld — injury_curve, warm severity */\n\n  /* ── Seasonal skies (dashboard) ──────────────────── */\n  --bg-october:  linear-gradient(180deg, #E8E4DC 0%, #EDE8DF 100%);\n  --bg-november: linear-gradient(180deg, #D8D4CC 0%, #E8E4DC 100%);\n  --bg-december: linear-gradient(180deg, #F0ECE4 0%, #E8DCCC 100%);\n  --bg-january:  linear-gradient(180deg, #D0D4D8 0%, #E0E4E8 100%);\n  --bg-february: linear-gradient(180deg, #E8E4DC 0%, #F0ECE4 100%);\n  --bg-march:    linear-gradient(180deg, #F0E0DC 0%, #EDE8DF 100%);\n  --bg-april:    linear-gradient(180deg, #E8F0E4 0%, #F0F5EC 100%);\n\n  /* ── Borders ─────────────────────────────────────── */\n  --border:      #DDD7CC;\n  --border-dark: #C4BAA8;\n\n  /* ── Text on light ───────────────────────────────── */\n  --text-primary:   #1A1A18;\n  --text-secondary: #6B6760;\n  --text-muted:     #8A857A;\n\n  /* ── Text on dark ────────────────────────────────── */\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n\n  /* ── Accent — copper / terracotta ────────────────── */\n  --accent:      #C47A3A;\n  --accent-dark: #A25828;\n  --accent-deep: #8B4820;  /* deepest — CTA end stop */\n\n  /* ── Semantic ────────────────────────────────────── */\n  --success:       #5A9A4A;\n  --success-light: #4A6A3A;\n  --warning:       #C47A3A;\n  --danger:        #B05040;\n  --danger-dark:   #8B3E30;\n  --danger-text:   #8B3E30;\n  --ice:           #7EB3D4;  /* away, weather, cool info */\n  --ice-dark:      #5A7A8A;\n\n  /* ── LED scoreboard ──────────────────────────────── */\n  --led-bg:          #0A0A0A;\n  --led-border:      #1A1A1A;\n  --led-score:       #FF1A1A;\n  --led-score-flash: #FF9900;\n  --led-time:        #CCFF00;\n  --led-warn:        #FF6644;  /* utvisningar */\n  /* Vi/dom-kodning — ratificerad 2026-06-11 (skördad ur build 050bb22).\n     --led-us = managed klubb (amber), --led-them = motståndare (is-LED).\n     Gäller poäng + lagkodad statistik på tavlan. Tid/period förblir --led-score.\n     Hela LED-paletten är FORTSATT reserverad för tavlan — aldrig annan chrome. */\n  --led-us:          #FFB033;\n  --led-them:        #6FC0E8;\n\n  /* ── Disabled (ratificerad 2026-06-11, B8) ───────── */\n  /* Disabled-knapp = samma färgfamilj @ 40% opacity. Aldrig egen färg. */\n  --disabled-opacity: 0.4;  /* @kind other */\n\n  /* ── Match atmosphere (weather-tinted leather) ──── */\n  --match-bg-default: #3D3520;\n  --match-bg-rain:    #2A2418;\n  --match-bg-snow:    #322E22;\n  --match-bg-cold:    #3D3228;\n  --match-bg-fog:     #2A3228;\n  --match-bg-wind:    #32301E;\n  --match-gold:       #D4B860;\n  --match-warn:       #E8A090;\n  --match-positive:   #A0C890;\n  --match-copper:     #D4A850;\n  --match-home-bg:    #F0EDE6;\n\n  /* ── Archetype (squad badges) ────────────────────── */\n  --arch-finisher:  #c0392b;\n  --arch-playmaker: #2563EB;\n  --arch-defensive: #1a5e3a;\n  --arch-twoway:    #5a2d7a;\n  --arch-reflexgk:  #8B6914;\n  --arch-posgk:     #7b5a14;\n  --arch-dribbler:  #1a5e8a;\n  --arch-corner:    #4a3a8a;\n  --arch-raw:       #2d6e2d;\n  --arch-default:   #1e4d8c;\n\n  /* ── Typography ──────────────────────────────────── */\n  --font-display: 'Georgia', 'Times New Roman', serif;\n  --font-body:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n\n  /* ── Shape ───────────────────────────────────────── */\n  --radius:    14px;   /* round cards (narrative) */\n  --radius-md:  8px;   /* sharp cards, buttons */\n  --radius-sm:  3px;\n\n  /* ── Layout (mobile 375–430px) ───────────────────── */\n  --bottom-nav-height: 60px;\n  --safe-bottom: env(safe-area-inset-bottom, 0px);\n\n  /* ── Elevation (soft, copper-tinted on primary) ─── */\n  --shadow-card:    0 1px 3px rgba(0,0,0,0.05);\n  --shadow-btn:     0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);\n  --shadow-primary: 0 3px 5px rgba(162,88,40,0.38);\n  --shadow-danger:  0 3px 10px rgba(176,80,64,0.40);\n  --shadow-menu:    0 4px 16px rgba(0,0,0,0.15);\n\n  /* ── Z-index scale ───────────────────────────────── */\n  --z-dropdown:    100;  /* @kind other */\n  --z-modal:       300;  /* @kind other */\n  --z-overlay:     400;  /* @kind other */\n  --z-interaction: 500;  /* @kind other */\n  --z-toast:       600;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SEMANTIC TYPE ROLES\n   ═══════════════════════════════════════════════════════════ */\n\n/* Display / numeric (Georgia) — poäng, score, position */\n.h-display-xl { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; }\n.h-display-lg { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; }\n.h-display-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }\n.h-display-sm { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }\n\n/* Card titles (body, heavy) */\n.h-card     { font-family: var(--font-body); font-size: 14px; font-weight: 700; line-height: 1.3; }\n.h-card-sm  { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.3; }\n\n/* Body copy */\n.h-body     { font-family: var(--font-body); font-size: 12px; font-weight: 400; line-height: 1.45; color: var(--text-primary); }\n.h-body-sm  { font-family: var(--font-body); font-size: 11px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); }\n.h-body-xs  { font-family: var(--font-body); font-size: 10px; font-weight: 400; line-height: 1.45; color: var(--text-muted); }\n\n/* Section label — emoji + UPPERCASE letter-spaced */\n.h-label {\n  font-family: var(--font-body);\n  font-size: 8px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--text-muted);\n  margin: 0 0 4px 0;\n}\n\n/* Quote / narrative (italic Georgia) */\n.h-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 12px;\n  color: var(--text-secondary);\n  line-height: 1.4;\n}\n\n/* CTA text — uppercase, letter-spaced */\n.h-cta {\n  font-family: var(--font-body);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SCEN-TYPOGRAFI (mörk bakgrund — ArrivalScene m.fl.)\n   Etablerad 2026-05-08 efter scenrevision (handover från Opus).\n   Komplement till .h-* som är dagsljus-optimerade.\n   ═══════════════════════════════════════════════════════════ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPRINT 1 — pre-match-ytor · mock + dokumentation\n   Självständig. Bygger på colors_and_type.css (tokens).\n   ═══════════════════════════════════════════════════════════ */\n\n* { box-sizing: border-box; }\nbody {\n  margin: 0;\n  background: #15120E;\n  color: var(--text-light);\n  font-family: var(--font-body);\n  -webkit-font-smoothing: antialiased;\n}\n.wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }\n\n/* ── HERO ── */\n.hero { padding: 64px 0 38px; border-bottom: 1px solid rgba(196,122,58,0.22); background: radial-gradient(120% 100% at 50% 0%, #211a12 0%, #15120E 70%); }\n.kick { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin: 0; }\n.hero h1 { font-family: var(--font-display); font-size: 50px; font-weight: 800; line-height: 1.04; letter-spacing: -1px; margin: 16px 0 0; color: var(--text-light); }\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub { font-size: 15px; line-height: 1.6; color: var(--text-light-secondary); max-width: 760px; margin: 18px 0 0; }\n.hero .sub em { color: var(--text-light); font-style: italic; }\n.meta { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 26px; font-size: 11.5px; color: var(--text-muted); }\n.meta b { color: var(--accent); font-weight: 600; }\n\n/* ── SCORECARD (sprint summary) ── */\n.scards { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 30px; }\n.scard { background: #1d1812; border: 1px solid rgba(196,122,58,0.2); border-radius: 12px; padding: 16px 17px; }\n.scard .n { font-family: var(--font-display); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1; }\n.scard .l { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 7px; font-weight: 600; }\n.scard .d { font-size: 11px; color: var(--text-light-secondary); margin-top: 5px; line-height: 1.4; }\n\n/* ── SECTION ── */\n.sec { padding: 46px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }\n.sec-head { max-width: 760px; }\n.sec-num { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); }\n.sec-head h2 { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.12; letter-spacing: -0.4px; margin: 11px 0 0; color: var(--text-light); }\n.sec-head p { font-size: 14px; line-height: 1.6; color: var(--text-light-secondary); margin: 12px 0 0; }\n.sec-head p .c { color: var(--accent); font-style: italic; }\n.tagrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }\n.tg { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; }\n.tg.fix { background: rgba(90,154,74,0.16); color: #7CB86A; }\n.tg.des { background: rgba(196,122,58,0.16); color: var(--accent); }\n.tg.bug { background: rgba(176,80,64,0.18); color: #D98878; }\n.tg.q { background: rgba(126,150,180,0.18); color: #9FB6CE; }\n\n/* ── BACKLOG TABLE ── */\n.backlog { margin-top: 8px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }\n.backlog table { width: 100%; border-collapse: collapse; }\n.backlog th, .backlog td { text-align: left; padding: 12px 15px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.07); vertical-align: top; }\n.backlog thead th { background: #1d1812; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }\n.backlog tbody tr:last-child td { border-bottom: none; }\n.backlog .id { font-family: var(--font-display); font-weight: 700; color: var(--accent); width: 40px; }\n.backlog .ti { color: var(--text-light); }\n.backlog .ow { color: var(--text-light-secondary); white-space: nowrap; }\n.backlog .pri { font-weight: 700; font-size: 11px; }\n.backlog .p1 { color: #D98878; } .backlog .p2 { color: var(--accent); } .backlog .p3 { color: var(--text-muted); }\n.mini { display:inline-block; font-size: 8.5px; font-weight: 700; letter-spacing:0.5px; text-transform: uppercase; padding: 1px 6px; border-radius: 99px; }\n.mini.des { background: rgba(196,122,58,0.16); color: var(--accent); }\n.mini.fix { background: rgba(90,154,74,0.16); color: #7CB86A; }\n.mini.bug { background: rgba(176,80,64,0.18); color: #D98878; }\n.mini.q { background: rgba(126,150,180,0.18); color: #9FB6CE; }\n\n/* ── BEFORE / AFTER LAYOUT ── */\n.ba { display: grid; grid-template-columns: 1fr auto 1fr; gap: 22px; align-items: start; margin-top: 26px; }\n.ba-arrow { align-self: center; font-size: 26px; color: var(--accent); }\n.ba-col { min-width: 0; }\n.ba-lbl { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }\n.ba-lbl .dot { width: 8px; height: 8px; border-radius: 99px; }\n.before .dot { background: #B05040; } .after .dot { background: var(--success); }\n.ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.before .t { color: #D98878; } .after .t { color: #7CB86A; }\n.ba-lbl .s { font-size: 11px; color: var(--text-muted); font-style: italic; }\n.ba-notes { margin-top: 13px; display: flex; flex-direction: column; gap: 8px; }\n.ba-note { display: flex; gap: 9px; font-size: 11.5px; line-height: 1.45; color: var(--text-light-secondary); }\n.ba-note .n-ic { flex-shrink: 0; font-weight: 700; }\n.after .n-ic { color: var(--success); } .before .n-ic { color: #B05040; }\n.ba-note b { color: var(--text-light); font-weight: 600; }\n@media (max-width: 940px) { .ba { grid-template-columns: 1fr; } .ba-arrow { display: none; } }\n\n/* single mock centered */\n.solo { display: flex; gap: 30px; margin-top: 26px; align-items: start; }\n.solo .panel { flex: 1; }\n.solo .panel h3 { font-family: var(--font-display); font-size: 19px; color: var(--text-light); margin: 0 0 4px; }\n.solo .panel .pk { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }\n.solo .panel p { font-size: 13px; line-height: 1.6; color: var(--text-light-secondary); margin: 10px 0 0; }\n.flag { display: flex; gap: 11px; margin-top: 12px; padding: 13px 15px; border-radius: 10px; background: rgba(90,154,74,0.07); border: 1px solid rgba(90,154,74,0.22); }\n.flag.des { background: rgba(196,122,58,0.07); border-color: rgba(196,122,58,0.25); }\n.flag .fic { flex-shrink: 0; color: var(--success); font-weight: 700; }\n.flag.des .fic { color: var(--accent); }\n.flag b { color: var(--text-light); font-weight: 600; }\n.flag span { font-size: 12px; line-height: 1.5; color: var(--text-light-secondary); }\n@media (max-width: 760px) { .solo { flex-direction: column; } }\n\n/* ═══════════════ PHONE FRAME (app-trogen) ═══════════════ */\n.phone { width: 300px; flex-shrink: 0; border-radius: 26px; background: #0a0a0a; padding: 7px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin: 0 auto; }\n.scr { border-radius: 20px; overflow: hidden; background: var(--bg); position: relative; }\n.scr.dark { background: var(--bg-portal); }\n\n/* app header */\n.gh { background: var(--bg-portal); padding: 9px 11px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(196,122,58,0.3); }\n.gh-logo { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-dark); display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 800; color: var(--text-light-secondary); flex-shrink: 0; }\n.gh-mid { min-width: 0; }\n.gh-club { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-light); line-height: 1; }\n.gh-sub { font-size: 8.5px; color: var(--text-muted); font-style: italic; margin-top: 2px; }\n.gh-omg { margin-left: auto; font-size: 8px; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 2px 5px; font-weight: 700; flex-shrink: 0; }\n.gh-ic { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }\n\n/* phase nav */\n.phase { background: var(--bg-portal); display: flex; align-items: center; padding: 7px 11px; gap: 6px; border-bottom: 1.5px solid var(--accent); }\n.phase .pp { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }\n.phase .pp.on { color: var(--accent); }\n.phase .pl { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }\n\n/* body */\n.body { padding: 11px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }\n.body.beige { background: var(--bg); }\n\n/* generic app card */\n.acard { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 11px 12px; }\n.acard.sharp { border-radius: var(--radius-md); }\n.alabel { font-size: 7.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n\n/* bottom nav */\n.bn { display: flex; background: var(--bg-surface); border-top: 1px solid var(--border); padding: 6px 4px 7px; }\n.bn .bi { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 7.5px; color: var(--text-muted); }\n.bn .bi.on { color: var(--accent); }\n.bn .bi .g { font-size: 13px; }\n\n/* highlight ring for the thing being fixed */\n.hl { position: relative; }\n.hl::after { content: ''; position: absolute; inset: -4px; border: 2px solid var(--accent); border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 4px rgba(196,122,58,0.12); }\n\n/* ── pill nav demo ── */\n.pillrow { display: flex; gap: 6px; padding: 9px 11px; background: var(--bg); }\n.pillrow.scroll { overflow: hidden; }\n.pill { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-dark); background: var(--bg-elevated); color: var(--text-secondary); white-space: nowrap; }\n.pill.on { background: var(--accent); color: #fff; border-color: var(--accent); }\n.pill.cut { opacity: 0.5; }\n\n/* segmented underline nav (the fix) */\n.segnav { display: grid; padding: 0 6px; background: var(--bg); border-bottom: 1px solid var(--border); }\n.segnav .row { display: flex; }\n.segitem { flex: 1; text-align: center; font-size: 9.5px; font-weight: 700; padding: 9px 2px; color: var(--text-muted); border-bottom: 2px solid transparent; }\n.segitem.on { color: var(--accent); border-bottom-color: var(--accent); }\n\n/* mode dial */\n.dial { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }\n.dbtn { border-radius: 7px; border: 1px solid var(--border); background: var(--bg-elevated); padding: 7px 3px; text-align: center; }\n.dbtn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }\n.dbtn .dn { font-size: 12px; font-weight: 700; color: var(--text-primary); }\n.dbtn.on .dn { color: var(--accent-dark); }\n.dbtn .de { font-size: 7px; color: var(--text-muted); margin-top: 2px; line-height: 1.2; }\n.dbtn.on .de { color: var(--accent); }\n\n/* reaction row */\n.rrow { display: flex; align-items: center; gap: 7px; padding: 7px 4px; border-top: 1px solid var(--border); }\n.rrow .pos { width: 22px; text-align: center; font-size: 9px; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 2px 0; flex-shrink: 0; }\n.rrow .nm { flex: 1; min-width: 0; }\n.rrow .nm .n1 { font-size: 12px; font-weight: 600; color: var(--text-primary); }\n.rrow .nm .n2 { font-size: 9px; color: var(--text-muted); }\n.rrow .flagpill { font-size: 8.5px; font-weight: 600; padding: 2px 6px; border-radius: 99px; white-space: nowrap; }\n.rrow .ov { display: flex; gap: 4px; flex-shrink: 0; }\n.ovbtn { font-size: 9px; font-weight: 600; padding: 3px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-elevated); color: var(--text-secondary); white-space: nowrap; }\n.ovbtn.cryptic { width: 22px; text-align: center; color: var(--text-muted); }\n\n/* player row (värvning) */\n.prow { display: flex; align-items: center; gap: 9px; padding: 9px 2px; border-top: 1px solid var(--border); }\n.prow:first-child { border-top: none; }\n.prow .pn { flex: 1; min-width: 0; }\n.prow .pn .p1 { font-size: 12.5px; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); }\n.prow .pn .p2 { font-size: 9.5px; color: var(--text-muted); margin-top: 1px; }\n.prow .pbtn { font-size: 9.5px; font-weight: 600; padding: 5px 10px; border: 1px solid var(--accent); border-radius: 6px; color: var(--accent-dark); background: transparent; white-space: nowrap; flex-shrink: 0; }\n.prow .pbtn.disabled { border-color: var(--border); color: var(--text-muted); opacity: 0.6; }\n\n/* messy version markers */\n.messy .p1 { font-size: 10px; font-weight: 700; }\n.messy .pbtn { padding: 5px 4px; font-size: 8.5px; line-height: 1.1; max-width: 52px; }\n\n/* dropdown demo */\n.dd { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-elevated); color: var(--text-secondary); font-size: 11px; }\n.dd.big { padding: 13px 12px; font-size: 13px; }\n.dd.tight { padding: 8px 11px; font-size: 11px; }\n.dd .cv { color: var(--text-muted); font-size: 9px; }\n\n/* empty state */\n.empty { text-align: center; padding: 22px 14px; }\n.empty .et { font-family: var(--font-display); font-style: italic; color: var(--text-muted); font-size: 12px; }\n.empty.guide { background: var(--bg-surface); border: 1px dashed var(--border-dark); border-radius: var(--radius-md); }\n.empty.guide .eh { font-size: 12px; color: var(--text-primary); font-weight: 600; font-family: var(--font-body); font-style: normal; }\n.empty.guide .es { font-size: 11px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }\n.empty.guide .eb { display: inline-block; margin-top: 11px; font-size: 11px; font-weight: 700; color: var(--accent-dark); border: 1px solid var(--accent); border-radius: 7px; padding: 6px 14px; }\n\n/* intro/help line normalized */\n.introline { display: flex; gap: 8px; align-items: flex-start; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 11px; }\n.introline.bad { border-color: rgba(176,80,64,0.4); }\n.introline .ii { font-size: 11px; flex-shrink: 0; }\n.introline .it { font-size: 10.5px; color: var(--text-secondary); line-height: 1.4; }\n.introline .it b { color: var(--text-primary); font-weight: 600; }\n\n/* build node */\n.bnode { border-radius: 7px; padding: 9px 11px; margin-bottom: 7px; position: relative; }\n.bnode.dashed { border: 1px dashed var(--border-dark); background: transparent; }\n.bnode.solid { border: 1px solid var(--border); background: var(--bg-surface); }\n.bnode .bt { display: flex; align-items: center; gap: 6px; }\n.bnode .bt .bttl { font-size: 12.5px; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); }\n.bnode .bt .bstate { margin-left: auto; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; }\n.bstate.ok { background: rgba(90,154,74,0.14); color: var(--success-light); }\n.bstate.lock { background: var(--border); color: var(--text-muted); }\n.bstate.trial { background: rgba(126,150,180,0.16); color: var(--ice-dark); }\n.bnode .bd { font-size: 9.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }\n.bnode .bdim { display: flex; gap: 9px; margin-top: 5px; font-size: 9px; font-weight: 600; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* foot */\n.foot { margin-top: 40px; padding: 22px 0 60px; font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }\n.foot b { color: var(--text-light-secondary); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">Sprint 1 · korrvända 2 · pre-match-ytor<\u002Fp>\n    <h1>Alla ytor innan <em>första nedsläppet<\u002Fem><\u002Fh1>\n    <p class=\"sub\">En full genomspelning av allt en spelare möter före match — intro, portal, Orten, Värvning, Trupp, Bygget. <em>13 fynd, kategoriserade, prioriterade och mockade till target-state i appens eget mobilspråk.<\u002Fem> Detta är sprintens enda dokument: backlog överst, ytorna under, code-ordrar sist.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Källa<\u002Fb> · Jacobs genomspelning + 10 skärmar<\u002Fspan>\n      <span><b>Backlog<\u002Fb> · KORRVANDA-2-FYND<\u002Fspan>\n      <span><b>2026-06-23<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"scards\">\n      <div class=\"scard\"><div class=\"n\">5<\u002Fdiv><div class=\"l\">Mock-ytor<\u002Fdiv><div class=\"d\">Designbeslut med target-state<\u002Fdiv><\u002Fdiv>\n      <div class=\"scard\"><div class=\"n\">4<\u002Fdiv><div class=\"l\">Code-ordrar<\u002Fdiv><div class=\"d\">Ren logik, ingen yta<\u002Fdiv><\u002Fdiv>\n      <div class=\"scard\"><div class=\"n\">1<\u002Fdiv><div class=\"l\">Bugg<\u002Fdiv><div class=\"d\">Bjud-in oändlig relation<\u002Fdiv><\u002Fdiv>\n      <div class=\"scard\"><div class=\"n\">2<\u002Fdiv><div class=\"l\">Att bekräfta<\u002Fdiv><div class=\"d\">Designbeslut för Jacob/Opus<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ 00 · BACKLOG ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">00 — SPRINT-BACKLOG<\u002Fdiv>\n      <h2>Vad sprinten innehåller<\u002Fh2>\n      <p>Allt ur korrvändan, ett beslut per rad, prioriterat. <span class=\"c\">P1 = blockerare/bugg · P2 = tydlighet · P3 = polish.<\u002Fspan> Mock-ytorna har egna sektioner nedan; code-ordrarna ligger sist.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"backlog\">\n      <table>\n        <thead><tr><th>ID<\u002Fth><th>Yta / fynd<\u002Fth><th>Typ<\u002Fth><th>Pri<\u002Fth><th>Ägare<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"id\">H5<\u002Ftd><td class=\"ti\">Säsongsbåge: \"H/V/↩\"-knappar odekodbara på touch (tooltip-only)<\u002Ftd><td><span class=\"mini bug\">touch-block<\u002Fspan><\u002Ftd><td class=\"pri p1\">P1<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">H2<\u002Ftd><td class=\"ti\">Orten: \"Bjud in\" går att spamma → relation stiger oändligt<\u002Ftd><td><span class=\"mini bug\">bugg<\u002Fspan><\u002Ftd><td class=\"pri p1\">P1<\u002Ftd><td class=\"ow\">Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">G2<\u002Ftd><td class=\"ti\">Marknad: notis-dot + \"stärk truppen\" men tomt, ingen väg vidare<\u002Ftd><td><span class=\"mini des\">tomt-state<\u002Fspan><\u002Ftd><td class=\"pri p1\">P1<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">H3·H5a<\u002Ftd><td class=\"ti\">Trupp: lägesratt visar bara namn, oklart vad den togglar<\u002Ftd><td><span class=\"mini des\">tydlighet<\u002Fspan><\u002Ftd><td class=\"pri p2\">P2<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">B2<\u002Ftd><td class=\"ti\">Klubb: topppill-navet scrollar / kapas<\u002Ftd><td><span class=\"mini des\">struktur<\u002Fspan><\u002Ftd><td class=\"pri p2\">P2<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">G1·G3<\u002Ftd><td class=\"ti\">Värvning: olika radtypografi, för stora dropdowns, onödigt lång<\u002Ftd><td><span class=\"mini des\">densitet<\u002Fspan><\u002Ftd><td class=\"pri p2\">P2<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">C3·B3·C2<\u002Ftd><td class=\"ti\">Intro-texter ostädade: fel text på fel flik, olika utseende<\u002Ftd><td><span class=\"mini des\">innehåll<\u002Fspan><\u002Ftd><td class=\"pri p2\">P2<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">E1·E2<\u002Ftd><td class=\"ti\">Bygget: påvert + blekt, för lite förklaring<\u002Ftd><td><span class=\"mini des\">kontrast<\u002Fspan><\u002Ftd><td class=\"pri p2\">P2<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">H1<\u002Ftd><td class=\"ti\">Klack-citat länkar till Orten utan payoff<\u002Ftd><td><span class=\"mini des\">koppling<\u002Fspan><\u002Ftd><td class=\"pri p3\">P3<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">A1<\u002Ftd><td class=\"ti\">Intro blir lite för mörk när den landar<\u002Ftd><td><span class=\"mini des\">polish<\u002Fspan><\u002Ftd><td class=\"pri p3\">P3<\u002Ftd><td class=\"ow\">Design→Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">A2<\u002Ftd><td class=\"ti\">Styrelsekort: klickhand i intro fast ej klickbart<\u002Ftd><td><span class=\"mini fix\">cursor<\u002Fspan><\u002Ftd><td class=\"pri p3\">P3<\u002Ftd><td class=\"ow\">Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">C1<\u002Ftd><td class=\"ti\">Värvning: knappar radbryts illa<\u002Ftd><td><span class=\"mini fix\">layout<\u002Fspan><\u002Ftd><td class=\"pri p3\">P3<\u002Ftd><td class=\"ow\">Code<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">D1<\u002Ftd><td class=\"ti\">\"Visa introduktionen igen\" — verifiera wiring till portal-overlay<\u002Ftd><td><span class=\"mini q\">verifiera<\u002Fspan><\u002Ftd><td class=\"pri p3\">P3<\u002Ftd><td class=\"ow\">Code<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p style=\"font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.6\"><b style=\"color:var(--text-light-secondary)\">Godkänt vid genomgång:<\u002Fb> portal som förstavy, Akademi, övriga flikars innehåll. <b style=\"color:var(--text-light-secondary)\">Löst:<\u002Fb> \"NU-diagrammet\" är inte borta — det lever i Säsongsbågen (Trupp).<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 01 · TRUPP / SÄSONGSBÅGE ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — TRUPP · SÄSONGSBÅGEN<\u002Fdiv>\n      <h2>Knapparna ska säga vad de gör<\u002Fh2>\n      <p>Diagrammet (form-kurva + projektion) är räddat — det lever i Säsongsbågen. Men de två knappgrupperna runt det är otydliga: <span class=\"c\">läges-ratten visar bara namn, och per-spelare-undantagen är enbokstäver bakom en tooltip som inte finns på touch.<\u002Fspan><\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg bug\">H5 touch-blockerare<\u002Fspan><span class=\"tg des\">H3 tydlighet<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">namn + enbokstäver<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"gap:9px;padding-bottom:13px\">\n              <div class=\"acard sharp\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span class=\"alabel\">Säsongsbåge<\u002Fspan><span style=\"font-size:9px;color:var(--text-secondary)\">Truppen: <b style=\"color:var(--accent-dark)\">Håll<\u002Fb> · 2 undantag<\u002Fspan><\u002Fdiv>\n                <div style=\"height:48px;margin:9px 0 6px;border-radius:5px;background:linear-gradient(180deg,#f3ede2,#ede6d8);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text-muted);font-style:italic\">▁▂▄▆▅ form-kurva ▅▄<\u002Fdiv>\n                <div class=\"dial hl\">\n                  <div class=\"dbtn\"><div class=\"dn\">Bygg<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dbtn on\"><div class=\"dn\">Håll<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dbtn\"><div class=\"dn\">Toppa<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dbtn\"><div class=\"dn\">Vila<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"acard sharp\" style=\"padding-top:9px\">\n                <div class=\"alabel\" style=\"margin-bottom:5px\">⚙ Reagerar på Håll<\u002Fdiv>\n                <div class=\"rrow\" style=\"border-top:none\">\n                  <div class=\"pos\">MV<\u002Fdiv>\n                  <div class=\"nm\"><div class=\"n1\">Filip Sandström<\u002Fdiv><div class=\"n2\">F 79 · Sk 64<\u002Fdiv><\u002Fdiv>\n                  <span class=\"flagpill\" style=\"color:var(--cold);background:color-mix(in srgb,var(--cold) 8%,transparent)\">rostar<\u002Fspan>\n                  <div class=\"ov hl\"><span class=\"ovbtn cryptic\">H<\u002Fspan><span class=\"ovbtn cryptic\">V<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"rrow\">\n                  <div class=\"pos\">A<\u002Fdiv>\n                  <div class=\"nm\"><div class=\"n1\">Claes Stål<\u002Fdiv><div class=\"n2\">F 71 · Sk 80<\u002Fdiv><\u002Fdiv>\n                  <span class=\"flagpill\" style=\"color:var(--accent-dark);background:color-mix(in srgb,var(--accent) 8%,transparent)\">trött<\u002Fspan>\n                  <div class=\"ov\"><span class=\"ovbtn cryptic\">H<\u002Fspan><span class=\"ovbtn cryptic\">V<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span><b>\"H\" / \"V\"<\u002Fb> = enda förklaring är en <code style=\"font-family:var(--font-body)\">title<\u002Fcode>-tooltip. Touch har ingen hover → odekodbart på mobil.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Ratten visar bara <b>namnet<\u002Fb>. Vad gör Toppa vs Bygg? Du måste klicka och gissa.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">effekt utskriven, ord på knappen<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"gap:9px;padding-bottom:13px\">\n              <div class=\"acard sharp\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span class=\"alabel\">Säsongsbåge<\u002Fspan><span style=\"font-size:9px;color:var(--text-secondary)\">Truppen: <b style=\"color:var(--accent-dark)\">Håll<\u002Fb> · 2 undantag<\u002Fspan><\u002Fdiv>\n                <div style=\"height:48px;margin:9px 0 6px;border-radius:5px;background:linear-gradient(180deg,#f3ede2,#ede6d8);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text-muted);font-style:italic\">▁▂▄▆▅ form-kurva ▅▄<\u002Fdiv>\n                <div class=\"dial\">\n                  <div class=\"dbtn\"><div class=\"dn\">Bygg<\u002Fdiv><div class=\"de\">form ↑ sakta<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dbtn on\"><div class=\"dn\">Håll<\u002Fdiv><div class=\"de\">stabilt<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dbtn\"><div class=\"dn\">Toppa<\u002Fdiv><div class=\"de\">3 upp, sen fall<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dbtn\"><div class=\"dn\">Vila<\u002Fdiv><div class=\"de\">ben ↑ form ↓<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"font-family:var(--font-display);font-style:italic;font-size:10px;color:var(--text-secondary);line-height:1.45;margin:9px 0 0\">Håll håller läget. Ingen vinst, ingen kostnad — rätt mellan tunga matcher.<\u002Fp>\n              <\u002Fdiv>\n              <div class=\"acard sharp\" style=\"padding-top:9px\">\n                <div class=\"alabel\" style=\"margin-bottom:5px\">⚙ Reagerar på Håll<\u002Fdiv>\n                <div class=\"rrow\" style=\"border-top:none\">\n                  <div class=\"pos\">MV<\u002Fdiv>\n                  <div class=\"nm\"><div class=\"n1\">Filip Sandström<\u002Fdiv><div class=\"n2\">F 79 · Sk 64<\u002Fdiv><\u002Fdiv>\n                  <span class=\"flagpill\" style=\"color:var(--cold);background:color-mix(in srgb,var(--cold) 8%,transparent)\">rostar<\u002Fspan>\n                  <div class=\"ov\"><span class=\"ovbtn\">Håll<\u002Fspan><span class=\"ovbtn\">Vila<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"rrow\">\n                  <div class=\"pos\">A<\u002Fdiv>\n                  <div class=\"nm\"><div class=\"n1\">Claes Stål<\u002Fdiv><div class=\"n2\">F 71 · Sk 80<\u002Fdiv><\u002Fdiv>\n                  <span class=\"flagpill\" style=\"color:var(--accent-dark);background:color-mix(in srgb,var(--accent) 8%,transparent)\">trött<\u002Fspan>\n                  <div class=\"ov\"><span class=\"ovbtn\">Håll<\u002Fspan><span class=\"ovbtn\">Vila<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Orden står på knappen<\u002Fb> — \"Håll\" / \"Vila\" / \"Följ truppen\" (vid undantag). Ingen hover behövs. Nollkostnad: texten finns redan i <code style=\"font-family:var(--font-body)\">title<\u002Fcode>.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Mikro-effekt under varje läge<\u002Fb> (\"3 upp, sen fall\") telegraferar valet före klick. Drar ur <code style=\"font-family:var(--font-body)\">getPhaseConsequence<\u002Fcode> som redan finns.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span>Konsekvensraden behålls oförändrad — den fungerar.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 02 · VÄRVNING ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — VÄRVNING · STÄD<\u002Fdiv>\n      <h2>En spelarrad, en skala, fyra flikar<\u002Fh2>\n      <p>Marknad·Scouting·Fria·Sälj ärver olika typografi och täthet. <span class=\"c\">Scouting-raden är kanon — den snyggaste. Allt rättas till den.<\u002Fspan> Plus: tomma flikar måste vägleda, inte bara konstatera tomhet.<\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">G3 enhetlig rad<\u002Fspan><span class=\"tg des\">G1 densitet<\u002Fspan><span class=\"tg des\">G2 tomt-state<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">Sälj-rad + tomt Marknad<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"pillrow\"><span class=\"pill on\">Marknad<\u002Fspan><span class=\"pill\">Scouting<\u002Fspan><span class=\"pill\">Fria<\u002Fspan><span class=\"pill\">Sälj<\u002Fspan><\u002Fdiv>\n            <div class=\"body beige\" style=\"gap:8px;padding-top:8px\">\n              <div class=\"empty hl\" style=\"background:var(--bg-surface);border:1px solid var(--border);border-radius:8px\">\n                <div class=\"et\">Inga spelare tillgängliga på marknaden just nu.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:8px;color:var(--text-muted);text-align:center;font-style:italic\">…men pillen har en notis-prick och säger \"stärk truppen\"<\u002Fdiv>\n              <div class=\"acard sharp messy\" style=\"padding:7px 9px\">\n                <div class=\"prow\" style=\"border-top:none\"><div class=\"pn\"><div class=\"p1\">Claes Stål<\u002Fdiv><div class=\"p2\">A · Styrka 78 · MV 115 tkr<\u002Fdiv><\u002Fdiv><span class=\"pbtn\">Till salu<\u002Fspan><\u002Fdiv>\n                <div class=\"prow\"><div class=\"pn\"><div class=\"p1\">Folke Lindgren<\u002Fdiv><div class=\"p2\">YH · Styrka 75 · MV 95 tkr<\u002Fdiv><\u002Fdiv><span class=\"pbtn\">Till salu<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Notis-prick lovar handling som inte finns när listan är tom.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Sälj-raden använder mindre, annan typografi än Scouting.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">kanon-rad + vägledande tomt<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"pillrow\"><span class=\"pill on\">Marknad<\u002Fspan><span class=\"pill\">Scouting<\u002Fspan><span class=\"pill\">Fria<\u002Fspan><span class=\"pill\">Sälj<\u002Fspan><\u002Fdiv>\n            <div class=\"body beige\" style=\"gap:9px;padding-top:8px\">\n              <div class=\"empty guide hl\">\n                <div class=\"eh\">Marknaden är tom just nu<\u002Fdiv>\n                <div class=\"es\">Spelare dyker upp när klubbar säljer. Vill du hitta okända talanger — skicka ut en scout.<\u002Fdiv>\n                <span class=\"eb\">Gå till Scouting →<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:8px;color:var(--text-muted);text-align:center;font-style:italic\">notis-pricken borta när inget är actionable<\u002Fdiv>\n              <div class=\"acard sharp\" style=\"padding:5px 11px\">\n                <div class=\"prow\"><div class=\"pn\"><div class=\"p1\">Claes Stål<\u002Fdiv><div class=\"p2\">A · Styrka 78 · MV 115 tkr<\u002Fdiv><\u002Fdiv><span class=\"pbtn\">Till salu<\u002Fspan><\u002Fdiv>\n                <div class=\"prow\"><div class=\"pn\"><div class=\"p1\">Folke Lindgren<\u002Fdiv><div class=\"p2\">YH · Styrka 75 · MV 95 tkr<\u002Fdiv><\u002Fdiv><span class=\"pbtn\">Till salu<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Scouting-radens typografi<\u002Fb> blir sanningskälla över alla fyra flikar — Georgia-namn, samma täthet.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Tomt-state vägleder:<\u002Fb> förklarar varför + en knapp till nästa steg (Scouting).<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Notis-prick endast när något faktiskt väntar.<\u002Fb> Tightare dropdowns i Scouting kortar vyn (G1).<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 03 · PILL-NAV ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">03 — KLUBB · NAVIGERING<\u002Fdiv>\n      <h2>Navet ska inte scrolla bort sina val<\u002Fh2>\n      <p>Under Klubb ligger fem+ flikar i en horisontell pill-rad som kapas i högerkant — du ser inte att \"Minne\" finns. <span class=\"c\">Ett nav som döljer val är inget nav.<\u002Fspan> Byt till ett jämnfördelat segment-nav med underline-aktiv.<\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">B2 struktur<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">scrollande piller, kapas<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"phase\"><span class=\"pp on\">○ Förbered<\u002Fspan><span class=\"pl\"><\u002Fspan><span class=\"pp\">Spela<\u002Fspan><span class=\"pl\"><\u002Fspan><span class=\"pp\">Granska<\u002Fspan><\u002Fdiv>\n            <div class=\"pillrow scroll hl\" style=\"padding-right:0\">\n              <span class=\"pill\">Träning<\u002Fspan><span class=\"pill\">Ekonomi<\u002Fspan><span class=\"pill on\">Orten<\u002Fspan><span class=\"pill\">Akademi<\u002Fspan><span class=\"pill cut\">Minne<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"body beige\" style=\"min-height:150px\"><div style=\"font-size:9px;color:var(--text-muted);text-align:center;padding:30px 10px;font-style:italic\">\"Minne\" kapas i kanten — finns men syns inte<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Sista fliken halvt avskuren → spelaren vet inte att den finns.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Horisontell scroll i ett nav = dold yta, dålig upptäckbarhet.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">jämnt segment-nav<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"phase\"><span class=\"pp on\">○ Förbered<\u002Fspan><span class=\"pl\"><\u002Fspan><span class=\"pp\">Spela<\u002Fspan><span class=\"pl\"><\u002Fspan><span class=\"pp\">Granska<\u002Fspan><\u002Fdiv>\n            <div class=\"segnav hl\"><div class=\"row\">\n              <span class=\"segitem\">Träning<\u002Fspan><span class=\"segitem\">Ekonomi<\u002Fspan><span class=\"segitem on\">Orten<\u002Fspan><span class=\"segitem\">Akademi<\u002Fspan><span class=\"segitem\">Minne<\u002Fspan>\n            <\u002Fdiv><\u002Fdiv>\n            <div class=\"body beige\" style=\"min-height:150px\"><div style=\"font-size:9px;color:var(--text-muted);text-align:center;padding:30px 10px;font-style:italic\">alla fem val syns på en gång<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Alla flikar ryms och syns<\u002Fb> — jämnfördelade, ingen scroll. Aktiv markeras med underline (samma språk som FÖRBERED/SPELA/GRANSKA ovanför).<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span>Vid 6+ flikar: korta etiketter / ikon+text, men aldrig dold scroll.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span>Samma fix gäller andra vyer med samma pill-rad — en komponent, ett mönster.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 04 · BYGGET ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">04 — BYGGET · ANLÄGGNINGEN<\u002Fdiv>\n      <h2>Lyft kontrasten, förklara trädet<\u002Fh2>\n      <p>Bygget ser påvert och blekt ut — dämpade streckade kort på beige, och det framgår inte vad noderna betyder eller hur beroenden funkar. <span class=\"c\">Höj kontrasten och lägg en kort förklaringsrad.<\u002Fspan><\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">E2 kontrast<\u002Fspan><span class=\"tg des\">E1 förklaring<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">blekt, oförklarat<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"gap:0;padding-bottom:14px\">\n              <div style=\"font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-primary)\">Anläggningen<\u002Fdiv>\n              <div style=\"font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin:3px 0 11px\">Betrakta · val görs i säsongsstarten<\u002Fdiv>\n              <div class=\"bnode dashed\" style=\"opacity:0.7\"><div class=\"bt\"><span class=\"bttl\" style=\"color:var(--text-secondary)\">Värmestuga<\u002Fspan><span class=\"bstate\" style=\"background:transparent;border:1px solid var(--border);color:var(--text-muted)\">Möjlig<\u002Fspan><\u002Fdiv><div class=\"bdim\"><span class=\"up\">Publik ↑<\u002Fspan><span class=\"up\">Själ ↑<\u002Fspan><span class=\"down\">Ekonomi ↓<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div class=\"bnode dashed\" style=\"opacity:0.5\"><div class=\"bt\"><span class=\"bttl\" style=\"color:var(--text-muted)\">Läktare — östra<\u002Fspan><span class=\"bstate\" style=\"background:transparent;border:1px solid var(--border);color:var(--text-muted)\">Kräver värmestuga<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div class=\"bnode dashed\" style=\"opacity:0.7\"><div class=\"bt\"><span class=\"bttl\" style=\"color:var(--text-secondary)\">Belysning träningsplan<\u002Fspan><span class=\"bstate\" style=\"background:transparent;border:1px solid var(--border);color:var(--text-muted)\">Möjlig<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Allt i samma bleka grå-på-beige → ingen hierarki, ser oavslutat ut.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">×<\u002Fspan><span>Vad betyder \"Möjlig\" vs \"Kräver X\"? Ingen förklaring.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">kontrast + legend<\u002Fspan><\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"body beige\" style=\"gap:0;padding-bottom:14px\">\n              <div style=\"font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-primary)\">Anläggningen<\u002Fdiv>\n              <div style=\"font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin:3px 0 8px\">Betrakta · val görs i säsongsstarten<\u002Fdiv>\n              <div class=\"introline\" style=\"margin-bottom:11px\"><span class=\"ii\">💡<\u002Fspan><span class=\"it\"><b>Bygg klubben sten för sten.<\u002Fb> Varje bygge påverkar publik, själ och ekonomi. Grå kort kräver att du byggt något annat först.<\u002Fspan><\u002Fdiv>\n              <div class=\"bnode solid\"><div class=\"bt\"><span class=\"bttl\">Värmestuga<\u002Fspan><span class=\"bstate ok\">Möjlig<\u002Fspan><\u002Fdiv><div class=\"bd\">Värmer publik och spelare en kall kväll.<\u002Fdiv><div class=\"bdim\"><span class=\"up\">Publik ↑<\u002Fspan><span class=\"up\">Själ ↑<\u002Fspan><span class=\"down\">Ekonomi ↓<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div class=\"bnode solid\" style=\"opacity:0.55\"><div class=\"bt\"><span class=\"bttl\" style=\"color:var(--text-secondary)\">Läktare — östra<\u002Fspan><span class=\"bstate lock\">🔒 Värmestuga<\u002Fspan><\u002Fdiv><div class=\"bd\" style=\"color:var(--text-muted)\">Lås upp genom att bygga värmestugan först.<\u002Fdiv><\u002Fdiv>\n              <div class=\"bnode solid\"><div class=\"bt\"><span class=\"bttl\">Belysning träningsplan<\u002Fspan><span class=\"bstate ok\">Möjlig<\u002Fspan><\u002Fdiv><div class=\"bdim\"><span class=\"up\">Ungdom ↑<\u002Fspan><span class=\"neu\">Publik —<\u002Fspan><span class=\"down\">Ekonomi ↓<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Solid kort + tydligare text<\u002Fb> ger hierarki; byggbara lyfts fram, låsta dimmas medvetet (inte alla lika bleka).<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Förklaringsrad överst<\u002Fb> + lås-ikon med villkoret utskrivet (\"🔒 Värmestuga\") → beroendeträdet blir läsbart.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span>En rad om vad bygget gör under varje nod — inte bara dimensions-pilar.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 05 · INTRO-TEXTER ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">05 — INTRO-TEXTER · NORMALISERING<\u002Fdiv>\n      <h2>Rätt text, rätt flik, samma form<\u002Fh2>\n      <p>Flikarnas inledande hjälp-/intro-texter ser olika ut och hamnar ibland fel — på Orten visas en text som egentligen gäller ekonomi. <span class=\"c\">En komponent, en placering, ett utseende — och innehållsaudit så varje flik förklarar sig själv.<\u002Fspan><\u002Fp>\n      <div class=\"tagrow\"><span class=\"tg des\">C3 normalisering<\u002Fspan><span class=\"tg des\">B3 fel flik<\u002Fspan><span class=\"tg des\">C2 konstig text<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"solo\">\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"segnav\"><div class=\"row\"><span class=\"segitem\">Träning<\u002Fspan><span class=\"segitem\">Ekonomi<\u002Fspan><span class=\"segitem on\">Orten<\u002Fspan><span class=\"segitem\">Akademi<\u002Fspan><span class=\"segitem\">Minne<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"body beige\" style=\"gap:9px\">\n            <div class=\"introline bad\"><span class=\"ii\">⚠️<\u002Fspan><span class=\"it\"><b style=\"color:var(--danger-text)\">Fel idag:<\u002Fb> \"Kassan är tight. Sponsorer + matchintäkter…\" — ekonomitext på Orten-fliken.<\u002Fspan><\u002Fdiv>\n            <div style=\"text-align:center;font-size:14px;color:var(--accent)\">↓<\u002Fdiv>\n            <div class=\"introline\"><span class=\"ii\">🏘️<\u002Fspan><span class=\"it\"><b>Orten<\u002Fb> — Frivilliga, kommun och aktiviteter ger pengar och bygdens puls. Hög puls = bättre ekonomi och hemmaplansfördel.<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)\">Samma mönster, varje flik<\u002Fdiv>\n            <div class=\"introline\"><span class=\"ii\">💰<\u002Fspan><span class=\"it\"><b>Ekonomi<\u002Fb> — Kassan är tight. Sponsorer, frivilliga och matchintäkter. Minusbudget tappar styrelsens tålamod.<\u002Fspan><\u002Fdiv>\n            <div class=\"introline\"><span class=\"ii\">🎓<\u002Fspan><span class=\"it\"><b>Akademi<\u002Fb> — Ungdomslag och talangutveckling. Lyft talanger till A-laget när de är redo.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"panel\">\n        <div class=\"pk\">Mönstret<\u002Fdiv>\n        <h3>En intro-rad, identisk på alla flikar<\u002Fh3>\n        <p>Samma kort: ikon + <b style=\"color:var(--text-light)\">fliknamn fetstil<\u002Fb> + en mening som förklarar vad fliken är till för och hur den kopplar till resten. Samma typografi, samma placering direkt under navet, samma ton.<\u002Fp>\n        <div class=\"flag des\"><span class=\"fic\">→<\u002Fspan><span><b>Innehållsaudit:<\u002Fb> gå igenom varje fliks intro-text och säkra att den (a) gäller rätt flik och (b) säger något konkret om vad spelaren gör där. Orten-buggen (ekonomitext) är symptomet — auditen är boten.<\u002Fspan><\u002Fdiv>\n        <div class=\"flag des\"><span class=\"fic\">→<\u002Fspan><span><b>Värvnings konstiga text (C2)<\u002Fb> rättas i samma svep — \"Spelare som är tillgängliga för transfer just nu\" normaliseras till mönstret.<\u002Fspan><\u002Fdiv>\n        <div class=\"flag\"><span class=\"fic\">✓<\u002Fspan><span><b>För Code:<\u002Fb> en delad <code style=\"font-family:var(--font-body)\">TabIntro<\u002Fcode>-komponent som tar <code style=\"font-family:var(--font-body)\">{icon, tab, text}<\u002Fcode> ur en <code style=\"font-family:var(--font-body)\">tabIntros.ts<\u002Fcode>-tabell. Texten flyttas till data, utseendet centraliseras.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 06 · CODE-ORDRAR ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">06 — RENA CODE-ORDRAR &amp; BUGG<\u002Fdiv>\n      <h2>Ingen mock — bara logik<\u002Fh2>\n      <p>Fyra poster som inte behöver en yta. Den första är en bugg.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"backlog\">\n      <table>\n        <thead><tr><th>ID<\u002Fth><th>Order<\u002Fth><th>Detalj<\u002Fth><th>Typ<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"id\">H2<\u002Ftd><td class=\"ti\"><b style=\"color:var(--text-light)\">Bjud-in: cap/debounce relationen<\u002Fb><\u002Ftd><td style=\"color:var(--text-light-secondary)\">\"Bjud in\" på Orten går att klicka i loop → relation stiger oändligt. En inbjudan per period (omg/säsong), eller diminishing returns + tak.<\u002Ftd><td><span class=\"mini bug\">bugg P1<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">A2<\u002Ftd><td class=\"ti\"><b style=\"color:var(--text-light)\">Ta bort klickhand i intro<\u002Fb><\u002Ftd><td style=\"color:var(--text-light-secondary)\">Styrelsekortet får <code style=\"font-family:var(--font-body)\">cursor:pointer<\u002Fcode> + hover i intro-kontext fast det inte är klickbart där. Stäng av affordansen när kortet renderas i introt — behåll den på portal där det leder till Orten.<\u002Ftd><td><span class=\"mini fix\">cursor<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">C1<\u002Ftd><td class=\"ti\"><b style=\"color:var(--text-light)\">Knapp-radbrytning i Värvning<\u002Fb><\u002Ftd><td style=\"color:var(--text-light-secondary)\">Knappar bryts mitt i ordet (\"Uppgradera till Satsning (50\\ntkr)\"). Sätt min-bredd / <code style=\"font-family:var(--font-body)\">white-space:nowrap<\u002Fcode> eller korta etiketterna.<\u002Ftd><td><span class=\"mini fix\">layout<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\">D1<\u002Ftd><td class=\"ti\"><b style=\"color:var(--text-light)\">Verifiera \"Visa introduktionen igen\"<\u002Fb><\u002Ftd><td style=\"color:var(--text-light-secondary)\">I \"?\"-modalen ska knappen trigga portal-intro-overlayn. Bekräfta att den faktiskt gör det — inte är död/dubblerad. Fixa om bruten.<\u002Ftd><td><span class=\"mini q\">verifiera<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div class=\"sec-head\" style=\"margin-top:30px\">\n      <div class=\"sec-num\">ATT BEKRÄFTA — DESIGNBESLUT<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"backlog\">\n      <table>\n        <tbody>\n          <tr><td class=\"id\" style=\"color:#9FB6CE\">A1<\u002Ftd><td class=\"ti\"><b style=\"color:var(--text-light)\">Hur mycket ska introt lättas?<\u002Fb> Sluttillståndet är lite för mörkt. Min rek: sänk overlay-opacity ett snäpp, behåll stämningen. Bekräfta nivå.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\" style=\"color:#9FB6CE\">E3<\u002Ftd><td class=\"ti\"><b style=\"color:var(--text-light)\">FÖRBERED-markering på Bygget?<\u002Fb> Min läsning: ja — Bygget hör till förberedelsefasen, så FÖRBERED bör vara aktiv i fas-navet när man går in. Bekräfta avsikt.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"id\" style=\"color:#9FB6CE\">H1<\u002Ftd><td class=\"ti\"><b style=\"color:var(--text-light)\">Klack-citatets destination.<\u002Fb> \"Jag frågade Elin…\" leder till Orten utan payoff. Länka till klack-/Bergskurvan-detalj som visar Elin, eller ytlägg klacken på Orten? Designval.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div class=\"foot\">\n      <b>Sprint 1 — pre-match-ytor<\u002Fb> · 2026-06-23 · korrvända 2<br>\n      13 fynd ur Jacobs genomspelning av allt före första nedsläppet. 5 mock-ytor (Trupp · Värvning · Klubb-nav · Bygget · Intro-texter), 4 code-ordrar (1 bugg), 3 designbeslut att bekräfta. Backlog: <b>KORRVANDA-2-FYND-2026-06-23.md<\u002Fb>.<br>\n      Princip genomgående: <b>knappar ska säga vad de gör · inget nav döljer val · rätt text på rätt flik · tomt ska vägleda · aldrig affordans utan funktion.<\u002Fb>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fbody><\u002Fhtml>"
