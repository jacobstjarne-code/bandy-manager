fact_id: D042
category: design_principles
claim: "Jacobs körorder 2026-09-01 ('hitta och spåra de ~150-220k/säsong som rör kassan utan financeLog-post'), uppföljning på D041. Rotorsak spårad till en verklig ÖVERBETALNINGSBUGG, inte bara en loggningslucka: contextualSponsorService.ts's kommunstöd (engångsbidrag, kontinuerlig CS-skala, tak 80 000 kr) dedup:ade via en sponsor-post i game.sponsors — men den posten skapades med contractRounds:1, och sponsorProcessor.ts's GENERISKA decrement+filter-svep (körs varje omgång, för ALLA sponsorer) rensade bort den efter EN enda omgång. Resultat: bidraget betalades ut på nytt vid varje kontrollomgång (5/11/18) — upp till 3x/säsong istf 1x. Fixat med ett persistent SaveGame-fält (kommunstodPaidSeason, lagrar säsongsnumret) som inte är beroende av sponsor-arrayens livslängd. Samtidigt hittades och åtgärdades en OBESLÄKTAD, ren loggningslucka: boardObjectiveService.ts's 'förtroendepott' (62 500 kr vid två raka flagship-mål godkända) mutade club.finances utan en enda financeLog-post."
