notes: |
  ── ARKITEKTURFYND: 8+ ställen bryter mot economyService.ts's egen
     dokumenterade regel ────────────────────────────────────────────────────
  economyService.ts:52 säger explicit: "Pure function — the single place
  where Club.finances is mutated. All callers must go through this instead
  of writing { ...c, finances: c.finances + x }." Grep bekräftade minst 8
  ställen (roundProcessor.ts×3, seasonEndProcessor.ts×3, scandalService.ts×2,
  contextualSponsorService.ts×1) som bryter mot regeln med direkta
  `{ ...c, finances: c.finances + x }`-skrivningar. applyFinanceChange
  loggar dessutom INTE till financeLog själv — även "rätta" anrop måste
  komma ihåg att logga separat, ett andra ställe att glömma. Detta är INTE
  fixat i denna runda (scope var att SPÅRA och fixa GAPET, inte refaktorera
  hela mönstret) — flaggat som ett strukturellt fynd för framtida arbete.

  ── VERIFIERAT: scandalService.ts:s TVÅ unloggade mutationer (sponsor_
     collapse -30 000 flat, municipal_scandal ±20/30% av kommunBidrag) är
     INTE källan till de kvarvarande residualerna ──────────────────────────
  TRIGGER_WINDOWS (scandalService.ts:40-45) är [6,8]/[12,14]/[18,20]/[24,26]
  — ingen skandal kan alltså trigga vid omgång 31 eller 37 (de kvarvarande
  OKÄNDA residualerna, 31 985 kr / −38 758 kr). Skandalernas egna unloggade
  mutationer kvarstår som ett SEPARAT, mindre öppet fynd (ingen skandal
  triggade i denna mätning, så deras faktiska bidrag till "det stora gapet"
  är obekräftat — men de bryter fortfarande mot samma logg-disciplin och bör
  fixas i en framtida runda om en skandal-tung mätning görs).

  ── KVARVARANDE, OIDENTIFIERAD RESIDUAL: 31 985 kr (s1/omg31) och
     −38 758 kr (s2/omg37), netto −6 773 kr över 3 säsonger ─────────────────
  Efter de två bekräftade fixarna sjönk det totala ospårade gapet från
  520 227 kr till −6 773 kr över 3 säsonger (98,7% löst). De två kvarvarande
  posterna matchar INGEN av de kända mekanismernas belopp eller trigger-
  villkor (kommunstöd, förtroendepott, skandal — samtliga uteslutna).
  Neråtriktad netto-effekt (spelaren tjänar INTE extra pengar av detta,
  snarare marginellt mindre) — nedprioriterat givet att de två dominerande,
  spelbalans-påverkande bråden nu är fixade. Kandidat för en framtida,
  smalare diagnosrunda om Jacob vill ha full 100%-spårbarhet.

  ── VEM GÖR VAD ────────────────────────────────────────────────────────────
  Code: byggt, testat (11 nya regressionstester: kommunstodSmoothing.test.ts
  ×3 nya, existerande 5 gröna oförändrade), tsc+3549 test+build gröna.
  Opus: dömer ommätningen mot ~600k-målet (nästa steg, match_revenue-
  dampFactor) mot DENNA financeLog-breakdown, inte mot D041:s äldre
  aggregat-siffror.
