notes: |
  ── VERIFIERAT FÖRE BYGGE: INTE redan byggt ──────────────────────────────
  grep efter motbud/counterOffer/CounterOffer i src/ gav bara träffar i
  TRANSFER-bud-filerna (ett annat, redan byggt system — en FAST förhandsberäknad
  bump, inte fri spelarinmatning). Sponsor-domänen hade noll motbudslogik.

  ── VERIFIERAT UNDER BYGGET: personality var aldrig satt ─────────────────
  Sponsor.ts deklarerade `personality?: 'local'|'regional'|'foundation'` men
  0 skrivställen fanns i sponsorService.ts/contextualSponsorService.ts. Domen
  antog "härledd ur det som redan finns" — fältet fanns, men var alltid
  undefined i produktion. Löst genom att TILLDELA personality i
  generateSponsorOffer (viktad slump: 55/35/10, en småstads verklighet —
  mest lokala företag). Detta är en förutsättning bygget behövde, inte ett
  scope-brott: utan den hade reservationsnivån inte haft något att läsa.

  ── ARKITEKTUR: varför UI:t inte bara är en fjärde choice ────────────────
  sponsorOffer-events renders ENDAST via EventCardInline.tsx (spårat via
  PortalEventSlot → selectDashboardDecisions, decisionTierService.ts —
  sponsorOffer är 'month'-tier, aldrig 'overlay', så EventPrimary/EventOverlay
  är aldrig i bilden). Motbudet kräver FRI Y-inmatning (domens ord: "UI:t
  rider BidModal-mönstret") — inte uttryckbart som ett statiskt
  choice+effect-par. choiceId==='counter' fångas i EventCardInline FÖRE
  resolveEvent och öppnar SponsorCounterModal i stället.

  ── BUGG HITTAD OCH FIXAD UNDER EGEN VERIFIERING: unmount-race ───────────
  Första utkastet lät modalens "skicka motbud"-knapp mutera game-state
  DIREKT (ta bort eventet ur pendingEvents vid walked_away/accepted). Det
  hade orsakat att PortalEventSlot omedelbart väljer en NY primary och
  unmountar EventCardInline (som äger modalen) INNAN spelaren hunnit läsa
  sponsorns slutbesked. Löst genom att dela store-anropet i
  previewSponsorCounter (rullar tärningen, RÖR INTE state) och
  commitSponsorCounter (applicerar det redan avgjorda utfallet, kallas när
  spelaren stänger modalen efter att ha läst resultatet).

  ── MÄTT (Monte Carlo, 5000 rullningar/cell, scripts/sponsor-motbud-
     matning-2026-09-01.ts) — samtliga GODKÄNT NÄR-kriterier gröna på FÖRSTA
     kalibreringen, ingen omkalibrering behövdes ──
  1. Aggressivt motbud (2× reservation) walkaway: local 49%, regional 90%,
     foundation 77% — genuint riskabelt, spelaren tvekar.
  2. Modest motbud (halvvägs mot reservationen): 100% accept för alla tre
     personligheter, en verklig men liten vinst (+75 till +175 kr/vecka på
     ett X=1000-exempel).
  3. Personlighet avläsbar: regional har HÖGRE tak (1.35×X mot lokalt
     1.15×X) MEN bryter lättare vid samma aggressiva Y (47% mot 34% walk-
     chans) — exakt domens "djupare ficka, går lättare".
  4. "Kräv alltid maximalt" (5× reservation): EV-delta ≈ −900 kr/vecka mot
     att bara acceptera originalet, för ALLA tre personligheter. Ingen
     freebie.

  ── ÖPPET — Opus-text ────────────────────────────────────────────────────
  SVENSK TEXT-regeln (CLAUDE.md): Code skriver aldrig speltext. Sex
  '[Opus]'-platshållare kvar (allowlistade i tests/grind/opusPlaceholderGate.ts):
  motbudsknappens etikett (postAdvanceEvents.ts), modalens titel/resultat-
  ruta/skicka-knapp (SponsorCounterModal.tsx, 3 st), walked-away-inboxnotisens
  title+body (gameStore.ts, 2 st). Domens egen text-plan: "ett register per
  utfall, personlighets-neutralt räcker för v1."
