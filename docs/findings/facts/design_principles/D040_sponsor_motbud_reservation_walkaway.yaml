fact_id: D040
category: design_principles
claim: "Sponsor-motbud (DOM_SPONSOR_MOTBUD_2026-08-31.md): ett sponsorerbjudande (X kr/vecka) kan besvaras med ett motbud (Y > X) i stället för bara acceptera/avslå. Enkelrunda, tre utfall avgjorda av Y mot sponsorns dolda reservationsnivå R (härledd ur personlighet × en communityStanding-hävstångsramp): Y ≤ R → accepteras (till Y); R < Y ≤ R×STAND_FIRM_BAND → sponsorn står fast (originalet X finns kvar, ingen förlust); Y > R×STAND_FIRM_BAND → drar sig ur med en sannolikhet som stiger med avståndet, tak MAX_WALKAWAY_PROBABILITY. personality (local/regional/foundation) var deklarerad på Sponsor.ts men aldrig satt av någon generator före denna leverans — tilldelas nu i generateSponsorOffer (55% local / 35% regional / 10% foundation)."
