fact_id: D043
category: design_principles
claim: "DOM_FRAMGANGSEKONOMIN_UPPSIDAN_2026-08-31.md, VÄG A (Jacobs beslut 2026-09-01, efter D041/D042): D041 dämpade rätt spak (kommunbidragens CS-skalning) men den bar bara ~5-9% av en dominant klubbs säsongsöverskott. match_revenue (arenaCapacity fryst vid world-gen, men ABSOLUT storlek 8-17× större än bägge kommunbidragen tillsammans) är bulken. Jacobs val: sänk match_revenue-BASLINJEN direkt via en rep-gated dampFactor på match_revenue-summan (baseRevenue×formBonus×eventBonus×derbyBonus), inte på kapaciteten separat (som ändå aldrig omräknas från levande rykte — att 'mätta' kapaciteten hade bara frusit ett tal som redan är fruset). Samma rykte-ramp som ANSPRAK4:s tre spakar (CS_UPKEEP_REP_FLOOR=80/CEIL=100) — en storleksaxel i hela klubbekonomin. 1,0 vid/under rykte 80 (elva av tolv klubbar, hela Survive-tiern, opåverkade), fallande linjärt till MATCH_REVENUE_REP_DAMP_FLOOR vid rykte 100."
