fact_id: D044
category: design_principles
claim: "DOM_BOARDEXPEKTAN_TROGHET_2026-08-31.md (Jacobs mandat: trög demotering). generatePreSeasonMessage/deriveBoardAssessment delade tidigare identisk ≤2/≥10-ladderlogik (dubblett) och saknade en väg ner för en klubb som fastnar 'för bra för nedgradering (botten-3), inte bra nog för sin nuvarande höga förväntan' (t.ex. WinLeague, binärt — bara plats 1 'möter' den). Ny ENDA-källa recalibrateExpectationLadder (boardService.ts) lägger till en TREDJE väg ner: ny Club.consecutiveExpectationMisses-räknare (+1 vid verdict='failed', nollställs av met/exceeded), demoterar ETT steg när räknaren når TROGHET_THRESHOLD=2 — men BARA när positionsratcharna (upp-vid-topp2/ner-vid-botten3) inte redan ändrat idx samma säsong (ingen dubbel-demotering, botten-3-kollaps hanteras redan av sin egen omedelbara väg)."
value:
