claim: "Anspråk 4 / ortsunderhållet (DOM_ANSPAK4_ORTSUNDERHALL_2026-08-29.md): när klubben vuxit har orten stigit i sina förväntningar. Managerns ortsinsats (aktivitets- + volontär-csBoost) skalas med en KONTINUERLIG rykte-ramp (csUpkeepFactor), och en rykte-skalad baslinjedrag (csExpectationDrag) biter oavsett matchresultat. Båda ramperna delar golv/tak — EN storleksaxel, aldrig en diskret era-/ryktetröskel (D031:s felklass, flyttad från cs-axeln till rykte-axeln). Bara positiva boostar skalas; negativ csBoost (förlust, skandal) är orörd."
