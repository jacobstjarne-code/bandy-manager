fact_id: D039
category: design_principles
claim: "Centralredaktören (DOM_CENTRALREDAKTOREN_2026-08-31.md): ett koordinationslager OVANPÅ event-blocket (generatePostAdvanceEvents) och pressen (generatePressConference), byggt på befintligt substrat (SaveGame.narrativeBeatLog), utan att riva de fem underliggande systemen. Fem kanaler (press/transfer/orten/personal/manager) är LÅSTA — högst en händelse per kanal per omgång, globalt tak 2/omgång, delat mellan event-blocket och pressen. systemhandelse:true, retirementCeremony och HIGH 11:s måste-tier (isMustDecision) är undantagna taket helt. Innehålls-recency: samma semanticKey (event.type för det generiska lagret, frågetext för press) återkommer inte inom sitt fönster — press 5 omgångar, personal-beats 3 omgångar; om alla kandidater i en kontext är på cooldown släpper spärren och hela poolen blir valbar igen (samma idiom som journalistExclusive redan använde). Subjekts-rotation: generiska personal-beats (star-performance/player-praise/player-media-comment) utesluter de senast figurerade subjekten ur DEN FULLA TRUPPEN (inte ur den lilla per-omgångs-kvalificerande kandidatpoolen — en verifierad implementationsfälla, se revisions), K=5, min(truppstorlek−3, K); journalistExclusive behåller sitt egna career-breda varv (excludeCount=Infinity) via samma delade helper."
