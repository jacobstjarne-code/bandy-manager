fact_id: D041
category: design_principles
claim: "DOM_FRAMGANGSEKONOMIN_UPPSIDAN_2026-08-31.md, DIAGNOS REVIDERAD (2026-09-01): den ursprungliga kapacitets-diagnosen var falsifierad (arenaCapacity fryses vid world-gen, matchintäkten är PLATT — inte kvadratisk i levande rykte). De två faktiska framgång→rikedom-länkarna var kommunbidragets TVÅ oberoende mekanismer, bägge med en olimiterad/accelererande CS-skalning: economyService.ts's kommunBidrag (60000×repFactor×csFactor, csFactor KVADRATISK och därför konvex/accelererande vid högt CS) och politicianService.calculateKommunBidrag (30000×generosityMod×communityMod, communityMod=CS/50 helt olimiterad linjär 0-2). Bägge dämpade med D031:s redan ratificerade getCsDiminishingFactor (1,0 vid/under cs55, fallande till 0,25 vid cs100) — samma primitiv, konsekvent applicerad på båda mekanismerna, ingen ny kurva uppfunnen. repFactor (delad med lönernas reputationSalaryMultiplier) rördes INTE. lokStöd/agendaBonus/relBonus (ej CS-drivna) rördes INTE. De två mekanismernas reason-taggar delades upp ('kommunbidrag' säsongsstart vs 'kommunbidrag_politiker' säsongsslut) — bekräftat två avsiktliga källor, inte en dubbelbetalning."
