notes: |
  MÄTMETOD: scripts/ah2-basekonomi-intakt-matning-2026-08-28.ts kör den
  RIKTIGA produktionsvägen (createNewGame → advanceToNextEvent →
  economyProcessor.ts → calcRoundIncome → applyFinanceChange) och läser av
  club.finances-deltat per omgång direkt — ingen ombyggd kopia av formeln.
  Tre klubbar mättes, samma STEG 0-konstruktion som redan verifierats
  icke-mättande i anspark1-budgettryck-matning-2026-08-28.ts (+10 CA på
  club_vastanfors, ingen ny gissning):
    - KONTROLL: club_malilla, ingen boost (huvudseed 2 + pool 10 seeds × 3
      säsonger, 754 rundor totalt).
    - DOMINANT: club_vastanfors, +10 CA (huvudseed 100 + pool 10 seeds × 3
      säsonger, 999 rundor totalt).
    - HEROS: club_heros, dyraste anläggningstiern (kiosk 'upgraded' +
      vipTent, samma tier RAPPORT_ASKADAREKONOMIN_V2_MATNING_2026-08-27.md
      mätte "5472→2173" på), kanonisk styrka, ingen tvingad
      communityStanding (huvudseed 91000 + pool 5 seeds × 1 säsong, 137
      rundor totalt).

  BASELINE (oförändrad kod, före denna commit):
    KONTROLL poolat snitt: -7666 kr/omgång
    DOMINANT poolat snitt: -39 kr/omgång
    HEROS poolat snitt: -12246 kr/omgång
  Detta BEKRÄFTAR doktrinens fyndet rakt av: även den dominanta klubben
  (+10 CA, topp-3 i 10/10 provsäsonger) var i praktiken lika illa ute som
  kontrollklubben — lönebasens obegränsade skalning med currentAbility åt
  upp hela framgångens intäktsvinst.

  EFTER (TOP_POSITION_BONUS_MAX=0,25, FORM_BONUS=1.35/1.15/0.72):
    KONTROLL poolat snitt: -4988 kr/omgång (35% mindre back än baseline)
    DOMINANT poolat snitt: +6371 kr/omgång (från -39 till klart positivt)
    HEROS poolat snitt: -11413 kr/omgång (fortsatt tydligt back, jfr
      baseline -12246 — knapp 1:s kontinuerliga term ger Heros något
      (tidigare botten-lag fick alltid 0 i positionsterm), men knapp 2:s
      hårdare botten-straff (0,72 mot gamla 0,88) väger mer än upp det)

  KRITERIUM-FÖR-KRITERIUM (GODKÄNT NÄR, doktrinen):
  1. Kontroll ≈ 0: -4988 kr/omgång. INTE exakt 0 — se ÖPPEN FRÅGA nedan.
     35% förbättring mot baseline, men residualen är verklig, inte brus:
     poolens spridning (per-seed-snitt -14420…+5376) gör att -4988 ligger
     inom ~0,6 standardavvikelser av 0, men medelvärdet är konsekvent
     negativt över tre separata magnitud-mätningar (0,08/0,20/0,30/0,40
     testade för knapp 1 isolerat innan knapp 2 lades på).
  2. Inget uppgångsfönster: dominant säsong 1 (klättrande, slutplacering 5)
     ger -10444 kr/omgång, UNDER kontrollens poolade -4988. Detta ligger
     dock inom kontrollens EGEN observerade variationsbredd (sämsta
     kontroll-seed: -14420) — se ÖPPEN FRÅGA.
  3. Dominant ≤ ~3× kontroll: kvot dominant/|kontroll| = 6371/4988 = 1,28.
     Klart innanför taket.
  4. Heros-golvet intakt: -11413 kr/omgång, back. OK, ej rört.

  KARRIÄRBANA-SOLVENSMÄTNING (2026-08-29, uppföljning av interim-beslutet i
  DOM_AH2_BASEKONOMI_INTAKT_2026-08-28.md): kontrollklubben (samma
  konstruktion, huvudseed 2 + pool [3..12]) simulerad 12 säsonger istf 3,
  club.finances läst varje omgång (scripts/ah2-karriarbana-solvens-matning-
  2026-08-29.ts). Svar: -4988/omg är INTE en jämn nivå cuppengar/transfers
  absorberar över en karriär — 3/11 seeds (27%) föll i en självförstärkande
  ryktekollaps (bottenplaceringar → rykte mot 0 → weeklyBase/kapacitet vid
  golvet → nya förluster) som nådde FAKTISKT finansiellt game-over
  (< -2M, managerFired) inom säsong 8-12. 7/11 (64%) återhämtade sig och
  blev tydligt plus; 1/11 gränsfall (warning vid s12, ej game-over).

  KANDIDATFIX (MÄTT, EJ LÅST — inte i value-blocket ovan): WEEKLY_BASE_FLAT
  i economyService.ts (weeklyBase = WEEKLY_BASE_FLAT + reputation×50),
  3000 → 8000 (+5000, flat, ryktemässigt oberoende, rör ej
  ATTENDANCE_STANDING_WEIGHT eller lönen). Re-mätning (samma robusthetspool):
    Kontroll: -4988 → +1340
    Dominant: +6371 → +11969
    Heros:    -11413 → -4916 (fortsatt back, OK)
  Karriärbana efter fix: 0/11 game-overs (var 3/11) — de tre tidigare
  krascherna slutar nu säsong 12 på +1,06M / +1,47M / +3,87M.
  Kriterium 2: dominant S1 (-5158) under nya kontroll-snittet (+1340) men
  inom kontrollens egen spridning (sämst -8240) — brusgolv, som innan fixen.
  Kriterium 3: kvot dominant/kontroll = 8,94x — LÅNGT över ~3x-taket. Testat
  svagare lyft (+3000): kvot 9,38x, SÄMRE trots mindre lyft — bekräftar att
  kvoten degenererar nära noll-nämnare, inte att dominanten drar ifrån.
  Dominantens ABSOLUTA förskott över kontroll: 11359 (innan lyft) → 10629
  (efter) — i praktiken oförändrat. Ingen WEEKLY_BASE_FLAT-magnitud kan
  både nolla kontrollen OCH hålla en meningsfull kvot ≤3x (matematisk
  motsägelse när nämnaren går mot noll). Opus separata oro (dominantens
  ABSOLUTA basöverskott ~175 tkr/säsong extra, ingen anspåk-4-mekanism
  äter det ännu) kvarstår oavsett kvot-degenereringen.
  STATUS: kandidaten ligger i arbetsträdet (ocommittad), grönt
  tsc/vitest(3185/3185)/build. Ej flyttad till value-blocket — kräver
  Opus/Jacobs lås-beslut (kriterium 1 och 3 drar isär, doktrinens egen
  gråzonsklausul, nu i en form ingen tidigare mätning förutsåg).

  ÖPPEN FRÅGA (rapporterad, ej löst av Code — kräver Opus/Jacobs dom):
  Kriterium 1 nådde inte exakt ≈0 med rimliga magnituder. Extrapolation
  visade att TOP_POSITION_BONUS_MAX skulle behöva ~0,80 (mer än den
  SKYDDADE communityStanding-vikten 0,45) för att pressa kontrollen till
  noll — det bedömdes IMPLAUSIBELT (skulle göra tabellplacering ensam
  viktigare för läktarfyllnad än vad orten/lojaliteten är, tvärtemot
  RAPPORT_MATCHINTAKT_VIKT_OCH_COMMUNITYSTANDING_2026-08-25.md:s uttryckliga
  hierarki) och restes ALDRIG mot den skyddade konstanten. Rotorsaken till
  residualen är sannolikt lönesidan (obegränsad skalning med currentAbility
  × auto-möt-alla-krav-policyn, DOM_AH2B_RETENTION_2026-08-28) — uttryckligt
  UTANFÖR scope för denna dom (ruling A skyddar lönen). Kriterium 1 och 2:s
  gränsfall bedöms här som "inom brusgolvet, inte en artefakt av knapparna"
  men är INTE en hård siffra — flaggat för Opus-granskning enligt doktrinens
  egen eskaleringsklausul (gäller strikt kriterium 1/3-konflikt om
  CS-vikten, men samma princip — stanna hellre än att pressa en implausibel
  magnitud — tillämpad analogt här).

  ── OMMÄTNING 2026-08-30 (RE-MÄTNING, INTE NY KALIBRERING) ─────────────────
  value-blocket ovan är OFÖRÄNDRAT. Detta är en verifiering av att D033/D036:s
  slutsatser står efter två mätförgiftande buggfixar (3914a5e6 socialMedia-
  ryktesticken, 06b86b29 pendingEvents-dräneringen). Script:
  scripts/remat-ah2-basekonomi-2026-08-30.ts. Full redovisning i doktrinens
  tillägg 2026-08-30.

  1. Ryktesfixen påverkar INTE denna mätning. Väg B-scriptet kör med
     createNewGame-defaults (socialMedia: false), så ticken kunde aldrig fyra.
     Verifierat: originalscriptet ger bit-identiska tal på 96deea39 och HEAD.

  2. Patronen (nu nåbar) ändrar inte talen materiellt: kontroll 6438 → 6234,
     dominant 12391 → 12242, Heros oförändrat −2385 kr/omgång. Patronbidraget
     betalas på säsongsövergången (seasonEndProcessor.ts:306-320) och syns
     därför per konstruktion inte i netto/omgång-måttet; mätt även som
     säsongstotal (288 397 → 280 626 kr/säsong för kontrollen) — ingen ny
     intäktskälla av betydelse.

  3. TALEN I value-blockets EGEN MÄTNING REPRODUCERAR INTE LÄNGRE, av skäl
     som ligger utanför D033. Det låsta originalscriptet kört per commit:
       af760bec (D036:s egen commit):  kontroll +1340, dominant +11969,
                                       Heros −4916, kvot 8,94×
       765fdcb7 (konditionsspiralen):  kontroll +6325, dominant +13188,
                                       Heros −2385, kvot 2,09×
       HEAD:                           kontroll +6438, dominant +12391,
                                       Heros −2385, kvot 1,92×
     Hela skiftet ligger i 765fdcb7 ("autofyll tystnar aldrig under golvet") —
     bättre truppurval → bättre resultat → den resultatresponsiva intäkten
     (D033:s egna två knappar) svarar. Ingen av de övriga tolv commitarna i
     spannet rör talen.

  4. Kriterieutfall under korrigerade villkor: kriterium 2 uppfyllt renare än
     förut (dominantens säsong 1, +6790, ligger nu ÖVER kontrollens steady-
     state); kriterium 3 uppfyllt BOKSTAVLIGT (kvot 1,92× — D036:s
     degenererade 8,94× är borta); kriterium 4 uppfyllt men med halverad
     marginal (−4916 → −2385); kriterium 1 ÖVERSKJUTET åt andra hållet
     (kontroll +6438 kr/omgång ≈ +212 tkr/säsong för en klubb som inget gör).

  5. FLAGGAT, EJ ÄNDRAT — WEEKLY_BASE_FLAT=8000 (D036). Låstes på bevisbördan
     "3/11 seeds fick faktiskt finansiellt game-over". Karriärbanescriptet
     omkört: HEAD med 8000 ger 0/11 game-over (sämst +1 525 450); HEAD med
     3000 (kontrafaktiskt, mätt i en engångs-worktree, produktionen orörd) ger
     också 0/11 game-over, men 1/11 license-denial (−1 137 986). Ryktekollaps-
     spiralen som fixen skrevs mot är alltså borta även utan lyftet — 765fdcb7
     löste den. Lyftet köper nu marginal, inte överlevnad. Om det ska stå kvar
     är ett omkalibreringsbeslut för Jacob; konstanten är oförändrad i
     economyService.ts.
