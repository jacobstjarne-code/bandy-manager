fact_id: D045
category: design_principles
claim: "DOM_BOARD_TALAMOD_SYSTEM_2026-09-01.md (ersätter D044:s punktfix, sammanhängande pass över hela boardService.ts): fem klockor läser boardPatience, kalibrerade var för sig, aldrig mot varandra — säsongsslutets positionsterm (1) och löpande omgångsterm (4) straffar ALLT utom att exakt möta anchoren, medan tröghets-demoteringen (5, D044), den enda som gör anchoren barmhärtig, kräver TVÅ fulla säsonger. En WinLeague-klubb som stabilt slutar 2:a-4:e (exceptionellt, inte ett misslyckande) tömdes av (1)+(4) innan (5) hann sänka anchoren — bekräftat i D044:s egen H5-mätning (avsked säsong 2, inte säsong 5). Lösning: EN delad boardGraceState(expectation, finalPos, totalTeams) — sann när klubben missar sin anchor men stannar inom en tier därunder PÅ SAMMA EXPECTATION_LADDER, klippt vid nedflyttningszonens start (RELEGATION_ZONE_SIZE) så en genuin kollaps aldrig mjuknar. Klocka 1 (computeBoardPatienceUpdate) använder NEAR_MISS_SLOPE i stället för slope.below när i grace. Klocka 4 (updateRunningBoardPatience, som bara känner klubbens LIVE tabellplacering mitt i säsongen — inte finalPos) skalar RUNNING_LOSS_EXPECTATION_MULTIPLIER och losingStreakSurcharge med GRACE_MULTIPLIER. Klockorna 2/3/5 orörda (SKYDDAT i domen)."
value:
  NEAR_MISS_SLOPE: 2
  GRACE_MULTIPLIER: 0.5
  GRACE_BAND_WINLEAGUE: [2, 4]
