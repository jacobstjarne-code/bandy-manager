notes: |
  ── PROPOSAL-magnituderna (DOM:ens egna, ~2 och ~0,5) fungerade på FÖRSTA
     försöket, ingen ytterligare tuning behövdes ──────────────────────────
  Kört rakt av utan justering, GODKÄNT NÄR-kriterierna gröna direkt.
  Jacobs döm-siffrorna-klausul (samma mönster som MERIT_BUFFER_CAP/
  MATCH_REVENUE_REP_DAMP_FLOOR) alltså INTE utnyttjad denna gång — inget
  gråzonsfynd att eskalera till Opus, per handoffens egen villkorssats
  ("nästa gång du behövs är om mätningen säger att grace-bandet har fel
  bredd" — bredden höll).

  ── EN BUGG HITTAD OCH FIXAD UNDER BYGGET, INTE GISSAD FRAM ────────────────
  Första versionen av boardGraceState härledde graceband som "upp till nästa
  tiers ankare" rakt av, utan tak. För AvoidBottom (nästa tier nedåt är
  Survive, ankare=12=sistaplats) gav det graceband 10-12 — vilket SVALDE hela
  den faktiska nedflyttningszonen (plats 11-12, RELEGATION_ZONE_SIZE=2) och
  bröt domens egen SKYDDAT-paragraf ("kollaps firar fortfarande"). Fångat av
  boardService.test.ts:s BEFINTLIGA regressionstester (2026-08-22-sviten,
  "nedflyttningszonen plats 11-12") INNAN commit — 4 tester failade, 2 var
  äkta regressioner (fixade med ett tak vid `min(nästa tiers ankare,
  nedflyttningszonens start − 1)`), 2 var korrekta konsekvenser av grace och
  uppdaterades till de nya, avsiktliga värdena. Ingen av de fyra gissades —
  varje diff spårades till antingen en kodbugg eller en avsiktlig
  beteendeändring innan testet ändrades.

  ── H5-MÄTNINGEN (scripts/h5-renommetak-matning-2026-09-01.ts, samma seed/
     klubb som D044:s ursprungsfynd) ──────────────────────────────────────
  Säsong | plac | boardExpectation (efter säsongen)
    1    |  4   | winLeague  (miss 1 av 2, grace mjukade bägge klockorna)
    2    |  2   | challengeTop  (miss 2 av 2 → tröghet demoterar, precis som
                  D044 avsåg — klubben ÖVERLEVER för att slutamerätning inte
                  längre dränerar patiensen till noll UNDER de två säsongerna)
    3    |  2   | winLeague  (pos<=2 under challengeTop → 'exceeded' → ratchet
                  upp igen)
    4    |  2   | winLeague  (miss 1 av 2 igen)
    5    |  7   | challengeTop  (GENUIN kollaps — plac 7 är UTANFÖR WinLeague-
                  gracebandet (2-4) → miss 2 av 2, fullt bled samtidigt,
                  demoterar)
  AVSKEDAD säsong 6 (boardPatience=0) — EFTER en verklig kollaps (säsong 5:s
  plac 7), inte för en nästan-lyckad säsong. Precis vad GODKÄNT NÄR krävde:
  klubben sparkas ALDRIG säsong 2-5 för en 2:a-4:e plats, men en genuin
  svacka (plac 7, bortom gracebandet) bestraffas fortfarande fullt ut och
  bidrar till det senare avskedet. D044:s öppna fynd (avsked säsong 2, INNAN
  tröghetens andra chans) är löst.

  ── GODKÄNT NÄR, alla fem (DOM_BOARD_TALAMOD_SYSTEM_2026-09-01.md) ─────────
  1. UPPFYLLT — se H5-tabellen ovan.
  2. UPPFYLLT — säsong 5:s plac 7 (utanför grace) och de befintliga
     "nedflyttningszonen"-testerna (plats 11-12, AvoidBottom) visar oförändrat
     fullt bled.
  3. UPPFYLLT — säsong 1 ensam (miss 1) demoterade inte, samma tröghets-
     räknarlogik som D044, orörd.
  4. STRUKTURELLT UPPFYLLT, inte H5-mätt (H5 är en WinLeague-scenario) —
     boardGraceState(Survive, pos, 12) === false för alla 12 positioner,
     regressionstestat direkt (boardService.test.ts).
  5. UPPFYLLT för de TVÅ klockor domens Ägarskap-sektion faktiskt skopar
     (computeBoardPatienceUpdate + updateRunningBoardPatience) — bägge
     anropar SAMMA exporterade boardGraceState, ingen egen kopia. Domens
     prosa nämner "alla fyra klockor" i GODKÄNT NÄR-rubriken men Ägarskap-
     sektionen (och Jacobs handoff, "de två straffande klockorna") skopar
     bygget till exakt två — klockorna 2/3/5 är explicit SKYDDADE/orörda i
     domens egen §"Alla klockor mjuknar i grace, ingen i kollaps". Läst som
     "de klockor som straffar läser samma boardGraceState", inte en
     bokstavlig fyra-anropsplatser-räkning.

  ── VEM GÖR VAD ────────────────────────────────────────────────────────────
  Code: boardGraceState byggd (en källa), wirad i de två straffande
  klockorna, 8 nya regressionstester (4 nya boardGraceState-tester + 4 nya
  grace-medvetna updateRunningBoardPatience-tester), 2 befintliga tester
  uppdaterade till nya avsiktliga värden, H5-mätt (6 säsonger). tsc rent,
  boardService.test.ts 83/83 gröna.
  Opus: dömer om NEAR_MISS_SLOPE/GRACE_MULTIPLIER hamnar i gråzon (för
  snällt = ingen känner guldtryck, för hårt = D044 kvarstår) — proposal-
  värdena höll på första försöket, ingen eskalering behövdes denna gång.
