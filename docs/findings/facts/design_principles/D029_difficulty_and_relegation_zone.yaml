fact_id: D029
category: design_principles
claim: "Svårighetsgrad = reputation + expectationGap*(-12) + finansiell marginal-justering (-10 om <4x lönebudget, +5 om >=6x); tröskel easy>=75, medium>=50. Nedflyttningszon = RELEGATION_ZONE_SIZE=2 platser (konstant, delad mellan evaluateBoard och seasonEndProcessor)."
value:
  DIFFICULTY_EASY_THRESHOLD: 75
  DIFFICULTY_MEDIUM_THRESHOLD: 50
  DIFFICULTY_GAP_PENALTY_PER_STEP: -12
  DIFFICULTY_THIN_MARGIN_PENALTY: -10
  DIFFICULTY_THIN_MARGIN_RATIO: 4
  DIFFICULTY_HEALTHY_MARGIN_BONUS: 5
  DIFFICULTY_HEALTHY_MARGIN_RATIO: 6
  RELEGATION_ZONE_SIZE: 2
  BOARD_PATIENCE_WARNING_ZONE_DELTA: -5
unit: score points / league positions
source:
  type: design_decision
  decided_by: jacob
  doc: "src/domain/services/offerSelectionService.ts (computeDifficultyScore), src/domain/services/boardService.ts (RELEGATION_ZONE_SIZE, computeBoardPatienceUpdate, evaluateBoard AvoidBottom)"
verified_at: 2026-08-17
verified_by: code
status: active
invariants:
  - "value.DIFFICULTY_EASY_THRESHOLD > value.DIFFICULTY_MEDIUM_THRESHOLD"
