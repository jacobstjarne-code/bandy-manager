related_facts: [D028]
notes: |
  U1 (SLUTTEST_KO.md, 2026-08-17) — "det största fyndet i hela testserien":
  offerSelectionService.ts satte difficulty ENBART från reputation (hard
  <55). Skutskär (rep 52, AvoidBottom-krav — det lägsta som finns, sund
  ekonomi 4.2x lönebudget) klassades "hard" trots att jobbet objektivt var
  lätt. En testare sabbade en säsong medvetet (felvänd taktik, svagaste
  elva, 15 vägrade presskonferenser) och slutade femma — styrelsen blev
  MER nöjd, inte mindre.

  Ny modell, tre faktorer, ingen ny körtidssimulering: reputation (bas,
  som idag) + expectationGap (kräver styrelsen mer än ryktet motiverar,
  ordinalt 0-3 per krav-nivå, straff -12/steg) + finansiell marginal
  (finances/wageBudget, straff -10 under 4x, bonus +5 över 6x).

  Kalibrering (engångsjobb, INTE en automatiserad pipeline): räknat för
  hand mot de tolv befintliga CLUB_TEMPLATES. Alla tolv har idag
  expectationGap=0 (styrelsekravet matchar redan reputation-tiern i
  templaten) — så modellens synliga effekt kommer nästan helt från
  marginaljusteringen. Resultat vid tröskeln easy>=75/medium>=50:
  Slottsbron (score 48) och Heros (score 40) hard; Skutskär (52),
  Rögle (50) och sex till medium; Forsbacka (90) och Västanfors (83) easy.
  Jämfört med gamla modellen: Skutskär och Rögle flyttar hard→medium
  (den faktiska bug-fixen), övriga oförändrade grupptillhörighet.

  Nedflyttningszonen: ingen enskild "N lag flyttas ner"-regel fanns
  tidigare i spelet (tre olika filer hade tre olika lösa trösklar för
  narrativ "bottenstrid" — 9+, 10+, och en totalTeams/3-räkning för
  boardPatience). RELEGATION_ZONE_SIZE=2 är en NY delad konstant, satt
  bara för boardPatience-mekaniken (evaluateBoard + seasonEndProcessor) —
  de lösa narrativa trösklarna i seasonContextService.ts/
  pressConferenceService.ts rördes INTE (utanför U1:s scope, ingen
  rapporterad symptom pekade dit).

  Varningszon (plats 9-10 av 12): ny, svag tålamodsstraff (-5, ingen
  failure-räknare) precis ovanför den faktiska zonen — trycket ska byggas
  upp innan klippan, inte bara vid den. Samma bredd som RELEGATION_ZONE_SIZE.

  REVISION 2026-08-25 (Jacobs dom, efter H4-mätning 5 — RAPPORT_SURVIVE_
  VERIFIERAD_OCH_ROGLE_TIERFRAGAN_2026-08-25.md): 2026-08-17-slutsatsen
  ovan är INVALIDERAD av senare data, inte av ett kodfel. Mellan de två
  datumen byggdes en hel serie styrelsemodell-kalibreringar (RUNNING_LOSS_
  EXPECTATION_MULTIPLIER, tier-härledda styrelseobjektiv, meritbufferns
  partiella skydd, Survive-tierns avskedsundantag) som tillsammans gjorde
  licensnekan (ren finansiell marginal) till den FAKTISKT dominerande
  avskedsorsaken för klubbar under rep ~55 — uppmätt, inte antaget: Rögle
  100% avsked (15/20 licensnekan), Skutskär 85% (14/20 licensnekan). Den
  gamla marginalbestraffningen (-10 under 4x) var för svag för att fånga
  detta. Ny bestraffning: -20 under 4,5x (var -10 under 4x), ny mellanzon
  -5 under 5,5x. Effekt på de tolv klubbmallarna: Rögle (score 50→30) och
  Skutskär (52→32) flyttar medium→hard — motsatt riktning mot 2026-08-17-
  fixet, men samma underliggande princip (marginalen ska spegla verklig
  avskedsrisk). D029:s ursprungliga princip står kvar: en genuint sund
  marginal (>=6x) skyddar fortfarande mot hard oavsett hur lågt ryktet är.
  Löser INTE MidTable-klubbar vars höga avskedsfrekvens drivs av boardPatience-
  formeln snarare än marginal (Söderfors 85%, Lesjöfors 90%, båda kvar
  medium) — den vägen är avstängd för vidare kalibrering samma dag ("sluta
  bygga i styrelsemodellen").
