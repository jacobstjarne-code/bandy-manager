fact_id: D034
category: design_principles
claim: "Managerrenommé (0-100) härleds ur seasonSummaries + antal avsked: bas 40, SM-guld +20, cupvinst +10, ligavinst +8, pallplats +4, slutspelskval +3, nedflyttningszon -6, per avsked -12. Antal erbjudanden på tränarmarknaden: >=55 ger 3, >=30 ger 2, >=15 ger 1, under 15 ger 0. Tredje avskedet (MAX_FIRINGS=3) ger 0 oavsett renommé. Lediga tränarstolar = klubbar i tabellens bottentredjedel (vacancyZoneSize = max(RELEGATION_ZONE_SIZE, round(totalTeams/3)) = 4 i en 12-lagsliga) sista säsongen av uppehållet."
