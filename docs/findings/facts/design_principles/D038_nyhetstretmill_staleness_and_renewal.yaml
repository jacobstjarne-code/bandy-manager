fact_id: D038
category: design_principles
claim: "Anspråk 4, spak 3 / nyhetstretmillen (DOM_ANSPAK4_TREDJE_SPAK_NYHET_2026-08-29.md): en ortsaktivitet är färskvara. Varje CS-bärande aktivitets flata csBoost multipliceras med en egen staleness-multiplikator som faller geometriskt med antal säsonger aktiviteten varit klubbens stående erbjudande, mot ett golv > 0. Avtrappningstakten skalar med klubbstorlek via SAMMA rykte-ramp som knapp 1 och 2 (csLinearRamp 80→100) — en klubb på/under rykte 80 har retention exakt 1,0 och ligger därmed helt utanför mekaniken. Färskheten återställs bara av en NYHETSINVESTERING i riktiga kronor, erbjuden som ett synligt dashboardbeslut (GameEventType communityActivityRenewal, tier month, mode dilemma) med två val: förnya (betala) eller avböj (noOp). Förnyelsen rör aldrig communityStanding direkt och aldrig aktiviteternas intäktssida."
