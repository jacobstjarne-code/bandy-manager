  ── VÄG C: AGGREGERINGSHYPOTESEN, MÄTT OCH FÖRKASTAD ──────────────────────
  Hypotesen var att getOrtFreshnessFactor:s vägda aritmetiska medel utspäder
  den enskilda förnyelsen (max vikt 0,12 av 0,67 ≈ 18 %), och att ett
  min()-lutande potensmedel skulle låta en försummad aktivitet dra mer och
  därmed göra förnyelsen mer värd. Det gör tvärtom, och orsaken är strukturell:
  den klubb som ALDRIG förnyar har alla nio aktiviteter exakt lika gamla, så
  varje potensmedel returnerar samma tal för den. Uppmätt, DOMINANT över tio
  säsonger, potensordning p = 1 / 0,25 / −1 / −4:
    SPARAR färskhet   0,822  0,822  0,822  0,822   (bit-identisk, som väntat)
    FÖRNYAR färskhet  0,942  0,941  0,939  0,934   (faller — trappan av åldrar
                                                    är just det min() straffar)
    FÖRNYAR − SPARAR  −45 125  −46 487  −49 153  −55 647 kr/säsong
  Det vägda aritmetiska medlet (p = 1) är alltså inte bara det disciplinerade
  valet (D031: ingen ny gissad viktvektor), det är också det mätt bästa.
  Sonderingen kördes med en tillfällig env-styrd potens i getOrtFreshnessFactor
  som ÄR BORTTAGEN igen — produktionskoden har bara p = 1.

  ── VÄG C: HYPOTESER SOM INTE ÄR LEVERANSEN ───────────────────────────────
  Förnyelsefrekvensen (cooldown 6 → tätare) prövades INTE och ska inte prövas:
  den är kapacitetsbunden redan (tröskeln surfar efter EN säsong vid rykte 100,
  så efterfrågan är nio kort/säsong och cooldownen släpper igenom 3,7-4,5).
  Tätare kort hade höjt både kostnad och färskhet ungefär proportionellt och
  inte flyttat kvoten — och domen säger uttryckligen BEHÅLL cooldown 6.
  Ett eget känslighetstal mellan färskhet och publik (en multiplikator utöver
  [golv, 1]) byggdes INTE: det hade varit ett andra, dolt golv och därmed en
  omväg runt SKYDDAT-punkten om holdbarhet.
