notes: |
  ── FORMEL ─────────────────────────────────────────────────────────────────
  retention(rykte) = csLinearRamp(rykte, 80, 100, 1,0, 0,75)
  multiplikator(s, rykte) = GOLV + (1 − GOLV) · retention(rykte)^s
    där s = currentSeason − communityActivitiesSince[aktivitet]

  Exakt 1,0 vid s = 0 och för varje rykte ≤ 80 (retention = 1,0 ⇒ 1^s = 1).
  Asymptot mot 0,25, aldrig 0 — D031:s anti-vägg, samma golv som
  getCsDiminishingFactor redan använder. Vid rykte 100: 1,000 / 0,813 / 0,672 /
  0,566 / 0,428 för s = 0/1/2/3/5.
  (Talen omräknade 2026-08-31 när retentionstaket gick 0,85 → 0,75; de gamla
  var 1,000 / 0,888 / 0,791 / 0,710 / 0,583.)

  ortFreshnessFactor = 0,65 + 0,35 · (vägt medel av multiplikatorerna − 0,25)/0,75,
  vikt = aktivitetens ACTIVITY_CS_BOOST. Multipliceras in i den FÄRDIGKLAMPADE
  publikandelen (computeAttendanceRate), inte i summan innan ATTENDANCE_CAP.

  Nyhetskostnad = 10 000 · csLinearRamp(rykte, 80, 100, 1, 4,0), avrundat till
  hela tusenlappar: 10 tkr vid rykte ≤80, 25 tkr vid 90, 40 tkr vid 100.
  (Var 25 000 · samma ramp = 25/63/100 tkr fram till 2026-08-31.)

  ── MÄTHARNESS: EN INSTRUMENTFIX SOM MÅSTE STÅ FÖRST ───────────────────────
  Första körningen gav 0,4 förnyelsebeslut per säsong för en dominant klubb —
  mekaniken syntes knappt. En diagnoskörning visade varför, och det var INTE
  mekaniken: ansprak4-ortsunderhall-matning-2026-08-30.ts besvarar bara
  patron-events och låter allt annat ligga kvar obesvarat i pendingEvents.
  getThrottledActiveDecisionCount låg därför konstant på taket 3 och
  canAddDecision blockerade 168 av 175 omgångar. Varje budgetgrindad händelse
  (mecenatens middag, burnout-lättnaden, förnyelsebeslutet) var i praktiken
  ogenererbar i den harnessen. Det spelade ingen roll för D037 (som mätte en
  budgetoberoende csBoost-faktor) men gör spak 3 omätbar.

  Det nya scriptet håller kön ren med kodbasens EGEN dokumenterade "håll
  ställningen"-policy — getDefaultRolloverChoice (deferredRolloverService.ts),
  samma funktion produktionen kör vid säsongsbytet. Månadsbeslut utan noOp/
  rejectTransfer plockas bort utan att någon effekt tillämpas. Alla tre armar
  kör identisk rensning, så jämförelsen är intern och giltig — men ABSOLUTTALEN
  ÄR INTE JÄMFÖRBARA MED D037:s. Därför mäts GLIDER om i samma körning som egen
  baslinje. Läs aldrig ett tal härifrån mot ett tal i D037 utan att gå via
  respektive körnings egen GLIDER-arm.

  ── SVEPET (dominant, 20 säsongsprover per cell) ───────────────────────────
  Fast: retention-tak 0,85, golv 0,25, cooldown 6 omgångar.
  Två knappar svepta — förnyelsetröskeln och kostnadsmultiplikatorn.

  Tröskeln 0,90 → 0,95: antal förnyelsebeslut per säsong 0,4 → 3,6. Vid 0,90
  krävs TVÅ hela säsonger innan ett rykte-95-lags aktivitet blir erbjudbar;
  vid 0,95 räcker en. 0,95 valdes för att en säsong är den takt domen beskriver
  ("ett topplag måste rotera hela tiden"), och för att ~3,6 kort per säsong
  ligger inom vad en dashboard tål utan att bli en kortskur.

  Kostnadsmultiplikatorn, med tröskel 0,95 och kön rensad (WEEKLY_BASE_FLAT
  fortfarande 8000 i dessa tre celler):
    mult   pris@rep100   nyhetskostnad/säs   DOM netto/säs   FÖRNYAR−GLIDER
    3,0        75 tkr        242 200 kr         541 665         +206 806
    4,0       100 tkr        318 450 kr         462 212         +127 354   ← låst
    5,0       125 tkr        395 000 kr         385 662          +50 804
  (GLIDER-referens i samtliga: 334 858 kr/säsong. SPARAR, dvs. ortsprogrammet
  igång men aldrig förnyat: 781 720 kr/säsong, +446 862 mot GLIDER — det är
  gapet UTAN någon nyhetskostnad, dvs. mätningens egen "före spak 3"-punkt.)

  4,0 låstes som den högsta nivå som fortfarande lämnar ett TYDLIGT POSITIVT
  incitament att finansiera orten. Domen säger "krymper", inte "inverterar";
  D037 hade redan inversionen som hård övre gräns för knapp 2, och 5,0 ligger
  nära den (+51 tkr, och 6,0 hade vänt tecknet). 100 tkr är dessutom en rund
  siffra i samma register som spelets övriga engångsinvesteringar
  (akademiuppgradering 50/150 tkr, anläggningsuppgradering 200 tkr).

  ── ⛔ HISTORISK: GODKÄNT NÄR PÅ CS-VÄGEN (före väg C) ──────────────────────
  ⛔ BESKRIVER INTE NULÄGET. Den här genomgången mättes när staleness bet på
  communityStanding. Sedan 2026-08-31 (väg C) biter den på PUBLIKEN i stället,
  och kostnaden/kurvan är omkalibrerade. Gällande siffror står i
  "VÄG C: MÄTNING 2026-08-31" längst ned. Bygg aldrig på talen nedan —
  de är kvar för att visa VARFÖR vägen byttes, inte vad som gäller.
  Slutkörning (då): kostnad ×4,0, tröskel 0,95, cooldown 6, WEEKLY_BASE_FLAT 3000
  (den konsoliderade omhärledningen, se D033:s notering 2026-08-31).

  1. BÄGGE SIDOR SVIDER — UPPFYLLT. Dominant, netto/säsong:
       FÖRNYAR 281 070 · SPARAR 603 780 · GLIDER 182 976
       FÖRNYAR − GLIDER = +98 094 kr/säsong
       SPARAR  − GLIDER = +420 804 kr/säsong  (mätningens egen "före"-punkt)
     Överskjutningen krympte med 77 %. D037:s referenstal (+291 252 i den
     harnessen) är inte direkt jämförbart, men åt samma håll och samma
     storleksordning. Att finansiera orten är inte längre gratis pengar; det
     är fortfarande marginellt lönsamt, vilket är avsiktligt — en inversion
     hade gjort ortsspaken till en fälla.
  2. KONSUMERAR ÖVERSKOTTET — UPPFYLLT. Dominantens nettoöverskott faller
     603 780 → 281 070 kr/säsong när orten hålls fräsch, dvs. −322 710 eller
     53 %. Nyhetskostnaden är 318 450 kr/säsong fördelat på 3,6 investeringar.
  3. SMÅ KLUBBAR OCH SURVIVE ORÖRDA — UPPFYLLT, mätt och inte antaget.
       KONTROLL (club_malilla, rykte-snitt 75,3): 0,0 förnyelsebeslut på 12
         säsongsprover, staleness-snitt 0,988, och FÖRNYAR/SPARAR är
         BIT-IDENTISKA på varje rad (netto 256 441, CS-snitt 67,0, publik 433).
       HEROS (club_heros, rykte-snitt 47,0): 0,0 förnyelsebeslut på 5
         säsongsprover, staleness 1,000, FÖRNYAR/SPARAR bit-identiska.
     KONTROLLENS 0,988 är inte ett fel: enskilda seeds passerar rykte 80 under
     goda säsonger och får då en avtrappning på 1,2 % — exakt vad en
     kontinuerlig ramp ska göra vid gränsen, i stället för att slå om.
     HOLDBARHET: en dominant klubb som betalar håller staleness-snittet på
     0,883 mot 0,806 om den låter bli — mekaniken går att motverka, aldrig en
     vägg. Att den inte når 1,000 är cooldownens verk (nio aktiviteter slits
     parallellt, som mest ~4 förnyelser hinns med per säsong).
     INGEN DUBBELRÄKNING: economyService.ts är helt orörd. Staleness biter
     bara på csBoost-vägen i communityProcessor.ts; aktiviteternas match- och
     omgångsintäkter är exakt som förut.
  4. D-FACT — detta dokument.

  ── ⛔ STÄNGD FRÅGA (var: "FÖRNYELSEN KÖPER NÄSTAN INGEN CS") ──────────────
  ⛔ BESVARAD OCH ÖVERSPELAD 2026-08-31. Jacob valde väg (c) nedan: utebliven
  förnyelse fick en ANNAN konsekvens än CS — publiken. Frågan "vad köper
  förnyelsen i CS?" har därmed ett avsiktligt svar: ingenting, och det är
  poängen. Texten står kvar oförändrad som diagnosen som motiverade bytet;
  den beskriver INTE nuläget och ingen ska agera på a/b/c-listan igen.
  Mätt, och det viktigaste fyndet i det passet. Dominantens CS-snitt:
    FÖRNYAR 77,7 · SPARAR 77,4 · GLIDER 67,9
  Att betala 318 tkr per säsong för färskhet köper alltså +0,3 CS mot att låta
  allt slitas. Rotorsaken är strukturell och är D037:s egen finding 1, en nivå
  ned: hela ortsspaken är värd ~10 CS för en dominant klubb, och av den bärs
  merparten av VOLONTÄRBONUSEN (upp till 1,5 CS/omgång) medan de nio
  aktiviteterna tillsammans bara ger 0,67 CS/omgång före skalning. Staleness
  kan per konstruktion bara röra de 0,67, och efter csUpkeepFactor (0,89) och
  getCsDiminishingFactor (~0,3 vid hög CS) blir hela skillnaden mellan färskt
  och slitet ~0,015 CS/omgång.

  Konsekvens för spelaren: HÅLL ORTEN MEN FÖRNYA ALDRIG är i dagens balans den
  dominanta strategin — aktiviteterna är intäktspositiva (D037 finding 2, orört
  per domens SKYDDAT), avböj är gratis, och CS-priset för att avböja är inom
  bruset. Domens kriterium 1 (finansiera-vs-släppa) är uppfyllt; domens
  INRE val (förnya-vs-låt-tröttna) är det inte.

  Tre vägar finns, ingen av dem tagen här eftersom alla tre är balanskall,
  inte klassificeringsfrågor:
    a) Låt staleness även träffa volontärbonusen (uttryckligen utanför detta
       pass scope — frivilliga har redan en egen moral-/avhoppsmekanik).
    b) Höj de nio aktivitetskonstanterna så CS-vägen väger tyngre (rör D037:s
       mätta balans).
    c) Ge den uteblivna förnyelsen en ANNAN konsekvens än CS (t.ex. en
       mecenat-/patron-reaktion), dvs. en fjärde spak.
  Ägare: Opus formulerar frågan, Jacob dömer. Code bygger inget av a–c utan
  en dom.

  ── EJ BYGGT, KRÄVER JACOBS ARKITEKTURBESLUT ───────────────────────────────
  Domen: "förnyelsebehovet surfar som ett dashboard-beslut (HIGH 11: 'denna
  månad'-nivå för normalt, 'måste'-nivå bara om CS är på väg under en
  uttågströskel)." Andra halvan är INTE byggd. decisionTierService.ts:s
  måste-medlemskap är stängt på TYP-nivå (Jacobs dom, ordagrant i filen) och
  tier saknar det per-instans-åsidosättande som mode/priority har. En villkorad
  eskalering kräver därför antingen ett nytt `tier?`-fält på GameEvent (analogt
  med `mode?`) eller någon annan mekanism — ett arkitekturbeslut, inte en
  klassificering. Eventet är statiskt 'month' tills dess.

  ── TEXT ───────────────────────────────────────────────────────────────────
  communityRenewalText.ts är TOM (title/body/valetiketter) tills Opus levererar.
  Interpolationen är wirad: {activity} {cost} {seasons} {wear}. Kortet renderar
  ingen prosa i mellantiden — avsiktligt, per CLAUDE.md:s hårda regel.

  ── VÄG C: MÄTNING 2026-08-31 ──────────────────────────────────────────────
  Detta är den GÄLLANDE genomgången. Den ersätter både CS-vägens GODKÄNT NÄR
  ovan och den stängda ÖPPNA FRÅGAN. Script: samma harness
  (scripts/ansprak4-nyhetstretmill-matning-2026-08-31.ts), samma klubbar, samma
  seeds, samma tre armar. Kalibrering: retentionstak 0,75, grundkostnad 10 000,
  kostnadsramp ×4,0, tröskel 0,95, cooldown 6, ORT_FRESHNESS_FLOOR 0,65.

  HORISONTEN ÄR EN DEL AV MÄTNINGEN, inte en detalj. Harnessens default (20
  säsongsprover, varav 15 från poolens 3-säsongskörningar) UNDERSKATTAR
  mekaniken systematiskt: en klubb som slutat förnya har efter tre säsonger
  knappt hunnit erodera. Därför redovisas båda horisonterna nedan, och
  A4_POOL_SEASONS lades till i scriptet (default oförändrad) för att kunna läsa
  steady state. Läs 10-säsongersraden som mekanikens verkliga form.

  1. BÄGGE SIDOR SVIDER I KRONOR — TYDLIGT FÖRBÄTTRAT, INTE HELT LÖST.
     DOMINANT, FÖRNYAR − SPARAR (netto/säsong; negativt = förnyelsen kostar mer
     än den drar in):
                        5 säsonger      10 säsonger
       före kalibrering   −288 395        −320 169
       efter              − 78 476        − 45 125
     Förbättring 3,7× respektive 7,1×. Att FÖRNYA kostar 130-164 tkr/säsong och
     drar in 52-119 tkr/säsong mer publikintäkt än att glida. Kvoten gick från
     ~13× till ~1,3×.
     ÄRLIGT OM RESTEN: att alltid förnya är fortfarande marginellt sämre än att
     aldrig göra det, −45 tkr/säsong på ett netto kring 460-505 tkr, dvs. ~9 %.
     Domens ord är "konkurrenskraftig, inte 'förnya aldrig'-dominant" — den
     tröskeln är passerad; "förnyelsen vinner" är den inte. Två skäl att det är
     rätt läge och inte en halvfärdig kalibrering:
       (a) HALLER_FORNYAR är den SÄMSTA möjliga förnyelsepolicyn. Den betalar
           varje kort så fort det surfar, dvs. vid slitage ~0,81, och köper då
           bara tillbaka en säsongs färskhet för fullt pris. En spelare som
           väntar tills en TUNG aktivitet (skolbesok väger 0,12 av 0,67, sociala
           medier 0,03) blivit ordentligt sliten får flera gånger mer färskhet
           per krona. Mätningens negativa tal är alltså golvet för vad
           förnyelse är värd, inte snittet.
       (b) Att trycka priset ytterligare tills även den blinda policyn går plus
           gör förnyelsen till gratis pengar — då är valet borta åt andra
           hållet. Jacobs formulering 2026-08-31: målet är "en avvägning som
           ibland talar för att förnya och ibland inte".
  2. SYNLIG EROSION FÖR DEN SOM ALDRIG FÖRNYAR — UPPFYLLT.
     DOMINANT HALLER_SPARAR, ortFreshnessFactor säsong för säsong (huvudseed):
       1,000 → 0,945 → 0,847 → 0,798 → 0,761 → 0,741 → 0,782 → 0,752
     och publiken med den: 588 → 625 → 541 → 524 → 480 → 330 → 373 → 388.
     Vid säsong 5 drar den klubb som förnyat 579 mot 480 för den som inte gjort
     det — 17 % skillnad på samma lag, samma tabellplacering, samma CS. Det är
     läsbart som "supportrarna slutade komma". Före kalibreringen var samma
     10-säsongersgenomsnitt 0,874 (−13 %); nu 0,822 (−18 %).
  3. SMÅ KLUBBAR OCH SURVIVE OPÅVERKADE — UPPFYLLT.
     HEROS (club_heros, rykte 40,7-47,0): färskhet 1,000 på VARJE rad, noll
     förnyelsekort, FÖRNYAR och SPARAR BIT-IDENTISKA (netto −144 355 vid 5
     säsonger, −167 784 vid 10). Garanterat av formen: rykte ≤ 80 ⇒ retention
     exakt 1,0 ⇒ 1^s = 1 ⇒ vägt medel 1,0 ⇒ faktor exakt 1,0.
     KONTROLL (club_malilla): färskhet 0,997-0,998 vid 5 säsonger (rykte-snitt
     75,3) och 0,975 vid 10 (rykte-snitt 82,0 — klubben har då vuxit förbi
     rykte-golvet och är inte längre en liten klubb den säsongen).
     AVVIKELSE ATT NOTERA ÄRLIGT: vid 5 säsonger är KONTROLL inte längre
     bit-identisk mellan armarna som den var före kalibreringen — den ser 0,6
     kort/säsong och −8 591 kr/säsong, mot 0 och 0 tidigare. Det är den brantare
     erosionen som gör att enstaka seeds som nuddar rykte 82 hinner passera
     tröskeln. Storleksordningen är Δfärskhet 0,001. Motsvarande tal före
     kalibreringen på TIO säsonger var −91 658 kr/säsong; efter är det −21 437.
     Mellanklubben är alltså MINDRE exponerad i kronor än förut, bara synligare
     i korträkningen. En hård "händer aldrig under rykte X" hade varit precis
     den vägg D031 finns för att stoppa.
  4. HOLDBARHET — UPPFYLLT, OCH DET ÄR DEN BINDANDE RANDEN.
     En klubb som betalar VARJE förnyelse ligger på ortFreshnessFactor
     0,92-0,95 och glider INTE nedåt över tio säsonger (huvudseed: 1,000 /
     0,962 / 0,929 / 0,926 / 0,919 / 0,923 / 0,947 / 0,947). Mekaniken går att
     motverka; den är dyr, aldrig omöjlig.
     Den som aldrig förnyar planar ut kring 0,74-0,78 — långt över golvet 0,65,
     som bara nås asymptotiskt efter decennier. Ingen kollaps, ingen vägg.
     GOLVET RÖRDES INTE, TROTS ATT DET HADE VARIT DEN ENKLA KNAPPEN. Δfärskhet
     skalar linjärt med (1 − golv), så ett golv på 0,30 hade fördubblat
     förnyelsens värde och tagit kriterium 1 hela vägen. Domens SKYDDAT säger
     att en helt sliten stor klubb ska dra MERPARTEN av sin publik, och Jacobs
     prioritetsordning 2026-08-31 är uttrycklig: holdbarheten vinner, backa på
     fixens aggressivitet i stället för på golvet. Det är gjort, och det är
     skälet till att kriterium 1 landar på "nära jämvikt" och inte på "löst".
  5. KONSUMERAR ÖVERSKOTTET — OMFORMULERAT, INTE BORTFALLET (Jacobs anvisning
     2026-08-31). Kriteriet formulerades när WEEKLY_BASE_FLAT var 8000; efter
     omhärledningen till 3000 (D033) är dominantöverskottet mindre, och att
     dimensionera priset för att beta av en specifik kronsumma vore att
     kalibrera mot ett tal som mätts under andra antaganden. Överskottet finns
     kvar men är mindre: SPARAR − GLIDER är 320 530 kr/säsong (5 säsonger) och
     253 095 (10). Nyhetskostnaden tar 130-164 tkr/säsong av det, dvs. 41-65 %,
     och tar det numera för att den ÄR värd publiken — inte som en avgift.
     Kriteriet läses hädanefter som proportionalitet: priset ska ligga i samma
     storleksordning som färskheten det köper. 164 tkr kostnad mot 119 tkr
     värde vid tio säsonger är den relationen.

