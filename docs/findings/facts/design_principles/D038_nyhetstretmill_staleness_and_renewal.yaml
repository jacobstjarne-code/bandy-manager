revisions:
  - date: 2026-08-31
    change: >-
      VÄG C (Jacobs beslut, DOM_ANSPAK4_TREDJE_SPAK_NYHET_2026-08-29.md §"VÄG C").
      Staleness KONSUMERAS INTE LÄNGRE AV communityStanding. De nio flata
      csBoost-konstanterna i communityProcessor.ts är återställda till oskalade
      (väg A:s `* stale(key)` borttagen); i stället aggregerar
      getOrtFreshnessFactor (communityRenewalService.ts) per-aktivitets-
      multiplikatorerna till EN klubbfaktor som multipliceras in i
      computeAttendanceRate (economyService.ts) och därmed i både matchintäkten
      och den visade publiksiffran. Rot: den ursprungliga mätningen (se ÖPPEN
      FRÅGA nedan) visade att staleness per konstruktion bara kunde röra de 0,67
      CS/omgång aktiviteterna ger, medan volontärbonusen ensam ger upp till 1,5
      — att förnya köpte +0,3 CS för 318 tkr/säsong och "håll men förnya aldrig"
      var dominant. NYTT VÄRDE: ORT_FRESHNESS_FLOOR 0,65 (svept, se
      OMHÄRLEDNING nedan). Inget befintligt value-fält ändrat — kurvan,
      tröskeln, kostnaden och cooldownen är återanvända exakt som domen kräver
      ("BEHÅLL … staleness-KURVAN").
  - date: 2026-08-31
    change: >-
      VÄG C, KALIBRERINGEN (samma dag, efter att flytten ovan mätts). Väg C
      flyttade konsekvensen rätt men löste inte kriterium 1: FÖRNYAR låg
      −288 tkr/säsong mot SPARAR, dvs. "förnya aldrig" var fortfarande
      dominant, nu i kronor i stället för i CS. Rotorsak, mätt: förnyelsens
      PRIS var aldrig satt mot vad förnyelsen KÖPER. D038:s första svep valde
      kostnadsmultiplikatorn som "den högsta nivå som fortfarande lämnar ett
      tydligt positivt incitament mot GLIDER" — priset kalibrerades alltså mot
      hur mycket ÖVERSKOTT det skulle beta av, i ett läge där förnyelsen
      bevisligen köpte +0,3 CS (= ingenting), och ärvdes sedan rakt in i väg C
      där den plötsligt skulle betalas av publikintäkt. Publikintäkten är
      ~0,98 Mkr/säsong och färskheten multiplicerar den inom [0,65, 1], så hela
      mekanikens spann är ~343 tkr/säsong mellan två oåtkomliga ytterligheter —
      medan förnyelsepolicyn kostade 409 tkr/säsong. Priset låg ÖVER taket:
      ingen kurv-, golv- eller aggregeringsändring kunde ha lagat det.
      ÄNDRADE VÄRDEN: ACTIVITY_RENEWAL_BASE_COST 25000 → 10000 (10/25/40 tkr
      vid rykte 80/90/100; rykte-rampen ×4 orörd) och
      ACTIVITY_STALENESS_RETENTION_CEIL 0,85 → 0,75 (erosionen behövde vara
      läsbar inom en karriärlängd — kriterium 2). ORT_FRESHNESS_FLOOR,
      ACTIVITY_STALENESS_FLOOR, tröskeln, cooldownen och kostnadens
      rykte-multiplikator är ORÖRDA. Golvet rördes medvetet INTE trots att en
      sänkning hade gjort kalkylen jämnare — Jacobs prioritetsordning
      2026-08-31: holdbarheten vinner över att få förnyelsen att gå plus.
