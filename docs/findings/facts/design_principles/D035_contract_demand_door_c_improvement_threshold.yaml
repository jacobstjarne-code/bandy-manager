fact_id: D035
category: design_principles
claim: "A-H2b retention-domens villkor 2, dörr (c) (DOM_AH2B_RETENTION_2026-08-28.md, contractDemandService.ts:clubSatisfiesSeasonSuccessGate) kräver nu att slutplaceringen förbättrats med minst IMPROVEMENT_THRESHOLD_POSITIONS (5) platser mot föregående säsong, inte 'vilken förbättring som helst' (den ursprungliga ordagranna doktrintolkningen, finalPosition < previousPosition). Uppmätt: ett mittenlags (club_malilla) säsong-till-säsong-placeringsförändring har standardavvikelse ~4.6 platser — praktiskt taget lika stor som om placeringen vore oberoende slumpmässig år för år. Tröskeln 5 (avrundat uppåt från 4.56) sänker mittenlagets dörr-(c)-frekvens från 37.8% (17/45 övergångar, N>=1) till 20.0% (9/45, N>=5) — vilket konvergerar med samma mittenlags empiriska sannolikhet att sluta topp tre (dörr a: 20.3%, 13/64 säsonger)."
value:
  IMPROVEMENT_THRESHOLD_POSITIONS: 5
unit: tabellplatser
source:
  type: measurement
  doc: "scripts/anspark1-villkorc-troskel-matning-2026-08-29.ts; src/domain/services/contractDemandService.ts:clubSatisfiesSeasonSuccessGate,IMPROVEMENT_THRESHOLD_POSITIONS"
  decided_by: code
verified_at: 2026-08-29
verified_by: code
