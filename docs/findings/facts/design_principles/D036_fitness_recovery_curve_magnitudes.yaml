fact_id: D036
category: design_principles
claim: "A3 (DOM_A3_KONDITIONSSPIRAL_2026-08-29.md): konditionens återhämtning är PROPORTIONELL mot gapet till taket (100), inte en platt konstant — en platt drän mot en platt återhämtning har ingen inre jämvikt och faller alltid mot 0 eller stiger mot taket. Tre takter per arbetsbelastning (startade/bänk/vilade) plus en sommaråterställning av både kondition och seasonForm. PRODUKTKRAVET X (domens punkt 4): normal rotation + Vila lämnar aldrig majoriteten av truppen under 25 % kondition inför match."
