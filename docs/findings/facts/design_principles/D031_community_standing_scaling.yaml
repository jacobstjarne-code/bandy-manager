fact_id: D031
category: design_principles
claim: "communityStanding (0-100) är en kontinuerlig mätare — nya konsumenter ska skala kontinuerligt (csLinearRamp), aldrig gata bakom en diskret cs > N-tröskel"
value: [0, 100]
unit: "communityStanding-skalans intervall"
