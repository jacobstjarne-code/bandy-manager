═ */\n\n/* Genre-etikett — \"⬩ Ankomsten ⬩\", \"⬩ Styrelsemötet ⬩\" */\n.h-scene-genre {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.7;\n}\n\n/* Scen-titel — mindre än .h-display, för \"Forsbacka.\" e.dyl. */\n.h-scene-title {\n  font-family: var(--font-display);\n  font-size: 16px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-light);\n}\n\n/* Helper / scen-anvisningar */\n.h-scene-helper {\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-style: italic;\n  color: var(--text-muted);\n  line-height: 1.45;\n}\n\n/* Setting-prolog — \"Onsdag kväll. Lampan vid bordet…\" */\n.h-scene-setting {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--text-light-secondary);\n  line-height: 1.5;\n}\n\n/* Speaker-namn — \"MARGARETA · KASSÖR\" */\n.h-scene-speaker {\n  font-family: var(--font-body);\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--accent);\n  opacity: 0.85;\n}\n\n/* Repliktext — Georgia kursiv, omsluts i \"…\" i markup */\n.h-scene-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 14px;\n  color: var(--text-light);\n  line-height: 1.55;\n}\n\n/* Wrapping-block: speaker + quote */\n.h-scene-replica {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n/* \"Scenens minne\" — element som dimmas men inte försvinner */\n.scene-dimmed {\n  opacity: 0.4;\n  transition: opacity 0.5s ease-out, font-size 0.6s ease-out;\n}\n\n/* ─── Scen-CTA (outline mot mörk bakgrund) ───────── */\n\n/* Primär CTA i scenkontext: transparent + accent-border + ljus text */\n.btn-scene-cta {\n  display: inline-block;\n  padding: 12px 24px;\n  background: transparent;\n  border: 1.5px solid var(--accent);\n  border-radius: var(--radius-md);\n  color: var(--text-light);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  transition: background 0.15s, border-color 0.15s;\n}\n.btn-scene-cta:hover {\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border-color: var(--accent-dark);\n}\n.btn-scene-cta:disabled {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* Sekundär ghost-knapp: transparent + accent text — länkar/tillbaka */\n.btn-scene-ghost {\n  display: inline-block;\n  padding: 8px 16px;\n  background: transparent;\n  border: none;\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n.btn-scene-ghost:hover {\n  opacity: 0.75;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════\n   SPELKÄNSLE-GENOMGÅNG — review-dokument\n   Mörk review-estetik, riktiga Bandy Manager-tokens.\n   ═══════════════════════════════════════════════════════════ */\n\n:root {\n  /* canvas */\n  --rv-bg:        #1a1714;\n  --rv-bg-2:      #211d19;\n  --rv-panel:     #262019;\n  --rv-line:      rgba(245,241,235,0.08);\n  --rv-line-2:    rgba(245,241,235,0.14);\n\n  /* text */\n  --rv-ink:       #F2ECE1;\n  --rv-ink-2:     #C6BCA9;\n  --rv-ink-3:     #8E867A;\n\n  /* brand (ur colors_and_type.css) */\n  --accent:       #C47A3A;\n  --accent-dark:  #A25828;\n  --accent-deep:  #8B4820;\n  --success:      #5A9A4A;\n  --danger:       #B05040;\n  --danger-text:  #D08A78;\n  --ice:          #7EB3D4;\n  --cold:         #7E9BB5;\n  --warm:         #C4A86A;\n  --gold:         #D8B45A;\n\n  /* portal dark */\n  --bg-portal:          #1a1612;\n  --bg-portal-surface:  #221d18;\n  --bg-portal-elevated: #2a241e;\n  --text-light:           #F5F1EB;\n  --text-light-secondary: #C4BAA8;\n  --text-muted:           #8A857A;\n\n  /* LED */\n  --led-bg:    #0A0A0A;\n  --led-score: #FF1A1A;\n  --led-time:  #CCFF00;\n  --led-us:    #FFB033;\n  --led-them:  #6FC0E8;\n\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --mono:  'Courier New', ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background:\n    radial-gradient(1200px 700px at 50% -200px, #2a231c 0%, transparent 60%),\n    var(--rv-bg);\n  color: var(--rv-ink);\n  font-family: var(--sans);\n  -webkit-font-smoothing: antialiased;\n  line-height: 1.5;\n  padding-bottom: 80px;\n}\n\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n\n/* ── Hero ─────────────────────────────────────────── */\n.hero {\n  text-align: center;\n  padding: 84px 0 48px;\n  border-bottom: 1px solid var(--rv-line);\n}\n.hero .kick {\n  font-size: 10px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase;\n  color: var(--accent); opacity: 0.85;\n}\n.hero h1 {\n  font-family: var(--serif); font-weight: 800; font-size: 52px; line-height: 1.05;\n  margin: 18px 0 0; letter-spacing: -0.5px;\n}\n.hero h1 em { font-style: italic; color: var(--accent); }\n.hero .sub {\n  font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--rv-ink-2);\n  max-width: 680px; margin: 20px auto 0; line-height: 1.6;\n}\n.hero .meta {\n  margin-top: 26px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;\n  font-size: 11px; color: var(--rv-ink-3); letter-spacing: 0.3px;\n}\n.hero .meta b { color: var(--rv-ink-2); font-weight: 600; }\n\n/* ── Section scaffold ─────────────────────────────── */\n.sec { padding: 70px 0 0; }\n.sec-head { margin-bottom: 30px; }\n.sec-num {\n  font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--accent);\n  letter-spacing: 2px;\n}\n.sec-head h2 {\n  font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1.12;\n  margin-top: 6px; letter-spacing: -0.3px;\n}\n.sec-head p {\n  font-size: 13.5px; color: var(--rv-ink-2); max-width: 760px; margin-top: 12px; line-height: 1.65;\n}\n.sec-head p strong { color: var(--rv-ink); font-weight: 600; }\n.sec-head p .c { color: var(--accent); font-weight: 600; }\n\n/* ── The curve ────────────────────────────────────── */\n.curve-card {\n  margin-top: 8px; background: linear-gradient(180deg, #221d17, #1c1813);\n  border: 1px solid var(--rv-line); border-radius: 14px; padding: 30px 30px 22px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.curve-svg { width: 100%; height: auto; display: block; }\n.curve-legend {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px;\n}\n.cl {\n  border-top: 2px solid var(--cz); padding-top: 10px;\n}\n.cl .cl-r { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--rv-ink-3); text-transform: uppercase; }\n.cl .cl-t { font-family: var(--serif); font-size: 15px; font-weight: 700; margin-top: 3px; color: var(--rv-ink); }\n.cl .cl-d { font-size: 11.5px; color: var(--rv-ink-2); margin-top: 5px; line-height: 1.5; }\n.cl.dip .cl-t { color: var(--danger-text); }\n\n/* ── Diagnosis rows (phone + panel) ───────────────── */\n.diag {\n  display: grid; grid-template-columns: 300px 1fr; gap: 38px; align-items: start;\n  padding: 30px 0; border-top: 1px solid var(--rv-line);\n}\n.diag:first-of-type { border-top: none; }\n.diag-panel { padding-top: 6px; }\n.diag-tag {\n  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;\n  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;\n}\n.diag-panel h3 { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.2; }\n.diag-panel > p { font-size: 13px; color: var(--rv-ink-2); margin-top: 10px; line-height: 1.6; }\n\n/* problem / move callouts */\n.flag { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--rv-line); }\n.flag:first-of-type { margin-top: 14px; }\n.flag-ic {\n  flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; margin-top: 1px;\n  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700;\n}\n.flag.bad  .flag-ic { background: rgba(176,80,64,0.16);  color: var(--danger-text); }\n.flag.good .flag-ic { background: rgba(196,122,58,0.16); color: var(--accent); }\n.flag-body { font-size: 12.5px; line-height: 1.55; }\n.flag-body b { color: var(--rv-ink); font-weight: 600; }\n.flag.bad .flag-body b  { color: var(--danger-text); }\n.flag.good .flag-body b { color: var(--accent); }\n.flag-body span { color: var(--rv-ink-2); }\n\n/* severity score chip */\n.sev {\n  display: inline-flex; align-items: center; gap: 7px; margin-top: 16px;\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--rv-ink-3);\n}\n.sev b { color: var(--rv-ink); }\n.sev-bar { width: 90px; height: 5px; border-radius: 3px; background: var(--rv-line-2); overflow: hidden; }\n.sev-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger)); }\n\n/* ── Before / after ───────────────────────────────── */\n.ba-head {\n  display: flex; align-items: baseline; gap: 14px; margin: 18px 0 22px;\n}\n.ba-head .ba-pin {\n  font-family: var(--serif); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1;\n}\n.ba-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; }\n.ba-head .ba-sub { font-size: 12px; color: var(--rv-ink-3); margin-left: auto; font-family: var(--mono); letter-spacing: 0.5px; }\n\n.ba {\n  display: grid; grid-template-columns: 1fr 54px 1fr; gap: 0; align-items: start;\n  margin-top: 6px;\n}\n.ba-col { }\n.ba-col .ba-lbl {\n  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;\n}\n.ba-col .ba-lbl .dot { width: 8px; height: 8px; border-radius: 50%; }\n.ba-col.before .dot { background: var(--danger); }\n.ba-col.after  .dot { background: var(--success); }\n.ba-col .ba-lbl .t { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }\n.ba-col.before .t { color: var(--danger-text); }\n.ba-col.after  .t { color: var(--success); }\n.ba-col .ba-lbl .s { font-size: 11px; color: var(--rv-ink-3); font-style: italic; font-family: var(--serif); }\n.ba-arrow {\n  display: grid; place-items: center; padding-top: 200px;\n  color: var(--accent); font-size: 24px;\n}\n.ba-notes { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }\n.ba-note { display: flex; gap: 9px; font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.ba-note .n-ic { color: var(--success); flex-shrink: 0; font-weight: 700; }\n.ba-note b { color: var(--rv-ink); font-weight: 600; }\n\n/* ═══════════════════════════════════════════════════\n   PHONE MOCKS — faithful BM recreation\n   ═══════════════════════════════════════════════════ */\n.phone {\n  border-radius: 18px; overflow: hidden; background: var(--bg-portal);\n  border: 4px solid #0b0a08; box-shadow: 0 14px 38px rgba(0,0,0,0.5);\n}\n.phone.paper { background: #EDE8DF; }\n.scr { position: relative; display: flex; flex-direction: column; min-height: 480px; }\n\n/* GameHeader */\n.gh {\n  background: linear-gradient(180deg, #3D3A32, #2a2822);\n  border-bottom: 2px solid var(--accent);\n  display: grid; grid-template-columns: 26px 1fr 40px; align-items: center; gap: 8px;\n  padding: 8px 12px;\n}\n.gh-logo { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(245,241,235,0.4);\n  display: grid; place-items: center; font-family: var(--serif); font-size: 9px; color: var(--text-light); }\n.gh-mid { text-align: center; }\n.gh-club { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--text-light); letter-spacing: 0.5px; }\n.gh-sub  { font-size: 8px; color: var(--text-light-secondary); letter-spacing: 0.5px; margin-top: 1px; }\n.gh-bell { justify-self: end; display: flex; gap: 6px; color: var(--text-light-secondary); font-size: 13px; }\n.gh-bell .dot-n { position: relative; }\n.gh-bell .dot-n::after { content:''; position:absolute; top:-1px; right:-2px; width:5px; height:5px; border-radius:50%; background: var(--danger); }\n\n/* PhaseIndicator */\n.pi {\n  display: flex; align-items: center; justify-content: center; gap: 6px;\n  padding: 7px 12px; background: rgba(0,0,0,0.18); border-bottom: 1px solid rgba(0,0,0,0.25);\n}\n.pi.paper { background: #E4DED3; border-bottom: 1px solid var(--border, #DDD7CC); }\n.pi-step { display: flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }\n.pi.dark .pi-step { color: var(--text-muted); }\n.pi.paper .pi-step { color: #8A857A; }\n.pi-step .pd { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }\n.pi-step.on { color: var(--accent); }\n.pi-step.on .pd { background: var(--accent); border-color: var(--accent); }\n.pi-line { width: 22px; height: 1px; background: currentColor; opacity: 0.3; }\n\n/* generic scroll body */\n.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.body.paper { background: #EDE8DF; }\n.body.dark  { background: var(--bg-portal); }\n\n/* section label */\n.lbl { font-size: 8px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }\n.lbl.dark  { color: var(--text-muted); }\n.lbl.paper { color: #8A857A; }\n\n/* cards */\n.c-sharp { border-radius: 8px; padding: 10px 12px; }\n.c-round { border-radius: 14px; padding: 11px 13px; }\n.c-paper { background: #FAF8F4; border: 1px solid #DDD7CC; }\n.c-dark  { background: var(--bg-portal-surface); border: 1px solid var(--rv-line-2); }\n.c-elev  { background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2); }\n\n/* next-match leather */\n.nmc {\n  background: linear-gradient(180deg, #3D3520, #2a2418);\n  border-radius: 8px; padding: 11px 13px; color: var(--text-light);\n}\n.nmc-top { display: flex; align-items: center; justify-content: space-between; }\n.nmc-tag { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--match-gold, #D4B860); display:flex; gap:5px; align-items:center;}\n.nmc-home { font-size: 7px; font-weight: 700; letter-spacing: 1px; color: #0E0D0B; background: var(--accent); padding: 2px 6px; border-radius: 99px; }\n.nmc-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; gap: 8px; }\n.nmc-badge { width: 34px; height: 34px; border-radius: 6px; margin: 0 auto; display: grid; place-items: center; font-size: 15px; }\n.nmc-team { text-align: center; font-family: var(--serif); font-size: 11px; font-weight: 700; margin-top: 4px; }\n.nmc-mid { text-align: center; }\n.nmc-time { font-family: var(--serif); font-size: 13px; color: var(--match-gold, #D4B860); }\n.nmc-arena { font-size: 7.5px; color: var(--text-light-secondary); margin-top: 2px; }\n.nmc-form { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 8px; letter-spacing: 1px; color: var(--text-light-secondary); }\n.fdot { width: 7px; height: 7px; border-radius: 50%; }\n.fdots { display: flex; gap: 3px; }\n\n/* metric tiles */\n.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.tile-val { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1; }\n.tile-sub { font-size: 9px; margin-top: 4px; }\n\n/* quote / diary */\n.diary { }\n.diary-q { font-family: var(--serif); font-style: italic; font-size: 12px; line-height: 1.5; }\n\n/* tactic selector */\n.tac { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }\n.tac-opt { border-radius: 8px; padding: 9px 6px; text-align: center; border: 1px solid #DDD7CC; background: #FAF8F4; }\n.tac-opt.on { border: 1.5px solid var(--accent); background: #FBF3EA; }\n.tac-opt .to-t { font-size: 11px; font-weight: 700; color: #1A1A18; }\n.tac-opt.on .to-t { color: var(--accent-dark); }\n.tac-opt .to-s { font-size: 8px; color: #8A857A; margin-top: 2px; }\n\n/* pitch */\n.pitch { background: #2d6e3a; border-radius: 8px; position: relative; height: 150px; overflow: hidden; }\n.pitch::before { content:''; position:absolute; inset:0; background:\n  repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,0.04) 18px 36px); }\n.pp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #1e4d8c; border: 1.5px solid rgba(255,255,255,0.5);\n  display: grid; place-items: center; font-size: 7px; font-weight: 700; color: #fff; transform: translate(-50%,-50%); }\n\n/* LED scoreboard mini */\n.led {\n  background: var(--led-bg); border: 1px solid var(--accent-deep); border-radius: 6px;\n  padding: 9px 11px; position: relative;\n}\n.led-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }\n.led-team { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1px; }\n.led-team.us { color: var(--led-us); } .led-team.them { color: var(--led-them); text-align: right; }\n.led-score { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 2px; text-align: center; }\n.led-score .us { color: var(--led-us); } .led-score .them { color: var(--led-them); } .led-score .sep { color: #555; }\n.led-time { font-family: var(--mono); font-size: 15px; color: var(--led-score); letter-spacing: 1px; text-align: center; margin-top: 2px; }\n.led-per  { font-family: var(--mono); font-size: 9px; color: var(--led-time); text-align: center; }\n\n/* momentum bar */\n.mom { margin-top: 8px; }\n.mom-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }\n.mom-top .st { color: var(--accent); }\n.mom-track { height: 8px; border-radius: 4px; margin-top: 5px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 58%, #2a3a44 58%, var(--ice) 100%); }\n\n/* feed line */\n.feed { display: flex; gap: 9px; font-size: 10px; padding: 4px 0; }\n.feed .min { font-family: var(--mono); font-size: 9px; color: var(--text-muted); width: 22px; flex-shrink: 0; }\n.feed .tx { color: var(--text-light-secondary); line-height: 1.4; }\n.feed.goal .tx { color: var(--accent); font-weight: 600; }\n\n/* mini button */\n.mbtn { border-radius: 8px; padding: 9px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }\n.mbtn-cta { background: linear-gradient(180deg, #DD9555, #8B4820); color: #fff; box-shadow: 0 3px 5px rgba(162,88,40,0.4); }\n.mbtn-ghost { background: transparent; border: 1.5px solid var(--rv-line-2); color: var(--text-light); }\n.mbtn-out { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }\n\n/* stripe-left accent */\n.stripe { position: relative; }\n.stripe::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; border-radius:2px; }\n.stripe.cold::before { background: var(--cold); }\n.stripe.warm::before { background: var(--warm); }\n.stripe.accent::before { background: var(--accent); }\n\n/* meter (puls / fanMood) */\n.meter { }\n.meter-top { display: flex; justify-content: space-between; align-items: baseline; }\n.meter-lbl { font-size: 8px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }\n.meter-val { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--text-light); }\n.meter-val s { font-size: 9px; color: var(--text-muted); text-decoration: none; font-weight: 400; }\n.meter-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 6px; overflow: hidden; }\n.meter-track i { display: block; height: 100%; border-radius: 3px; }\n.meter-cons { display: flex; gap: 8px; font-size: 8px; font-weight: 600; margin-top: 6px; }\n.up { color: var(--success); } .down { color: var(--danger-text); } .neu { color: var(--text-muted); }\n\n/* \"dead\" marker overlay used in diagnosis */\n.dead-pin {\n  position: absolute; top: 8px; right: 8px; z-index: 4;\n  font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px;\n  background: rgba(176,80,64,0.92); color: #fff; padding: 3px 7px; border-radius: 4px;\n  text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.4);\n}\n\n/* eyebrow scene */\n.eyebrow { font-size: 8px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: var(--cold); }\n\n/* priority table */\n.prio { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }\n.prio-row {\n  display: grid; grid-template-columns: 30px 1fr 120px 92px; gap: 16px; align-items: center;\n  background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 10px; padding: 14px 18px;\n}\n.prio-row .rank { font-family: var(--serif); font-size: 22px; font-weight: 800; color: var(--accent); }\n.prio-row .what b { font-size: 13.5px; font-weight: 700; color: var(--rv-ink); }\n.prio-row .what span { display: block; font-size: 11.5px; color: var(--rv-ink-2); margin-top: 3px; line-height: 1.45; }\n.prio-row .eff { font-size: 10px; letter-spacing: 0.5px; }\n.prio-row .eff .k { color: var(--rv-ink-3); text-transform: uppercase; font-size: 8px; letter-spacing: 1px; }\n.prio-row .eff .v { color: var(--rv-ink); font-weight: 600; }\n.impact { display: flex; gap: 3px; }\n.impact i { width: 10px; height: 10px; border-radius: 2px; background: var(--rv-line-2); }\n.impact i.on { background: var(--accent); }\n\n/* foot */\n.foot { margin-top: 64px; padding-top: 26px; border-top: 1px solid var(--rv-line); text-align: center;\n  font-size: 11px; color: var(--rv-ink-3); line-height: 1.7; }\n.foot b { color: var(--rv-ink-2); }\n\n@media (max-width: 920px) {\n  .diag { grid-template-columns: 1fr; }\n  .ba { grid-template-columns: 1fr; gap: 28px; }\n  .ba-arrow { padding: 0; transform: rotate(90deg); }\n  .prio-row { grid-template-columns: 30px 1fr; }\n  .prio-row .eff, .prio-row .impact { display: none; }\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════\n   B1 NAVIGERING & LIV — tillägg ovanpå spelkansle_review.css\n   ═══════════════════════════════════════════════════ */\n\n/* recommendation banner */\n.verdict {\n  margin-top: 18px;\n  background: linear-gradient(180deg, #2a2218, #211c15);\n  border: 1px solid rgba(196,122,58,0.35);\n  border-radius: 14px; padding: 26px 28px;\n  box-shadow: 0 18px 50px rgba(0,0,0,0.4);\n}\n.verdict .vk { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }\n.verdict h2 { font-family: var(--serif); font-size: 25px; font-weight: 700; line-height: 1.18; margin-top: 10px; letter-spacing: -0.3px; }\n.verdict h2 em { font-style: italic; color: var(--accent); }\n.verdict p { font-size: 13.5px; color: var(--rv-ink-2); line-height: 1.6; margin-top: 12px; max-width: 760px; }\n.verdict p strong { color: var(--rv-ink); font-weight: 600; }\n\n/* bottom-nav strip mock */\n.navstrip {\n  background: #1f1a15;\n  border: 1.5px solid rgba(245,241,235,0.14);\n  border-radius: 10px; overflow: hidden;\n  display: flex; align-items: stretch;\n}\n.navstrip.bg { background-image: repeating-linear-gradient(92deg, rgba(160,130,90,0.05) 0px, rgba(160,130,90,0.02) 2px, transparent 2px, transparent 8px); }\n.navcell {\n  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;\n  gap: 4px; padding: 9px 2px; position: relative; min-width: 0;\n}\n.navcell .ico {\n  width: 19px; height: 19px; border-radius: 4px; border: 1.6px solid currentColor;\n  position: relative; flex-shrink: 0;\n}\n.navcell .lab { font-size: 8.5px; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }\n.navcell { color: var(--text-muted); }\n.navcell.on { color: var(--accent); }\n.navcell.on .lab { font-weight: 700; }\n.navcell.new::after {\n  content: ''; position: absolute; top: 7px; right: 50%; margin-right: -13px;\n  width: 6px; height: 6px; border-radius: 50%; background: var(--accent); border: 1.5px solid #1f1a15;\n}\n.navcell.ctx { opacity: 0.5; }\n.navcell .win-dot { position: absolute; top: 7px; right: 50%; margin-right: -13px; width: 6px; height: 6px; border-radius: 50%; background: var(--ice); border: 1.5px solid #1f1a15; }\n/* cramped variant */\n.navstrip.cramp .navcell { padding: 8px 1px; }\n.navstrip.cramp .navcell .lab { font-size: 7.5px; letter-spacing: -0.2px; }\n.cram-warn { color: var(--danger-text); }\n\n/* nav comparison block */\n.navcompare { display: grid; gap: 18px; margin-top: 8px; }\n.navrow { display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: center; }\n.navrow .nlab { }\n.navrow .nlab .t { font-size: 13px; font-weight: 700; color: var(--rv-ink); }\n.navrow .nlab .t.bad { color: var(--danger-text); }\n.navrow .nlab .t.good { color: var(--success); }\n.navrow .nlab .s { font-size: 11px; color: var(--rv-ink-3); margin-top: 4px; line-height: 1.5; }\n@media (max-width: 760px) { .navrow { grid-template-columns: 1fr; gap: 10px; } }\n\n/* simple option cards */\n.opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 10px; }\n.opt { background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 12px; padding: 18px 18px 16px; }\n.opt.win { border-color: rgba(90,154,74,0.5); box-shadow: 0 0 0 1px rgba(90,154,74,0.18); }\n.opt .ot { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--rv-ink); }\n.opt .obadge { display: inline-block; font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; margin-bottom: 9px; }\n.opt.win .obadge { background: rgba(90,154,74,0.16); color: var(--success); }\n.opt .obadge.alt { background: var(--rv-line-2); color: var(--rv-ink-3); }\n.opt .od { font-size: 12px; color: var(--rv-ink-2); line-height: 1.55; margin-top: 8px; }\n.opt .ometa { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--rv-line); font-size: 10.5px; line-height: 1.5; }\n.opt .ometa b { color: var(--rv-ink); }\n.opt .ometa .pro { color: var(--success); }\n.opt .ometa .con { color: var(--danger-text); }\n@media (max-width: 760px) { .opts { grid-template-columns: 1fr; } }\n\n/* the build-beat line on portal */\n.beat {\n  position: relative; padding: 10px 12px 10px 15px; border-radius: 8px;\n  background: var(--bg-portal-elevated); border: 1px solid var(--rv-line-2);\n}\n.beat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: var(--accent); }\n.beat .bk { font-size: 7.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }\n.beat .bt { font-size: 11.5px; color: var(--text-light); margin-top: 3px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }\n.beat .bt b { font-weight: 600; }\n.beat .bt .arr { color: var(--accent); flex-shrink: 0; }\n\n/* anti-brus rule list */\n.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.rule { display: flex; gap: 10px; background: var(--rv-bg-2); border: 1px solid var(--rv-line); border-radius: 10px; padding: 12px 14px; }\n.rule .ri { flex-shrink: 0; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); }\n.rule .rb { font-size: 12px; line-height: 1.5; color: var(--rv-ink-2); }\n.rule .rb b { color: var(--rv-ink); font-weight: 600; }\n@media (max-width: 760px) { .rules { grid-template-columns: 1fr; } }\n\n/* resolved-thread row */\n.thread { display: flex; gap: 13px; padding: 15px 0; border-top: 1px solid var(--rv-line); }\n.thread:first-of-type { border-top: none; }\n.thread .tstat { flex-shrink: 0; width: 70px; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding-top: 2px; }\n.thread .tstat.done { color: var(--success); }\n.thread .tstat.open { color: var(--accent); }\n.thread .tb h4 { font-size: 13.5px; font-weight: 700; color: var(--rv-ink); }\n.thread .tb p { font-size: 12px; color: var(--rv-ink-2); line-height: 1.55; margin-top: 5px; }\n.thread .tb p b { color: var(--rv-ink); font-weight: 600; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"kick\">B1 Klubbutveckling · navigationsarkitektur &amp; liv<\u002Fp>\n    <h1>Var bor <em>bygget<\u002Fem>?<\u002Fh1>\n    <p class=\"sub\">Trädet är byggt men begravt — fyra-fem klick och en lång scroll ner i Orten. Bygget är spelets enda fleråriga båge; den kan inte bo som en undersektion. Den här genomgången löser <em>var den sitter, hur den nås och hur den lever<\u002Fem> — utan att rita om de tre ytorna.<\u002Fp>\n    <div class=\"meta\">\n      <span><b>Brief<\u002Fb> · DESIGN-BRIEF-B1-NAVIGERING-OCH-LIV<\u002Fspan>\n      <span><b>Grund<\u002Fb> · BottomNav · OrtenTab · FacilityScreen (kod)<\u002Fspan>\n      <span><b>2026-06-19<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"verdict\">\n      <div class=\"vk\">Rekommendation · ditt tillägg besvarat<\u002Fdiv>\n      <h2>Ja — egen plats i navet. Men rummet kommer från <em>Transfers<\u002Fem>, inte från en sjunde flik.<\u002Fh2>\n      <p>Din instinkt är rätt: den icke-sportsliga framdriften behöver en egen scen, annars äter matchrytmen alltid upp den. <strong>Men navet har redan sex flikar<\u002Fstrong> (Hem · Trupp · Match · Tabell · Transfers · Klubb) — en sjunde på 375px blir trång och labels kapas. Den eleganta vägen: ge Bygget en egen flik och <strong>låt Transfers bli kontextuell<\u002Fstrong> — den är fönster-gated och vet redan när den är relevant. Navet förblir behagliga sex, och bygget blir genuint topp-nivå. <strong>Transfers blir inte hemlös<\u002Fstrong> — dess åretrunt-del (kontrakt) flyttar in i Trupp, marknaden eleveras till nav-flik bara när fönstret är öppet.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ 1 · FLIK-FRÅGAN ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01 — FLIKEN<\u002Fdiv>\n      <h2>Sex flikar i ett nav byggt för fem<\u002Fh2>\n      <p>Du bad mig väga egen-flik som UX-ansvarig, inte bara utföra. Här är den ärliga läsningen: en egen destination är <span class=\"c\">rätt<\u002Fspan> — men \"sjunde permanenta flik\" och \"egen destination\" är inte samma sak. Tre vägar, en rekommenderad.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"navcompare\">\n      <!-- current -->\n      <div class=\"navrow\">\n        <div class=\"nlab\">\n          <div class=\"t\">Idag · 6 flikar<\u002Fdiv>\n          <div class=\"s\">Redan en mer än mobilkonventionens fem. Bygget saknas helt — det bor i en undersektion av Klubb.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"navstrip bg\">\n          <div class=\"navcell on\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Hem<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Trupp<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Match<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Tabell<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"win-dot\"><\u002Fspan><span class=\"lab\">Transfers<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Klubb<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- crammed 7 -->\n      <div class=\"navrow\">\n        <div class=\"nlab\">\n          <div class=\"t bad\">Sjunde flik · trångt<\u002Fdiv>\n          <div class=\"s\">~53px per mål på 375px. \"Transfers\" + \"Bygget\" konkurrerar om bredd, labels kapar. Funkar — men känns billigt.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"navstrip bg cramp\">\n          <div class=\"navcell on\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Hem<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Trupp<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Match<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Tabell<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"win-dot\"><\u002Fspan><span class=\"lab\">Transfers<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Klubb<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell new\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Bygget<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- recommended -->\n      <div class=\"navrow\">\n        <div class=\"nlab\">\n          <div class=\"t good\">Rekommenderat · Transfers kontextuell<\u002Fdiv>\n          <div class=\"s\">Bygget tar Transfers plats i den permanenta raden. Transfers dyker upp som flik bara när fönstret är öppet — annars nås den från Trupp. Sex behagliga mål, bygget topp-nivå året om.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"navstrip bg\">\n          <div class=\"navcell on\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Hem<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Trupp<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Match<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Tabell<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell new\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Bygget<\u002Fspan><\u002Fdiv>\n          <div class=\"navcell\"><span class=\"ico\"><\u002Fspan><span class=\"lab\">Klubb<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"font-size:12px;color:var(--rv-ink-3);margin-top:18px;line-height:1.6;max-width:820px;font-style:italic;font-family:var(--serif)\">Varför Transfers och inte Tabell? Tabell slår man upp varje omgång — den är en referens man återvänder till. Transfers är säsongsbunden: meningsfull bara under fönstren, och koden vet redan när (window-status-pricken finns). Det som är kontextuellt till sin natur ska vara kontextuellt i navet.<\u002Fp>\n\n    <div class=\"opts\">\n      <div class=\"opt win\">\n        <div class=\"obadge\">Rekommenderas<\u002Fdiv>\n        <div class=\"ot\">Bygget in, Transfers ut (kontextuell)<\u002Fdiv>\n        <div class=\"od\">Egen permanent flik för bygget. Transfers blir en flik som tänds under transferfönster, annars en ingång inifrån Trupp.<\u002Fdiv>\n        <div class=\"ometa\"><b>Honorar din instinkt:<\u002Fb> <span class=\"pro\">genuint egen flik, året om<\u002Fspan>. <br><span class=\"con\">Kostar:<\u002Fspan> Transfers byter beteende — men den är redan fönster-gated.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"opt\">\n        <div class=\"obadge alt\">Alternativ<\u002Fdiv>\n        <div class=\"ot\">Klubb föds om som bygg-lett hem<\u002Fdiv>\n        <div class=\"od\">Ingen ny flik. Klubb blir \"Klubben\" — en lång-bågs-destination vars <em>första<\u002Fem> yta är trädet; Orten/ekonomi/minne blir sekundärt under.<\u002Fdiv>\n        <div class=\"ometa\"><b>Bäst om:<\u002Fb> <span class=\"pro\">du vill röra navet minimalt<\u002Fspan>. <br><span class=\"con\">Risk:<\u002Fspan> bygget blir headline men delar ändå hus — mindre \"egen scen\".<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"opt\">\n        <div class=\"obadge alt\">Ej rekommenderat<\u002Fdiv>\n        <div class=\"ot\">Sjunde flik, rakt av<\u002Fdiv>\n        <div class=\"od\">Bygget läggs till som sjunde permanenta mål. Inget annat rör sig.<\u002Fdiv>\n        <div class=\"ometa\"><b>Enklast att bygga.<\u002Fb> <br><span class=\"con\">Kostar:<\u002Fspan> trångt nav, kapade labels, känns billigt på en annars omsorgsfull yta.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 1B · TRANSFERS HEM ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">01·B — TRANSFERS HEM<\u002Fdiv>\n      <h2>Om Transfers lämnar navet — vart tar den vägen?<\u002Fh2>\n      <p>Rätt fråga. Passiv stora delar av året, men aldrig hemlös. Svaret: <span class=\"c\">Trupp<\u002Fspan> — Transfers är \"ändra truppen\", den hör där truppen bor. Men det skarpare greppet är att dela den på <strong>tidskänslan<\u002Fstrong>: en del är åretrunt-truppvård, en del är säsongsbunden marknad.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"diag\">\n      <div class=\"phone paper\">\n        <div class=\"scr\" style=\"min-height:470px\">\n          <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">HÄLLEFORSNÄS IF<\u002Fdiv><div class=\"gh-sub\">Trupp<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\" style=\"color:#C4BAA8\">⚙<\u002Fdiv><\u002Fdiv>\n          <div class=\"tabrow\" style=\"background:#FAF8F4;display:flex;gap:4px;padding:7px 10px;border-bottom:1px solid #DDD7CC\">\n            <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:var(--accent);color:#fff\">Nu<\u002Fspan>\n            <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:5px 11px;border-radius:99px;border:1px solid #DDD7CC;color:#6B6760\">Trupp<\u002Fspan>\n            <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:5px 11px;border-radius:99px;border:1px solid #DDD7CC;color:#6B6760\">Taktik<\u002Fspan>\n            <span style=\"font-size:8.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:5px 11px;border-radius:99px;border:1px solid #DDD7CC;color:#6B6760\">Värvning<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"body paper\" style=\"gap:9px\">\n            <div style=\"font-size:8px;font-weight:600;letter-spacing:2px;color:#8A857A;text-transform:uppercase\">ÅRETRUNT · BOR HÄR<\u002Fdiv>\n            <div class=\"c-sharp c-paper\" style=\"position:relative;border:1px solid var(--accent)\">\n              <div class=\"lbl paper\" style=\"color:var(--accent-dark)\">📋 KONTRAKT &amp; FÖRLÄNGNINGAR<\u002Fdiv>\n              <div style=\"font-size:11px;color:#3a352c;margin-top:4px;font-family:var(--serif)\">Sundström — avtal ut om 2 säsonger<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;margin-top:5px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-top:3px\"><\u002Fspan><span style=\"font-size:10px;color:#6B6760\">3 avtal kräver beslut i år<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:8px;font-weight:600;letter-spacing:2px;color:#8A857A;text-transform:uppercase;margin-top:4px\">SÄSONGSBUNDET · ELEVERAS VID FÖNSTER<\u002Fdiv>\n            <div class=\"c-sharp c-paper\" style=\"opacity:0.62\">\n              <div class=\"lbl paper\">🛒 MARKNAD · SCOUTING · FRIA · SÄLJ<\u002Fdiv>\n              <div style=\"font-size:10px;color:#8A857A;margin-top:4px;font-style:italic;font-family:var(--serif)\">Fönstret stängt — öppnar 1 nov. Då blir Värvning en nav-flik.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"diag-panel\">\n        <div class=\"diag-tag\">Förslag · dela på tidskänslan<\u002Fdiv>\n        <h3>Kontrakt bor i Trupp. Marknaden eleveras vid fönster.<\u002Fh3>\n        <p>Transfers fem sub-flikar är inte lika i tid. Kontrakt/förlängningar är truppvård man gör <em>året om<\u002Fem> — den hör hemma där spelarna bor. Marknaden öppnar och stänger.<\u002Fp>\n        <div class=\"flag good\"><div class=\"flag-ic\">↑<\u002Fdiv><div class=\"flag-body\"><b>Permanent hem = Trupp.<\u002Fb> <span>\"Värvning\"-fliken i Trupps egen rad (Nu · Trupp · Taktik · Värvning) är alltid nåbar. Inget göms, oavsett fönsterstatus.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag good\"><div class=\"flag-ic\">↑<\u002Fdiv><div class=\"flag-body\"><b>Kontrakt slutar vara säsongsbundet.<\u002Fb> <span>Utgående avtal kräver beslut mitt i säsongen — nu ligger de där man ändå sköter truppen, inte bakom en stängd marknad.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"flag good\"><div class=\"flag-ic\">↑<\u002Fdiv><div class=\"flag-body\"><b>Marknaden eleveras vid fönster.<\u002Fb> <span>När fönstret öppnar tänds Värvning som egen nav-flik (window-pricken finns redan i koden) — snabb access de få veckor det gäller. Ett tillfälligt sjunde mål under fönstret är ett medvetet undantag, inte normalläget.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"sev\"><span>IA-vinst<\u002Fspan><span class=\"sev-bar\"><i style=\"width:80%;background:linear-gradient(90deg,var(--accent),var(--success))\"><\u002Fi><\u002Fspan><b style=\"color:var(--success)\">Hög<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2 · ORTEN/KLUBB ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">02 — VAD SOM BLIR KVAR<\u002Fdiv>\n      <h2>När bygget flyttar ut vinner Orten fokus<\u002Fh2>\n      <p>Trädet bor idag i Ortens näst sista sektion, \"🏟️ Anläggning &amp; faciliteter\". Flyttar det ut blir Orten <span class=\"c\">renare, inte tunnare<\u002Fspan> — den blir vad den egentligen är: orten och dess människor. Och OrtenMap-arenanoden slutar scrolla till en begravd knapp — den deep-länkar in i Bygget-fliken.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Idag<\u002Fspan><span class=\"s\">trädet begravt i sektion 7 av 7<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\">\n          <div class=\"scr\" style=\"min-height:470px\">\n            <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">HÄLLEFORSNÄS IF<\u002Fdiv><div class=\"gh-sub\">🏘️ Klubb · Orten<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\" style=\"color:#C4BAA8\">⚙<\u002Fdiv><\u002Fdiv>\n            <div style=\"position:relative;flex:1\">\n              <div class=\"dead-pin\">4–5 klick + scroll<\u002Fdiv>\n              <div class=\"body paper\" style=\"gap:7px\">\n                <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">🗺️ ORTSKARTAN<\u002Fdiv><\u002Fdiv>\n                <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">🏠 BYGDENS PULS<\u002Fdiv><\u002Fdiv>\n                <div class=\"c-sharp c-paper\" style=\"opacity:0.8\"><div class=\"lbl paper\">📰 LOKALTIDNINGEN<\u002Fdiv><\u002Fdiv>\n                <div class=\"c-sharp c-paper\" style=\"opacity:0.7\"><div class=\"lbl paper\">👥 FRIVILLIGA<\u002Fdiv><\u002Fdiv>\n                <div class=\"c-sharp c-paper\" style=\"opacity:0.6\"><div class=\"lbl paper\">👥 MECENATER<\u002Fdiv><\u002Fdiv>\n                <div class=\"c-sharp c-paper\" style=\"opacity:0.5\"><div class=\"lbl paper\">🏛️ KOMMUN<\u002Fdiv><\u002Fdiv>\n                <div class=\"c-sharp c-paper\" style=\"border:1.5px solid var(--accent);opacity:0.95\"><div class=\"lbl paper\" style=\"color:var(--accent-dark)\">🏟️ ANLÄGGNING &amp; FACILITETER<\u002Fdiv><div style=\"font-size:10px;color:var(--accent-dark);margin-top:4px;font-weight:700\">Visa trädet ›<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\" style=\"color:var(--danger-text)\">×<\u002Fspan><span>Spelets enda fleråriga båge ligger sist i en lista i en undersektion.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\" style=\"color:var(--danger-text)\">×<\u002Fspan><span>OrtenMap-arenanoden gör en <code style=\"font-family:var(--mono);font-size:10px\">scrollIntoView<\u002Fcode> hit — leder till knappen, inte in i trädet.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ba-arrow\">→<\u002Fdiv>\n\n      <div class=\"ba-col after\">\n        <div class=\"ba-lbl\"><span class=\"dot\"><\u002Fspan><span class=\"t\">Förslag<\u002Fspan><span class=\"s\">Orten = orten &amp; folket · bygget bor i egen flik<\u002Fspan><\u002Fdiv>\n        <div class=\"phone paper\">\n          <div class=\"scr\" style=\"min-height:470px\">\n            <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">HÄLLEFORSNÄS IF<\u002Fdiv><div class=\"gh-sub\">🏘️ Klubb · Orten<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\" style=\"color:#C4BAA8\">⚙<\u002Fdiv><\u002Fdiv>\n            <div class=\"body paper\" style=\"gap:8px\">\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">🗺️ ORTSKARTAN<\u002Fdiv>\n                <div style=\"margin-top:7px;display:flex;gap:6px;flex-wrap:wrap\">\n                  <span class=\"np on\" style=\"font-size:8.5px\">Arena ›<\u002Fspan>\n                  <span class=\"np\" style=\"font-size:8.5px;background:#fff;border-color:#DDD7CC;color:#6B6760\">Kommunen<\u002Fspan>\n                  <span class=\"np\" style=\"font-size:8.5px;background:#fff;border-color:#DDD7CC;color:#6B6760\">Mecenater<\u002Fspan>\n                  <span class=\"np\" style=\"font-size:8.5px;background:#fff;border-color:#DDD7CC;color:#6B6760\">Frivilliga<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:9px;color:#8A857A;margin-top:7px;font-style:italic;font-family:var(--serif)\">Arena-noden öppnar Bygget-fliken — inte en scroll.<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">🏠 BYGDENS PULS<\u002Fdiv><div style=\"font-size:11px;color:#3a352c;font-family:var(--serif);margin-top:3px\">54 · vänder uppåt<\u002Fdiv><\u002Fdiv>\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">👥 FRIVILLIGA &amp; MECENATER<\u002Fdiv><div style=\"font-size:10px;color:#6B6760;margin-top:3px\">Folket runt klubben<\u002Fdiv><\u002Fdiv>\n              <div class=\"c-sharp c-paper\"><div class=\"lbl paper\">📰 LOKALTIDNINGEN · 🏛️ KOMMUN<\u002Fdiv><\u002Fdiv>\n              <div class=\"c-sharp c-paper\" style=\"position:relative;background:#FBF3EA;border:1px solid var(--accent)\">\n                <div class=\"lbl paper\" style=\"color:var(--accent-dark)\">🏟️ ANLÄGGNINGEN<\u002Fdiv>\n                <div style=\"font-size:11px;color:#3a352c;margin-top:3px;font-family:var(--serif)\">Östra läktaren — pågår, klar omg 14<\u002Fdiv>\n                <div style=\"font-size:10px;color:var(--accent-dark);font-weight:700;margin-top:5px\">Öppna Bygget ›<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-notes\">\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Orten blir koherent.<\u002Fb> Den tappar facilitets-grab-baggen och blir orten &amp; dess människor — kartan, pulsen, folket, pressen, kommunen.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Deep-link i stället för scroll.<\u002Fb> Arena-noden och anläggnings-raden öppnar Bygget-fliken direkt — 06-11-beslutet (\"OrtenMap deep-länkar dit\") byggs nu hela vägen.<\u002Fspan><\u002Fdiv>\n          <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Klubb behåller<\u002Fb> Träning · Ekonomi · Minne · Tränare. Bara den fleråriga bågen flyttar ut till egen scen.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 3 · VALET SOM CEREMONI ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">03 — VALET SOM SCEN<\u002Fdiv>\n      <h2>Valet möter man, letar inte upp<\u002Fh2>\n      <p>PreSeason-\"Valet\" är domän utan yta idag — <code style=\"font-family:var(--mono);font-size:11px\">getPreSeasonChoices()<\u002Fcode> finns men ingen scen renderar den. Den ska <span class=\"c\">avfyras som ett ceremoniellt avbrott vid säsongsstart<\u002Fspan>, samma ceremoninivå som spelet redan har. Inte en flik man besöker — ett ögonblick som ställer sig i vägen, en gång om året, efter säsongsrullningen och före säsongens första portal.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:6px\">\n      <div style=\"flex:1;min-width:130px;background:var(--rv-bg-2);border:1px solid var(--rv-line);border-radius:10px;padding:14px 16px\">\n        <div style=\"font-family:var(--mono);font-size:9px;color:var(--rv-ink-3);letter-spacing:1px\">STEG 1<\u002Fdiv>\n        <div style=\"font-family:var(--serif);font-size:14px;font-weight:700;margin-top:4px\">Säsongen rullar<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--rv-ink-2);margin-top:4px;line-height:1.45\">Tabellen nollas, kontrakt åldras, rullnings-ceremonin spelar.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;place-items:center;padding:0 10px;color:var(--accent);font-size:20px\">→<\u002Fdiv>\n      <div style=\"flex:1.2;min-width:150px;background:linear-gradient(180deg,#2a2218,#211c15);border:1.5px solid var(--accent);border-radius:10px;padding:14px 16px\">\n        <div style=\"font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:1px\">STEG 2 · CEREMONI<\u002Fdiv>\n        <div style=\"font-family:var(--serif);font-size:14px;font-weight:700;margin-top:4px;color:var(--rv-ink)\">⬩ Valet ⬩<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--rv-ink-2);margin-top:4px;line-height:1.45\">Den typografiska scenen ställer sig i vägen. \"Vad bygger vi i år?\" Ett val, eller vänta.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;place-items:center;padding:0 10px;color:var(--accent);font-size:20px\">→<\u002Fdiv>\n      <div style=\"flex:1;min-width:130px;background:var(--rv-bg-2);border:1px solid var(--rv-line);border-radius:10px;padding:14px 16px\">\n        <div style=\"font-family:var(--mono);font-size:9px;color:var(--rv-ink-3);letter-spacing:1px\">STEG 3<\u002Fdiv>\n        <div style=\"font-family:var(--serif);font-size:14px;font-weight:700;margin-top:4px\">Säsongens portal<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--rv-ink-2);margin-top:4px;line-height:1.45\">Valet lever nu vidare i Bygget-fliken — trädet visar det påbörjade.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ba-notes\" style=\"max-width:none;margin-top:18px\">\n      <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>\"Två ingångar, ett träd\" — bevarat, omhusat.<\u002Fb> <em>Välj<\u002Fem>-läget är säsongsstartens ceremoni. <em>Betrakta<\u002Fem>-läget är Bygget-fliken (förr Orten). Samma <code style=\"font-family:var(--mono);font-size:10px\">FacilityTree<\u002Fcode>, två lägen — exakt 06-11-beslutet, bara re-hemmat från Orten till egen flik.<\u002Fspan><\u002Fdiv>\n      <div class=\"ba-note\"><span class=\"n-ic\">✓<\u002Fspan><span><b>Fliken är där valet bor resten av året.<\u002Fb> Ceremonin är ingången en gång; fliken är hemmet däremellan. Och eftersom välj-läge redan kan triggas löpande (kod: \"Bygg ut\"-knappen) kan man fatta nästa val inifrån fliken utan att vänta på nästa säsong.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 4 · PORTAL-BEAT ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">04 — HUR DET LEVER<\u002Fdiv>\n      <h2>Bygget knackar på portalen — en rad, aldrig hela trädet<\u002Fh2>\n      <p>En egen flik ensam riskerar bli en plats man besöker en gång och glömmer. Portalen är där spelaren faktiskt är varje omgång. När något <span class=\"c\">faktiskt händer<\u002Fspan> i bygget yttrar det sig som ett lågmält beat på portalen som pekar in i fliken — knuffen, inte trädet.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"diag\">\n      <div class=\"phone\">\n        <div class=\"scr\">\n          <div class=\"gh\"><div class=\"gh-logo\">BM<\u002Fdiv><div class=\"gh-mid\"><div class=\"gh-club\">HÄLLEFORSNÄS IF<\u002Fdiv><div class=\"gh-sub\">Hem · Omg 13<\u002Fdiv><\u002Fdiv><div class=\"gh-bell\">⚙<\u002Fdiv><\u002Fdiv>\n          <div class=\"body dark\" style=\"gap:9px\">\n            <div class=\"c-round c-dark\"><div class=\"lbl dark\" style=\"margin-bottom:4px\">📖 DAGBOKEN<\u002Fdiv><div class=\"diary-q\" style=\"color:var(--text-light-secondary)\">\"Östra läktaren reser sig. Snart syns den från bron.\"<\u002Fdiv><\u002Fdiv>\n            <div class=\"beat\">\n              <div class=\"bk\">🏟️ Bygget<\u002Fdiv>\n              <div class=\"bt\"><b>Östra läktaren står klar nästa omgång.<\u002Fb><span class=\"arr\">›<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"c-sharp c-dark\"><div class=\"lbl dark\">📊 TABELL<\u002Fdiv><div style=\"font-size:11px;color:var(--text-light-secondary);margin-top:3px;font-family:var(--serif)\">3:a · 26 p<\u002Fdiv><\u002Fdiv>\n            <div class=\"nmc\" style=\"margin-top:2px\">\n              <div class=\"nmc-top\"><span class=\"nmc-tag\">🏒 NÄSTA MATCH<\u002Fspan><span class=\"nmc-home\">HEMMA<\u002Fspan><\u002Fdiv>\n              <div style=\"font-family:var(--serif);font-weight:700;font-size:12px;color:var(--text-light);margin-top:7px;text-align:center\">Hälleforsnäs — Skutskär · lö 14:00<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"diag-panel\">\n        <div class=\"diag-tag\">Beatet · anatomi<\u002Fdiv>\n        <h3>En rad i portalens befintliga rytm<\u002Fh3>\n        <p>Samma form som dagboks-/andningsraden: copper-stripe, liten etikett, en mening, en pil in i fliken. Den lägger sig <em>i<\u002Fem> portalens flöde — inte ovanpå som en banner. Den bär aldrig data, bara knuffen.<\u002Fp>\n        <div class=\"rules\">\n          <div class=\"rule\"><span class=\"ri\">01<\u002Fspan><span class=\"rb\"><b>Bara på state-change.<\u002Fb> En nod blev klar, en blev möjlig, hallen-prövningen tog ett steg. Aldrig \"47% färdig\".<\u002Fspan><\u002Fdiv>\n          <div class=\"rule\"><span class=\"ri\">02<\u002Fspan><span class=\"rb\"><b>Max ett beat per omgång.<\u002Fb> Händer flera saker visas det tyngsta; resten väntar i fliken.<\u002Fspan><\u002Fdiv>\n          <div class=\"rule\"><span class=\"ri\">03<\u002Fspan><span class=\"rb\"><b>Räknas mot beslutsbudgeten.<\u002Fb> Beatet är ETT av portalens objekt (KF3) — det konkurrerar, staplar aldrig.<\u002Fspan><\u002Fdiv>\n          <div class=\"rule\"><span class=\"ri\">04<\u002Fspan><span class=\"rb\"><b>Tystnad är korrekt.<\u002Fb> Hände inget i bygget? Ingen rad. En slow arc får vara tyst — det är inte en tom yta.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin-top:14px;font-size:11.5px;color:var(--rv-ink-3);font-style:italic;font-family:var(--serif)\">Ton-exempel: \"Akademin har sin första junior redo ›\" · \"Förankringen för hallen tog ett steg ›\" · \"Värmestugan står klar — folk stannar kvar efter matchen ›\". Klubbliv, aldrig feature-prompt.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 5 · LÖSA TRÅDAR ═══════════════ -->\n<section class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\">05 — LÖSA TRÅDAR<\u002Fdiv>\n      <h2>De två \"öppna frågorna\" — redan stängda<\u002Fh2>\n      <p>Briefen flaggar två frågor ur 06-11-mockens not. Båda besvarades faktiskt i <strong>REVIEW-B1-MOCK-OPUS-2026-06-12<\u002Fstrong> och sitter redan i koden. Här är status så inget byggs på fel antagande.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:6px\">\n      <div class=\"thread\">\n        <div class=\"tstat done\">Stängd<\u002Fdiv>\n        <div class=\"tb\">\n          <h4>\"Själ\" som dimensionsnamn<\u002Fh4>\n          <p><b>Behålls.<\u002Fb> Datadefinition låst: Själ = klack-relation + identitetsvärde; Publik = antal + intäkt. Lever redan i koden — <code style=\"font-family:var(--mono);font-size:11px\">DIM_LABELS.sjal = 'Själ'<\u002Fcode> i FacilityTree. Ordet är rätt, inte \"Orten\".<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"thread\">\n        <div class=\"tstat done\">Stängd<\u002Fdiv>\n        <div class=\"tb\">\n          <h4>Gaffelns röster<\u002Fh4>\n          <p><b>Två röster i ingången, stegvisa i prövningen.<\u002Fb> Förankring = Birger + medlemsmöte · krav = förbundet · förhandling = kommunalrådet (via politicianData) · patron som joker. Så patron/kommun <em>får<\u002Fem> röst — men i senare processteg, inte i ingången.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"thread\">\n        <div class=\"tstat open\">Kvarstår<\u002Fdiv>\n        <div class=\"tb\">\n          <h4>Prövningens processteg<\u002Fh4>\n          <p>Förankring → krav → kommunförhandling → bygge mockas <b>efter att Opus låst mekaniken<\u002Fb> (per 06-11 §5). Det är nästa B1-ytbrief när den tiden kommer — utanför den här navigations-genomgången.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"foot\">\n      <b>B1 · Var bor bygget? — navigering &amp; liv<\u002Fb> · 2026-06-19<br>\n      Svar på ditt tillägg: <b>egen flik — ja<\u002Fb>, rummet från Transfers (kontextuell), inte en sjunde. Du ratificerar; jag har inte låst.<br>\n      Grund: <b>BottomNav.tsx<\u002Fb> · <b>OrtenTab.tsx<\u002Fb> · <b>FacilityScreen / FacilityTree<\u002Fb> · brief 2026-06-19 · review 06-12. Inga nya tokens, ingen omritning av de tre ytorna.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<\u002Fbody><\u002Fhtml>"
